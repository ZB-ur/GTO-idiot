<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokerTable Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col items-center gap-4 w-full max-w-4xl mx-auto p-4">

    <!-- Hand info bar -->
    <div class="flex items-center justify-between w-full text-sm text-gray-500">
      <span class="font-medium">Hand #42</span>
      <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-green-100 text-green-700">flop</span>
    </div>

    <!-- Table area -->
    <div class="relative w-full" style="padding-bottom: 60%;">

      <!-- Felt -->
      <div class="absolute inset-[8%] rounded-[50%] bg-gradient-to-br from-emerald-700 via-emerald-800 to-emerald-900 border-[6px] border-emerald-950 shadow-2xl">
        <div class="absolute inset-3 rounded-[50%] border border-emerald-600/30"></div>

        <!-- Center: Pot + Community Cards -->
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-3">
          <!-- Pot -->
          <div class="flex flex-col items-center gap-0.5">
            <div class="text-sm font-semibold text-white/70 uppercase tracking-wider">Pot</div>
            <div class="text-2xl font-bold text-white">12.5 BB</div>
          </div>
          <!-- Community Cards -->
          <div class="flex gap-1.5">
            <!-- Ah -->
            <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center leading-none">
              <span class="text-sm font-bold text-gray-900">A</span>
              <span class="text-xs text-gray-900">♠</span>
            </div>
            <!-- Kh -->
            <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center leading-none">
              <span class="text-sm font-bold text-red-500">K</span>
              <span class="text-xs text-red-500">♥</span>
            </div>
            <!-- 7d -->
            <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center leading-none">
              <span class="text-sm font-bold text-blue-500">7</span>
              <span class="text-xs text-blue-500">♦</span>
            </div>
            <!-- Empty slot -->
            <div class="w-10 h-14 rounded-lg border border-dashed border-white/20 bg-white/5"></div>
            <!-- Empty slot -->
            <div class="w-10 h-14 rounded-lg border border-dashed border-white/20 bg-white/5"></div>
          </div>
        </div>
      </div>

      <!-- ===== PLAYER SEATS ===== -->

      <!-- BTN (bottom-right) - BOT "Charlie" - Dealer -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 72%; left: 72%;">
        <div class="flex flex-col items-center gap-1 px-3 py-2 rounded-xl border-2 min-w-[100px] border-gray-200 bg-white">
          <!-- Dealer chip -->
          <div class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-yellow-400 border border-yellow-500 text-[10px] font-bold flex items-center justify-center text-yellow-900 shadow">D</div>
          <div class="text-center">
            <div class="text-xs font-semibold truncate max-w-[90px] text-gray-900">Charlie</div>
            <div class="text-[10px] text-gray-400 font-medium">BTN</div>
          </div>
          <div class="text-sm font-bold text-gray-800">95.0 BB</div>
          <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide">Raise</div>
        </div>
      </div>
      <!-- BTN bet chip -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 58%; left: 64%;">
        <div class="flex items-center gap-1 bg-white/80 backdrop-blur-sm rounded-full px-2 py-0.5 border border-gray-200 shadow-sm">
          <div class="w-3 h-3 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-500 border border-yellow-600"></div>
          <span class="text-xs font-bold text-gray-700">3.0</span>
        </div>
      </div>

      <!-- SB (bottom-left) - Hero / User - current actor -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 72%; left: 28%;">
        <div class="flex flex-col items-center gap-1 px-3 py-2 rounded-xl border-2 min-w-[100px] border-yellow-400 bg-yellow-50 shadow-lg shadow-yellow-200/50">
          <!-- Hole cards -->
          <div class="flex gap-0.5 -mt-1">
            <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center leading-none">
              <span class="text-sm font-bold text-red-500">A</span>
              <span class="text-xs text-red-500">♥</span>
            </div>
            <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center leading-none">
              <span class="text-sm font-bold text-red-500">K</span>
              <span class="text-xs text-red-500">♥</span>
            </div>
          </div>
          <div class="text-center">
            <div class="text-xs font-semibold truncate max-w-[90px] text-blue-700">Hero</div>
            <div class="text-[10px] text-gray-400 font-medium">SB</div>
          </div>
          <div class="text-sm font-bold text-gray-800">97.5 BB</div>
        </div>
      </div>
      <!-- SB bet chip -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 58%; left: 34%;">
        <div class="flex items-center gap-1 bg-white/80 backdrop-blur-sm rounded-full px-2 py-0.5 border border-gray-200 shadow-sm">
          <div class="w-3 h-3 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-500 border border-yellow-600"></div>
          <span class="text-xs font-bold text-gray-700">0.5</span>
        </div>
      </div>

      <!-- BB (left) - BOT "Dave" -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 44%; left: 6%;">
        <div class="flex flex-col items-center gap-1 px-3 py-2 rounded-xl border-2 min-w-[100px] border-gray-200 bg-white">
          <div class="text-center">
            <div class="text-xs font-semibold truncate max-w-[90px] text-gray-900">Dave</div>
            <div class="text-[10px] text-gray-400 font-medium">BB</div>
          </div>
          <div class="text-sm font-bold text-gray-800">99.0 BB</div>
          <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide">Call</div>
        </div>
      </div>
      <!-- BB bet chip -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 44%; left: 20%;">
        <div class="flex items-center gap-1 bg-white/80 backdrop-blur-sm rounded-full px-2 py-0.5 border border-gray-200 shadow-sm">
          <div class="w-3 h-3 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-500 border border-yellow-600"></div>
          <span class="text-xs font-bold text-gray-700">3.0</span>
        </div>
      </div>

      <!-- UTG (top-left) - BOT "Alice" - FOLDED -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 12%; left: 28%;">
        <div class="flex flex-col items-center gap-1 px-3 py-2 rounded-xl border-2 min-w-[100px] opacity-40 border-gray-300 bg-gray-50">
          <div class="text-center">
            <div class="text-xs font-semibold truncate max-w-[90px] text-gray-900">Alice</div>
            <div class="text-[10px] text-gray-400 font-medium">UTG</div>
          </div>
          <div class="text-sm font-bold text-gray-800">100.0 BB</div>
          <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide">Fold</div>
        </div>
      </div>

      <!-- MP (top-right) - BOT "Bob" - FOLDED -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 12%; left: 72%;">
        <div class="flex flex-col items-center gap-1 px-3 py-2 rounded-xl border-2 min-w-[100px] opacity-40 border-gray-300 bg-gray-50">
          <div class="text-center">
            <div class="text-xs font-semibold truncate max-w-[90px] text-gray-900">Bob</div>
            <div class="text-[10px] text-gray-400 font-medium">MP</div>
          </div>
          <div class="text-sm font-bold text-gray-800">100.0 BB</div>
          <div class="text-[10px] font-medium text-gray-500 uppercase tracking-wide">Fold</div>
        </div>
      </div>

      <!-- CO (right) - BOT "Eve" - ALL IN -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 44%; left: 94%;">
        <div class="flex flex-col items-center gap-1 px-3 py-2 rounded-xl border-2 min-w-[100px] border-red-400 bg-red-50">
          <div class="text-center">
            <div class="text-xs font-semibold truncate max-w-[90px] text-gray-900">Eve</div>
            <div class="text-[10px] text-gray-400 font-medium">CO</div>
          </div>
          <div class="text-sm font-bold text-red-600">ALL IN</div>
        </div>
      </div>
      <!-- CO bet chip -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2 z-10" style="top: 44%; left: 78%;">
        <div class="flex items-center gap-1 bg-white/80 backdrop-blur-sm rounded-full px-2 py-0.5 border border-gray-200 shadow-sm">
          <div class="w-3 h-3 rounded-full bg-gradient-to-br from-yellow-300 to-yellow-500 border border-yellow-600"></div>
          <span class="text-xs font-bold text-gray-700">6.0</span>
        </div>
      </div>
    </div>

    <!-- Action Panel (user's turn) -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 w-full">
      <div class="flex items-center gap-2 flex-wrap">
        <button class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-gray-500 hover:bg-gray-600 text-white transition-colors">Fold</button>
        <button class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-green-600 hover:bg-green-700 text-white transition-colors">Call <span class="ml-1 opacity-80">6.0 BB</span></button>
        <button class="px-5 py-2.5 rounded-lg font-semibold text-sm bg-red-500 hover:bg-red-600 text-white transition-colors">All In</button>

        <div class="flex items-center gap-2 ml-2 pl-2 border-l border-gray-200">
          <button class="px-3 py-2 rounded-lg text-xs font-semibold bg-yellow-100 text-yellow-800 hover:bg-yellow-200 transition-colors">½ Pot</button>
          <button class="px-3 py-2 rounded-lg text-xs font-semibold bg-yellow-100 text-yellow-800 hover:bg-yellow-200 transition-colors">¾ Pot</button>
          <button class="px-3 py-2 rounded-lg text-xs font-semibold bg-yellow-100 text-yellow-800 hover:bg-yellow-200 transition-colors">Pot</button>

          <div class="flex items-center gap-2">
            <input type="range" min="6" max="97.5" step="0.5" value="18" class="w-24 accent-yellow-500" />
            <span class="text-sm font-mono font-bold text-gray-700 min-w-[50px] text-right">18.0</span>
            <button class="px-4 py-2.5 rounded-lg font-semibold text-sm bg-yellow-500 hover:bg-yellow-600 text-gray-900 transition-colors">Raise</button>
          </div>
        </div>
      </div>

      <div class="flex gap-4 mt-2 text-xs text-gray-400">
        <span>Pot: 12.5 BB</span>
        <span>Your Stack: 97.5 BB</span>
        <span>To Call: 6.0 BB</span>
      </div>
    </div>
  </div>
</body>
</html>
