<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #1e293b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-lg mx-auto">
    <div class="flex flex-col gap-3 w-full bg-gray-800 rounded-xl p-4 border border-gray-700">
      <!-- Progress bar -->
      <div class="w-full bg-gray-700 rounded-full h-1.5">
        <div class="bg-blue-500 h-1.5 rounded-full" style="width: 45%"></div>
      </div>
      <div class="flex items-center justify-between">
        <!-- Transport controls -->
        <div class="flex items-center gap-1">
          <button class="p-2 rounded-lg text-gray-300 hover:bg-gray-700 opacity-30">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M15.707 15.707a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 010 1.414zm-6 0a1 1 0 01-1.414 0l-5-5a1 1 0 010-1.414l5-5a1 1 0 011.414 1.414L5.414 10l4.293 4.293a1 1 0 010 1.414z"/></svg>
          </button>
          <button class="p-2 rounded-lg text-gray-300 hover:bg-gray-700">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          </button>
          <span class="text-gray-400 text-xs font-mono px-2 min-w-[60px] text-center">9 / 20</span>
          <button class="p-2 rounded-lg text-gray-300 hover:bg-gray-700">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
          </button>
          <button class="p-2 rounded-lg text-gray-300 hover:bg-gray-700">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M4.293 15.707a1 1 0 010-1.414L8.586 10 4.293 5.707a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0zm6 0a1 1 0 010-1.414L14.586 10l-4.293-4.293a1 1 0 011.414-1.414l5 5a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0z"/></svg>
          </button>
        </div>
        <!-- Street jump -->
        <div class="flex gap-1">
          <button class="px-2 py-1 rounded text-xs font-medium bg-gray-700 text-gray-400">Pre</button>
          <button class="px-2 py-1 rounded text-xs font-medium bg-blue-600 text-white">Flop</button>
          <button class="px-2 py-1 rounded text-xs font-medium bg-gray-700 text-gray-400">Turn</button>
          <button class="px-2 py-1 rounded text-xs font-medium bg-gray-700 text-gray-400">River</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
