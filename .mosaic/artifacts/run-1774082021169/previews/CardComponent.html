<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardComponent Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">CardComponent</h2>

  <!-- Face-up cards row -->
  <p class="text-sm text-gray-600 mb-2">Face Up — All Suits</p>
  <div class="flex gap-3 mb-6">
    <!-- Ace of Spades -->
    <div class="relative w-16 h-[5.5rem] bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between p-1.5 select-none text-gray-900">
      <div class="flex flex-col items-start leading-none">
        <span class="text-sm font-bold">A</span>
        <span class="text-xs -mt-0.5">♠</span>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-2xl">♠</span>
      </div>
      <div class="flex flex-col items-end leading-none rotate-180">
        <span class="text-sm font-bold">A</span>
        <span class="text-xs -mt-0.5">♠</span>
      </div>
    </div>

    <!-- King of Hearts -->
    <div class="relative w-16 h-[5.5rem] bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between p-1.5 select-none text-red-500">
      <div class="flex flex-col items-start leading-none">
        <span class="text-sm font-bold">K</span>
        <span class="text-xs -mt-0.5">♥</span>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-2xl">♥</span>
      </div>
      <div class="flex flex-col items-end leading-none rotate-180">
        <span class="text-sm font-bold">K</span>
        <span class="text-xs -mt-0.5">♥</span>
      </div>
    </div>

    <!-- Queen of Diamonds -->
    <div class="relative w-16 h-[5.5rem] bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between p-1.5 select-none text-blue-500">
      <div class="flex flex-col items-start leading-none">
        <span class="text-sm font-bold">Q</span>
        <span class="text-xs -mt-0.5">♦</span>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-2xl">♦</span>
      </div>
      <div class="flex flex-col items-end leading-none rotate-180">
        <span class="text-sm font-bold">Q</span>
        <span class="text-xs -mt-0.5">♦</span>
      </div>
    </div>

    <!-- 10 of Clubs -->
    <div class="relative w-16 h-[5.5rem] bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between p-1.5 select-none text-green-600">
      <div class="flex flex-col items-start leading-none">
        <span class="text-sm font-bold">10</span>
        <span class="text-xs -mt-0.5">♣</span>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-2xl">♣</span>
      </div>
      <div class="flex flex-col items-end leading-none rotate-180">
        <span class="text-sm font-bold">10</span>
        <span class="text-xs -mt-0.5">♣</span>
      </div>
    </div>

    <!-- 7 of Hearts -->
    <div class="relative w-16 h-[5.5rem] bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between p-1.5 select-none text-red-500">
      <div class="flex flex-col items-start leading-none">
        <span class="text-sm font-bold">7</span>
        <span class="text-xs -mt-0.5">♥</span>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <span class="text-2xl">♥</span>
      </div>
      <div class="flex flex-col items-end leading-none rotate-180">
        <span class="text-sm font-bold">7</span>
        <span class="text-xs -mt-0.5">♥</span>
      </div>
    </div>
  </div>

  <!-- Face-down cards row -->
  <p class="text-sm text-gray-600 mb-2">Face Down</p>
  <div class="flex gap-3">
    <div class="relative w-16 h-[5.5rem] rounded-lg shadow-sm border border-gray-300 overflow-hidden select-none" style="background: linear-gradient(135deg, #1e3a5f 25%, #2563eb 50%, #1e3a5f 75%);">
      <div class="absolute inset-1 rounded border border-white/20 flex items-center justify-center">
        <div class="w-6 h-6 rounded-full border-2 border-white/30"></div>
      </div>
    </div>
    <div class="relative w-16 h-[5.5rem] rounded-lg shadow-sm border border-gray-300 overflow-hidden select-none" style="background: linear-gradient(135deg, #1e3a5f 25%, #2563eb 50%, #1e3a5f 75%);">
      <div class="absolute inset-1 rounded border border-white/20 flex items-center justify-center">
        <div class="w-6 h-6 rounded-full border-2 border-white/30"></div>
      </div>
    </div>
  </div>
</body>
</html>
