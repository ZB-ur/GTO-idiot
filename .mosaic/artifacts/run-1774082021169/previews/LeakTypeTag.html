<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeakTypeTag Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="space-y-4">
    <p class="text-sm font-medium text-gray-600">Leak Type Tags</p>

    <div class="flex flex-wrap items-center gap-2">
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-rose-50 text-rose-700 border-rose-200">过度弃牌</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-amber-50 text-amber-700 border-amber-200">Bluff 频率过高</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-purple-50 text-purple-700 border-purple-200">下注尺寸不合理</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-blue-50 text-blue-700 border-blue-200">Position Misplay</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-teal-50 text-teal-700 border-teal-200">过度跟注</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-orange-50 text-orange-700 border-orange-200">C-Bet 频率过低</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-pink-50 text-pink-700 border-pink-200">Check-Raise 不足</span>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-md border text-xs font-medium bg-indigo-50 text-indigo-700 border-indigo-200">River Fold 过多</span>
    </div>
  </div>
</body>
</html>
