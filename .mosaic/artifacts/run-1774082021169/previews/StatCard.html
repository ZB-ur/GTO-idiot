<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StatCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="grid grid-cols-2 gap-4 max-w-xl">
    <!-- Hands Played — trend up -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2">
      <span class="text-sm text-gray-600">Hands Played</span>
      <div class="flex items-baseline gap-2">
        <span class="text-2xl font-bold text-gray-900">1,284</span>
        <span class="text-sm text-gray-400">hands</span>
        <span class="text-sm font-semibold text-green-500 ml-auto">↑</span>
      </div>
    </div>

    <!-- Win Rate — trend up -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2">
      <span class="text-sm text-gray-600">Win Rate</span>
      <div class="flex items-baseline gap-2">
        <span class="text-2xl font-bold text-gray-900">62.4</span>
        <span class="text-sm text-gray-400">%</span>
        <span class="text-sm font-semibold text-green-500 ml-auto">↑</span>
      </div>
    </div>

    <!-- Avg EV Loss — trend down (improving) -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2">
      <span class="text-sm text-gray-600">Avg EV Loss</span>
      <div class="flex items-baseline gap-2">
        <span class="text-2xl font-bold text-gray-900">-0.23</span>
        <span class="text-sm text-gray-400">BB</span>
        <span class="text-sm font-semibold text-rose-500 ml-auto">↓</span>
      </div>
    </div>

    <!-- GTO Accuracy — neutral -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2">
      <span class="text-sm text-gray-600">GTO Accuracy</span>
      <div class="flex items-baseline gap-2">
        <span class="text-2xl font-bold text-gray-900">78</span>
        <span class="text-sm text-gray-400">%</span>
        <span class="text-sm font-semibold text-gray-400 ml-auto">→</span>
      </div>
    </div>
  </div>
</body>
</html>
