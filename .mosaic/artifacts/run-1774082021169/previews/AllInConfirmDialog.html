<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #0f172a; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/60"></div>
    <div class="relative bg-gray-800 rounded-xl border border-gray-700 shadow-xl p-6 max-w-sm w-full mx-4">
      <div class="flex justify-center mb-4">
        <div class="w-12 h-12 rounded-full bg-red-500/20 flex items-center justify-center">
          <svg class="w-6 h-6 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z"/>
          </svg>
        </div>
      </div>
      <h3 class="text-white text-lg font-bold text-center mb-2">Go All In?</h3>
      <p class="text-gray-400 text-sm text-center mb-1">You are about to go all in for</p>
      <p class="text-yellow-400 text-2xl font-mono font-bold text-center mb-6">1,500 BB</p>
      <div class="flex gap-3">
        <button class="flex-1 px-4 py-2.5 rounded-lg bg-gray-700 text-gray-300 font-semibold text-sm">Cancel</button>
        <button class="flex-1 px-4 py-2.5 rounded-lg bg-red-600 text-white font-bold text-sm">All In!</button>
      </div>
    </div>
  </div>
</body>
</html>
