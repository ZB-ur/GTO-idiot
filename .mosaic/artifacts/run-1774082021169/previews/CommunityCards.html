<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #1e293b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <!-- Flop only -->
    <div>
      <p class="text-gray-400 text-xs mb-2">Flop (3 cards)</p>
      <div class="flex items-center justify-center gap-2">
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-red-600 font-bold text-sm leading-none"><div>A</div><div>♥</div></div>
          <div class="text-red-600 text-center text-lg leading-none">♥</div>
        </div>
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-gray-900 font-bold text-sm leading-none"><div>K</div><div>♠</div></div>
          <div class="text-gray-900 text-center text-lg leading-none">♠</div>
        </div>
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-red-600 font-bold text-sm leading-none"><div>7</div><div>♦</div></div>
          <div class="text-red-600 text-center text-lg leading-none">♦</div>
        </div>
        <div class="w-14 h-20 rounded-lg border border-gray-600/20"></div>
        <div class="w-14 h-20 rounded-lg border border-gray-600/20"></div>
      </div>
    </div>

    <!-- All 5 cards -->
    <div>
      <p class="text-gray-400 text-xs mb-2">River (5 cards)</p>
      <div class="flex items-center justify-center gap-2">
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-red-600 font-bold text-sm leading-none"><div>A</div><div>♥</div></div>
          <div class="text-red-600 text-center text-lg leading-none">♥</div>
        </div>
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-gray-900 font-bold text-sm leading-none"><div>K</div><div>♠</div></div>
          <div class="text-gray-900 text-center text-lg leading-none">♠</div>
        </div>
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-red-600 font-bold text-sm leading-none"><div>7</div><div>♦</div></div>
          <div class="text-red-600 text-center text-lg leading-none">♦</div>
        </div>
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-gray-900 font-bold text-sm leading-none"><div>2</div><div>♣</div></div>
          <div class="text-gray-900 text-center text-lg leading-none">♣</div>
        </div>
        <div class="w-14 h-20 rounded-lg border border-gray-300 bg-white shadow-md flex flex-col justify-between p-1">
          <div class="text-red-600 font-bold text-sm leading-none"><div>Q</div><div>♥</div></div>
          <div class="text-red-600 text-center text-lg leading-none">♥</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
