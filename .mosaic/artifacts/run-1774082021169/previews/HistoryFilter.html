<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #1e293b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-2xl mx-auto">
    <div class="flex flex-wrap items-center gap-3 p-3 bg-gray-800 rounded-xl border border-gray-700">
      <!-- Date range -->
      <div class="flex items-center gap-2">
        <label class="text-gray-400 text-xs">From</label>
        <input type="date" value="2026-03-01" class="bg-gray-700 border border-gray-600 rounded-lg px-2 py-1 text-gray-300 text-xs" />
        <label class="text-gray-400 text-xs">To</label>
        <input type="date" value="2026-03-21" class="bg-gray-700 border border-gray-600 rounded-lg px-2 py-1 text-gray-300 text-xs" />
      </div>
      <div class="w-px h-6 bg-gray-700"></div>
      <!-- Position -->
      <div class="flex items-center gap-1">
        <label class="text-gray-400 text-xs mr-1">Position</label>
        <button class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-blue-600 text-white">All</button>
        <button class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-700 text-gray-400">UTG</button>
        <button class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-700 text-gray-400">MP</button>
        <button class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-700 text-gray-400">CO</button>
        <button class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-700 text-gray-400">BTN</button>
        <button class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-700 text-gray-400">SB</button>
        <button class="px-2 py-1 rounded text-[10px] font-bold uppercase bg-gray-700 text-gray-400">BB</button>
      </div>
      <div class="w-px h-6 bg-gray-700"></div>
      <!-- Result -->
      <div class="flex items-center gap-1">
        <label class="text-gray-400 text-xs mr-1">Result</label>
        <button class="px-2 py-1 rounded text-xs font-medium bg-blue-600 text-white">All</button>
        <button class="px-2 py-1 rounded text-xs font-medium bg-gray-700 text-gray-400">Wins</button>
        <button class="px-2 py-1 rounded text-xs font-medium bg-gray-700 text-gray-400">Losses</button>
      </div>
    </div>
  </div>
</body>
</html>
