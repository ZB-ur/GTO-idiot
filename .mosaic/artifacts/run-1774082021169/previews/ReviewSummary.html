<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #1e293b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-lg mx-auto space-y-6">
    <!-- Score header -->
    <div class="bg-gray-800 rounded-xl border border-gray-700 p-6">
      <div class="flex items-center gap-6">
        <!-- Score ring -->
        <div class="relative w-24 h-24 flex-shrink-0">
          <svg class="w-24 h-24 -rotate-90" viewBox="0 0 96 96">
            <circle cx="48" cy="48" r="40" fill="none" stroke="#374151" stroke-width="6"/>
            <circle cx="48" cy="48" r="40" fill="none" stroke="#eab308" stroke-width="6" stroke-linecap="round" stroke-dasharray="251.3" stroke-dashoffset="75.4"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span class="text-2xl font-bold text-white">70</span>
            <span class="text-[10px] text-gray-400">GTO Score</span>
          </div>
        </div>
        <div class="flex-1 space-y-2">
          <h3 class="text-white text-lg font-bold">Hand Review</h3>
          <div class="grid grid-cols-2 gap-2 text-sm">
            <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-green-500"></div><span class="text-gray-300">Optimal: 3</span></div>
            <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-blue-500"></div><span class="text-gray-300">Good: 2</span></div>
            <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div><span class="text-gray-300">Minor: 1</span></div>
            <div class="flex items-center gap-2"><div class="w-2.5 h-2.5 rounded-full bg-red-500"></div><span class="text-gray-300">Major: 1</span></div>
          </div>
          <div class="flex items-center gap-2 pt-1">
            <span class="text-gray-400 text-xs">Total EV Loss:</span>
            <span class="text-red-400 text-sm font-mono font-bold">-7.30 BB</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Leaks list -->
    <div>
      <h4 class="text-gray-200 text-sm font-semibold mb-3">Top Leaks (2)</h4>
      <div class="space-y-3">
        <!-- Leak 1 -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-4">
          <div class="flex items-start gap-3">
            <div class="w-7 h-7 rounded-full bg-gray-700 flex items-center justify-center flex-shrink-0"><span class="text-gray-300 text-xs font-bold">#1</span></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1 flex-wrap">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-500/20 text-red-300">Bad call</span>
                <span class="text-gray-500 text-[10px] uppercase">river</span>
                <span class="text-red-400 text-xs font-mono font-bold ml-auto">-5.20 BB</span>
              </div>
              <p class="text-gray-400 text-sm mb-2">Called a large river bet with weak top pair.</p>
              <div class="bg-blue-500/10 border border-blue-500/20 rounded-lg overflow-hidden">
                <button class="w-full flex items-center gap-2 px-3 py-2 text-left">
                  <svg class="w-4 h-4 text-blue-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
                  <span class="text-blue-400 text-xs font-semibold">Improvement Tip</span>
                </button>
              </div>
              <button class="mt-2 text-blue-400 text-xs">View in replay →</button>
            </div>
          </div>
        </div>

        <!-- Leak 2 -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-4">
          <div class="flex items-start gap-3">
            <div class="w-7 h-7 rounded-full bg-gray-700 flex items-center justify-center flex-shrink-0"><span class="text-gray-300 text-xs font-bold">#2</span></div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1 flex-wrap">
                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-yellow-500/20 text-yellow-300">Sizing error</span>
                <span class="text-gray-500 text-[10px] uppercase">turn</span>
                <span class="text-red-400 text-xs font-mono font-bold ml-auto">-2.10 BB</span>
              </div>
              <p class="text-gray-400 text-sm mb-2">C-bet sizing too small on wet board.</p>
              <div class="bg-blue-500/10 border border-blue-500/20 rounded-lg overflow-hidden">
                <button class="w-full flex items-center gap-2 px-3 py-2 text-left">
                  <svg class="w-4 h-4 text-blue-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
                  <span class="text-blue-400 text-xs font-semibold">Improvement Tip</span>
                </button>
              </div>
              <button class="mt-2 text-blue-400 text-xs">View in replay →</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
