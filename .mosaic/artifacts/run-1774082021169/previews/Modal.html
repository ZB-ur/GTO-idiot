<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- Backdrop -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
    <div class="bg-white rounded-xl shadow-md border border-gray-200 w-full max-w-lg mx-4 overflow-hidden">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-gray-900">Clear Old Hands</h2>
        <button class="text-gray-400 hover:text-gray-600 transition-colors text-xl leading-none">×</button>
      </div>
      <!-- Body -->
      <div class="px-6 py-5 text-base text-gray-600">
        <p>Are you sure you want to delete all hand records older than 30 days? This action cannot be undone.</p>
        <p class="mt-3 text-sm text-gray-400">This will free approximately 12.4 MB of storage.</p>
      </div>
      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-slate-50">
        <button class="px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
        <button class="px-4 py-2 text-sm font-medium text-white bg-rose-500 rounded-lg hover:bg-rose-600 transition-colors">Delete</button>
      </div>
    </div>
  </div>
</body>
</html>
