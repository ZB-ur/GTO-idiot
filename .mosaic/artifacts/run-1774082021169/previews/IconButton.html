<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IconButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">IconButton</h2>

  <!-- Ghost variant -->
  <p class="text-sm text-gray-600 mb-2">Variant: ghost</p>
  <div class="flex items-center gap-3 mb-5">
    <button class="inline-flex items-center justify-center rounded-lg w-8 h-8 text-sm bg-transparent hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition-colors duration-150 cursor-pointer" title="Settings">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.573-1.066z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="inline-flex items-center justify-center rounded-lg w-10 h-10 text-base bg-transparent hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition-colors duration-150 cursor-pointer" title="Menu">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button class="inline-flex items-center justify-center rounded-lg w-12 h-12 text-lg bg-transparent hover:bg-gray-100 text-gray-600 hover:text-gray-900 transition-colors duration-150 cursor-pointer" title="Close">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- Outline variant -->
  <p class="text-sm text-gray-600 mb-2">Variant: outline</p>
  <div class="flex items-center gap-3 mb-5">
    <button class="inline-flex items-center justify-center rounded-lg w-8 h-8 text-sm bg-transparent border border-gray-200 hover:bg-gray-50 text-gray-600 hover:text-gray-900 transition-colors duration-150 cursor-pointer" title="Undo">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a5 5 0 015 5v2M3 10l4-4M3 10l4 4"/></svg>
    </button>
    <button class="inline-flex items-center justify-center rounded-lg w-10 h-10 text-base bg-transparent border border-gray-200 hover:bg-gray-50 text-gray-600 hover:text-gray-900 transition-colors duration-150 cursor-pointer" title="Info">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 16v-4M12 8h.01"/></svg>
    </button>
    <button class="inline-flex items-center justify-center rounded-lg w-12 h-12 text-lg bg-transparent border border-gray-200 hover:bg-gray-50 text-gray-600 hover:text-gray-900 transition-colors duration-150 cursor-pointer" title="Refresh">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h5M20 20v-5h-5"/><path d="M20.49 9A9 9 0 005.64 5.64L4 4m16 16l-1.64-1.64A9 9 0 013.51 15"/></svg>
    </button>
  </div>

  <!-- Solid variant -->
  <p class="text-sm text-gray-600 mb-2">Variant: solid</p>
  <div class="flex items-center gap-3">
    <button class="inline-flex items-center justify-center rounded-lg w-8 h-8 text-sm bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-colors duration-150 cursor-pointer" title="Add">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
    </button>
    <button class="inline-flex items-center justify-center rounded-lg w-10 h-10 text-base bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-colors duration-150 cursor-pointer" title="Play">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button class="inline-flex items-center justify-center rounded-lg w-12 h-12 text-lg bg-blue-600 hover:bg-blue-700 text-white shadow-sm transition-colors duration-150 cursor-pointer" title="Next">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
</body>
</html>
