<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #0f172a; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/60"></div>
    <div class="relative bg-gray-800 rounded-xl border border-gray-700 shadow-xl p-6 max-w-md w-full mx-4">
      <h3 class="text-white text-lg font-bold mb-2">Clean Up Hand Data</h3>
      <p class="text-gray-400 text-sm mb-4">
        Delete hands older than a selected period. You currently have
        <span class="text-white font-mono">12,340</span> hands, oldest from 8/10/2025.
      </p>
      <div class="flex gap-2 mb-4">
        <button class="flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-gray-700 text-gray-300">30 days</button>
        <button class="flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-red-600 text-white">90 days</button>
        <button class="flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-gray-700 text-gray-300">6 months</button>
        <button class="flex-1 px-3 py-2 rounded-lg text-sm font-medium bg-gray-700 text-gray-300">1 year</button>
      </div>
      <p class="text-gray-500 text-xs mb-4">
        This will delete all hands older than <span class="text-gray-300">12/21/2025</span>. This action cannot be undone.
      </p>
      <div class="flex gap-3">
        <button class="flex-1 px-4 py-2.5 rounded-lg bg-gray-700 text-gray-300 font-semibold text-sm">Cancel</button>
        <button class="flex-1 px-4 py-2.5 rounded-lg bg-red-600 text-white font-bold text-sm">Delete Old Hands</button>
      </div>
    </div>
  </div>
</body>
</html>
