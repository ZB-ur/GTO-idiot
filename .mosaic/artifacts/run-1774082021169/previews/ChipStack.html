<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChipStack Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">ChipStack</h2>

  <div class="flex items-end gap-10">
    <!-- 2 BB - white chip, 1 chip -->
    <div class="inline-flex flex-col items-center gap-1">
      <div class="relative" style="height: 32px;">
        <div class="absolute rounded-full w-8 h-8 bg-gray-100 border-gray-300 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 0; z-index: 0;">
          <span class="font-bold text-gray-700 leading-none">2</span>
        </div>
      </div>
      <span class="text-sm font-semibold text-gray-900">2 BB</span>
    </div>

    <!-- 10 BB - red chip, 1 chip -->
    <div class="inline-flex flex-col items-center gap-1">
      <div class="relative" style="height: 32px;">
        <div class="absolute rounded-full w-8 h-8 bg-red-500 border-red-700 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 0; z-index: 0;">
          <span class="font-bold text-white leading-none">10</span>
        </div>
      </div>
      <span class="text-sm font-semibold text-gray-900">10 BB</span>
    </div>

    <!-- 50 BB - green chips, 2 stacked -->
    <div class="inline-flex flex-col items-center gap-1">
      <div class="relative" style="height: 36px;">
        <div class="absolute rounded-full w-8 h-8 bg-green-500 border-green-700 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 0; z-index: 0;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-green-500 border-green-700 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 4px; z-index: 1;">
          <span class="font-bold text-white leading-none">50</span>
        </div>
      </div>
      <span class="text-sm font-semibold text-gray-900">50 BB</span>
    </div>

    <!-- 150 BB - blue chips, 5 stacked -->
    <div class="inline-flex flex-col items-center gap-1">
      <div class="relative" style="height: 48px;">
        <div class="absolute rounded-full w-8 h-8 bg-blue-600 border-blue-800 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 0; z-index: 0;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-blue-600 border-blue-800 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 4px; z-index: 1;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-blue-600 border-blue-800 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 8px; z-index: 2;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-blue-600 border-blue-800 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 12px; z-index: 3;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-blue-600 border-blue-800 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 16px; z-index: 4;">
          <span class="font-bold text-white leading-none">150</span>
        </div>
      </div>
      <span class="text-sm font-semibold text-gray-900">150 BB</span>
    </div>

    <!-- 1000 BB - gold chips, 5 stacked -->
    <div class="inline-flex flex-col items-center gap-1">
      <div class="relative" style="height: 48px;">
        <div class="absolute rounded-full w-8 h-8 bg-yellow-400 border-yellow-600 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 0; z-index: 0;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-yellow-400 border-yellow-600 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 4px; z-index: 1;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-yellow-400 border-yellow-600 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 8px; z-index: 2;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-yellow-400 border-yellow-600 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 12px; z-index: 3;"></div>
        <div class="absolute rounded-full w-8 h-8 bg-yellow-400 border-yellow-600 border-2 flex items-center justify-center shadow-sm text-xs" style="bottom: 16px; z-index: 4;">
          <span class="font-bold text-gray-900 leading-none">1k</span>
        </div>
      </div>
      <span class="text-sm font-semibold text-gray-900">1k BB</span>
    </div>
  </div>

  <!-- Small size -->
  <p class="text-sm text-gray-600 mt-6 mb-2">Size: sm</p>
  <div class="flex items-end gap-8">
    <div class="inline-flex flex-col items-center gap-1">
      <div class="relative" style="height: 26px;">
        <div class="absolute rounded-full w-6 h-6 bg-red-500 border-red-700 border-2 flex items-center justify-center shadow-sm" style="bottom: 0; z-index: 0;">
          <span class="font-bold text-white leading-none text-[10px]">25</span>
        </div>
      </div>
      <span class="text-xs font-semibold text-gray-900">25 BB</span>
    </div>
  </div>

  <!-- Large size -->
  <p class="text-sm text-gray-600 mt-6 mb-2">Size: lg</p>
  <div class="flex items-end gap-8">
    <div class="inline-flex flex-col items-center gap-1">
      <div class="relative" style="height: 46px;">
        <div class="absolute rounded-full w-10 h-10 bg-purple-600 border-purple-800 border-2 flex items-center justify-center shadow-sm text-sm" style="bottom: 0; z-index: 0;"></div>
        <div class="absolute rounded-full w-10 h-10 bg-purple-600 border-purple-800 border-2 flex items-center justify-center shadow-sm text-sm" style="bottom: 4px; z-index: 1;">
          <span class="font-bold text-white leading-none">500</span>
        </div>
      </div>
      <span class="text-base font-semibold text-gray-900">500 BB</span>
    </div>
  </div>
</body>
</html>
