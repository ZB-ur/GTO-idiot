<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #1e293b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <!-- Simple pot -->
    <div class="flex flex-col items-center gap-1">
      <div class="flex items-center gap-1.5 bg-black/40 rounded-full px-3 py-1">
        <svg viewBox="0 0 16 16" class="inline-block w-4 h-4 text-red-500" fill="currentColor">
          <circle cx="8" cy="8" r="7" fill="currentColor" stroke="#fff" stroke-width="1"/>
          <circle cx="8" cy="8" r="4" fill="none" stroke="#fff" stroke-width="0.8"/>
        </svg>
        <span class="text-white font-mono text-sm font-bold">450 BB</span>
      </div>
    </div>

    <!-- Pot with side pots -->
    <div class="flex flex-col items-center gap-1">
      <div class="flex items-center gap-1.5 bg-black/40 rounded-full px-3 py-1">
        <svg viewBox="0 0 16 16" class="inline-block w-4 h-4 text-red-500" fill="currentColor">
          <circle cx="8" cy="8" r="7" fill="currentColor" stroke="#fff" stroke-width="1"/>
          <circle cx="8" cy="8" r="4" fill="none" stroke="#fff" stroke-width="0.8"/>
        </svg>
        <span class="text-white font-mono text-sm font-bold">1,200 BB</span>
      </div>
      <div class="flex gap-2">
        <div class="flex items-center gap-1 bg-black/30 rounded-full px-2 py-0.5">
          <svg viewBox="0 0 16 16" class="inline-block w-3 h-3 text-blue-400" fill="currentColor">
            <circle cx="8" cy="8" r="7" fill="currentColor" stroke="#fff" stroke-width="1"/>
            <circle cx="8" cy="8" r="4" fill="none" stroke="#fff" stroke-width="0.8"/>
          </svg>
          <span class="text-gray-300 font-mono text-xs">Side 1: 300</span>
        </div>
        <div class="flex items-center gap-1 bg-black/30 rounded-full px-2 py-0.5">
          <svg viewBox="0 0 16 16" class="inline-block w-3 h-3 text-blue-400" fill="currentColor">
            <circle cx="8" cy="8" r="7" fill="currentColor" stroke="#fff" stroke-width="1"/>
            <circle cx="8" cy="8" r="4" fill="none" stroke="#fff" stroke-width="0.8"/>
          </svg>
          <span class="text-gray-300 font-mono text-xs">Side 2: 150</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
