<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TopNav Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    .animate-ping { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>
</head>
<body>

  <!-- State 1: Game tab active, session in progress -->
  <nav class="bg-white border-b border-gray-200 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto flex items-center justify-between h-14">
      <!-- Logo -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 bg-emerald-800 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-sm">G</span>
        </div>
        <span class="text-lg font-bold text-gray-900 tracking-tight">GTO Idiot</span>
      </div>

      <!-- Tabs -->
      <div class="flex items-center gap-1">
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600">
          <span class="text-base">🎴</span>
          <span>对战</span>
        </button>
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50">
          <span class="text-base">📋</span>
          <span>历史</span>
        </button>
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50">
          <span class="text-base">📊</span>
          <span>统计</span>
        </button>
      </div>

      <!-- Session: Active -->
      <div class="flex items-center shrink-0">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-green-50 border border-green-200 rounded-lg">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
          </span>
          <span class="text-sm font-medium text-green-700">进行中</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Spacer -->
  <div class="h-6"></div>

  <!-- State 2: History tab active, no session -->
  <nav class="bg-white border-b border-gray-200 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto flex items-center justify-between h-14">
      <!-- Logo -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 bg-emerald-800 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-sm">G</span>
        </div>
        <span class="text-lg font-bold text-gray-900 tracking-tight">GTO Idiot</span>
      </div>

      <!-- Tabs -->
      <div class="flex items-center gap-1">
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50">
          <span class="text-base">🎴</span>
          <span>对战</span>
        </button>
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600">
          <span class="text-base">📋</span>
          <span>历史</span>
        </button>
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50">
          <span class="text-base">📊</span>
          <span>统计</span>
        </button>
      </div>

      <!-- Session: None -->
      <div class="flex items-center shrink-0">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg">
          <span class="inline-flex rounded-full h-2 w-2 bg-gray-300"></span>
          <span class="text-sm font-medium text-gray-400">无会话</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- Spacer -->
  <div class="h-6"></div>

  <!-- State 3: Stats tab active, session active -->
  <nav class="bg-white border-b border-gray-200 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto flex items-center justify-between h-14">
      <!-- Logo -->
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-8 h-8 bg-emerald-800 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-sm">G</span>
        </div>
        <span class="text-lg font-bold text-gray-900 tracking-tight">GTO Idiot</span>
      </div>

      <!-- Tabs -->
      <div class="flex items-center gap-1">
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50">
          <span class="text-base">🎴</span>
          <span>对战</span>
        </button>
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50">
          <span class="text-base">📋</span>
          <span>历史</span>
        </button>
        <button class="relative flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600">
          <span class="text-base">📊</span>
          <span>统计</span>
        </button>
      </div>

      <!-- Session: Active -->
      <div class="flex items-center shrink-0">
        <div class="flex items-center gap-2 px-3 py-1.5 bg-green-50 border border-green-200 rounded-lg">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
          </span>
          <span class="text-sm font-medium text-green-700">进行中</span>
        </div>
      </div>
    </div>
  </nav>

</body>
</html>
