<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionStatusBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-4 max-w-2xl">

    <!-- Active session (positive P/L) -->
    <div class="flex items-center justify-between px-4 py-2 bg-white border border-gray-200 rounded-xl shadow-sm">
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-1.5">
          <svg class="w-4 h-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
          <span class="text-sm font-semibold text-gray-900">42m 15s</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-gray-400 font-medium">Hands</span>
          <span class="text-sm font-semibold text-gray-900">67</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-gray-400 font-medium">P/L</span>
          <span class="text-sm font-bold text-emerald-600">+18.5 BB</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700">Pause</button>
        <button class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-red-200 bg-red-50 text-red-700">End Session</button>
      </div>
    </div>

    <!-- Paused session (negative P/L) -->
    <div class="flex items-center justify-between px-4 py-2 bg-white border border-gray-200 rounded-xl shadow-sm">
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-1.5">
          <svg class="w-4 h-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg>
          <span class="text-sm font-semibold text-gray-900">1h 23m</span>
          <span class="text-[10px] font-bold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">PAUSED</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-gray-400 font-medium">Hands</span>
          <span class="text-sm font-semibold text-gray-900">142</span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-xs text-gray-400 font-medium">P/L</span>
          <span class="text-sm font-bold text-red-500">-12.0 BB</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700">Resume</button>
        <button class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-red-200 bg-red-50 text-red-700">End Session</button>
      </div>
    </div>

  </div>
</body>
</html>
