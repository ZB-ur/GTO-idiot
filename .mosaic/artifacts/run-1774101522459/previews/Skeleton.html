<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .skeleton-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">Skeleton Component</h2>

  <!-- Text variant -->
  <p class="text-sm text-gray-600 mb-2">Text Lines (count=3)</p>
  <div class="flex flex-col gap-2 mb-6 max-w-sm">
    <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:100%;height:16px"></div>
    <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:100%;height:16px"></div>
    <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:75%;height:16px"></div>
  </div>

  <!-- Rect variant -->
  <p class="text-sm text-gray-600 mb-2">Rectangle (card placeholder)</p>
  <div class="mb-6 max-w-sm">
    <div class="skeleton-pulse bg-gray-200 rounded-xl" style="width:100%;height:80px"></div>
  </div>

  <!-- Circle variant -->
  <p class="text-sm text-gray-600 mb-2">Circle (avatar)</p>
  <div class="flex gap-3 mb-6">
    <div class="skeleton-pulse bg-gray-200 rounded-full" style="width:40px;height:40px"></div>
    <div class="skeleton-pulse bg-gray-200 rounded-full" style="width:40px;height:40px"></div>
    <div class="skeleton-pulse bg-gray-200 rounded-full" style="width:40px;height:40px"></div>
  </div>

  <!-- Composite: Card-like loading state -->
  <p class="text-sm text-gray-600 mb-2">Composite: Hand History Loading</p>
  <div class="max-w-md bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <div class="flex items-center gap-3 mb-4">
      <div class="skeleton-pulse bg-gray-200 rounded-full" style="width:40px;height:40px"></div>
      <div class="flex flex-col gap-2 flex-1">
        <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:60%;height:14px"></div>
        <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:40%;height:12px"></div>
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:100%;height:16px"></div>
      <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:100%;height:16px"></div>
      <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:80%;height:16px"></div>
    </div>
  </div>

  <!-- GTO Calculation Loading -->
  <p class="text-sm text-gray-600 mb-2 mt-6">GTO Calculation Loading</p>
  <div class="max-w-md bg-white rounded-xl border border-gray-200 shadow-sm p-6">
    <div class="flex items-center gap-2 mb-4">
      <div class="skeleton-pulse bg-gray-200 rounded-lg" style="width:120px;height:20px"></div>
    </div>
    <div class="flex gap-3">
      <div class="skeleton-pulse bg-gray-200 rounded-xl" style="width:64px;height:88px"></div>
      <div class="skeleton-pulse bg-gray-200 rounded-xl" style="width:64px;height:88px"></div>
      <div class="skeleton-pulse bg-gray-200 rounded-xl" style="width:64px;height:88px"></div>
    </div>
  </div>
</body>
</html>
