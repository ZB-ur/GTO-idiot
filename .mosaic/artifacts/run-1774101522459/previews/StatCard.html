<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StatCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>

  <h2 class="text-lg font-semibold text-gray-900 mb-4">StatCard Variants</h2>

  <div class="flex flex-wrap gap-4">

    <!-- Total Hands — trend up -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2 min-w-[180px]">
      <span class="text-sm font-medium text-gray-600">Total Hands</span>
      <div class="flex items-baseline gap-1.5">
        <span class="text-2xl font-bold text-gray-900">1,248</span>
      </div>
      <div class="flex items-center gap-1 text-green-500">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
        <span class="text-sm font-medium">+86 today</span>
      </div>
    </div>

    <!-- Win Rate — trend up -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2 min-w-[180px]">
      <span class="text-sm font-medium text-gray-600">Win Rate</span>
      <div class="flex items-baseline gap-1.5">
        <span class="text-2xl font-bold text-gray-900">54.3</span>
        <span class="text-sm text-gray-400 font-medium">%</span>
      </div>
      <div class="flex items-center gap-1 text-green-500">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
        <span class="text-sm font-medium">+2.1%</span>
      </div>
    </div>

    <!-- Profit/Loss — trend down -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2 min-w-[180px]">
      <span class="text-sm font-medium text-gray-600">Profit / Loss</span>
      <div class="flex items-baseline gap-1.5">
        <span class="text-2xl font-bold text-gray-900">-12.5</span>
        <span class="text-sm text-gray-400 font-medium">BB</span>
      </div>
      <div class="flex items-center gap-1 text-red-500">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
        <span class="text-sm font-medium">-3.2 BB</span>
      </div>
    </div>

    <!-- Avg EV Loss — flat -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2 min-w-[180px]">
      <span class="text-sm font-medium text-gray-600">Avg EV Loss</span>
      <div class="flex items-baseline gap-1.5">
        <span class="text-2xl font-bold text-gray-900">-0.8</span>
        <span class="text-sm text-gray-400 font-medium">BB/hand</span>
      </div>
      <div class="flex items-center gap-1 text-gray-400">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
        </svg>
        <span class="text-sm font-medium">no change</span>
      </div>
    </div>

    <!-- Sessions — no trend -->
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 flex flex-col gap-2 min-w-[180px]">
      <span class="text-sm font-medium text-gray-600">Sessions</span>
      <div class="flex items-baseline gap-1.5">
        <span class="text-2xl font-bold text-gray-900">37</span>
      </div>
    </div>

  </div>

</body>
</html>
