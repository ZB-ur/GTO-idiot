<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Card Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    .card-back-pattern {
      background: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(255,255,255,0.1) 4px, rgba(255,255,255,0.1) 8px);
    }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">Card Component</h2>

  <!-- Size Variants -->
  <p class="text-sm text-gray-600 mb-2">Sizes: sm / md / lg</p>
  <div class="flex items-end gap-3 mb-6">
    <!-- Small -->
    <div class="w-10 h-14 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col select-none">
      <div class="flex items-center gap-0.5 pl-1 pt-0.5 font-bold text-red-600">
        <span class="text-xs">A</span><span class="text-[10px]">♥</span>
      </div>
      <div class="flex-1 flex items-center justify-center text-red-600">
        <span class="text-lg">♥</span>
      </div>
    </div>
    <!-- Medium -->
    <div class="w-16 h-22 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col select-none">
      <div class="flex items-center gap-0.5 pl-1 pt-0.5 font-bold text-red-600">
        <span class="text-sm">A</span><span class="text-xs">♥</span>
      </div>
      <div class="flex-1 flex items-center justify-center text-red-600">
        <span class="text-2xl">♥</span>
      </div>
    </div>
    <!-- Large -->
    <div class="w-24 h-34 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col select-none">
      <div class="flex items-center gap-0.5 pl-1 pt-0.5 font-bold text-red-600">
        <span class="text-lg">A</span><span class="text-sm">♥</span>
      </div>
      <div class="flex-1 flex items-center justify-center text-red-600">
        <span class="text-4xl">♥</span>
      </div>
    </div>
  </div>

  <!-- All Suits -->
  <p class="text-sm text-gray-600 mb-2">Suits: ♠ ♥ ♦ ♣</p>
  <div class="flex gap-3 mb-6">
    <!-- Spade (black) -->
    <div class="w-16 h-22 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col select-none">
      <div class="flex items-center gap-0.5 pl-1 pt-0.5 font-bold text-gray-900">
        <span class="text-sm">K</span><span class="text-xs">♠</span>
      </div>
      <div class="flex-1 flex items-center justify-center text-gray-900">
        <span class="text-2xl">♠</span>
      </div>
    </div>
    <!-- Heart (red) -->
    <div class="w-16 h-22 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col select-none">
      <div class="flex items-center gap-0.5 pl-1 pt-0.5 font-bold text-red-600">
        <span class="text-sm">Q</span><span class="text-xs">♥</span>
      </div>
      <div class="flex-1 flex items-center justify-center text-red-600">
        <span class="text-2xl">♥</span>
      </div>
    </div>
    <!-- Diamond (red) -->
    <div class="w-16 h-22 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col select-none">
      <div class="flex items-center gap-0.5 pl-1 pt-0.5 font-bold text-red-600">
        <span class="text-sm">J</span><span class="text-xs">♦</span>
      </div>
      <div class="flex-1 flex items-center justify-center text-red-600">
        <span class="text-2xl">♦</span>
      </div>
    </div>
    <!-- Club (black) -->
    <div class="w-16 h-22 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col select-none">
      <div class="flex items-center gap-0.5 pl-1 pt-0.5 font-bold text-gray-900">
        <span class="text-sm">T</span><span class="text-xs">♣</span>
      </div>
      <div class="flex-1 flex items-center justify-center text-gray-900">
        <span class="text-2xl">♣</span>
      </div>
    </div>
  </div>

  <!-- Face Down -->
  <p class="text-sm text-gray-600 mb-2">Face Down</p>
  <div class="flex gap-3">
    <div class="w-16 h-22 rounded-lg border border-gray-200 shadow-sm bg-gradient-to-br from-blue-600 to-blue-800 inline-flex flex-col select-none">
      <div class="flex-1 rounded-md m-1 card-back-pattern"></div>
    </div>
    <div class="w-16 h-22 rounded-lg border border-gray-200 shadow-sm bg-gradient-to-br from-blue-600 to-blue-800 inline-flex flex-col select-none">
      <div class="flex-1 rounded-md m-1 card-back-pattern"></div>
    </div>
  </div>
</body>
</html>
