<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">Badge Component</h2>

  <!-- Position Badges -->
  <p class="text-sm text-gray-600 mb-2">Position Badges</p>
  <div class="flex flex-wrap gap-2 mb-5">
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">BTN</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">SB</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">BB</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">UTG</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">MP</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">CO</span>
  </div>

  <!-- Bot Style Badges -->
  <p class="text-sm text-gray-600 mb-2">Bot Style Badges</p>
  <div class="flex flex-wrap gap-2 mb-5">
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-red-100 text-red-700 border-red-200">TAG</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-yellow-100 text-yellow-700 border-yellow-200">LAG</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-gray-100 text-gray-700 border-gray-200">TP</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-gray-100 text-gray-700 border-gray-200">LP</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">GTO</span>
  </div>

  <!-- Quality Badges -->
  <p class="text-sm text-gray-600 mb-2">Decision Quality Badges</p>
  <div class="flex flex-wrap gap-2 mb-5">
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-green-100 text-green-700 border-green-200">Good</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-yellow-100 text-yellow-700 border-yellow-200">Minor Deviation</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-red-100 text-red-700 border-red-200">Major Deviation</span>
  </div>

  <!-- All Colors -->
  <p class="text-sm text-gray-600 mb-2">All Colors</p>
  <div class="flex flex-wrap gap-2">
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-green-100 text-green-700 border-green-200">Green</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-yellow-100 text-yellow-700 border-yellow-200">Yellow</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-red-100 text-red-700 border-red-200">Red</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">Blue</span>
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-semibold rounded-lg border bg-gray-100 text-gray-700 border-gray-200">Gray</span>
  </div>
</body>
</html>
