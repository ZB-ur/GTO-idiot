<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-8 max-w-lg mx-auto">

    <!-- Fold / Call / Raise -->
    <div>
      <p class="text-sm font-semibold text-gray-600 mb-2">Facing a bet</p>
      <div class="flex flex-col gap-3">
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg border border-gray-200 bg-white text-gray-700 hover:bg-gray-50">Fold</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg border border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100">Call 6.0 BB</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg border border-blue-300 bg-blue-600 text-white hover:bg-blue-700">Raise</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg border border-red-300 bg-red-500 text-white hover:bg-red-600">All-in</button>
        </div>

        <!-- Raise slider expanded -->
        <div class="bg-slate-50 rounded-xl p-4 border border-gray-200">
          <div class="flex gap-2 mb-3">
            <button class="flex-1 px-3 py-1.5 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700">1/2 Pot</button>
            <button class="flex-1 px-3 py-1.5 text-xs font-semibold rounded-lg border border-blue-300 bg-blue-50 text-blue-700">3/4 Pot</button>
            <button class="flex-1 px-3 py-1.5 text-xs font-semibold rounded-lg border border-gray-200 bg-white text-gray-700">Pot</button>
            <button class="flex-1 px-3 py-1.5 text-xs font-semibold rounded-lg border border-red-200 bg-red-50 text-red-700">All-in</button>
          </div>
          <div class="mb-3">
            <div class="flex justify-between text-[10px] text-gray-400 font-medium mb-1"><span>12 BB</span><span>100 BB</span></div>
            <div class="relative h-2 bg-gray-200 rounded-full"><div class="absolute h-2 bg-blue-600 rounded-full" style="width:25%"></div><div class="absolute w-4 h-4 bg-white border-2 border-blue-600 rounded-full shadow-sm -top-1" style="left:calc(25% - 8px)"></div></div>
          </div>
          <div class="flex gap-2 items-center">
            <div class="relative flex-1">
              <input type="text" value="24.0" class="w-full px-3 py-2 pr-10 rounded-lg border border-gray-200 text-sm font-semibold text-gray-900"/>
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-400 font-medium">BB</span>
            </div>
            <button class="px-5 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold shadow-sm">Raise</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Check / Bet -->
    <div>
      <p class="text-sm font-semibold text-gray-600 mb-2">No bet to face</p>
      <div class="flex gap-2">
        <button class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg border border-blue-200 bg-blue-50 text-blue-700">Check</button>
        <button class="flex-1 px-4 py-3 text-sm font-semibold rounded-lg border border-blue-300 bg-blue-600 text-white">Bet</button>
      </div>
    </div>

  </div>
</body>
</html>
