<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppShell Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen bg-slate-50 flex flex-col">

    <!-- ===== TopNav ===== -->
    <nav class="w-full bg-white border-b border-gray-200">
      <div class="max-w-6xl mx-auto px-6 flex items-center justify-between h-14">
        <!-- Logo -->
        <div class="flex items-center gap-2">
          <span class="text-xl">🃏</span>
          <span class="text-lg font-bold text-gray-900 tracking-tight">GTO Idiot</span>
        </div>
        <!-- Nav Links -->
        <div class="flex items-center gap-1">
          <button class="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-slate-50 transition-colors">
            <span>♠</span><span>对战</span>
          </button>
          <button class="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600">
            <span>📋</span><span>历史</span>
          </button>
          <button class="flex items-center gap-1.5 px-4 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-slate-50 transition-colors">
            <span>📊</span><span>统计</span>
          </button>
        </div>
        <!-- Session Badge -->
        <div class="flex items-center gap-2 px-3 py-1.5 bg-slate-100 rounded-lg text-sm">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span class="text-gray-500">进行中</span>
          <span class="text-gray-300">|</span>
          <span class="text-gray-900 font-medium">#42</span>
        </div>
      </div>
    </nav>

    <!-- ===== Page Content Area — sample: History page ===== -->
    <div class="flex-1">
      <main class="max-w-4xl mx-auto px-6 py-6">
        <!-- Page Title -->
        <h1 class="text-2xl font-bold text-gray-900 mb-6">手牌历史</h1>

        <!-- Sample hand cards list -->
        <div class="space-y-3">
          <!-- Hand 1 -->
          <div class="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-4">
              <div class="flex gap-1">
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-red-600">A♥</span>
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-gray-900">K♠</span>
              </div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Hand #38</p>
                <p class="text-xs text-gray-500">BTN · 到 River</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm font-bold text-green-500">+12.5 BB</p>
              <p class="text-xs text-gray-400">3 分钟前</p>
            </div>
          </div>

          <!-- Hand 2 -->
          <div class="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-4">
              <div class="flex gap-1">
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-gray-900">Q♣</span>
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-gray-900">J♠</span>
              </div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Hand #37</p>
                <p class="text-xs text-gray-500">CO · Fold @ Flop</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm font-bold text-red-500">-3.0 BB</p>
              <p class="text-xs text-gray-400">6 分钟前</p>
            </div>
          </div>

          <!-- Hand 3 -->
          <div class="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-4">
              <div class="flex gap-1">
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-red-600">T♦</span>
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-red-600">T♥</span>
              </div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Hand #36</p>
                <p class="text-xs text-gray-500">UTG · 到 Showdown</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm font-bold text-green-500">+24.0 BB</p>
              <p class="text-xs text-gray-400">10 分钟前</p>
            </div>
          </div>

          <!-- Hand 4 -->
          <div class="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between shadow-sm">
            <div class="flex items-center gap-4">
              <div class="flex gap-1">
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-gray-900">7♠</span>
                <span class="inline-flex items-center justify-center w-8 h-11 rounded-md bg-white border border-gray-200 text-xs font-bold text-gray-900">6♣</span>
              </div>
              <div>
                <p class="text-sm font-semibold text-gray-900">Hand #35</p>
                <p class="text-xs text-gray-500">BB · Fold @ Preflop</p>
              </div>
            </div>
            <div class="text-right">
              <p class="text-sm font-bold text-gray-400">-1.0 BB</p>
              <p class="text-xs text-gray-400">14 分钟前</p>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ===== Toast Notifications (stacked, top-right) ===== -->
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2">
      <!-- Success Toast -->
      <div class="flex items-center gap-3 px-4 py-3 rounded-xl border shadow-md bg-emerald-50 border-emerald-200">
        <span class="w-6 h-6 rounded-full bg-emerald-500 flex items-center justify-center text-white text-xs font-bold">✓</span>
        <span class="text-sm font-medium text-emerald-800">Session 已创建，开始对战！</span>
        <button class="ml-2 text-emerald-800 opacity-60 hover:opacity-100 transition-opacity text-lg leading-none">×</button>
      </div>
      <!-- Warning Toast -->
      <div class="flex items-center gap-3 px-4 py-3 rounded-xl border shadow-md bg-amber-50 border-amber-200">
        <span class="w-6 h-6 rounded-full bg-amber-500 flex items-center justify-center text-white text-xs font-bold">⚠</span>
        <span class="text-sm font-medium text-amber-800">EV 偏差较大，建议复盘</span>
        <button class="ml-2 text-amber-800 opacity-60 hover:opacity-100 transition-opacity text-lg leading-none">×</button>
      </div>
    </div>
  </div>
</body>
</html>
