<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionSummaryModal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <!-- Backdrop -->
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm"></div>

  <!-- Modal -->
  <div class="fixed inset-0 flex items-center justify-center">
    <div class="max-w-md w-full mx-4 bg-white rounded-xl shadow-md border border-gray-200">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
        <h2 class="text-lg font-semibold text-gray-900">Session Summary</h2>
        <button class="flex items-center justify-center w-8 h-8 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-slate-100">
          <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-5">
        <!-- Time -->
        <div class="flex items-center justify-between mb-6 px-4 py-3 bg-slate-50 rounded-lg">
          <div class="text-center">
            <div class="text-[10px] text-gray-400 font-medium uppercase">Start</div>
            <div class="text-sm font-semibold text-gray-900">14:05</div>
          </div>
          <div class="flex items-center gap-2 text-gray-300">
            <div class="w-8 h-px bg-gray-200"></div>
            <span class="text-xs font-semibold text-gray-500">1h 42m</span>
            <div class="w-8 h-px bg-gray-200"></div>
          </div>
          <div class="text-center">
            <div class="text-[10px] text-gray-400 font-medium uppercase">End</div>
            <div class="text-sm font-semibold text-gray-900">15:47</div>
          </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col gap-1">
            <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Hands Played</span>
            <span class="text-2xl font-bold text-gray-900">142</span>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col gap-1">
            <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Duration</span>
            <span class="text-2xl font-bold text-gray-900">1h 42m</span>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col gap-1">
            <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Profit / Loss</span>
            <span class="text-2xl font-bold text-emerald-600">+28.5 BB</span>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col gap-1">
            <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">Avg EV Loss</span>
            <span class="text-2xl font-bold text-amber-600">-0.32 BB</span>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="flex justify-end px-6 py-4 border-t border-gray-200 bg-slate-50 rounded-b-xl">
        <button class="px-5 py-2 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 shadow-sm">Done</button>
      </div>
    </div>
  </div>
</body>
</html>
