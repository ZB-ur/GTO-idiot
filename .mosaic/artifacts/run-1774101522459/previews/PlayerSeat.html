<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayerSeat Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-wrap gap-6 items-start">

    <!-- Active player (human, acting, dealer) -->
    <div class="relative flex flex-col items-center gap-1.5 p-3 rounded-xl border-2 border-blue-500 ring-2 ring-blue-200 shadow-sm shadow-blue-100 bg-white" style="min-width:120px">
      <div class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-white border-2 border-gray-300 shadow-md flex items-center justify-center text-[10px] font-bold text-gray-900">D</div>
      <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-yellow-100 text-yellow-800">BTN</span>
      <div class="flex items-center gap-1.5">
        <span class="text-sm font-semibold text-gray-900">Hero</span>
      </div>
      <div class="flex gap-1">
        <div class="w-10 h-14 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col items-center justify-between overflow-hidden select-none">
          <div class="self-start pl-1 pt-0.5 leading-none text-gray-900"><div class="text-xs font-bold">A</div><div class="text-xs -mt-0.5">&#9824;</div></div>
          <div class="text-lg text-gray-900 -mt-2">&#9824;</div>
          <div class="self-end pr-1 pb-0.5 leading-none rotate-180 text-gray-900"><div class="text-xs font-bold">A</div><div class="text-xs -mt-0.5">&#9824;</div></div>
        </div>
        <div class="w-10 h-14 rounded-lg border border-gray-200 shadow-sm bg-white inline-flex flex-col items-center justify-between overflow-hidden select-none">
          <div class="self-start pl-1 pt-0.5 leading-none text-red-500"><div class="text-xs font-bold">K</div><div class="text-xs -mt-0.5">&#9829;</div></div>
          <div class="text-lg text-red-500 -mt-2">&#9829;</div>
          <div class="self-end pr-1 pb-0.5 leading-none rotate-180 text-red-500"><div class="text-xs font-bold">K</div><div class="text-xs -mt-0.5">&#9829;</div></div>
        </div>
      </div>
      <span class="text-xs font-semibold text-gray-600">98.5 BB</span>
      <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg">RAISE</span>
      <span class="text-[10px] font-semibold text-amber-700 bg-amber-50 px-2 py-0.5 rounded-lg border border-amber-200">Bet: 6 BB</span>
    </div>

    <!-- BOT (TAG, active, not acting) -->
    <div class="relative flex flex-col items-center gap-1.5 p-3 rounded-xl border-2 border-gray-200 shadow-sm bg-white" style="min-width:120px">
      <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-emerald-100 text-emerald-800">CO</span>
      <div class="flex items-center gap-1.5">
        <span class="text-sm font-semibold text-gray-900">Bot_Alice</span>
        <span class="text-[10px] font-medium px-1.5 py-0.5 rounded border bg-blue-50 text-blue-700 border-blue-200">TAG</span>
      </div>
      <div class="flex gap-1">
        <div class="w-10 h-14 rounded-lg border border-gray-200 shadow-sm bg-gradient-to-br from-blue-600 to-blue-800 inline-flex flex-col items-center justify-between overflow-hidden select-none">
          <div class="w-full h-full flex items-center justify-center"><div class="w-[80%] h-[85%] rounded border border-blue-400/30 bg-blue-700/50 flex items-center justify-center"><span class="text-blue-200/60 text-lg font-bold">&#9824;</span></div></div>
        </div>
        <div class="w-10 h-14 rounded-lg border border-gray-200 shadow-sm bg-gradient-to-br from-blue-600 to-blue-800 inline-flex flex-col items-center justify-between overflow-hidden select-none">
          <div class="w-full h-full flex items-center justify-center"><div class="w-[80%] h-[85%] rounded border border-blue-400/30 bg-blue-700/50 flex items-center justify-center"><span class="text-blue-200/60 text-lg font-bold">&#9824;</span></div></div>
        </div>
      </div>
      <span class="text-xs font-semibold text-gray-600">125.0 BB</span>
      <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg">CALL</span>
    </div>

    <!-- Folded (inactive) -->
    <div class="relative flex flex-col items-center gap-1.5 p-3 rounded-xl border-2 border-gray-200 shadow-sm bg-white opacity-50" style="min-width:120px">
      <span class="text-[10px] font-bold px-2 py-0.5 rounded-lg bg-red-100 text-red-800">UTG</span>
      <div class="flex items-center gap-1.5">
        <span class="text-sm font-semibold text-gray-900">Bot_Bob</span>
        <span class="text-[10px] font-medium px-1.5 py-0.5 rounded border bg-red-50 text-red-700 border-red-200">LAG</span>
      </div>
      <div class="flex gap-1">
        <div class="w-10 h-14 rounded-lg border border-gray-200 shadow-sm bg-gradient-to-br from-blue-600 to-blue-800 inline-flex flex-col items-center justify-between overflow-hidden select-none">
          <div class="w-full h-full flex items-center justify-center"><div class="w-[80%] h-[85%] rounded border border-blue-400/30 bg-blue-700/50 flex items-center justify-center"><span class="text-blue-200/60 text-lg font-bold">&#9824;</span></div></div>
        </div>
        <div class="w-10 h-14 rounded-lg border border-gray-200 shadow-sm bg-gradient-to-br from-blue-600 to-blue-800 inline-flex flex-col items-center justify-between overflow-hidden select-none">
          <div class="w-full h-full flex items-center justify-center"><div class="w-[80%] h-[85%] rounded border border-blue-400/30 bg-blue-700/50 flex items-center justify-center"><span class="text-blue-200/60 text-lg font-bold">&#9824;</span></div></div>
        </div>
      </div>
      <span class="text-xs font-semibold text-gray-600">42.0 BB</span>
      <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg">FOLD</span>
    </div>

  </div>
</body>
</html>
