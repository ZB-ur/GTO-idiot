<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BetSizer Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 32px; max-width: 360px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Bet Sizer</p>

    <div class="w-full space-y-3 bg-gray-800 border border-gray-700 rounded-xl p-4">
      <!-- Quick amount buttons -->
      <div class="flex items-center gap-1.5 flex-wrap">
        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">Min</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">1/3 Pot</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold border bg-emerald-600/30 text-emerald-400 border-emerald-500/50">1/2 Pot</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">2/3 Pot</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">Pot</button>
        <button class="px-3 py-1.5 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">All-In</button>
      </div>

      <!-- Slider -->
      <div class="relative">
        <div class="w-full h-2 bg-gray-700 rounded-full overflow-hidden">
          <div class="h-full bg-emerald-500 rounded-full" style="width: 40%;"></div>
        </div>
      </div>

      <!-- Amount display -->
      <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-1.5">
          <span class="text-gray-400 text-xs">Min 2</span>
          <span class="text-gray-600 text-xs">|</span>
          <span class="text-gray-400 text-xs">Max 100</span>
        </div>
        <div class="flex items-center gap-1.5 bg-gray-800 border border-gray-600 rounded-lg px-3 py-1.5">
          <span class="text-white text-sm font-semibold" style="font-variant-numeric: tabular-nums;">12.5</span>
          <span class="text-gray-400 text-xs font-medium">BB</span>
        </div>
      </div>

      <!-- Pot reference -->
      <div class="text-center text-gray-500 text-[10px]">
        Pot: 25 BB · 50% pot
      </div>
    </div>
  </div>
</body>
</html>
