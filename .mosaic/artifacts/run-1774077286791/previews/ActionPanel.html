<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ActionPanel Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 32px; max-width: 480px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Action Panel — Scenarios</p>

    <!-- Facing bet (fold/call/raise) -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Facing Bet — Fold / Call / Raise</p>
      <div class="w-full bg-gray-800/80 border border-gray-700 rounded-xl p-4 space-y-3">
        <!-- Quick amounts -->
        <div class="flex items-center gap-1.5 flex-wrap">
          <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">Min</button>
          <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">1/3 Pot</button>
          <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-emerald-600/30 text-emerald-400 border-emerald-500/50">1/2 Pot</button>
          <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">2/3 Pot</button>
          <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">Pot</button>
          <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600">All-In</button>
        </div>
        <!-- Slider -->
        <div class="relative h-2">
          <div class="w-full h-2 bg-gray-700 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full" style="width: 35%;"></div>
          </div>
        </div>
        <!-- Amount -->
        <div class="flex items-center justify-between">
          <span class="text-gray-400 text-xs">6.0 — 98.5 BB</span>
          <div class="flex items-center gap-1 bg-gray-900 border border-gray-600 rounded-lg px-2.5 py-1">
            <span class="text-white text-sm font-semibold" style="font-variant-numeric: tabular-nums;">18.0</span>
            <span class="text-gray-400 text-xs">BB</span>
          </div>
        </div>
        <!-- Buttons -->
        <div class="flex items-center gap-2">
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-red-500/20 text-red-400 border-red-500/40 min-w-[70px]">
            <span class="text-sm">弃牌</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-emerald-600 text-white border-emerald-500 min-w-[70px]">
            <span class="text-sm">跟注</span>
            <span class="text-xs opacity-70 mt-0.5">3.0 BB</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-emerald-600 text-white border-emerald-500 min-w-[70px]">
            <span class="text-sm">加注</span>
            <span class="text-xs opacity-70 mt-0.5">18.0 BB</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Check/Bet -->
    <div>
      <p class="text-gray-500 text-xs mb-2">No Bet — Check / Bet</p>
      <div class="w-full bg-gray-800/80 border border-gray-700 rounded-xl p-4 space-y-3">
        <div class="flex items-center gap-2">
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-gray-700 text-white border-gray-600 min-w-[70px]">
            <span class="text-sm">过牌</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-emerald-600 text-white border-emerald-500 min-w-[70px]">
            <span class="text-sm">下注</span>
            <span class="text-xs opacity-70 mt-0.5">6.0 BB</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Disabled state -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Disabled (not player's turn)</p>
      <div class="w-full bg-gray-800/80 border border-gray-700 rounded-xl p-4 space-y-3">
        <div class="flex items-center gap-2">
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold opacity-30 cursor-not-allowed bg-red-500/20 text-red-400 border-red-500/40 min-w-[70px]">
            <span class="text-sm">弃牌</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold opacity-30 cursor-not-allowed bg-emerald-600 text-white border-emerald-500 min-w-[70px]">
            <span class="text-sm">跟注</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold opacity-30 cursor-not-allowed bg-emerald-600 text-white border-emerald-500 min-w-[70px]">
            <span class="text-sm">加注</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
