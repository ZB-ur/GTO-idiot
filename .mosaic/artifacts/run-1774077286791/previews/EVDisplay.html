<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-6 p-6">
    <h2 class="text-lg font-semibold text-gray-900">EVDisplay — All Qualities</h2>

    <!-- Good (green) -->
    <div>
      <p class="mb-2 text-sm font-medium text-gray-500">Good (EV diff &lt; 0.5BB)</p>
      <div class="inline-flex items-center gap-3 rounded-xl border border-green-200 bg-green-50 px-4 py-3">
        <div class="text-green-700">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-baseline gap-1.5">
            <span class="text-xl font-bold tabular-nums" style="color: #22c55e;">0.00</span>
            <span class="text-xs font-medium text-gray-400">BB</span>
          </div>
          <span class="text-xs font-medium text-green-700">符合 GTO</span>
        </div>
        <div class="ml-1 border-l border-gray-200 pl-3">
          <span class="inline-flex items-center gap-1.5 rounded-lg border border-green-200 bg-green-50 px-2.5 py-1 text-xs font-medium text-green-700">
            <span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>
            高置信度
          </span>
        </div>
      </div>
    </div>

    <!-- Minor deviation (yellow) -->
    <div>
      <p class="mb-2 text-sm font-medium text-gray-500">Minor Deviation (0.5–2BB)</p>
      <div class="inline-flex items-center gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3">
        <div class="text-amber-700">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-baseline gap-1.5">
            <span class="text-xl font-bold tabular-nums" style="color: #eab308;">-1.25</span>
            <span class="text-xs font-medium text-gray-400">BB</span>
          </div>
          <span class="text-xs font-medium text-amber-700">轻微偏差</span>
        </div>
        <div class="ml-1 border-l border-gray-200 pl-3">
          <span class="inline-flex items-center gap-1.5 rounded-lg border border-amber-200 bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-700">
            <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
            中置信度
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Major deviation (red) -->
    <div>
      <p class="mb-2 text-sm font-medium text-gray-500">Major Deviation (&gt; 2BB)</p>
      <div class="inline-flex items-center gap-3 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3">
        <div class="text-rose-700">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-baseline gap-1.5">
            <span class="text-xl font-bold tabular-nums" style="color: #ef4444;">-4.80</span>
            <span class="text-xs font-medium text-gray-400">BB</span>
          </div>
          <span class="text-xs font-medium text-rose-700">严重偏差</span>
        </div>
        <div class="ml-1 border-l border-gray-200 pl-3">
          <span class="inline-flex items-center gap-1.5 rounded-lg border border-rose-200 bg-rose-50 px-2.5 py-1 text-xs font-medium text-rose-700">
            <span class="h-1.5 w-1.5 rounded-full bg-rose-500"></span>
            低置信度
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
          </span>
        </div>
      </div>
    </div>

    <!-- Without confidence -->
    <div>
      <p class="mb-2 text-sm font-medium text-gray-500">Without Confidence Badge</p>
      <div class="inline-flex items-center gap-3 rounded-xl border border-green-200 bg-green-50 px-4 py-3">
        <div class="text-green-700">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
        <div class="flex flex-col">
          <div class="flex items-baseline gap-1.5">
            <span class="text-xl font-bold tabular-nums" style="color: #22c55e;">-0.15</span>
            <span class="text-xs font-medium text-gray-400">BB</span>
          </div>
          <span class="text-xs font-medium text-green-700">符合 GTO</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
