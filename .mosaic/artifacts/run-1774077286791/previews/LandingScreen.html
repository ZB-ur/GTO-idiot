<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandingScreen Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen bg-slate-50 flex items-center justify-center p-4">
    <div class="w-full max-w-md space-y-8 text-center">

      <!-- Logo & Branding -->
      <div class="space-y-3">
        <div class="mx-auto w-20 h-20 bg-emerald-800 rounded-2xl flex items-center justify-center shadow-lg">
          <span class="text-4xl">♠</span>
        </div>
        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">GTO Idiot</h1>
        <p class="text-gray-600 text-base">Texas Hold'em GTO 训练器</p>
      </div>

      <!-- Action Cards -->
      <div class="space-y-4">

        <!-- Resume Session Card -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-6 shadow-sm text-left cursor-pointer hover:border-blue-300 hover:shadow-md transition-all duration-200 group">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-amber-50 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div class="flex-1">
              <h2 class="text-lg font-semibold text-gray-900">继续上次 Session</h2>
              <p class="text-sm text-gray-500 mt-0.5">恢复未完成的牌局</p>
            </div>
            <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </div>

        <!-- New Session Card -->
        <div class="w-full bg-blue-600 rounded-xl p-6 shadow-sm text-left cursor-pointer hover:bg-blue-700 transition-all duration-200 group">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-blue-500/30 rounded-lg flex items-center justify-center">
              <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
            </div>
            <div class="flex-1">
              <h2 class="text-lg font-semibold text-white">新建 Session</h2>
              <p class="text-sm text-blue-100 mt-0.5">6-max · 100BB · 1 Human + 5 BOTs</p>
            </div>
            <svg class="w-5 h-5 text-blue-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
            </svg>
          </div>
        </div>

      </div>

      <!-- Footer -->
      <p class="text-xs text-gray-400">纯前端运行 · 数据保存在本地 IndexedDB</p>

    </div>
  </div>
</body>
</html>
