<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfirmDialog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <!-- Simulated page content behind -->
  <div class="p-8 opacity-50">
    <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
      <h2 class="text-lg font-semibold text-gray-900">牌桌界面（背景内容）</h2>
      <p class="mt-2 text-sm text-gray-600">这里是被对话框遮挡的背景页面内容。</p>
    </div>
  </div>

  <!-- Backdrop -->
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>

    <!-- Danger variant -->
    <div class="relative z-10 mx-4 w-full max-w-sm rounded-xl border border-gray-200 bg-white p-6 shadow-md">
      <div class="flex flex-col items-center text-center">
        <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-rose-100 text-rose-600">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
          </svg>
        </div>
        <h3 class="mb-2 text-lg font-semibold text-gray-900">确认 Fold？</h3>
        <p class="mb-6 text-sm text-gray-600">你持有 A♠ K♠，当前底池 120BB。确定要弃牌吗？</p>
        <div class="flex w-full gap-3">
          <button class="flex-1 rounded-lg border border-gray-200 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50">取消</button>
          <button class="flex-1 rounded-lg bg-rose-600 px-4 py-2.5 text-sm font-medium text-white hover:bg-rose-700">确认 Fold</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
