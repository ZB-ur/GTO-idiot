<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonLoader Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">SkeletonLoader</h2>

  <!-- Card variant -->
  <div class="mb-8">
    <p class="text-sm text-gray-600 mb-3">variant="card" count=3</p>
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <!-- Card 1 -->
      <div class="border border-gray-200 rounded-xl p-6 bg-white shadow-sm space-y-4">
        <div class="flex items-center gap-3">
          <div class="skeleton w-10 h-10 rounded-full"></div>
          <div class="space-y-2 flex-1">
            <div class="skeleton h-4 w-1/3"></div>
            <div class="skeleton h-3 w-1/2"></div>
          </div>
        </div>
        <div class="skeleton h-3 w-full"></div>
        <div class="skeleton h-3 w-4/5"></div>
        <div class="skeleton h-3 w-2/3"></div>
      </div>
      <!-- Card 2 -->
      <div class="border border-gray-200 rounded-xl p-6 bg-white shadow-sm space-y-4">
        <div class="flex items-center gap-3">
          <div class="skeleton w-10 h-10 rounded-full"></div>
          <div class="space-y-2 flex-1">
            <div class="skeleton h-4 w-1/3"></div>
            <div class="skeleton h-3 w-1/2"></div>
          </div>
        </div>
        <div class="skeleton h-3 w-full"></div>
        <div class="skeleton h-3 w-4/5"></div>
        <div class="skeleton h-3 w-2/3"></div>
      </div>
      <!-- Card 3 -->
      <div class="border border-gray-200 rounded-xl p-6 bg-white shadow-sm space-y-4">
        <div class="flex items-center gap-3">
          <div class="skeleton w-10 h-10 rounded-full"></div>
          <div class="space-y-2 flex-1">
            <div class="skeleton h-4 w-1/3"></div>
            <div class="skeleton h-3 w-1/2"></div>
          </div>
        </div>
        <div class="skeleton h-3 w-full"></div>
        <div class="skeleton h-3 w-4/5"></div>
        <div class="skeleton h-3 w-2/3"></div>
      </div>
    </div>
  </div>

  <!-- List variant -->
  <div class="mb-8">
    <p class="text-sm text-gray-600 mb-3">variant="list" count=4</p>
    <div class="border border-gray-200 rounded-xl bg-white shadow-sm overflow-hidden">
      <div class="flex items-center gap-3 py-3 px-4 border-b border-gray-100">
        <div class="skeleton w-8 h-8 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-4 w-2/5"></div>
          <div class="skeleton h-3 w-3/5"></div>
        </div>
        <div class="skeleton h-4 w-16"></div>
      </div>
      <div class="flex items-center gap-3 py-3 px-4 border-b border-gray-100">
        <div class="skeleton w-8 h-8 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-4 w-2/5"></div>
          <div class="skeleton h-3 w-3/5"></div>
        </div>
        <div class="skeleton h-4 w-16"></div>
      </div>
      <div class="flex items-center gap-3 py-3 px-4 border-b border-gray-100">
        <div class="skeleton w-8 h-8 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-4 w-2/5"></div>
          <div class="skeleton h-3 w-3/5"></div>
        </div>
        <div class="skeleton h-4 w-16"></div>
      </div>
      <div class="flex items-center gap-3 py-3 px-4">
        <div class="skeleton w-8 h-8 rounded-full"></div>
        <div class="flex-1 space-y-2">
          <div class="skeleton h-4 w-2/5"></div>
          <div class="skeleton h-3 w-3/5"></div>
        </div>
        <div class="skeleton h-4 w-16"></div>
      </div>
    </div>
  </div>

  <!-- Table variant -->
  <div class="mb-8">
    <p class="text-sm text-gray-600 mb-3">variant="table" count=3</p>
    <div class="border border-gray-200 rounded-xl bg-white shadow-sm overflow-hidden">
      <!-- Table header -->
      <div class="flex items-center gap-4 py-3 px-4 bg-gray-50 border-b border-gray-200">
        <div class="h-3 w-12 bg-gray-300 rounded"></div>
        <div class="h-3 w-24 bg-gray-300 rounded"></div>
        <div class="h-3 w-20 bg-gray-300 rounded"></div>
        <div class="h-3 w-16 bg-gray-300 rounded"></div>
        <div class="h-3 w-20 bg-gray-300 rounded ml-auto"></div>
      </div>
      <!-- Row 1 -->
      <div class="flex items-center gap-4 py-3 px-4 border-b border-gray-100">
        <div class="skeleton h-4 w-12"></div>
        <div class="skeleton h-4 w-24"></div>
        <div class="skeleton h-4 w-20"></div>
        <div class="skeleton h-4 w-16"></div>
        <div class="skeleton h-4 w-20 ml-auto"></div>
      </div>
      <!-- Row 2 -->
      <div class="flex items-center gap-4 py-3 px-4 border-b border-gray-100">
        <div class="skeleton h-4 w-12"></div>
        <div class="skeleton h-4 w-24"></div>
        <div class="skeleton h-4 w-20"></div>
        <div class="skeleton h-4 w-16"></div>
        <div class="skeleton h-4 w-20 ml-auto"></div>
      </div>
      <!-- Row 3 -->
      <div class="flex items-center gap-4 py-3 px-4">
        <div class="skeleton h-4 w-12"></div>
        <div class="skeleton h-4 w-24"></div>
        <div class="skeleton h-4 w-20"></div>
        <div class="skeleton h-4 w-16"></div>
        <div class="skeleton h-4 w-20 ml-auto"></div>
      </div>
    </div>
  </div>
</body>
</html>
