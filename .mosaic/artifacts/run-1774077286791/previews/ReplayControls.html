<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ReplayControls Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 32px; max-width: 480px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Replay Controls</p>

    <!-- Mid-progress state -->
    <div class="w-full bg-gray-800 border border-gray-600 rounded-xl p-4 space-y-3">
      <div class="relative w-full h-1.5 bg-gray-700 rounded-full overflow-hidden">
        <div class="absolute inset-y-0 left-0 bg-emerald-600 rounded-full" style="width: 42.8%;"></div>
        <div class="absolute inset-0 flex items-center justify-between">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 ring-2 ring-emerald-400/50" style="transform: scale(1.25);"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-gray-600"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-gray-600"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-gray-600"></div>
          <div class="w-2.5 h-2.5 rounded-full bg-gray-600"></div>
        </div>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-300 min-w-[80px]" style="font-variant-numeric: tabular-nums;">
          <span class="text-white font-semibold">4</span>
          <span class="text-gray-500"> / 8</span>
        </span>
        <div class="flex items-center gap-1.5">
          <button class="flex items-center justify-center w-9 h-9 rounded-lg bg-gray-700 text-gray-300 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
          </button>
          <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 transition-colors">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
          </button>
          <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 transition-colors">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
          </button>
          <button class="flex items-center justify-center w-9 h-9 rounded-lg bg-gray-700 text-gray-300 transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
          </button>
        </div>
        <span class="text-xs text-gray-500 min-w-[80px] text-right">← → Home End</span>
      </div>
    </div>

    <!-- At beginning (first/prev disabled) -->
    <div class="w-full bg-gray-800 border border-gray-600 rounded-xl p-4 space-y-3">
      <div class="relative w-full h-1.5 bg-gray-700 rounded-full overflow-hidden">
        <div class="absolute inset-y-0 left-0 bg-emerald-600 rounded-full" style="width: 0%;"></div>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-300 min-w-[80px]" style="font-variant-numeric: tabular-nums;">
          <span class="text-white font-semibold">1</span>
          <span class="text-gray-500"> / 8</span>
        </span>
        <div class="flex items-center gap-1.5">
          <button class="flex items-center justify-center w-9 h-9 rounded-lg bg-gray-700 text-gray-300 opacity-30 cursor-not-allowed">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" /></svg>
          </button>
          <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 opacity-30 cursor-not-allowed">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" /></svg>
          </button>
          <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" /></svg>
          </button>
          <button class="flex items-center justify-center w-9 h-9 rounded-lg bg-gray-700 text-gray-300">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" /></svg>
          </button>
        </div>
        <span class="text-xs text-gray-500 min-w-[80px] text-right">← → Home End</span>
      </div>
    </div>
  </div>
</body>
</html>
