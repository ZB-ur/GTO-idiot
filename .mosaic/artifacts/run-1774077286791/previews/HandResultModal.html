<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HandResultModal Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 0; background: #111827; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <!-- Backdrop -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm" style="position: relative; min-height: 100vh;">
    <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
      <!-- Header -->
      <div class="bg-gradient-to-r from-emerald-600/20 to-amber-600/20 border-b border-gray-700 px-6 py-4 text-center">
        <div class="text-amber-400 text-sm font-medium">Hand Complete</div>
        <div class="text-white text-xl font-bold mt-1">You 胜出!</div>
        <div class="text-gray-300 text-sm mt-0.5">Full House, Aces full of Kings</div>
      </div>

      <!-- Winner's cards -->
      <div class="flex items-center justify-center gap-1.5 py-4 border-b border-gray-700">
        <div class="w-12 h-[68px] rounded-md bg-white border border-gray-300 shadow-sm flex flex-col items-center justify-center text-gray-900">
          <span class="text-sm font-bold leading-none">A</span>
          <span class="text-base leading-none">♠</span>
        </div>
        <div class="w-12 h-[68px] rounded-md bg-white border border-gray-300 shadow-sm flex flex-col items-center justify-center text-red-600">
          <span class="text-sm font-bold leading-none">A</span>
          <span class="text-base leading-none">♥</span>
        </div>
        <div class="w-12 h-[68px] rounded-md bg-white border border-gray-300 shadow-sm flex flex-col items-center justify-center text-gray-900">
          <span class="text-sm font-bold leading-none">A</span>
          <span class="text-base leading-none">♣</span>
        </div>
        <div class="w-12 h-[68px] rounded-md bg-white border border-gray-300 shadow-sm flex flex-col items-center justify-center text-red-600">
          <span class="text-sm font-bold leading-none">K</span>
          <span class="text-base leading-none">♥</span>
        </div>
        <div class="w-12 h-[68px] rounded-md bg-white border border-gray-300 shadow-sm flex flex-col items-center justify-center text-gray-900">
          <span class="text-sm font-bold leading-none">K</span>
          <span class="text-base leading-none">♠</span>
        </div>
      </div>

      <!-- Player results -->
      <div class="px-6 py-4 space-y-2">
        <div class="flex items-center justify-between py-1.5">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-white text-xs font-bold">Y</div>
            <div>
              <div class="text-white text-sm font-medium">You</div>
              <div class="text-gray-500 text-xs">Full House</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold text-emerald-400" style="font-variant-numeric: tabular-nums;">+45.5 BB</div>
            <div class="text-gray-500 text-xs" style="font-variant-numeric: tabular-nums;">145.5 BB</div>
          </div>
        </div>
        <div class="flex items-center justify-between py-1.5">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-white text-xs font-bold">A</div>
            <div>
              <div class="text-white text-sm font-medium">Bot-A</div>
              <div class="text-gray-500 text-xs">Two Pair</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold text-red-400" style="font-variant-numeric: tabular-nums;">-22.5 BB</div>
            <div class="text-gray-500 text-xs" style="font-variant-numeric: tabular-nums;">77.5 BB</div>
          </div>
        </div>
        <div class="flex items-center justify-between py-1.5">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gray-700 flex items-center justify-center text-white text-xs font-bold">B</div>
            <div>
              <div class="text-white text-sm font-medium">Bot-B</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold text-red-400" style="font-variant-numeric: tabular-nums;">-23.0 BB</div>
            <div class="text-gray-500 text-xs" style="font-variant-numeric: tabular-nums;">52.0 BB</div>
          </div>
        </div>
      </div>

      <!-- Highlights -->
      <div class="px-6 pb-3">
        <div class="flex items-center gap-1.5 text-amber-400 text-xs">
          <span>★</span><span>最大底池 45.5 BB</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="border-t border-gray-700 px-6 py-4 flex items-center gap-2">
        <button class="px-4 py-2.5 rounded-lg border border-gray-600 text-gray-300 text-sm font-medium">结束牌局</button>
        <button class="px-4 py-2.5 rounded-lg border border-gray-600 text-gray-300 text-sm font-medium flex-1">查看复盘</button>
        <button class="px-4 py-2.5 rounded-lg bg-emerald-600 text-white text-sm font-semibold flex-1 shadow-lg shadow-emerald-600/20">下一局</button>
      </div>
    </div>
  </div>
</body>
</html>
