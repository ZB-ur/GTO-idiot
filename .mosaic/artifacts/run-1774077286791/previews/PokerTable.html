<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokerTable Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #111827; font-family: system-ui, -apple-system, sans-serif; }
    @keyframes pulse-ring { 0%, 100% { box-shadow: 0 0 0 0 rgba(52,211,153,0.4); } 50% { box-shadow: 0 0 0 8px rgba(52,211,153,0); } }
    .action-ring { animation: pulse-ring 2s ease-in-out infinite; }
    @keyframes bounce1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .dot1 { animation: bounce1 0.8s ease-in-out infinite; }
    .dot2 { animation: bounce1 0.8s ease-in-out infinite 0.15s; }
    .dot3 { animation: bounce1 0.8s ease-in-out infinite 0.3s; }
  </style>
</head>
<body>
  <div class="relative w-full h-screen min-h-[700px] flex flex-col items-center justify-center bg-gray-900 overflow-hidden select-none">

    <!-- Hand info header -->
    <div class="absolute top-4 left-4 flex items-center gap-3 z-10">
      <div class="bg-black/50 backdrop-blur-sm rounded-lg px-3 py-1.5 border border-gray-700/50">
        <span class="text-gray-400 text-xs">Hand</span>
        <span class="text-white text-sm font-bold ml-1.5">#17</span>
      </div>
      <div class="bg-black/50 backdrop-blur-sm rounded-lg px-3 py-1.5 border border-gray-700/50">
        <span class="text-gray-400 text-xs">Street</span>
        <span class="text-emerald-400 text-sm font-semibold ml-1.5">Flop</span>
      </div>
    </div>

    <!-- End session button -->
    <button class="absolute top-4 right-4 z-10 bg-black/50 backdrop-blur-sm rounded-lg px-3 py-1.5 border border-gray-700/50 text-gray-400 text-xs font-medium hover:text-white hover:border-gray-600 transition-colors">
      结束牌局
    </button>

    <!-- Table felt -->
    <div class="relative shrink-0" style="width:720px;height:420px;">
      <!-- Outer ring -->
      <div class="absolute inset-0 rounded-[50%] border-[6px] border-emerald-900 shadow-2xl shadow-black/50" style="background:radial-gradient(ellipse at center, #166534 0%, #14532d 50%, #052e16 100%);"></div>
      <!-- Inner felt line -->
      <div class="absolute inset-6 rounded-[50%] border-2 border-emerald-700/40"></div>

      <!-- Center: Pot + Community Cards -->
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="flex flex-col items-center gap-3">

          <!-- Pot Display -->
          <div class="flex flex-col items-center gap-1.5">
            <div class="text-gray-300 text-xs font-medium tracking-wide uppercase">Total Pot</div>
            <div class="flex items-center gap-1.5 bg-black/40 backdrop-blur-sm rounded-full px-4 py-1.5 border border-amber-400/30 shadow-lg shadow-black/30">
              <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
                <circle cx="10" cy="10" r="8" />
                <text x="10" y="14" text-anchor="middle" font-size="10" fill="#1a1a1a" font-weight="bold">$</text>
              </svg>
              <span class="text-amber-400 text-lg font-bold">24.5 BB</span>
            </div>
            <div class="flex items-center gap-2">
              <div class="flex items-center gap-1 bg-black/30 rounded-lg px-2.5 py-1 border border-gray-600/40">
                <div class="flex flex-col items-center gap-px">
                  <div class="w-3.5 h-1 rounded-sm bg-amber-400 shadow-sm"></div>
                  <div class="w-3.5 h-1 rounded-sm bg-amber-500 shadow-sm"></div>
                  <div class="w-3.5 h-1 rounded-sm bg-amber-600 shadow-sm"></div>
                </div>
                <div class="flex flex-col items-start ml-0.5">
                  <span class="text-gray-400 text-[10px] leading-tight">Main</span>
                  <span class="text-white text-xs font-semibold">24.5</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Community Cards (Flop dealt) -->
          <div class="flex flex-col items-center gap-2">
            <div class="text-gray-400 text-xs font-semibold uppercase tracking-wider">Flop</div>
            <div class="flex items-center justify-center gap-2">
              <!-- Card 1: A♠ -->
              <div class="w-16 h-[88px] rounded-md bg-white shadow-md flex flex-col items-center justify-center border border-gray-200 text-gray-900">
                <span class="text-lg font-bold leading-none">A</span>
                <span class="text-xl leading-none mt-0.5">♠</span>
              </div>
              <!-- Card 2: K♥ -->
              <div class="w-16 h-[88px] rounded-md bg-white shadow-md flex flex-col items-center justify-center border border-gray-200 text-red-600">
                <span class="text-lg font-bold leading-none">K</span>
                <span class="text-xl leading-none mt-0.5">♥</span>
              </div>
              <!-- Card 3: 7♦ -->
              <div class="w-16 h-[88px] rounded-md bg-white shadow-md flex flex-col items-center justify-center border border-gray-200 text-red-600">
                <span class="text-lg font-bold leading-none">7</span>
                <span class="text-xl leading-none mt-0.5">♦</span>
              </div>
              <!-- Slot 4: empty -->
              <div class="w-16 h-[88px] rounded-md border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
              <!-- Slot 5: empty -->
              <div class="w-16 h-[88px] rounded-md border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
          </div>

        </div>
      </div>

      <!-- ═══ PLAYER SEATS ═══ -->

      <!-- Seat 0 — Hero (bottom-right) — BTN — Action On -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:78%;left:65%;">
        <div class="relative">
          <div class="relative flex flex-col items-center gap-1">
            <!-- Dealer button -->
            <div class="absolute -top-1 -right-1 w-5 h-5 bg-amber-400 rounded-full flex items-center justify-center text-gray-900 text-[10px] font-bold shadow-md z-10">D</div>
            <!-- Avatar with action ring -->
            <div class="w-14 h-14 rounded-full flex items-center justify-center border-2 border-emerald-400 shadow-lg shadow-emerald-400/30 bg-gray-700 action-ring">
              <span class="text-white text-lg font-bold">Y</span>
            </div>
            <!-- Name + Position -->
            <div class="flex items-center gap-1">
              <span class="text-white text-xs font-medium">You</span>
              <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">BTN</span>
            </div>
            <!-- Stack -->
            <span class="text-gray-300 text-xs font-semibold">96.5 BB</span>
            <!-- Hole cards (face up) -->
            <div class="flex items-center gap-0.5 mt-0.5">
              <div class="w-10 h-[56px] rounded-md bg-white border border-gray-300 shadow-sm flex flex-col items-center justify-center text-red-600">
                <span class="text-xs font-bold leading-none">A</span>
                <span class="text-sm leading-none">♥</span>
              </div>
              <div class="w-10 h-[56px] rounded-md bg-white border border-gray-300 shadow-sm flex flex-col items-center justify-center text-gray-900">
                <span class="text-xs font-bold leading-none">K</span>
                <span class="text-sm leading-none">♠</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Seat 1 — BOT 1 (bottom-left) — SB — Folded -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:78%;left:25%;">
        <div class="relative">
          <div class="relative flex flex-col items-center gap-1 opacity-40">
            <div class="w-14 h-14 rounded-full flex items-center justify-center border-2 border-gray-600 bg-gray-700">
              <span class="text-white text-lg font-bold">B</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-white text-xs font-medium">Bot-1</span>
              <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">SB</span>
            </div>
            <span class="text-gray-300 text-xs font-semibold">89.0 BB</span>
            <span class="text-gray-500 text-[10px] font-medium uppercase">Folded</span>
          </div>
          <!-- Action badge -->
          <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide bg-gray-700 text-gray-400">fold</span>
          </div>
        </div>
      </div>

      <!-- Seat 2 — BOT 2 (left) — BB — Checked -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:42%;left:3%;">
        <div class="relative">
          <div class="relative flex flex-col items-center gap-1">
            <div class="w-14 h-14 rounded-full flex items-center justify-center border-2 border-gray-600 bg-gray-700">
              <span class="text-white text-lg font-bold">C</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-white text-xs font-medium">Bot-2</span>
              <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">BB</span>
            </div>
            <span class="text-gray-300 text-xs font-semibold">98.0 BB</span>
            <!-- Face-down cards -->
            <div class="flex items-center gap-0.5 mt-0.5">
              <div class="w-10 h-[56px] rounded-md bg-gradient-to-br from-emerald-700 to-emerald-900 border-2 border-emerald-600 flex items-center justify-center">
                <div class="w-6 h-8 rounded-sm border border-emerald-500/40 bg-emerald-800/50"></div>
              </div>
              <div class="w-10 h-[56px] rounded-md bg-gradient-to-br from-emerald-700 to-emerald-900 border-2 border-emerald-600 flex items-center justify-center -ml-2">
                <div class="w-6 h-8 rounded-sm border border-emerald-500/40 bg-emerald-800/50"></div>
              </div>
            </div>
          </div>
          <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide bg-gray-700/60 text-gray-300 border border-gray-600/40">check</span>
          </div>
        </div>
      </div>

      <!-- Seat 3 — BOT 3 (top-left) — UTG — Folded -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:6%;left:25%;">
        <div class="relative">
          <div class="relative flex flex-col items-center gap-1 opacity-40">
            <div class="w-14 h-14 rounded-full flex items-center justify-center border-2 border-gray-600 bg-gray-700">
              <span class="text-white text-lg font-bold">D</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-white text-xs font-medium">Bot-3</span>
              <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">UTG</span>
            </div>
            <span class="text-gray-300 text-xs font-semibold">100.0 BB</span>
            <span class="text-gray-500 text-[10px] font-medium uppercase">Folded</span>
          </div>
          <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide bg-gray-700 text-gray-400">fold</span>
          </div>
        </div>
      </div>

      <!-- Seat 4 — BOT 4 (top-right) — HJ — Raised -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:6%;left:65%;">
        <div class="relative">
          <div class="relative flex flex-col items-center gap-1">
            <div class="w-14 h-14 rounded-full flex items-center justify-center border-2 border-gray-600 bg-gray-700">
              <span class="text-white text-lg font-bold">E</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-white text-xs font-medium">Bot-4</span>
              <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">HJ</span>
            </div>
            <span class="text-gray-300 text-xs font-semibold">92.5 BB</span>
            <!-- Face-down cards -->
            <div class="flex items-center gap-0.5 mt-0.5">
              <div class="w-10 h-[56px] rounded-md bg-gradient-to-br from-emerald-700 to-emerald-900 border-2 border-emerald-600 flex items-center justify-center">
                <div class="w-6 h-8 rounded-sm border border-emerald-500/40 bg-emerald-800/50"></div>
              </div>
              <div class="w-10 h-[56px] rounded-md bg-gradient-to-br from-emerald-700 to-emerald-900 border-2 border-emerald-600 flex items-center justify-center -ml-2">
                <div class="w-6 h-8 rounded-sm border border-emerald-500/40 bg-emerald-800/50"></div>
              </div>
            </div>
          </div>
          <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide bg-emerald-600/30 text-emerald-400 border border-emerald-500/40">bet 7.5</span>
          </div>
        </div>
      </div>

      <!-- Seat 5 — BOT 5 (right) — CO — BOT Thinking -->
      <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:42%;left:90%;">
        <div class="relative">
          <div class="relative flex flex-col items-center gap-1">
            <div class="w-14 h-14 rounded-full flex items-center justify-center border-2 border-gray-600 bg-gray-700">
              <span class="text-white text-lg font-bold">F</span>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-white text-xs font-medium">Bot-5</span>
              <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">CO</span>
            </div>
            <span class="text-gray-300 text-xs font-semibold">100.0 BB</span>
            <!-- Face-down cards -->
            <div class="flex items-center gap-0.5 mt-0.5">
              <div class="w-10 h-[56px] rounded-md bg-gradient-to-br from-emerald-700 to-emerald-900 border-2 border-emerald-600 flex items-center justify-center">
                <div class="w-6 h-8 rounded-sm border border-emerald-500/40 bg-emerald-800/50"></div>
              </div>
              <div class="w-10 h-[56px] rounded-md bg-gradient-to-br from-emerald-700 to-emerald-900 border-2 border-emerald-600 flex items-center justify-center -ml-2">
                <div class="w-6 h-8 rounded-sm border border-emerald-500/40 bg-emerald-800/50"></div>
              </div>
            </div>
          </div>
          <div class="absolute -bottom-5 left-1/2 -translate-x-1/2 whitespace-nowrap">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wide bg-gray-700/60 text-gray-300 border border-gray-600/40">call 7.5</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Action Panel (Hero's turn) -->
    <div class="w-full max-w-xl px-4 mt-4">
      <div class="w-full bg-gray-800/80 backdrop-blur-sm border border-gray-700 rounded-xl p-4 space-y-3">
        <!-- Quick amounts -->
        <div class="space-y-2">
          <div class="flex items-center gap-1.5 flex-wrap">
            <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600">Min</button>
            <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600">1/3 Pot</button>
            <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-emerald-600/30 text-emerald-400 border-emerald-500/50">1/2 Pot</button>
            <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600">2/3 Pot</button>
            <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600">Pot</button>
            <button class="px-2.5 py-1 rounded-lg text-xs font-semibold border bg-gray-700 text-gray-300 border-gray-600 hover:bg-gray-600">All-In</button>
          </div>
          <!-- Slider -->
          <div class="relative h-2">
            <div class="w-full h-2 bg-gray-700 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-500 rounded-full" style="width:35%"></div>
            </div>
          </div>
          <!-- Amount display -->
          <div class="flex items-center justify-between">
            <span class="text-gray-400 text-xs">15.0 — 96.5 BB</span>
            <div class="flex items-center gap-1 bg-gray-900 border border-gray-600 rounded-lg px-2.5 py-1">
              <span class="text-white text-sm font-semibold text-right">12.3</span>
              <span class="text-gray-400 text-xs">BB</span>
            </div>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="flex items-center gap-2">
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-red-500/20 text-red-400 border-red-500/40 hover:bg-red-500/30 min-w-[70px]">
            <span class="text-sm">弃牌</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-emerald-600 text-white border-emerald-500 hover:bg-emerald-500 min-w-[70px]">
            <span class="text-sm">跟注</span>
            <span class="text-xs opacity-70 mt-0.5">7.5 BB</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-emerald-600 text-white border-emerald-500 hover:bg-emerald-500 min-w-[70px]">
            <span class="text-sm">加注</span>
            <span class="text-xs opacity-70 mt-0.5">12.3 BB</span>
          </button>
          <button class="flex-1 flex flex-col items-center justify-center px-4 py-3 rounded-lg border font-semibold bg-red-600 text-white border-red-500 hover:bg-red-500 min-w-[70px]">
            <span class="text-sm">全下</span>
            <span class="text-xs opacity-70 mt-0.5">96.5 BB</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
