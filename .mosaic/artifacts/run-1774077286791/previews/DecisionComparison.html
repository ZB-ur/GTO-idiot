<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DecisionComparison Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 16px; max-width: 440px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Decision Comparison — Quality Levels</p>

    <!-- Good -->
    <div class="rounded-xl border p-4 space-y-4 bg-emerald-500/15 border-emerald-500/30">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400">符合 GTO</span>
        <span class="text-sm font-bold" style="color: #22c55e; font-variant-numeric: tabular-nums;">EV: 0 BB</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-black/20 rounded-lg p-3 space-y-1.5">
          <div class="text-gray-400 text-xs font-medium uppercase">你的选择</div>
          <div class="text-white text-sm font-semibold">Raise 6.0 BB</div>
        </div>
        <div class="bg-black/20 rounded-lg p-3 space-y-1.5">
          <div class="text-gray-400 text-xs font-medium uppercase">GTO 推荐</div>
          <div class="text-white text-sm font-semibold">Raise 6.5 BB</div>
          <div class="text-gray-500 text-xs" style="font-variant-numeric: tabular-nums;">EV: 1.25 BB</div>
        </div>
      </div>
      <div class="space-y-1.5">
        <div class="text-gray-400 text-xs font-medium">混合策略</div>
        <div class="flex items-center gap-1 h-4 w-full rounded-full overflow-hidden">
          <div class="h-full bg-emerald-500" style="width: 70%;"></div>
          <div class="h-full bg-blue-500" style="width: 20%;"></div>
          <div class="h-full bg-amber-500" style="width: 10%;"></div>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
          <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span class="text-xs text-emerald-400">Raise 70%</span></div>
          <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span class="text-xs text-blue-400">Call 20%</span></div>
          <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-amber-500"></span><span class="text-xs text-amber-400">Fold 10%</span></div>
        </div>
      </div>
    </div>

    <!-- Minor deviation -->
    <div class="rounded-xl border p-4 space-y-4 bg-amber-500/15 border-amber-500/30">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-400">轻微偏差</span>
        <span class="text-sm font-bold" style="color: #eab308; font-variant-numeric: tabular-nums;">EV: -1.20 BB</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-black/20 rounded-lg p-3 space-y-1.5">
          <div class="text-gray-400 text-xs font-medium uppercase">你的选择</div>
          <div class="text-white text-sm font-semibold">Call 3.0 BB</div>
        </div>
        <div class="bg-black/20 rounded-lg p-3 space-y-1.5">
          <div class="text-gray-400 text-xs font-medium uppercase">GTO 推荐</div>
          <div class="text-white text-sm font-semibold">Raise 9.0 BB</div>
          <div class="text-gray-500 text-xs" style="font-variant-numeric: tabular-nums;">EV: 2.10 BB</div>
        </div>
      </div>
    </div>

    <!-- Major deviation with confidence warning -->
    <div class="rounded-xl border p-4 space-y-4 bg-red-500/15 border-red-500/30">
      <div class="flex items-center justify-between">
        <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-red-500/20 text-red-400">重大偏差</span>
        <span class="text-sm font-bold" style="color: #ef4444; font-variant-numeric: tabular-nums;">EV: -5.80 BB</span>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-black/20 rounded-lg p-3 space-y-1.5">
          <div class="text-gray-400 text-xs font-medium uppercase">你的选择</div>
          <div class="text-white text-sm font-semibold">Call 12.0 BB</div>
        </div>
        <div class="bg-black/20 rounded-lg p-3 space-y-1.5">
          <div class="text-gray-400 text-xs font-medium uppercase">GTO 推荐</div>
          <div class="text-white text-sm font-semibold">Fold</div>
          <div class="text-gray-500 text-xs" style="font-variant-numeric: tabular-nums;">EV: 0 BB</div>
        </div>
      </div>
      <div class="flex items-start gap-2 bg-black/20 rounded-lg p-2.5">
        <svg class="w-4 h-4 shrink-0 mt-0.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.834-1.964-.834-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" /></svg>
        <span class="text-gray-400 text-xs">多人底池 EV 为近似值，建议参考专业 solver</span>
      </div>
    </div>
  </div>
</body>
</html>
