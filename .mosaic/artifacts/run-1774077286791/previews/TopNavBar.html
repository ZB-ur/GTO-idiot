<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TopNavBar Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 0; background: #111827; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 0;">
    <!-- With session info (positive) -->
    <nav class="bg-gray-900 border-b border-gray-700 px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer select-none">
        <span class="text-emerald-400 text-xl font-bold tracking-tight">♠</span>
        <span class="text-white text-lg font-bold">GTO<span class="text-emerald-400">Idiot</span></span>
      </div>
      <div class="flex items-center gap-1">
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-600/20 text-emerald-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
          <span>牌桌</span>
        </button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          <span>历史</span>
        </button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
          <span>复盘</span>
        </button>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-3 bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5">
          <div class="flex items-center gap-1">
            <span class="text-gray-500 text-xs">局数</span>
            <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">42</span>
          </div>
          <div class="w-px h-3 bg-gray-600"></div>
          <div class="flex items-center gap-1">
            <span class="text-gray-500 text-xs">盈亏</span>
            <span class="text-emerald-400 text-xs font-semibold" style="font-variant-numeric: tabular-nums;">+18.5 BB</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- With session info (negative) -->
    <nav class="bg-gray-900 border-b border-gray-700 px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer select-none">
        <span class="text-emerald-400 text-xl font-bold tracking-tight">♠</span>
        <span class="text-white text-lg font-bold">GTO<span class="text-emerald-400">Idiot</span></span>
      </div>
      <div class="flex items-center gap-1">
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400">
          <span>牌桌</span>
        </button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-600/20 text-emerald-400">
          <span>历史</span>
        </button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400">
          <span>复盘</span>
        </button>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-3 bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5">
          <div class="flex items-center gap-1">
            <span class="text-gray-500 text-xs">局数</span>
            <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">15</span>
          </div>
          <div class="w-px h-3 bg-gray-600"></div>
          <div class="flex items-center gap-1">
            <span class="text-gray-500 text-xs">盈亏</span>
            <span class="text-red-400 text-xs font-semibold" style="font-variant-numeric: tabular-nums;">-32.0 BB</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- No session -->
    <nav class="bg-gray-900 border-b border-gray-700 px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 cursor-pointer select-none">
        <span class="text-emerald-400 text-xl font-bold tracking-tight">♠</span>
        <span class="text-white text-lg font-bold">GTO<span class="text-emerald-400">Idiot</span></span>
      </div>
      <div class="flex items-center gap-1">
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400"><span>牌桌</span></button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400"><span>历史</span></button>
        <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400"><span>复盘</span></button>
      </div>
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-2 bg-gray-800 border border-gray-700 rounded-lg px-3 py-1.5">
          <span class="h-2 w-2 rounded-full bg-gray-500"></span>
          <span class="text-gray-500 text-xs font-medium">无活跃牌局</span>
        </div>
      </div>
    </nav>
  </div>
</body>
</html>
