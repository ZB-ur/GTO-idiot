<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, initial-scale=1" />
  <title>AppShell Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            felt: { DEFAULT: '#065f46', dark: '#064e3b' }
          }
        }
      }
    }
  </script>
</head>
<body>
  <div class="min-h-screen bg-slate-50 flex flex-col">

    <!-- ===== TopNavBar ===== -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3">
        <!-- Logo -->
        <div class="w-8 h-8 rounded-lg bg-emerald-800 flex items-center justify-center">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3C7.5 3 4 8 4 12c0 5 3.5 9 8 9s8-4 8-9c0-4-3.5-9-8-9z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01"/>
          </svg>
        </div>
        <span class="text-lg font-bold text-gray-900 tracking-tight">GTO Idiot</span>
      </div>

      <!-- Nav Links -->
      <div class="flex items-center gap-1">
        <a href="#" class="px-4 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600">
          牌桌
        </a>
        <a href="#" class="px-4 py-2 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100 transition-colors">
          历史
        </a>
      </div>

      <!-- Session indicator -->
      <div class="flex items-center gap-2">
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
          Session 进行中
        </span>
      </div>
    </nav>

    <!-- ===== Main Content Area (Landing Screen mockup) ===== -->
    <main class="flex-1 flex flex-col items-center justify-center px-6 py-16">
      <!-- Landing hero -->
      <div class="max-w-md w-full text-center space-y-8">
        <!-- Poker chip icon -->
        <div class="mx-auto w-20 h-20 rounded-full bg-emerald-800 flex items-center justify-center shadow-lg">
          <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="5" />
            <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8" />
          </svg>
        </div>

        <div class="space-y-3">
          <h1 class="text-2xl font-bold text-gray-900">GTO Idiot</h1>
          <p class="text-gray-600 text-base">6-max 德州扑克 GTO 训练器，边打边学最优策略</p>
        </div>

        <!-- CTA Buttons -->
        <div class="space-y-3">
          <button class="w-full px-6 py-3 rounded-xl bg-blue-600 text-white text-base font-semibold shadow-sm hover:bg-blue-700 transition-colors">
            开始新 Session
          </button>
          <button class="w-full px-6 py-3 rounded-xl bg-white text-gray-700 text-base font-medium border border-gray-200 shadow-sm hover:bg-gray-50 transition-colors">
            继续上次 Session
          </button>
        </div>

        <!-- Stats summary -->
        <div class="grid grid-cols-3 gap-4 pt-4">
          <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
            <div class="text-2xl font-bold text-gray-900">42</div>
            <div class="text-xs text-gray-500 mt-1">总手数</div>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
            <div class="text-2xl font-bold text-emerald-600">+18.5</div>
            <div class="text-xs text-gray-500 mt-1">盈亏 (BB)</div>
          </div>
          <div class="bg-white rounded-xl border border-gray-200 p-4 shadow-sm">
            <div class="text-2xl font-bold text-gray-900">76</div>
            <div class="text-xs text-gray-500 mt-1">GTO 评分</div>
          </div>
        </div>
      </div>
    </main>

    <!-- ===== Toast Messages ===== -->
    <div class="fixed bottom-6 right-6 z-50 flex flex-col gap-3">
      <!-- Success toast -->
      <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-xl shadow-md px-4 py-3 min-w-[300px]">
        <div class="w-2 h-2 rounded-full bg-green-500 shrink-0"></div>
        <span class="text-sm text-gray-900 flex-1">Session 已保存</span>
        <button class="text-gray-400 hover:text-gray-600 text-sm">✕</button>
      </div>

      <!-- Warning toast -->
      <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-xl shadow-md px-4 py-3 min-w-[300px]">
        <div class="w-2 h-2 rounded-full bg-yellow-500 shrink-0"></div>
        <span class="text-sm text-gray-900 flex-1">BOT 3 已重新买入 100BB</span>
        <button class="text-gray-400 hover:text-gray-600 text-sm">✕</button>
      </div>
    </div>
  </div>
</body>
</html>
