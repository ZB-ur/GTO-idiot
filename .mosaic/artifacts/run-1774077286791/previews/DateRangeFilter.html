<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DateRangeFilter Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
input[type="date"] { color-scheme: dark; }
</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 24px; max-width: 480px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Date Range Filter</p>

    <!-- With dates selected -->
    <div>
      <p class="text-gray-500 text-xs mb-2">With filter active</p>
      <div class="flex items-center gap-2 flex-wrap">
        <div class="flex items-center gap-1.5">
          <span class="text-gray-400 text-xs font-medium">从</span>
          <input type="date" value="2026-03-01" class="bg-gray-800 border border-gray-600 rounded-lg px-2.5 py-1.5 text-white text-xs focus:outline-none" />
        </div>
        <span class="text-gray-600 text-xs">—</span>
        <div class="flex items-center gap-1.5">
          <span class="text-gray-400 text-xs font-medium">至</span>
          <input type="date" value="2026-03-21" class="bg-gray-800 border border-gray-600 rounded-lg px-2.5 py-1.5 text-white text-xs focus:outline-none" />
        </div>
        <button class="text-gray-400 text-xs px-2 py-1 rounded-lg bg-gray-700">清除</button>
      </div>
    </div>

    <!-- Empty state -->
    <div>
      <p class="text-gray-500 text-xs mb-2">No filter</p>
      <div class="flex items-center gap-2 flex-wrap">
        <div class="flex items-center gap-1.5">
          <span class="text-gray-400 text-xs font-medium">从</span>
          <input type="date" value="" placeholder="选择日期" class="bg-gray-800 border border-gray-600 rounded-lg px-2.5 py-1.5 text-white text-xs focus:outline-none" />
        </div>
        <span class="text-gray-600 text-xs">—</span>
        <div class="flex items-center gap-1.5">
          <span class="text-gray-400 text-xs font-medium">至</span>
          <input type="date" value="" placeholder="选择日期" class="bg-gray-800 border border-gray-600 rounded-lg px-2.5 py-1.5 text-white text-xs focus:outline-none" />
        </div>
      </div>
    </div>
  </div>
</body>
</html>
