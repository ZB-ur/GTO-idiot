<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeviationBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">DeviationBadge</h2>

  <!-- All severities -->
  <div class="mb-6">
    <p class="text-sm text-gray-500 mb-2">Severity levels</p>
    <div class="flex items-center gap-3">
      <!-- none -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-emerald-50 text-emerald-700 border-emerald-200">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        GTO
      </span>
      <!-- minor -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-amber-50 text-amber-700 border-amber-200">
        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
        Minor Deviation
      </span>
      <!-- major -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-red-50 text-red-700 border-red-200">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        Major Deviation
      </span>
    </div>
  </div>

  <!-- Custom labels -->
  <div class="mb-6">
    <p class="text-sm text-gray-500 mb-2">Custom labels</p>
    <div class="flex items-center gap-3">
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-emerald-50 text-emerald-700 border-emerald-200">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        Optimal Play
      </span>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-amber-50 text-amber-700 border-amber-200">
        <span class="w-2 h-2 rounded-full bg-amber-500"></span>
        -0.5 BB EV
      </span>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-red-50 text-red-700 border-red-200">
        <span class="w-2 h-2 rounded-full bg-red-500"></span>
        -3.2 BB EV
      </span>
    </div>
  </div>

  <!-- In context: decision point -->
  <div>
    <p class="text-sm text-gray-500 mb-2">In context: decision point</p>
    <div class="max-w-md p-4 bg-white border border-gray-200 rounded-xl shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-900">Flop · Decision #2</span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-red-50 text-red-700 border-red-200">
          <span class="w-2 h-2 rounded-full bg-red-500"></span>
          Major Deviation
        </span>
      </div>
      <div class="text-sm text-gray-600 mb-2">
        You chose <span class="font-medium text-gray-900">Call</span> · GTO recommends <span class="font-medium text-gray-900">Raise 66%</span>
      </div>
      <div class="text-xs text-gray-500">EV Loss: -2.8 BB</div>
    </div>
  </div>
</body>
</html>
