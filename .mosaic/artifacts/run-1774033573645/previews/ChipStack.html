<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChipStack Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">ChipStack</h2>

  <div class="flex items-end gap-10 flex-wrap">

    <!-- 25 chips -->
    <div class="flex flex-col items-center">
      <p class="text-sm text-gray-500 mb-2">25</p>
      <div class="inline-flex flex-col items-center gap-1">
        <div class="flex items-end gap-1">
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-8 h-8 rounded-full border-2 bg-emerald-500 border-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm">25</div>
          </div>
        </div>
        <span class="text-xs font-semibold text-gray-900">25</span>
      </div>
    </div>

    <!-- 150 chips -->
    <div class="flex flex-col items-center">
      <p class="text-sm text-gray-500 mb-2">150</p>
      <div class="inline-flex flex-col items-center gap-1">
        <div class="flex items-end gap-1">
          <!-- 100 stack -->
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-8 h-8 rounded-full border-2 bg-gray-900 border-gray-700 text-white flex items-center justify-center text-[10px] font-bold shadow-sm">100</div>
          </div>
          <!-- 25 stack x2 -->
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-8 h-8 rounded-full border-2 bg-emerald-500 border-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm" style="margin-top:0"></div>
            <div class="w-8 h-8 rounded-full border-2 bg-emerald-500 border-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm" style="margin-top:-4px">25</div>
          </div>
        </div>
        <span class="text-xs font-semibold text-gray-900">150</span>
      </div>
    </div>

    <!-- 1,250 chips -->
    <div class="flex flex-col items-center">
      <p class="text-sm text-gray-500 mb-2">1,250</p>
      <div class="inline-flex flex-col items-center gap-1">
        <div class="flex items-end gap-1">
          <!-- 1K stack -->
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-8 h-8 rounded-full border-2 bg-yellow-400 border-yellow-500 text-yellow-900 flex items-center justify-center text-[10px] font-bold shadow-sm">1K</div>
          </div>
          <!-- 100 stack x2 -->
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-8 h-8 rounded-full border-2 bg-gray-900 border-gray-700 text-white flex items-center justify-center text-[10px] font-bold shadow-sm" style="margin-top:0"></div>
            <div class="w-8 h-8 rounded-full border-2 bg-gray-900 border-gray-700 text-white flex items-center justify-center text-[10px] font-bold shadow-sm" style="margin-top:-4px">100</div>
          </div>
          <!-- 25 stack x2 -->
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-8 h-8 rounded-full border-2 bg-emerald-500 border-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm" style="margin-top:0"></div>
            <div class="w-8 h-8 rounded-full border-2 bg-emerald-500 border-emerald-600 text-white flex items-center justify-center text-[10px] font-bold shadow-sm" style="margin-top:-4px">25</div>
          </div>
        </div>
        <span class="text-xs font-semibold text-gray-900">1.3K</span>
      </div>
    </div>

    <!-- 5,500 chips (sm) -->
    <div class="flex flex-col items-center">
      <p class="text-sm text-gray-500 mb-2">5,500 (sm)</p>
      <div class="inline-flex flex-col items-center gap-1">
        <div class="flex items-end gap-1">
          <!-- 1K stack x5 -->
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-6 h-6 rounded-full border-2 bg-yellow-400 border-yellow-500 text-yellow-900 flex items-center justify-center text-[8px] font-bold shadow-sm" style="margin-top:0"></div>
            <div class="w-6 h-6 rounded-full border-2 bg-yellow-400 border-yellow-500 text-yellow-900 flex items-center justify-center text-[8px] font-bold shadow-sm" style="margin-top:-4px"></div>
            <div class="w-6 h-6 rounded-full border-2 bg-yellow-400 border-yellow-500 text-yellow-900 flex items-center justify-center text-[8px] font-bold shadow-sm" style="margin-top:-4px"></div>
            <div class="w-6 h-6 rounded-full border-2 bg-yellow-400 border-yellow-500 text-yellow-900 flex items-center justify-center text-[8px] font-bold shadow-sm" style="margin-top:-4px"></div>
            <div class="w-6 h-6 rounded-full border-2 bg-yellow-400 border-yellow-500 text-yellow-900 flex items-center justify-center text-[8px] font-bold shadow-sm" style="margin-top:-4px">1K</div>
          </div>
          <!-- 500 stack -->
          <div class="flex flex-col-reverse items-center gap-0.5">
            <div class="w-6 h-6 rounded-full border-2 bg-purple-500 border-purple-600 text-white flex items-center justify-center text-[8px] font-bold shadow-sm">500</div>
          </div>
        </div>
        <span class="text-xs font-semibold text-gray-900">5.5K</span>
      </div>
    </div>

  </div>
</body>
</html>
