<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionPauseModal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- Simulated game table background -->
  <div class="min-h-screen bg-emerald-900 flex items-center justify-center relative">
    <!-- Faint table elements for context -->
    <div class="absolute inset-0 flex items-center justify-center opacity-30">
      <div class="w-[600px] h-[300px] bg-emerald-800 rounded-full border-4 border-emerald-700"></div>
    </div>

    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>

    <!-- Modal -->
    <div class="relative w-full max-w-sm mx-4 bg-white rounded-xl shadow-lg border border-gray-200 overflow-hidden">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 pt-6 pb-2">
        <h2 class="text-lg font-semibold text-gray-900">暂停游戏</h2>
        <button class="p-1 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-slate-100 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 py-4">
        <p class="text-sm text-gray-500 leading-relaxed">
          你可以暂停当前 Session 稍后继续，或者直接结束并查看本次统计摘要。
        </p>
      </div>

      <!-- Actions -->
      <div class="px-6 pb-6 space-y-3">
        <!-- Pause Button -->
        <button class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          暂停 Session
        </button>

        <!-- End Button -->
        <button class="w-full flex items-center justify-center gap-2 px-4 py-3 bg-white hover:bg-red-50 text-red-500 text-sm font-medium rounded-lg border border-red-200 hover:border-red-300 transition-colors">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
          </svg>
          结束 Session
        </button>

        <!-- Cancel -->
        <button class="w-full px-4 py-2.5 text-sm text-gray-500 hover:text-gray-700 font-medium transition-colors">
          继续游戏
        </button>
      </div>
    </div>
  </div>
</body>
</html>
