<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetTimeline Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    .animate-ping { animation: ping 1s cubic-bezier(0, 0, 0.2, 1) infinite; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto">

    <!-- BetTimeline Component -->
    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm">

      <!-- Header -->
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-sm font-semibold text-gray-900">Bet Timeline</h3>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 text-xs text-gray-500">
            <span class="w-2 h-2 rounded-full bg-gray-300"></span>Fold
          </div>
          <div class="flex items-center gap-1 text-xs text-gray-500">
            <span class="w-2 h-2 rounded-full bg-blue-500"></span>Check
          </div>
          <div class="flex items-center gap-1 text-xs text-gray-500">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>Call
          </div>
          <div class="flex items-center gap-1 text-xs text-gray-500">
            <span class="w-2 h-2 rounded-full bg-amber-500"></span>Raise
          </div>
          <div class="flex items-center gap-1 text-xs text-gray-500">
            <span class="w-2 h-2 rounded-full bg-red-500"></span>All-In
          </div>
        </div>
      </div>

      <!-- Street progress bar -->
      <div class="flex items-center gap-1 mb-5">
        <div class="h-1 flex-1 rounded-full bg-blue-600"></div>
        <div class="h-1 flex-1 rounded-full bg-blue-400"></div>
        <div class="h-1 flex-1 rounded-full bg-gray-200"></div>
        <div class="h-1 flex-1 rounded-full bg-gray-200"></div>
      </div>

      <!-- PREFLOP (completed) -->
      <div class="relative mb-5">
        <div class="flex items-center gap-2 mb-3">
          <div class="px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-gray-200 text-gray-600">
            Preflop
          </div>
          <span class="text-xs text-gray-400">5 actions</span>
        </div>
        <div class="flex flex-col gap-1.5 pl-1 relative">
          <div class="absolute left-[7px] top-0 bottom-0 w-px bg-gray-200"></div>

          <!-- UTG Fold -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-gray-300"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-gray-100">
              <span class="text-xs">✕</span>
              <span class="font-medium text-gray-400">NitBot</span>
              <span class="text-gray-400 opacity-75">Fold</span>
            </div>
          </div>

          <!-- HJ Raise -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-amber-500"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-amber-50">
              <span class="text-xs">↑</span>
              <span class="font-medium text-amber-600">LAGBot</span>
              <span class="text-amber-600 opacity-75">Raise</span>
              <span class="font-semibold text-amber-600">6</span>
            </div>
          </div>

          <!-- CO Fold -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-gray-300"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-gray-100">
              <span class="text-xs">✕</span>
              <span class="font-medium text-gray-400">TAGBot</span>
              <span class="text-gray-400 opacity-75">Fold</span>
            </div>
          </div>

          <!-- BTN (Hero) Call - highlighted -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-emerald-500"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-emerald-50 ring-2 ring-blue-200">
              <span class="text-xs">→</span>
              <span class="font-medium text-emerald-600">Hero</span>
              <span class="text-emerald-600 opacity-75">Call</span>
              <span class="font-semibold text-emerald-600">6</span>
            </div>
          </div>

          <!-- BB Fold -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-gray-300"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-gray-100">
              <span class="text-xs">✕</span>
              <span class="font-medium text-gray-400">FishBot</span>
              <span class="text-gray-400 opacity-75">Fold</span>
            </div>
          </div>
        </div>
      </div>

      <!-- FLOP (current) -->
      <div class="relative mb-5">
        <div class="flex items-center gap-2 mb-3">
          <div class="px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-blue-600 text-white shadow-sm">
            Flop
          </div>
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
          </span>
          <span class="text-xs text-gray-400">3 actions</span>
        </div>
        <div class="flex flex-col gap-1.5 pl-1 relative">
          <div class="absolute left-[7px] top-0 bottom-0 w-px bg-gray-200"></div>

          <!-- LAGBot Bet -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-amber-500"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-amber-50">
              <span class="text-xs">↑</span>
              <span class="font-medium text-amber-600">LAGBot</span>
              <span class="text-amber-600 opacity-75">Raise</span>
              <span class="font-semibold text-amber-600">8</span>
            </div>
          </div>

          <!-- Hero Raise - highlighted -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-amber-500"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-amber-50 ring-2 ring-blue-200">
              <span class="text-xs">↑</span>
              <span class="font-medium text-amber-600">Hero</span>
              <span class="text-amber-600 opacity-75">Raise</span>
              <span class="font-semibold text-amber-600">22</span>
            </div>
          </div>

          <!-- LAGBot All-In -->
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm flex-shrink-0 bg-red-500"></div>
            <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-sm bg-red-50">
              <span class="text-xs">★</span>
              <span class="font-medium text-red-500">LAGBot</span>
              <span class="text-red-500 opacity-75">All-In</span>
              <span class="font-semibold text-red-500">94</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Total actions summary -->
      <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
        <span>8 total actions</span>
        <span class="font-medium text-gray-600">Current Pot: 135</span>
      </div>

    </div>
  </div>
</body>
</html>
