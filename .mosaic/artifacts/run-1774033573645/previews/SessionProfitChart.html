<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionProfitChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-lg mx-auto space-y-8">

    <!-- Scenario 1: Winning session -->
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-gray-900">Profit Curve</h3>
        <span class="text-sm font-bold text-emerald-500">+18.5 BB</span>
      </div>
      <div class="w-full" style="height: 192px;">
        <svg viewBox="0 0 480 180" class="w-full h-full" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gPos" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <!-- Grid lines -->
          <line x1="40" y1="20" x2="470" y2="20" stroke="#e5e7eb" stroke-dasharray="3 3"/>
          <line x1="40" y1="55" x2="470" y2="55" stroke="#e5e7eb" stroke-dasharray="3 3"/>
          <line x1="40" y1="90" x2="470" y2="90" stroke="#d1d5db" stroke-dasharray="4 2"/>
          <line x1="40" y1="125" x2="470" y2="125" stroke="#e5e7eb" stroke-dasharray="3 3"/>
          <line x1="40" y1="160" x2="470" y2="160" stroke="#e5e7eb" stroke-dasharray="3 3"/>

          <!-- Y axis labels -->
          <text x="36" y="24" text-anchor="end" fill="#9ca3af" font-size="10">+20</text>
          <text x="36" y="59" text-anchor="end" fill="#9ca3af" font-size="10">+10</text>
          <text x="36" y="94" text-anchor="end" fill="#9ca3af" font-size="10">0</text>
          <text x="36" y="129" text-anchor="end" fill="#9ca3af" font-size="10">-10</text>
          <text x="36" y="164" text-anchor="end" fill="#9ca3af" font-size="10">-20</text>

          <!-- X axis labels -->
          <text x="40" y="178" fill="#9ca3af" font-size="10">#1</text>
          <text x="145" y="178" fill="#9ca3af" font-size="10">#5</text>
          <text x="252" y="178" fill="#9ca3af" font-size="10">#10</text>
          <text x="358" y="178" fill="#9ca3af" font-size="10">#15</text>
          <text x="455" y="178" fill="#9ca3af" font-size="10">#20</text>

          <!-- Area fill -->
          <path d="M40,90 L62,85 L84,78 L106,95 L128,105 L150,88 L172,70 L194,62 L216,75 L238,58 L260,45 L282,55 L304,40 L326,48 L348,35 L370,42 L392,30 L414,38 L436,25 L458,24 L458,90 L40,90 Z"
                fill="url(#gPos)"/>

          <!-- Line -->
          <polyline
            points="40,90 62,85 84,78 106,95 128,105 150,88 172,70 194,62 216,75 238,58 260,45 282,55 304,40 326,48 348,35 370,42 392,30 414,38 436,25 458,24"
            fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- End dot -->
          <circle cx="458" cy="24" r="4" fill="#10b981" stroke="white" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <!-- Scenario 2: Losing session -->
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-gray-900">Profit Curve</h3>
        <span class="text-sm font-bold text-red-500">-12.0 BB</span>
      </div>
      <div class="w-full" style="height: 192px;">
        <svg viewBox="0 0 480 180" class="w-full h-full" preserveAspectRatio="none">
          <defs>
            <linearGradient id="gNeg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#ef4444" stop-opacity="0"/>
              <stop offset="100%" stop-color="#ef4444" stop-opacity="0.2"/>
            </linearGradient>
          </defs>
          <!-- Grid lines -->
          <line x1="40" y1="20" x2="470" y2="20" stroke="#e5e7eb" stroke-dasharray="3 3"/>
          <line x1="40" y1="55" x2="470" y2="55" stroke="#e5e7eb" stroke-dasharray="3 3"/>
          <line x1="40" y1="55" x2="470" y2="55" stroke="#d1d5db" stroke-dasharray="4 2"/>
          <line x1="40" y1="90" x2="470" y2="90" stroke="#e5e7eb" stroke-dasharray="3 3"/>
          <line x1="40" y1="125" x2="470" y2="125" stroke="#e5e7eb" stroke-dasharray="3 3"/>
          <line x1="40" y1="160" x2="470" y2="160" stroke="#e5e7eb" stroke-dasharray="3 3"/>

          <!-- Y axis labels -->
          <text x="36" y="24" text-anchor="end" fill="#9ca3af" font-size="10">+10</text>
          <text x="36" y="59" text-anchor="end" fill="#9ca3af" font-size="10">0</text>
          <text x="36" y="94" text-anchor="end" fill="#9ca3af" font-size="10">-10</text>
          <text x="36" y="129" text-anchor="end" fill="#9ca3af" font-size="10">-20</text>
          <text x="36" y="164" text-anchor="end" fill="#9ca3af" font-size="10">-30</text>

          <!-- X axis labels -->
          <text x="40" y="178" fill="#9ca3af" font-size="10">#1</text>
          <text x="150" y="178" fill="#9ca3af" font-size="10">#5</text>
          <text x="260" y="178" fill="#9ca3af" font-size="10">#10</text>
          <text x="370" y="178" fill="#9ca3af" font-size="10">#15</text>

          <!-- Area fill (below zero line) -->
          <path d="M40,55 L70,48 L100,52 L130,62 L160,75 L190,68 L220,82 L250,90 L280,78 L310,95 L340,88 L370,100 L400,95 L430,98 L430,55 L40,55 Z"
                fill="url(#gNeg)"/>

          <!-- Line -->
          <polyline
            points="40,55 70,48 100,52 130,62 160,75 190,68 220,82 250,90 280,78 310,95 340,88 370,100 400,95 430,98"
            fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- End dot -->
          <circle cx="430" cy="98" r="4" fill="#ef4444" stroke="white" stroke-width="2"/>
        </svg>
      </div>
    </div>

    <!-- Scenario 3: Empty state -->
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-gray-900">Profit Curve</h3>
      </div>
      <div class="w-full flex items-center justify-center text-gray-400 text-sm" style="height: 192px;">
        No hand data yet
      </div>
    </div>

  </div>
</body>
</html>
