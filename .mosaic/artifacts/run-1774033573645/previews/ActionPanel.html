<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>

  <!-- === State 1: Active — All actions available (Preflop facing raise) === -->
  <div class="mb-8">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">Active — Facing Raise (All Actions)</p>
    <div class="w-full max-w-2xl mx-auto p-4 space-y-4">

      <!-- Raise Controls -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-gray-900">Raise Amount</span>
          <span class="text-lg font-bold text-amber-500">18 BB</span>
        </div>
        <!-- Slider -->
        <input type="range" min="6" max="100" value="18"
          class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-amber-500" />
        <div class="flex justify-between text-xs text-gray-400">
          <span>6 BB</span>
          <span>100 BB</span>
        </div>
        <!-- Presets -->
        <div class="flex gap-2">
          <button class="flex-1 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-600 hover:bg-slate-50 hover:border-amber-300 transition-colors">½ Pot</button>
          <button class="flex-1 py-1.5 rounded-lg border border-amber-300 bg-amber-50 text-xs font-medium text-amber-600 transition-colors">¾ Pot</button>
          <button class="flex-1 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-600 hover:bg-slate-50 hover:border-amber-300 transition-colors">Pot</button>
          <button class="flex-1 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-600 hover:bg-slate-50 hover:border-amber-300 transition-colors">2× Pot</button>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2">
        <button class="flex-1 py-3 rounded-lg bg-gray-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">✕</span> Fold
        </button>
        <button class="flex-1 py-3 rounded-lg bg-blue-600 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">☎</span> Call 3
        </button>
        <button class="flex-1 py-3 rounded-lg bg-amber-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">↑</span> Raise 18
        </button>
        <button class="flex-1 py-3 rounded-lg bg-red-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">🔥</span> All In
        </button>
      </div>

      <!-- Pot Info -->
      <div class="text-center text-sm text-gray-400">
        Pot: <span class="font-semibold text-gray-600">24 BB</span>
      </div>
    </div>
  </div>

  <!-- === State 2: Active — Check or Bet (no facing bet) === -->
  <div class="mb-8">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">Active — Check or Bet (Flop, no facing bet)</p>
    <div class="w-full max-w-2xl mx-auto p-4 space-y-4">

      <!-- Raise Controls -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-gray-900">Raise Amount</span>
          <span class="text-lg font-bold text-amber-500">8 BB</span>
        </div>
        <input type="range" min="2" max="97" value="8"
          class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-amber-500" />
        <div class="flex justify-between text-xs text-gray-400">
          <span>2 BB</span>
          <span>97 BB</span>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-600">½ Pot</button>
          <button class="flex-1 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-600">¾ Pot</button>
          <button class="flex-1 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-600">Pot</button>
          <button class="flex-1 py-1.5 rounded-lg border border-gray-200 text-xs font-medium text-gray-600">2× Pot</button>
        </div>
      </div>

      <!-- Action Buttons: Check + Raise + All In -->
      <div class="flex gap-2">
        <button class="flex-1 py-3 rounded-lg bg-emerald-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">✓</span> Check
        </button>
        <button class="flex-1 py-3 rounded-lg bg-amber-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">↑</span> Raise 8
        </button>
        <button class="flex-1 py-3 rounded-lg bg-red-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">🔥</span> All In
        </button>
      </div>

      <div class="text-center text-sm text-gray-400">
        Pot: <span class="font-semibold text-gray-600">10.5 BB</span>
      </div>
    </div>
  </div>

  <!-- === State 3: Confirm Dialog (All In) === -->
  <div class="mb-8">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">Confirm Dialog — All In</p>
    <div class="w-full max-w-2xl mx-auto p-4 space-y-4">

      <!-- Confirm bar -->
      <div class="bg-white rounded-xl border border-gray-200 shadow-md p-4 flex items-center justify-between">
        <p class="text-gray-900 font-semibold">
          Confirm <span class="text-red-500">All In</span>?
        </p>
        <div class="flex gap-2">
          <button class="px-4 py-2 rounded-lg border border-gray-200 text-gray-600 text-sm font-medium hover:bg-gray-50 transition-colors">
            Cancel
          </button>
          <button class="px-4 py-2 rounded-lg bg-red-500 text-white text-sm font-semibold transition-colors">
            Confirm
          </button>
        </div>
      </div>

      <!-- Buttons dimmed behind -->
      <div class="flex gap-2 opacity-40 pointer-events-none">
        <button class="flex-1 py-3 rounded-lg bg-gray-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">✕</span> Fold
        </button>
        <button class="flex-1 py-3 rounded-lg bg-blue-600 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">☎</span> Call 3
        </button>
        <button class="flex-1 py-3 rounded-lg bg-amber-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">↑</span> Raise 18
        </button>
        <button class="flex-1 py-3 rounded-lg bg-red-500 text-white font-semibold text-base shadow-sm">
          <span class="mr-1">🔥</span> All In
        </button>
      </div>

      <div class="text-center text-sm text-gray-400">
        Pot: <span class="font-semibold text-gray-600">24 BB</span>
      </div>
    </div>
  </div>

  <!-- === State 4: Inactive — Waiting === -->
  <div class="mb-8">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 px-1">Inactive — Waiting for turn</p>
    <div class="w-full max-w-2xl mx-auto p-6">
      <div class="bg-slate-100 rounded-xl border border-gray-200 p-8 text-center">
        <p class="text-gray-400 text-lg font-medium">Waiting for your turn…</p>
      </div>
    </div>
  </div>

</body>
</html>
