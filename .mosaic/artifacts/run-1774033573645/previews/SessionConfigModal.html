<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionConfigModal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #0b0f1a; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- Backdrop -->
  <div style="position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(4px);"></div>

  <!-- Modal -->
  <div style="position:relative;z-index:10;width:100%;max-width:28rem;margin:0 1rem;" class="bg-white rounded-xl shadow-xl overflow-hidden">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 pt-6 pb-2">
      <div>
        <h2 class="text-xl font-bold text-gray-900">New Session</h2>
        <p class="text-sm text-gray-500 mt-1">Choose your starting stack depth</p>
      </div>
      <button class="p-2 text-gray-400 hover:text-gray-600 hover:bg-slate-100 rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-4 space-y-4">

      <!-- Preset Grid -->
      <div class="grid grid-cols-2 gap-3">
        <!-- 20 BB -->
        <button class="flex flex-col items-center p-4 rounded-lg border-2 border-gray-200 bg-white text-gray-700 hover:border-gray-300 hover:bg-slate-50 transition-all">
          <span class="text-lg font-bold">20 BB</span>
          <span class="text-xs mt-1 text-gray-400">Short Stack</span>
        </button>
        <!-- 50 BB -->
        <button class="flex flex-col items-center p-4 rounded-lg border-2 border-gray-200 bg-white text-gray-700 hover:border-gray-300 hover:bg-slate-50 transition-all">
          <span class="text-lg font-bold">50 BB</span>
          <span class="text-xs mt-1 text-gray-400">Mid Stack</span>
        </button>
        <!-- 100 BB (selected) -->
        <button class="flex flex-col items-center p-4 rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-700 transition-all">
          <span class="text-lg font-bold">100 BB</span>
          <span class="text-xs mt-1 text-blue-500">Deep Stack</span>
        </button>
        <!-- 200 BB -->
        <button class="flex flex-col items-center p-4 rounded-lg border-2 border-gray-200 bg-white text-gray-700 hover:border-gray-300 hover:bg-slate-50 transition-all">
          <span class="text-lg font-bold">200 BB</span>
          <span class="text-xs mt-1 text-gray-400">Ultra Deep</span>
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-3">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="text-xs text-gray-400 font-medium uppercase tracking-wider">or</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- Custom Input -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Custom Stack Depth</label>
        <div class="relative">
          <input
            type="text"
            placeholder="Enter 20–500"
            class="w-full px-4 py-2.5 pr-12 rounded-lg border border-gray-200 text-gray-900 placeholder-gray-400 focus:outline-none"
          />
          <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-400 pointer-events-none">BB</span>
        </div>
      </div>

      <!-- Info -->
      <div class="flex items-start gap-2 p-3 bg-slate-100 rounded-lg">
        <svg class="w-4 h-4 text-gray-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-xs text-gray-500 leading-relaxed">
          6-max No-Limit Hold'em. All 6 players start with the same stack.
          5 BOT opponents with varied play styles will be assigned automatically.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-200 bg-slate-50">
      <button class="px-4 py-2.5 text-sm font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition-colors">
        Cancel
      </button>
      <button class="px-6 py-2.5 text-sm font-semibold rounded-lg bg-blue-600 text-white hover:bg-blue-700 shadow-sm hover:shadow transition-all">
        Start Session
      </button>
    </div>
  </div>

</body>
</html>
