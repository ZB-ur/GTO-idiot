<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealerButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">DealerButton</h2>

  <div class="flex items-center gap-6">
    <!-- Default -->
    <div class="flex flex-col items-center gap-2">
      <p class="text-sm text-gray-500">Default</p>
      <div class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 shadow-md flex items-center justify-center text-sm font-bold text-gray-900 select-none">
        D
      </div>
    </div>

    <!-- On felt background -->
    <div class="flex flex-col items-center gap-2">
      <p class="text-sm text-gray-500">On felt</p>
      <div class="w-24 h-24 rounded-xl bg-emerald-800 flex items-center justify-center">
        <div class="w-8 h-8 rounded-full bg-white border-2 border-gray-300 shadow-md flex items-center justify-center text-sm font-bold text-gray-900 select-none">
          D
        </div>
      </div>
    </div>

    <!-- With player seat context -->
    <div class="flex flex-col items-center gap-2">
      <p class="text-sm text-gray-500">With player info</p>
      <div class="relative inline-flex flex-col items-center gap-1 p-3 bg-white border border-gray-200 rounded-xl shadow-sm">
        <div class="text-sm font-semibold text-gray-900">Player 1</div>
        <div class="text-xs text-gray-500">BTN · 1,500</div>
        <div class="absolute -top-2 -right-2 w-8 h-8 rounded-full bg-white border-2 border-gray-300 shadow-md flex items-center justify-center text-sm font-bold text-gray-900 select-none">
          D
        </div>
      </div>
    </div>
  </div>
</body>
</html>
