<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScenarioRadarChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-xl mx-auto">
    <!-- Card container -->
    <div class="rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-semibold text-gray-900">Scenario Radar</h3>
        <span class="text-xs text-gray-400">Click a dimension to drill down</span>
      </div>

      <!-- SVG Radar Chart (static mock) -->
      <div class="flex justify-center" style="height: 320px;">
        <svg viewBox="0 0 500 400" width="100%" height="100%">
          <defs>
            <style>
              .label-text { font-size: 12px; fill: #6b7280; font-family: system-ui, sans-serif; }
              .tick-text { font-size: 10px; fill: #9ca3af; font-family: system-ui, sans-serif; }
            </style>
          </defs>

          <!-- Center: 250, 185; Radius: 140 -->
          <!-- 8 axes at 45° intervals (0°=top, clockwise) -->
          <!-- Scenarios: Open Raise, 3-Bet, C-Bet, Check-Raise, River Bluff, Fold to 3B, Fold to CB, Donk Bet -->

          <!-- Concentric grid polygons (25%, 50%, 75%, 100%) -->
          <!-- 8 points, angles: -90, -45, 0, 45, 90, 135, 180, 225 degrees -->

          <!-- Grid ring 25% (r=35) -->
          <polygon points="250,150 274.75,160.25 285,185 274.75,209.75 250,220 225.25,209.75 215,185 225.25,160.25"
            fill="none" stroke="#e5e7eb" stroke-width="1" />
          <!-- Grid ring 50% (r=70) -->
          <polygon points="250,115 299.5,135.5 320,185 299.5,234.5 250,255 200.5,234.5 180,185 200.5,135.5"
            fill="none" stroke="#e5e7eb" stroke-width="1" />
          <!-- Grid ring 75% (r=105) -->
          <polygon points="250,80 324.25,110.75 355,185 324.25,259.25 250,290 175.75,259.25 145,185 175.75,110.75"
            fill="none" stroke="#e5e7eb" stroke-width="1" />
          <!-- Grid ring 100% (r=140) -->
          <polygon points="250,45 349,86 390,185 349,284 250,325 151,284 110,185 151,86"
            fill="none" stroke="#e5e7eb" stroke-width="1" />

          <!-- Axis lines from center to outer -->
          <line x1="250" y1="185" x2="250" y2="45" stroke="#e5e7eb" stroke-width="1" />
          <line x1="250" y1="185" x2="349" y2="86" stroke="#e5e7eb" stroke-width="1" />
          <line x1="250" y1="185" x2="390" y2="185" stroke="#e5e7eb" stroke-width="1" />
          <line x1="250" y1="185" x2="349" y2="284" stroke="#e5e7eb" stroke-width="1" />
          <line x1="250" y1="185" x2="250" y2="325" stroke="#e5e7eb" stroke-width="1" />
          <line x1="250" y1="185" x2="151" y2="284" stroke="#e5e7eb" stroke-width="1" />
          <line x1="250" y1="185" x2="110" y2="185" stroke="#e5e7eb" stroke-width="1" />
          <line x1="250" y1="185" x2="151" y2="86" stroke="#e5e7eb" stroke-width="1" />

          <!-- Tick labels (right axis only for clean look) -->
          <text x="395" y="189" class="tick-text">100%</text>
          <text x="360" y="189" class="tick-text">75%</text>
          <text x="325" y="189" class="tick-text">50%</text>
          <text x="290" y="189" class="tick-text">25%</text>

          <!-- GTO polygon (dashed green) -->
          <!-- Mock GTO data: Open 72%, 3Bet 55%, CBet 68%, CkRaise 30%, River Bluff 35%, Fold3B 42%, FoldCB 48%, Donk 15% -->
          <!-- Compute points: center + r * fraction * cos/sin -->
          <polygon points="
            250,84.2
            326.6,112.3
            345.2,185
            291.8,243.4
            250,234
            191.2,243.6
            182.8,185
            172.2,109.3
          " fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="2" stroke-dasharray="6 3" />

          <!-- User polygon (solid blue) -->
          <!-- Mock User data: Open 65%, 3Bet 40%, CBet 78%, CkRaise 18%, River Bluff 22%, Fold3B 58%, FoldCB 55%, Donk 28% -->
          <polygon points="
            250,93.9
            309.6,125.4
            359.2,185
            275.1,219.9
            250,215.2
            168.6,253.8
            173.0,185
            178.5,99.2
          " fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="2" />

          <!-- User dots -->
          <circle cx="250" cy="93.9" r="4" fill="#2563eb" />
          <circle cx="309.6" cy="125.4" r="4" fill="#2563eb" />
          <circle cx="359.2" cy="185" r="4" fill="#2563eb" />
          <circle cx="275.1" cy="219.9" r="4" fill="#2563eb" />
          <circle cx="250" cy="215.2" r="4" fill="#2563eb" />
          <circle cx="168.6" cy="253.8" r="4" fill="#2563eb" />
          <circle cx="173.0" cy="185" r="4" fill="#2563eb" />
          <circle cx="178.5" cy="99.2" r="4" fill="#2563eb" />

          <!-- GTO dots -->
          <circle cx="250" cy="84.2" r="3" fill="#10b981" />
          <circle cx="326.6" cy="112.3" r="3" fill="#10b981" />
          <circle cx="345.2" cy="185" r="3" fill="#10b981" />
          <circle cx="291.8" cy="243.4" r="3" fill="#10b981" />
          <circle cx="250" cy="234" r="3" fill="#10b981" />
          <circle cx="191.2" cy="243.6" r="3" fill="#10b981" />
          <circle cx="182.8" cy="185" r="3" fill="#10b981" />
          <circle cx="172.2" cy="109.3" r="3" fill="#10b981" />

          <!-- Axis Labels -->
          <text x="250" y="32" text-anchor="middle" class="label-text">Open Raise</text>
          <text x="362" y="76" text-anchor="start" class="label-text">3-Bet</text>
          <text x="398" y="189" text-anchor="start" class="label-text" dx="20">C-Bet</text>
          <text x="362" y="298" text-anchor="start" class="label-text">Check-Raise</text>
          <text x="250" y="345" text-anchor="middle" class="label-text">River Bluff</text>
          <text x="138" y="298" text-anchor="end" class="label-text">Fold to 3B</text>
          <text x="100" y="189" text-anchor="end" class="label-text">Fold to CB</text>
          <text x="138" y="76" text-anchor="end" class="label-text">Donk Bet</text>
        </svg>
      </div>

      <!-- Legend -->
      <div class="flex items-center justify-center gap-6 mt-2 text-sm">
        <div class="flex items-center gap-2">
          <div class="w-5 h-0.5 bg-blue-600 rounded"></div>
          <span class="text-gray-600">You</span>
        </div>
        <div class="flex items-center gap-2">
          <div class="w-5 h-0.5 rounded" style="border-top: 2px dashed #10b981;"></div>
          <span class="text-gray-600">GTO</span>
        </div>
      </div>

      <!-- Tooltip mock (positioned near a data point) -->
      <div class="absolute" style="top: 140px; right: 60px; display: none;">
        <div class="rounded-lg border border-gray-200 bg-white p-3 shadow-md text-sm">
          <p class="font-semibold text-gray-900 mb-1">C-Bet</p>
          <p class="text-blue-600">You: 78.0%</p>
          <p class="text-emerald-600">GTO: 68.0%</p>
          <p class="text-gray-400 text-xs mt-1">142 hands</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
