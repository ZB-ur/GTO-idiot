<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExportModal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <!-- Backdrop -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40" style="backdrop-filter: blur(4px);">
    <!-- Modal -->
    <div class="w-full max-w-md rounded-xl bg-white shadow-md border border-gray-200 overflow-hidden">
      <!-- Header -->
      <div class="flex items-center justify-between px-6 pt-6 pb-4">
        <h2 class="text-lg font-semibold text-gray-900">导出手牌记录</h2>
        <button class="rounded-lg p-1.5 text-gray-400 hover:text-gray-600 hover:bg-slate-100 transition-colors">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Body -->
      <div class="px-6 pb-6 space-y-5">
        <!-- Format Selection -->
        <fieldset>
          <legend class="text-sm font-medium text-gray-900 mb-2">导出格式</legend>
          <div class="space-y-2">
            <!-- HH Text - Selected -->
            <label class="flex items-start gap-3 rounded-lg border border-blue-600 bg-blue-50/50 ring-1 ring-blue-600 p-3.5 cursor-pointer">
              <input type="radio" name="format" value="hh_text" checked class="mt-0.5 h-4 w-4 text-blue-600 border-gray-300 accent-blue-600" />
              <div>
                <span class="text-sm font-medium text-gray-900">HH 文本格式</span>
                <p class="text-xs text-gray-500 mt-0.5">标准 Hand History 格式，兼容 PokerTracker、Hold'em Manager 等分析工具</p>
              </div>
            </label>

            <!-- JSON - Not selected -->
            <label class="flex items-start gap-3 rounded-lg border border-gray-200 hover:border-gray-300 p-3.5 cursor-pointer">
              <input type="radio" name="format" value="json" class="mt-0.5 h-4 w-4 text-blue-600 border-gray-300 accent-blue-600" />
              <div>
                <span class="text-sm font-medium text-gray-900">JSON 格式</span>
                <p class="text-xs text-gray-500 mt-0.5">完整结构化数据，包含 GTO 分析信息，适合自定义数据处理</p>
              </div>
            </label>
          </div>
        </fieldset>

        <!-- Scope Selection -->
        <fieldset>
          <legend class="text-sm font-medium text-gray-900 mb-2">导出范围</legend>
          <div class="space-y-2">
            <!-- Selected hands -->
            <label class="flex items-center gap-3 rounded-lg border border-blue-600 bg-blue-50/50 ring-1 ring-blue-600 p-3.5 cursor-pointer">
              <input type="radio" name="scope" value="selected" checked class="h-4 w-4 text-blue-600 border-gray-300 accent-blue-600" />
              <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-gray-900">已选手牌</span>
                <span class="inline-flex items-center rounded-full bg-blue-100 px-2 py-0.5 text-xs font-medium text-blue-700">12 手</span>
              </div>
            </label>

            <!-- All hands -->
            <label class="flex items-center gap-3 rounded-lg border border-gray-200 hover:border-gray-300 p-3.5 cursor-pointer">
              <input type="radio" name="scope" value="all" class="h-4 w-4 text-blue-600 border-gray-300 accent-blue-600" />
              <span class="text-sm font-medium text-gray-900">全部手牌</span>
            </label>
          </div>
        </fieldset>
      </div>

      <!-- Footer -->
      <div class="flex items-center justify-end gap-3 border-t border-gray-200 bg-slate-50 px-6 py-4">
        <button class="rounded-lg px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-100 transition-colors">
          取消
        </button>
        <button class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700 transition-colors inline-flex items-center gap-2">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          导出
        </button>
      </div>
    </div>
  </div>
</body>
</html>
