<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommunityCards Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      font-family: system-ui, sans-serif;
    }

    @keyframes flipIn {
      0% {
        transform: rotateY(90deg);
        opacity: 0;
      }
      60% {
        transform: rotateY(-10deg);
        opacity: 1;
      }
      80% {
        transform: rotateY(5deg);
      }
      100% {
        transform: rotateY(0deg);
        opacity: 1;
      }
    }

    .card-flip {
      animation: flipIn 0.5s ease-out both;
    }

    .card-flip-1 { animation-delay: 0ms; }
    .card-flip-2 { animation-delay: 120ms; }
    .card-flip-3 { animation-delay: 240ms; }
    .card-flip-4 { animation-delay: 0ms; }
    .card-flip-5 { animation-delay: 0ms; }
  </style>
</head>
<body>
  <div class="space-y-10">

    <!-- === State: Flop (3 cards) === -->
    <div class="space-y-2">
      <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Flop — 3 cards dealt</h3>
      <div class="inline-flex items-center rounded-2xl bg-emerald-900 px-8 py-6 shadow-lg">
        <div class="flex flex-col items-center gap-2">
          <span class="text-xs font-medium tracking-wide uppercase text-emerald-300/70">Flop</span>
          <div class="flex items-center gap-2">
            <!-- A♠ -->
            <div style="perspective:600px; width:64px; height:88px;">
              <div class="card-flip card-flip-1 w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-gray-900">A</span>
                <span class="text-xl leading-none mt-0.5 text-gray-900">♠</span>
              </div>
            </div>
            <!-- K♥ -->
            <div style="perspective:600px; width:64px; height:88px;">
              <div class="card-flip card-flip-2 w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-red-500">K</span>
                <span class="text-xl leading-none mt-0.5 text-red-500">♥</span>
              </div>
            </div>
            <!-- 7♦ -->
            <div style="perspective:600px; width:64px; height:88px;">
              <div class="card-flip card-flip-3 w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-blue-500">7</span>
                <span class="text-xl leading-none mt-0.5 text-blue-500">♦</span>
              </div>
            </div>
            <!-- Empty slot -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
            <!-- Empty slot -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- === State: Turn (4 cards) === -->
    <div class="space-y-2">
      <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Turn — 4 cards dealt</h3>
      <div class="inline-flex items-center rounded-2xl bg-emerald-900 px-8 py-6 shadow-lg">
        <div class="flex flex-col items-center gap-2">
          <span class="text-xs font-medium tracking-wide uppercase text-emerald-300/70">Turn</span>
          <div class="flex items-center gap-2">
            <!-- A♠ -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-gray-900">A</span>
                <span class="text-xl leading-none mt-0.5 text-gray-900">♠</span>
              </div>
            </div>
            <!-- K♥ -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-red-500">K</span>
                <span class="text-xl leading-none mt-0.5 text-red-500">♥</span>
              </div>
            </div>
            <!-- 7♦ -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-blue-500">7</span>
                <span class="text-xl leading-none mt-0.5 text-blue-500">♦</span>
              </div>
            </div>
            <!-- T♣ -->
            <div style="perspective:600px; width:64px; height:88px;">
              <div class="card-flip card-flip-4 w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-emerald-600">T</span>
                <span class="text-xl leading-none mt-0.5 text-emerald-600">♣</span>
              </div>
            </div>
            <!-- Empty slot -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- === State: River (5 cards) === -->
    <div class="space-y-2">
      <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">River — 5 cards dealt (complete board)</h3>
      <div class="inline-flex items-center rounded-2xl bg-emerald-900 px-8 py-6 shadow-lg">
        <div class="flex flex-col items-center gap-2">
          <span class="text-xs font-medium tracking-wide uppercase text-emerald-300/70">River</span>
          <div class="flex items-center gap-2">
            <!-- A♠ -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-gray-900">A</span>
                <span class="text-xl leading-none mt-0.5 text-gray-900">♠</span>
              </div>
            </div>
            <!-- K♥ -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-red-500">K</span>
                <span class="text-xl leading-none mt-0.5 text-red-500">♥</span>
              </div>
            </div>
            <!-- 7♦ -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-blue-500">7</span>
                <span class="text-xl leading-none mt-0.5 text-blue-500">♦</span>
              </div>
            </div>
            <!-- T♣ -->
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-emerald-600">T</span>
                <span class="text-xl leading-none mt-0.5 text-emerald-600">♣</span>
              </div>
            </div>
            <!-- Q♥ -->
            <div style="perspective:600px; width:64px; height:88px;">
              <div class="card-flip card-flip-5 w-full h-full rounded-lg bg-white border border-gray-200 shadow-md flex flex-col items-center justify-center">
                <span class="text-lg font-bold leading-none text-red-500">Q</span>
                <span class="text-xl leading-none mt-0.5 text-red-500">♥</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- === State: Preflop (no cards) === -->
    <div class="space-y-2">
      <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Preflop — no community cards</h3>
      <div class="inline-flex items-center rounded-2xl bg-emerald-900 px-8 py-6 shadow-lg">
        <div class="flex flex-col items-center gap-2">
          <span class="text-xs font-medium tracking-wide uppercase text-emerald-300/70">Preflop</span>
          <div class="flex items-center gap-2">
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
            <div style="width:64px; height:88px;">
              <div class="w-full h-full rounded-lg border-2 border-dashed border-emerald-600/30 bg-emerald-900/20"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
