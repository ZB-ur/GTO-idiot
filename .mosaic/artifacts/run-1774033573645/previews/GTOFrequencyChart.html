<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTOFrequencyChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>

  <!-- Card wrapper matching DecisionPointPanel surface -->
  <div class="max-w-sm mx-auto bg-white border border-gray-200 rounded-xl p-6 shadow-sm">

    <!-- Header row -->
    <div class="flex items-center justify-between mb-3">
      <h4 class="text-sm font-semibold text-gray-900">GTO Frequency</h4>
      <span class="text-xs text-gray-500">
        You chose: <span class="font-medium text-gray-900">Call</span>
      </span>
    </div>

    <div class="space-y-2">

      <!-- Raise — 52% (highest frequency) -->
      <div>
        <div class="flex items-center justify-between mb-0.5">
          <span class="text-xs font-medium text-gray-600">Raise</span>
          <span class="text-xs tabular-nums text-gray-500">52%</span>
        </div>
        <div class="h-5 w-full rounded-lg overflow-hidden bg-emerald-100">
          <div class="h-full rounded-lg bg-emerald-500" style="width: 100%;"></div>
        </div>
        <p class="text-[10px] text-gray-400 mt-0.5">Sizing: 3.5 BB</p>
      </div>

      <!-- Call — 30% (player's action) -->
      <div>
        <div class="flex items-center justify-between mb-0.5">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-medium text-gray-900">Call</span>
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-blue-100 text-blue-700">YOUR ACTION</span>
          </div>
          <span class="text-xs tabular-nums font-semibold text-gray-900">30%</span>
        </div>
        <div class="h-5 w-full rounded-lg overflow-hidden bg-amber-100">
          <div class="h-full rounded-lg bg-amber-500 ring-2 ring-offset-1 ring-blue-600" style="width: 57.7%;"></div>
        </div>
      </div>

      <!-- Fold — 18% -->
      <div>
        <div class="flex items-center justify-between mb-0.5">
          <span class="text-xs font-medium text-gray-600">Fold</span>
          <span class="text-xs tabular-nums text-gray-500">18%</span>
        </div>
        <div class="h-5 w-full rounded-lg overflow-hidden bg-red-100">
          <div class="h-full rounded-lg bg-red-500" style="width: 34.6%;"></div>
        </div>
      </div>

    </div>

    <!-- Deviation warning -->
    <p class="mt-3 text-[11px] text-red-500 leading-tight">
      Your action deviates from GTO recommendation.
    </p>

  </div>

  <!-- Second example: Player matches GTO -->
  <div class="max-w-sm mx-auto bg-white border border-gray-200 rounded-xl p-6 shadow-sm mt-6">

    <div class="flex items-center justify-between mb-3">
      <h4 class="text-sm font-semibold text-gray-900">GTO Frequency</h4>
      <span class="text-xs text-gray-500">
        You chose: <span class="font-medium text-gray-900">Fold</span>
      </span>
    </div>

    <div class="space-y-2">

      <!-- Fold — 72% (player's action, matches GTO) -->
      <div>
        <div class="flex items-center justify-between mb-0.5">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-medium text-gray-900">Fold</span>
            <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-semibold bg-blue-100 text-blue-700">YOUR ACTION</span>
          </div>
          <span class="text-xs tabular-nums font-semibold text-gray-900">72%</span>
        </div>
        <div class="h-5 w-full rounded-lg overflow-hidden bg-red-100">
          <div class="h-full rounded-lg bg-red-500 ring-2 ring-offset-1 ring-blue-600" style="width: 100%;"></div>
        </div>
      </div>

      <!-- Call — 20% -->
      <div>
        <div class="flex items-center justify-between mb-0.5">
          <span class="text-xs font-medium text-gray-600">Call</span>
          <span class="text-xs tabular-nums text-gray-500">20%</span>
        </div>
        <div class="h-5 w-full rounded-lg overflow-hidden bg-amber-100">
          <div class="h-full rounded-lg bg-amber-500" style="width: 27.8%;"></div>
        </div>
      </div>

      <!-- Raise — 8% -->
      <div>
        <div class="flex items-center justify-between mb-0.5">
          <span class="text-xs font-medium text-gray-600">Raise</span>
          <span class="text-xs tabular-nums text-gray-500">8%</span>
        </div>
        <div class="h-5 w-full rounded-lg overflow-hidden bg-emerald-100">
          <div class="h-full rounded-lg bg-emerald-500" style="width: 11.1%;"></div>
        </div>
        <p class="text-[10px] text-gray-400 mt-0.5">Sizing: 8 BB</p>
      </div>

    </div>

  </div>

</body>
</html>
