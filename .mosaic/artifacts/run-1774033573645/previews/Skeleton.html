<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .skeleton-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background-color: #e5e7eb; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-8">
    <!-- Section: Text variant -->
    <div>
      <p class="text-sm font-semibold text-gray-500 mb-3">Text (3 lines)</p>
      <div class="space-y-2" style="width: 100%;">
        <div class="skeleton-pulse rounded-lg" style="height: 16px; width: 100%;"></div>
        <div class="skeleton-pulse rounded-lg" style="height: 16px; width: 100%;"></div>
        <div class="skeleton-pulse rounded-lg" style="height: 16px; width: 75%;"></div>
      </div>
    </div>

    <!-- Section: Circular variant -->
    <div>
      <p class="text-sm font-semibold text-gray-500 mb-3">Circular</p>
      <div class="flex items-center gap-4">
        <div class="skeleton-pulse rounded-full" style="width: 40px; height: 40px;"></div>
        <div class="skeleton-pulse rounded-full" style="width: 56px; height: 56px;"></div>
        <div class="skeleton-pulse rounded-full" style="width: 32px; height: 32px;"></div>
      </div>
    </div>

    <!-- Section: Rectangular variant -->
    <div>
      <p class="text-sm font-semibold text-gray-500 mb-3">Rectangular</p>
      <div class="skeleton-pulse rounded-lg" style="width: 100%; height: 120px;"></div>
    </div>

    <!-- Section: Card composition -->
    <div>
      <p class="text-sm font-semibold text-gray-500 mb-3">Card Skeleton</p>
      <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm space-y-4">
        <div class="flex items-center gap-3">
          <div class="skeleton-pulse rounded-full" style="width: 40px; height: 40px;"></div>
          <div class="space-y-2 flex-1">
            <div class="skeleton-pulse rounded-lg" style="height: 16px; width: 40%;"></div>
            <div class="skeleton-pulse rounded-lg" style="height: 12px; width: 25%;"></div>
          </div>
        </div>
        <div class="skeleton-pulse rounded-lg" style="width: 100%; height: 160px;"></div>
        <div class="space-y-2">
          <div class="skeleton-pulse rounded-lg" style="height: 14px; width: 100%;"></div>
          <div class="skeleton-pulse rounded-lg" style="height: 14px; width: 90%;"></div>
          <div class="skeleton-pulse rounded-lg" style="height: 14px; width: 60%;"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
