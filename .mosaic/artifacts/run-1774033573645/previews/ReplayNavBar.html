<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReplayNavBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-8">

    <!-- State 1: Mid-replay, paused, speed 1x -->
    <div>
      <p class="text-xs text-gray-400 mb-2 font-medium uppercase tracking-wide">Paused — Decision 3 of 5</p>
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm px-4 py-3">
        <!-- Progress bar -->
        <div class="mb-3">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-medium text-gray-500">决策点</span>
            <span class="text-xs font-semibold text-gray-900">3 / 5</span>
          </div>
          <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 rounded-full" style="width: 50%;"></div>
          </div>
          <!-- Dot indicators -->
          <div class="flex items-center justify-center gap-1.5 mt-2">
            <div class="w-2 h-2 rounded-full bg-blue-300"></div>
            <div class="w-2 h-2 rounded-full bg-blue-300"></div>
            <div class="w-2 h-2 rounded-full bg-blue-600" style="transform: scale(1.1);"></div>
            <div class="w-2 h-2 rounded-full bg-gray-200"></div>
            <div class="w-2 h-2 rounded-full bg-gray-200"></div>
          </div>
        </div>
        <!-- Controls -->
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1">
            <!-- Prev -->
            <button class="flex items-center justify-center w-9 h-9 rounded-lg text-gray-600 hover:bg-slate-100">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20" />
                <line x1="5" y1="19" x2="5" y2="5" />
              </svg>
            </button>
            <!-- Play -->
            <button class="flex items-center justify-center w-11 h-11 rounded-xl bg-blue-600 text-white shadow-sm">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 3 20 12 6 21 6 3" />
              </svg>
            </button>
            <!-- Next -->
            <button class="flex items-center justify-center w-9 h-9 rounded-lg text-gray-600 hover:bg-slate-100">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4" />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
            </button>
          </div>
          <!-- Speed -->
          <div class="flex items-center gap-1.5">
            <span class="text-xs text-gray-500 mr-1">速度</span>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">0.5x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-blue-600 text-white shadow-sm">1x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">1.5x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">2x</button>
          </div>
        </div>
      </div>
    </div>

    <!-- State 2: Playing, speed 2x -->
    <div>
      <p class="text-xs text-gray-400 mb-2 font-medium uppercase tracking-wide">Playing — Decision 2 of 5, 2x speed</p>
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm px-4 py-3">
        <div class="mb-3">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-medium text-gray-500">决策点</span>
            <span class="text-xs font-semibold text-gray-900">2 / 5</span>
          </div>
          <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 rounded-full" style="width: 25%;"></div>
          </div>
          <div class="flex items-center justify-center gap-1.5 mt-2">
            <div class="w-2 h-2 rounded-full bg-blue-300"></div>
            <div class="w-2 h-2 rounded-full bg-blue-600" style="transform: scale(1.1);"></div>
            <div class="w-2 h-2 rounded-full bg-gray-200"></div>
            <div class="w-2 h-2 rounded-full bg-gray-200"></div>
            <div class="w-2 h-2 rounded-full bg-gray-200"></div>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1">
            <!-- Prev disabled while playing -->
            <button class="flex items-center justify-center w-9 h-9 rounded-lg text-gray-300" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20" />
                <line x1="5" y1="19" x2="5" y2="5" />
              </svg>
            </button>
            <!-- Pause button -->
            <button class="flex items-center justify-center w-11 h-11 rounded-xl bg-blue-600 text-white shadow-sm">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="4" width="4" height="16" rx="1" />
                <rect x="14" y="4" width="4" height="16" rx="1" />
              </svg>
            </button>
            <!-- Next disabled while playing -->
            <button class="flex items-center justify-center w-9 h-9 rounded-lg text-gray-300" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4" />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
            </button>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-xs text-gray-500 mr-1">速度</span>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">0.5x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">1x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">1.5x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-blue-600 text-white shadow-sm">2x</button>
          </div>
        </div>
      </div>
    </div>

    <!-- State 3: At last decision point, paused -->
    <div>
      <p class="text-xs text-gray-400 mb-2 font-medium uppercase tracking-wide">Last Decision — Next disabled</p>
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm px-4 py-3">
        <div class="mb-3">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-medium text-gray-500">决策点</span>
            <span class="text-xs font-semibold text-gray-900">5 / 5</span>
          </div>
          <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 rounded-full" style="width: 100%;"></div>
          </div>
          <div class="flex items-center justify-center gap-1.5 mt-2">
            <div class="w-2 h-2 rounded-full bg-blue-300"></div>
            <div class="w-2 h-2 rounded-full bg-blue-300"></div>
            <div class="w-2 h-2 rounded-full bg-blue-300"></div>
            <div class="w-2 h-2 rounded-full bg-blue-300"></div>
            <div class="w-2 h-2 rounded-full bg-blue-600" style="transform: scale(1.1);"></div>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1">
            <button class="flex items-center justify-center w-9 h-9 rounded-lg text-gray-600 hover:bg-slate-100">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20" />
                <line x1="5" y1="19" x2="5" y2="5" />
              </svg>
            </button>
            <!-- Play disabled at end -->
            <button class="flex items-center justify-center w-11 h-11 rounded-xl bg-gray-200 text-gray-400" disabled>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6 3 20 12 6 21 6 3" />
              </svg>
            </button>
            <!-- Next disabled -->
            <button class="flex items-center justify-center w-9 h-9 rounded-lg text-gray-300" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 4 15 12 5 20 5 4" />
                <line x1="19" y1="5" x2="19" y2="19" />
              </svg>
            </button>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-xs text-gray-500 mr-1">速度</span>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">0.5x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-blue-600 text-white shadow-sm">1x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">1.5x</button>
            <button class="px-2.5 py-1 text-xs font-medium rounded-lg bg-slate-100 text-gray-600">2x</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
