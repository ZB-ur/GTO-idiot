<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealerButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-4">
    <p class="text-sm font-semibold text-gray-600">Dealer Button</p>
    <div class="flex items-center gap-4">
      <!-- On light background -->
      <div class="flex flex-col items-center gap-1">
        <div class="w-7 h-7 rounded-full bg-gradient-to-b from-yellow-300 to-yellow-500 border-2 border-yellow-600 shadow-md flex items-center justify-center select-none">
          <span class="text-xs font-extrabold text-yellow-900 leading-none">D</span>
        </div>
        <span class="text-xs text-gray-400">Light bg</span>
      </div>
      <!-- On dark/felt background -->
      <div class="flex flex-col items-center gap-1">
        <div class="bg-emerald-800 rounded-lg p-3">
          <div class="w-7 h-7 rounded-full bg-gradient-to-b from-yellow-300 to-yellow-500 border-2 border-yellow-600 shadow-md flex items-center justify-center select-none">
            <span class="text-xs font-extrabold text-yellow-900 leading-none">D</span>
          </div>
        </div>
        <span class="text-xs text-gray-400">Felt bg</span>
      </div>
    </div>
  </div>
</body>
</html>
