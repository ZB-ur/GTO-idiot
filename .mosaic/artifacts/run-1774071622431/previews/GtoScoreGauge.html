<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GtoScoreGauge Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex gap-12 items-start justify-center py-12">

  <!-- Good score (78) -->
  <div class="flex flex-col items-center">
    <div class="relative w-36 h-36">
      <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" stroke-width="8" />
        <circle cx="60" cy="60" r="54" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="339.29" stroke-dashoffset="74.64" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-3xl font-bold text-emerald-500">78</span>
        <span class="text-xs text-gray-500 font-medium">/ 100</span>
      </div>
    </div>
    <div class="mt-2 text-sm font-semibold text-emerald-500">Good</div>
    <div class="text-xs text-gray-400">GTO Conformance</div>
  </div>

  <!-- Fair score (52) -->
  <div class="flex flex-col items-center">
    <div class="relative w-36 h-36">
      <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" stroke-width="8" />
        <circle cx="60" cy="60" r="54" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="339.29" stroke-dashoffset="162.86" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-3xl font-bold text-amber-500">52</span>
        <span class="text-xs text-gray-500 font-medium">/ 100</span>
      </div>
    </div>
    <div class="mt-2 text-sm font-semibold text-amber-500">Fair</div>
    <div class="text-xs text-gray-400">GTO Conformance</div>
  </div>

  <!-- Poor score (25) -->
  <div class="flex flex-col items-center">
    <div class="relative w-36 h-36">
      <svg class="w-full h-full -rotate-90" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="54" fill="none" stroke="#e2e8f0" stroke-width="8" />
        <circle cx="60" cy="60" r="54" fill="none" stroke="#ef4444" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="339.29" stroke-dashoffset="254.47" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="text-3xl font-bold text-red-500">25</span>
        <span class="text-xs text-gray-500 font-medium">/ 100</span>
      </div>
    </div>
    <div class="mt-2 text-sm font-semibold text-red-500">Needs Work</div>
    <div class="text-xs text-gray-400">GTO Conformance</div>
  </div>

</div>
</body>
</html>
