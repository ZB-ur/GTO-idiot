<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonLoader Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .skeleton-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      background-color: #e5e7eb;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>
  <div class="max-w-4xl mx-auto space-y-10">
    <!-- Label -->
    <h2 class="text-lg font-semibold text-gray-900">SkeletonLoader — All Variants</h2>

    <!-- Table variant -->
    <div>
      <p class="text-sm font-medium text-gray-600 mb-3">variant="table"</p>
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
        <div class="space-y-3">
          <div class="flex gap-4 px-4 py-3">
            <div class="skeleton-pulse h-4 w-24"></div>
            <div class="skeleton-pulse h-4 w-32"></div>
            <div class="skeleton-pulse h-4 w-20"></div>
            <div class="skeleton-pulse h-4 w-28"></div>
          </div>
          <div class="flex gap-4 px-4 py-3 border-t border-gray-100">
            <div class="skeleton-pulse h-4 w-24"></div>
            <div class="skeleton-pulse h-4 w-32"></div>
            <div class="skeleton-pulse h-4 w-20"></div>
            <div class="skeleton-pulse h-4 w-28"></div>
          </div>
          <div class="flex gap-4 px-4 py-3 border-t border-gray-100">
            <div class="skeleton-pulse h-4 w-24"></div>
            <div class="skeleton-pulse h-4 w-32"></div>
            <div class="skeleton-pulse h-4 w-20"></div>
            <div class="skeleton-pulse h-4 w-28"></div>
          </div>
          <div class="flex gap-4 px-4 py-3 border-t border-gray-100">
            <div class="skeleton-pulse h-4 w-24"></div>
            <div class="skeleton-pulse h-4 w-32"></div>
            <div class="skeleton-pulse h-4 w-20"></div>
            <div class="skeleton-pulse h-4 w-28"></div>
          </div>
          <div class="flex gap-4 px-4 py-3 border-t border-gray-100">
            <div class="skeleton-pulse h-4 w-24"></div>
            <div class="skeleton-pulse h-4 w-32"></div>
            <div class="skeleton-pulse h-4 w-20"></div>
            <div class="skeleton-pulse h-4 w-28"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- List variant -->
    <div>
      <p class="text-sm font-medium text-gray-600 mb-3">variant="list"</p>
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
        <div class="space-y-3">
          <div class="flex items-center gap-3">
            <div class="skeleton-pulse h-10 w-10 flex-shrink-0" style="border-radius:9999px"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton-pulse h-4 w-3/4"></div>
              <div class="skeleton-pulse h-3 w-1/2"></div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="skeleton-pulse h-10 w-10 flex-shrink-0" style="border-radius:9999px"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton-pulse h-4 w-3/4"></div>
              <div class="skeleton-pulse h-3 w-1/2"></div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="skeleton-pulse h-10 w-10 flex-shrink-0" style="border-radius:9999px"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton-pulse h-4 w-3/4"></div>
              <div class="skeleton-pulse h-3 w-1/2"></div>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <div class="skeleton-pulse h-10 w-10 flex-shrink-0" style="border-radius:9999px"></div>
            <div class="flex-1 space-y-2">
              <div class="skeleton-pulse h-4 w-3/4"></div>
              <div class="skeleton-pulse h-3 w-1/2"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Chart variant -->
    <div>
      <p class="text-sm font-medium text-gray-600 mb-3">variant="chart"</p>
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
        <div class="space-y-3">
          <div class="skeleton-pulse h-4 w-32"></div>
          <div class="flex items-end gap-2" style="height:160px">
            <div class="skeleton-pulse flex-1" style="height:40%"></div>
            <div class="skeleton-pulse flex-1" style="height:65%"></div>
            <div class="skeleton-pulse flex-1" style="height:30%"></div>
            <div class="skeleton-pulse flex-1" style="height:80%"></div>
            <div class="skeleton-pulse flex-1" style="height:55%"></div>
            <div class="skeleton-pulse flex-1" style="height:70%"></div>
            <div class="skeleton-pulse flex-1" style="height:45%"></div>
            <div class="skeleton-pulse flex-1" style="height:60%"></div>
            <div class="skeleton-pulse flex-1" style="height:35%"></div>
            <div class="skeleton-pulse flex-1" style="height:75%"></div>
          </div>
          <div class="flex justify-between">
            <div class="skeleton-pulse h-3 w-8"></div>
            <div class="skeleton-pulse h-3 w-8"></div>
            <div class="skeleton-pulse h-3 w-8"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card variant -->
    <div>
      <p class="text-sm font-medium text-gray-600 mb-3">variant="card"</p>
      <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 space-y-4">
        <div class="flex items-center gap-3">
          <div class="skeleton-pulse h-12 w-12 flex-shrink-0"></div>
          <div class="flex-1 space-y-2">
            <div class="skeleton-pulse h-5 w-2/3"></div>
            <div class="skeleton-pulse h-3 w-1/3"></div>
          </div>
        </div>
        <div class="skeleton-pulse h-4 w-full"></div>
        <div class="skeleton-pulse h-4 w-4/5"></div>
        <div class="skeleton-pulse h-8 w-24"></div>
      </div>
    </div>
  </div>
</body>
</html>
