<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HandResultOverlay Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 0; background: #065f46; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl p-6 max-w-md w-full mx-4 space-y-4">
    <h2 class="text-center text-xl font-bold text-white">Hand Complete</h2>
    <div class="space-y-3">
      <div class="flex items-center justify-between bg-emerald-900/30 border border-emerald-700/50 rounded-lg px-4 py-3">
        <div>
          <div class="text-white font-semibold">You</div>
          <div class="text-emerald-400 text-sm">Two Pair, Aces and Kings</div>
        </div>
        <div class="text-emerald-300 font-bold font-mono text-lg">+2,400</div>
      </div>
    </div>
    <button class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition-colors">Next Hand</button>
  </div>
</div>
</body>
</html>
