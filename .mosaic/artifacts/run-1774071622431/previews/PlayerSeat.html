<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlayerSeat Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #1e293b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex flex-wrap gap-8 items-start justify-center p-8">

  <!-- User seat, active turn, dealer -->
  <div class="relative flex flex-col items-center gap-1">
    <div class="absolute -top-2 -right-2 w-6 h-6 bg-yellow-400 text-gray-900 rounded-full flex items-center justify-center text-xs font-bold shadow-md z-10">D</div>
    <div class="relative flex flex-col items-center rounded-xl px-4 py-3 min-w-[100px] bg-blue-600 text-white ring-2 ring-emerald-400 shadow-lg shadow-emerald-400/30">
      <div class="absolute -top-1 -left-1 w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></div>
      <div class="w-10 h-10 rounded-full bg-blue-800 flex items-center justify-center text-lg font-bold mb-1">Y</div>
      <div class="text-sm font-semibold">You</div>
      <div class="text-xs opacity-70">BTN</div>
      <div class="text-sm font-mono mt-1">4,850</div>
    </div>
    <div class="flex gap-1 mt-1">
      <div class="w-9 h-13 bg-white rounded-md shadow-md flex flex-col items-center justify-center border border-gray-200 text-sm font-bold">
        <span class="text-gray-900">A</span><span class="text-gray-900">♠</span>
      </div>
      <div class="w-9 h-13 bg-white rounded-md shadow-md flex flex-col items-center justify-center border border-gray-200 text-sm font-bold">
        <span class="text-red-500">K</span><span class="text-red-500">♥</span>
      </div>
    </div>
    <div class="mt-1 px-2 py-0.5 bg-emerald-900/80 text-emerald-300 rounded-full text-xs font-mono">200</div>
  </div>

  <!-- Bot seat, TAG, not turn -->
  <div class="relative flex flex-col items-center gap-1">
    <div class="relative flex flex-col items-center rounded-xl px-4 py-3 min-w-[100px] bg-slate-800 text-gray-100 shadow-sm">
      <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center text-lg font-bold mb-1">M</div>
      <div class="text-sm font-semibold">Mike_TAG</div>
      <div class="text-xs opacity-70 flex items-center gap-1"><span>CO</span><span class="text-[10px] px-1 bg-gray-700 rounded">TAG</span></div>
      <div class="text-sm font-mono mt-1">5,200</div>
    </div>
    <div class="flex gap-1 mt-1">
      <div class="w-9 h-13 bg-slate-700 rounded-md shadow-md flex items-center justify-center border border-slate-600">
        <span class="text-slate-500 text-lg">?</span>
      </div>
      <div class="w-9 h-13 bg-slate-700 rounded-md shadow-md flex items-center justify-center border border-slate-600">
        <span class="text-slate-500 text-lg">?</span>
      </div>
    </div>
    <div class="mt-1 px-2 py-0.5 bg-emerald-900/80 text-emerald-300 rounded-full text-xs font-mono">100</div>
  </div>

  <!-- Folded seat -->
  <div class="relative flex flex-col items-center gap-1 opacity-50">
    <div class="relative flex flex-col items-center rounded-xl px-4 py-3 min-w-[100px] bg-slate-800 text-gray-100 shadow-sm">
      <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center text-lg font-bold mb-1">S</div>
      <div class="text-sm font-semibold">Sarah_LAG</div>
      <div class="text-xs opacity-70 flex items-center gap-1"><span>UTG</span><span class="text-[10px] px-1 bg-gray-700 rounded">LAG</span></div>
      <div class="text-sm font-mono mt-1">3,100</div>
      <div class="text-[10px] uppercase tracking-wider text-gray-400 mt-0.5">Folded</div>
    </div>
  </div>

  <!-- All-in seat -->
  <div class="relative flex flex-col items-center gap-1">
    <div class="relative flex flex-col items-center rounded-xl px-4 py-3 min-w-[100px] bg-slate-800 text-gray-100 ring-2 ring-amber-400 shadow-sm">
      <div class="w-10 h-10 rounded-full bg-gray-600 flex items-center justify-center text-lg font-bold mb-1">J</div>
      <div class="text-sm font-semibold">Joe_Fish</div>
      <div class="text-xs opacity-70 flex items-center gap-1"><span>SB</span><span class="text-[10px] px-1 bg-gray-700 rounded">Fish</span></div>
      <div class="text-sm font-mono mt-1">0</div>
      <div class="text-[10px] uppercase tracking-wider text-amber-400 font-bold mt-0.5">All-In</div>
    </div>
    <div class="mt-1 px-2 py-0.5 bg-emerald-900/80 text-emerald-300 rounded-full text-xs font-mono">2,500</div>
  </div>

</div>
</body>
</html>
