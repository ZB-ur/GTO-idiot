<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotThinkingIndicator Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes dotBounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #f3f4f6;
      border-radius: 9999px;
      display: inline-block;
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div class="space-y-8">
    <h2 class="text-lg font-semibold text-gray-900">BotThinkingIndicator</h2>

    <!-- Context: shown above a poker seat on a felt-green background -->
    <div class="flex flex-col items-center gap-6">
      <!-- Standalone -->
      <div>
        <p class="text-sm text-gray-600 mb-3">Standalone</p>
        <div class="inline-flex items-center gap-1 bg-slate-800 text-gray-100 px-3 py-1.5 rounded-full shadow-md">
          <span class="text-xs font-medium mr-1">Thinking</span>
          <span class="flex gap-0.5">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </span>
        </div>
      </div>

      <!-- In context: above a player seat on felt -->
      <div>
        <p class="text-sm text-gray-600 mb-3">In context (above a BOT seat)</p>
        <div class="bg-emerald-800 border-2 border-emerald-900 rounded-xl p-8 flex flex-col items-center gap-3">
          <!-- Indicator bubble -->
          <div class="inline-flex items-center gap-1 bg-slate-800 text-gray-100 px-3 py-1.5 rounded-full shadow-md">
            <span class="text-xs font-medium mr-1">Thinking</span>
            <span class="flex gap-0.5">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </span>
          </div>
          <!-- Mock player seat -->
          <div class="bg-slate-800 border border-slate-700 rounded-xl px-5 py-3 text-center min-w-[120px]">
            <p class="text-gray-100 text-sm font-semibold">BOT_TAG</p>
            <p class="text-gray-400 text-xs">1,250 chips</p>
            <span class="inline-block mt-1 px-2 py-0.5 bg-slate-700 rounded text-gray-300 text-xs">CO</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
