<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StatsGrid Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="max-w-4xl mx-auto py-8">
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">

    <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
      <div class="w-8 h-8 mx-auto mb-2 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center text-sm font-bold">#</div>
      <div class="text-lg font-bold text-gray-900">247</div>
      <div class="text-xs text-gray-500 mt-0.5">Total Hands</div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
      <div class="w-8 h-8 mx-auto mb-2 bg-green-100 text-green-600 rounded-lg flex items-center justify-center text-sm font-bold">W</div>
      <div class="text-lg font-bold text-green-600">+8.3 BB/100</div>
      <div class="text-xs text-gray-500 mt-0.5">Win Rate</div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
      <div class="w-8 h-8 mx-auto mb-2 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center text-sm font-bold">V</div>
      <div class="text-lg font-bold text-gray-900">24.3%</div>
      <div class="text-xs text-gray-500 mt-0.5">VPIP</div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
      <div class="w-8 h-8 mx-auto mb-2 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center text-sm font-bold">S</div>
      <div class="text-lg font-bold text-gray-900">31.2%</div>
      <div class="text-xs text-gray-500 mt-0.5">Showdown %</div>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl p-4 text-center">
      <div class="w-8 h-8 mx-auto mb-2 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center text-sm font-bold">F</div>
      <div class="text-lg font-bold text-gray-900">68.8%</div>
      <div class="text-xs text-gray-500 mt-0.5">Fold %</div>
    </div>

  </div>
</div>
</body>
</html>
