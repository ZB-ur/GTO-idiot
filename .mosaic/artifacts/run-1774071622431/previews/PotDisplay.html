<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PotDisplay Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #065f46; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex flex-col gap-12 items-center justify-center min-h-screen">

  <!-- Simple pot -->
  <div class="flex flex-col items-center gap-1">
    <div class="px-4 py-2 bg-black/60 backdrop-blur-sm rounded-xl text-center">
      <div class="text-emerald-300 text-xs font-semibold uppercase tracking-wider mb-0.5">Pot</div>
      <div class="text-white text-xl font-bold font-mono">1,200</div>
    </div>
  </div>

  <!-- Pot with side pots -->
  <div class="flex flex-col items-center gap-1">
    <div class="px-4 py-2 bg-black/60 backdrop-blur-sm rounded-xl text-center">
      <div class="text-emerald-300 text-xs font-semibold uppercase tracking-wider mb-0.5">Pot</div>
      <div class="text-white text-xl font-bold font-mono">8,400</div>
    </div>
    <div class="flex gap-2 mt-1">
      <div class="px-2 py-1 bg-black/40 rounded-lg text-center">
        <div class="text-gray-400 text-[10px] uppercase">Main</div>
        <div class="text-white text-sm font-mono">4,200</div>
      </div>
      <div class="px-2 py-1 bg-black/40 rounded-lg text-center">
        <div class="text-gray-400 text-[10px] uppercase">Side 1</div>
        <div class="text-white text-sm font-mono">2,800</div>
      </div>
      <div class="px-2 py-1 bg-black/40 rounded-lg text-center">
        <div class="text-gray-400 text-[10px] uppercase">Side 2</div>
        <div class="text-white text-sm font-mono">1,400</div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
