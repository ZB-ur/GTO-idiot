<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ConfirmationModal Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 0; background: #065f46; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<!-- Danger variant -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 space-y-4">
    <div class="flex justify-center">
      <div class="w-12 h-12 rounded-full flex items-center justify-center bg-red-100">
        <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
      </div>
    </div>
    <div class="text-center">
      <h3 class="text-lg font-semibold text-gray-900">Leave Table?</h3>
      <p class="text-sm text-gray-600 mt-1">You're in the middle of a hand. Leaving now will forfeit your current bet. Are you sure?</p>
    </div>
    <div class="flex gap-3">
      <button class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg">Stay</button>
      <button class="flex-1 py-2.5 bg-red-500 hover:bg-red-600 text-white font-medium rounded-lg">Leave Table</button>
    </div>
  </div>
</div>
</body>
</html>
