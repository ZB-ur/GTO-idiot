<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GlobalDisclaimerFooter Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- Spacer to simulate page content -->
  <div class="max-w-4xl mx-auto mb-20">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">GlobalDisclaimerFooter</h2>
    <p class="text-gray-600 text-sm">The footer is fixed at the bottom of the viewport.</p>
  </div>

  <!-- Footer -->
  <footer class="fixed bottom-0 left-0 right-0 z-50 bg-slate-800 border-t border-slate-700">
    <div class="max-w-4xl mx-auto px-4 py-2 flex items-center justify-center gap-2">
      <svg class="h-4 w-4 text-amber-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86l-8.5 14.14A1.98 1.98 0 003.5 21h17a1.98 1.98 0 001.71-2.99l-8.5-14.15a2 2 0 00-3.42 0z" />
      </svg>
      <p class="text-sm text-gray-100">
        For learning purposes only — not financial advice. GTO solutions are simplified approximations.
      </p>
    </div>
  </footer>
</body>
</html>
