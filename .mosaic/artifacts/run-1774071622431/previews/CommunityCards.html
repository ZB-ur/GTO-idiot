<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CommunityCards Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #065f46; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex flex-col gap-8 items-center justify-center min-h-screen">

  <!-- Flop only (3 cards) -->
  <div>
    <div class="text-emerald-300 text-xs mb-2 text-center font-semibold uppercase tracking-wider">Flop</div>
    <div class="flex items-center justify-center gap-2">
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-red-500">A</span><span class="text-xl text-red-500">♥</span>
      </div>
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-gray-900">K</span><span class="text-xl text-gray-900">♠</span>
      </div>
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-blue-500">7</span><span class="text-xl text-blue-500">♦</span>
      </div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/40 flex items-center justify-center">
        <span class="text-emerald-600/30 text-2xl">?</span>
      </div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/40 flex items-center justify-center">
        <span class="text-emerald-600/30 text-2xl">?</span>
      </div>
    </div>
  </div>

  <!-- All 5 cards (River) -->
  <div>
    <div class="text-emerald-300 text-xs mb-2 text-center font-semibold uppercase tracking-wider">River</div>
    <div class="flex items-center justify-center gap-2">
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-red-500">A</span><span class="text-xl text-red-500">♥</span>
      </div>
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-gray-900">K</span><span class="text-xl text-gray-900">♠</span>
      </div>
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-blue-500">7</span><span class="text-xl text-blue-500">♦</span>
      </div>
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-green-600">T</span><span class="text-xl text-green-600">♣</span>
      </div>
      <div class="w-14 h-20 bg-white rounded-lg shadow-md flex flex-col items-center justify-center border border-gray-200">
        <span class="text-lg font-bold text-red-500">2</span><span class="text-xl text-red-500">♥</span>
      </div>
    </div>
  </div>

  <!-- Pre-flop (empty) -->
  <div>
    <div class="text-emerald-300 text-xs mb-2 text-center font-semibold uppercase tracking-wider">Pre-flop</div>
    <div class="flex items-center justify-center gap-2">
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/40 flex items-center justify-center"><span class="text-emerald-600/30 text-2xl">?</span></div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/40 flex items-center justify-center"><span class="text-emerald-600/30 text-2xl">?</span></div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/40 flex items-center justify-center"><span class="text-emerald-600/30 text-2xl">?</span></div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/40 flex items-center justify-center"><span class="text-emerald-600/30 text-2xl">?</span></div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/40 flex items-center justify-center"><span class="text-emerald-600/30 text-2xl">?</span></div>
    </div>
  </div>

</div>
</body>
</html>
