<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ActionBar Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 0; background: #065f46; font-family: system-ui, sans-serif; }
input[type="range"] { -webkit-appearance: none; appearance: none; height: 8px; background: #334155; border-radius: 8px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #2563eb; cursor: pointer; }
</style>
</head>
<body>
<div class="min-h-screen flex flex-col">
  <!-- Spacer to push action bar to bottom -->
  <div class="flex-1 flex items-center justify-center">
    <div class="text-emerald-300/50 text-lg">Table area above</div>
  </div>

  <!-- Action bar: Fold / Call / Raise -->
  <div class="bg-slate-900/95 backdrop-blur-sm border-t border-slate-700 px-4 py-4">
    <div class="max-w-2xl mx-auto space-y-3">
      <div class="flex gap-3">
        <button class="flex-1 py-3 font-semibold rounded-lg text-sm uppercase tracking-wide bg-gray-600 hover:bg-gray-500 text-white">Fold</button>
        <button class="flex-1 py-3 font-semibold rounded-lg text-sm uppercase tracking-wide bg-green-600 hover:bg-green-700 text-white">Call 200</button>
        <button class="flex-1 py-3 font-semibold rounded-lg text-sm uppercase tracking-wide bg-amber-500 hover:bg-amber-600 text-white">Raise</button>
        <button class="flex-1 py-3 font-semibold rounded-lg text-sm uppercase tracking-wide bg-red-600 hover:bg-red-700 text-white">All-In</button>
      </div>
    </div>
  </div>
</div>

<!-- Second example: with slider open -->
<div class="mt-8 bg-slate-900/95 border-t border-slate-700 px-4 py-4">
  <div class="max-w-2xl mx-auto space-y-3">
    <!-- Slider area -->
    <div class="flex items-end gap-3">
      <div class="flex-1 space-y-3">
        <div class="flex gap-2">
          <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-700 text-gray-200 rounded-lg">1/3</button>
          <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-700 text-gray-200 rounded-lg">1/2</button>
          <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-700 text-gray-200 rounded-lg">2/3</button>
          <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-700 text-gray-200 rounded-lg">Pot</button>
          <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-red-600 text-white rounded-lg">All-In</button>
        </div>
        <input type="range" min="400" max="5000" value="1200" class="w-full" />
        <input type="text" value="1,200" class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white text-center font-mono text-sm" readonly />
      </div>
      <button class="px-6 py-2.5 bg-amber-500 text-white font-semibold rounded-lg">Confirm Raise 1,200</button>
      <button class="px-4 py-2.5 bg-gray-700 text-gray-300 rounded-lg">Cancel</button>
    </div>
    <!-- Remaining buttons -->
    <div class="flex gap-3">
      <button class="flex-1 py-3 font-semibold rounded-lg text-sm uppercase tracking-wide bg-gray-600 text-white">Fold</button>
      <button class="flex-1 py-3 font-semibold rounded-lg text-sm uppercase tracking-wide bg-green-600 text-white">Call 200</button>
    </div>
  </div>
</div>
</body>
</html>
