<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BetSlider Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #1e293b; font-family: system-ui, sans-serif; }
input[type="range"] { -webkit-appearance: none; appearance: none; height: 8px; background: #334155; border-radius: 8px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #2563eb; cursor: pointer; }
</style>
</head>
<body>
<div class="flex items-center justify-center min-h-screen">
  <div class="w-full max-w-sm space-y-3">
    <!-- Preset buttons -->
    <div class="flex gap-2">
      <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-700 text-gray-200 rounded-lg">1/3</button>
      <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-600 text-white rounded-lg ring-2 ring-blue-500">1/2</button>
      <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-700 text-gray-200 rounded-lg">2/3</button>
      <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-slate-700 text-gray-200 rounded-lg">Pot</button>
      <button class="flex-1 px-2 py-1.5 text-xs font-semibold bg-red-600 text-white rounded-lg">All-In</button>
    </div>
    <!-- Slider -->
    <div class="relative">
      <input type="range" min="100" max="5000" value="600" class="w-full" />
      <div class="flex justify-between text-[10px] text-gray-500 mt-1">
        <span>100</span>
        <span>5,000</span>
      </div>
    </div>
    <!-- Numeric input -->
    <div class="flex items-center gap-2">
      <input type="text" value="600" class="flex-1 px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white text-center font-mono text-sm" readonly />
    </div>
  </div>
</div>
</body>
</html>
