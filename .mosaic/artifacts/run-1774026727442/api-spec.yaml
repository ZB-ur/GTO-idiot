openapi: "3.0.3"
info:
  title: GTO Idiot — 德州扑克 GTO 策略练习器 Service API
  version: "1.0.0"
  description: |
    纯前端 Web 应用的内部 Service API 契约。所有端点由客户端 service 层实现（localStorage + 内存状态），
    不经过网络传输。本规范定义前端组件与 service 层之间的数据契约，便于模块解耦与未来后端迁移。

servers:
  - url: /api/v1
    description: Client-side service layer (in-browser)

tags:
  - name: Sessions
    description: 牌局会话管理
  - name: Hands
    description: 单手牌局引擎与生命周期
  - name: Actions
    description: 玩家操作
  - name: History
    description: 牌局历史记录
  - name: Review
    description: 赛后复盘分析
  - name: Stats
    description: 练习统计
  - name: GTO
    description: GTO 策略数据查询
  - name: Lobby
    description: 游戏大厅

paths:
  # ── Lobby ──────────────────────────────────────────────
  /lobby/summary:
    get:
      operationId: getLobbySummary
      tags: [Lobby]
      summary: 获取大厅摘要数据
      description: 返回快速开始所需信息、历史统计摘要、未完成 Session 信息
      responses:
        "200":
          description: 大厅摘要
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LobbySummary"

  # ── Sessions ───────────────────────────────────────────
  /sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: 创建新牌局 Session
      description: 根据座位选择和 Bot 风格配置创建一个新的牌局会话，自动发第一手牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session 创建成功，含首手牌初始状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    get:
      operationId: listSessions
      tags: [Sessions]
      summary: 获取所有 Session 列表
      description: 按时间倒序返回所有 Session（含进行中和已结束）
      responses:
        "200":
          description: Session 列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListItem"

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [Sessions]
      summary: 获取 Session 详情
      description: 返回 Session 完整状态，用于恢复暂停的牌局
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session 详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"

  /sessions/{sessionId}/pause:
    post:
      operationId: pauseSession
      tags: [Sessions]
      summary: 暂停 Session
      description: 保存当前 Session 状态到 localStorage，可稍后恢复继续
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session 已暂停
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session 不在进行中状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/resume:
    post:
      operationId: resumeSession
      tags: [Sessions]
      summary: 恢复暂停的 Session
      description: 从 localStorage 恢复暂停的 Session 状态，继续牌局
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session 已恢复，返回当前手牌状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session 不在暂停状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/end:
    post:
      operationId: endSession
      tags: [Sessions]
      summary: 结束 Session
      description: 结束当前 Session 并返回汇总统计（总手数、盈亏、GTO 符合率）
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session 已结束，返回汇总
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Hands (牌局引擎) ──────────────────────────────────
  /sessions/{sessionId}/hands:
    post:
      operationId: dealNewHand
      tags: [Hands]
      summary: 发一手新牌
      description: 在当前 Session 中开始新的一手牌，洗牌、发底牌、收盲注
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "201":
          description: 新手牌已发出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandState"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 上一手牌尚未结束
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/hands/{handId}:
    get:
      operationId: getHandState
      tags: [Hands]
      summary: 获取当前手牌状态
      description: 返回当前手牌的完整可见状态（己方底牌明牌，对手暗牌）
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/HandId"
      responses:
        "200":
          description: 当前手牌状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandState"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Player Actions ─────────────────────────────────────
  /sessions/{sessionId}/hands/{handId}/actions:
    get:
      operationId: getAvailableActions
      tags: [Actions]
      summary: 获取当前可用操作
      description: 返回当前决策点玩家可执行的合法操作列表及下注范围
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/HandId"
      responses:
        "200":
          description: 可用操作列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableActions"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 当前不是该玩家的行动回合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: performAction
      tags: [Actions]
      summary: 执行玩家操作
      description: |
        提交玩家的操作（Fold/Check/Call/Bet/Raise/All-in），引擎执行操作后：
        1. 更新底池和筹码
        2. 依次执行后续 Bot 决策直到下一个用户决策点或手牌结束
        3. 如进入新 street 则发出公共牌
        4. 如手牌结束则执行摊牌和底池分配
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/HandId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayerActionRequest"
      responses:
        "200":
          description: 操作执行成功，返回更新后的手牌状态和中间事件序列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "400":
          description: 非法操作（如下注金额超出范围）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 当前不是该玩家的行动回合
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Hand History ───────────────────────────────────────
  /hands:
    get:
      operationId: listHandHistory
      tags: [History]
      summary: 获取牌局历史列表
      description: 按时间倒序返回历史牌局，支持筛选过滤和分页
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
          description: 起始日期（含）
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
          description: 结束日期（含）
        - name: position
          in: query
          schema:
            $ref: "#/components/schemas/SeatPosition"
          description: 按座位位置筛选
        - name: result
          in: query
          schema:
            type: string
            enum: [win, loss, breakeven]
          description: 按结果筛选
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: 分页偏移量
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
          description: 每页条数
      responses:
        "200":
          description: 历史牌局列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandHistoryListResponse"

  /hands/{handId}:
    get:
      operationId: getHandDetail
      tags: [History]
      summary: 获取单手牌局详情
      description: 返回一手牌的完整记录，包含每 street 所有玩家动作序列
      parameters:
        - $ref: "#/components/parameters/HandIdPath"
      responses:
        "200":
          description: 牌局详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandRecord"
        "404":
          $ref: "#/components/responses/NotFound"

  /hands/export:
    get:
      operationId: exportHandHistory
      tags: [History]
      summary: 导出牌局历史为 JSON
      description: 导出全部或筛选后的历史记录为 JSON 文件（触发浏览器下载）
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: position
          in: query
          schema:
            $ref: "#/components/schemas/SeatPosition"
        - name: result
          in: query
          schema:
            type: string
            enum: [win, loss, breakeven]
      responses:
        "200":
          description: JSON 导出数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandHistoryExport"

  /hands/clear:
    delete:
      operationId: clearHandHistory
      tags: [History]
      summary: 清理所有历史记录
      description: 删除 localStorage 中的全部牌局历史数据（不可逆操作）
      responses:
        "200":
          description: 历史记录已清空
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
                    description: 删除的牌局数量

  # ── Hand Review ────────────────────────────────────────
  /hands/{handId}/review:
    get:
      operationId: getHandReview
      tags: [Review]
      summary: 获取单手牌复盘分析
      description: |
        对一手历史牌局进行 GTO 偏差分析，返回每个用户决策点的：
        GTO 推荐动作、偏差判定、近似 EV 损失，以及整手牌评分
      parameters:
        - $ref: "#/components/parameters/HandIdPath"
      responses:
        "200":
          description: 复盘分析结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandReview"
        "404":
          $ref: "#/components/responses/NotFound"

  /hands/{handId}/review/replay:
    get:
      operationId: getReplaySteps
      tags: [Review]
      summary: 获取逐步回放数据
      description: 返回按动作顺序排列的回放步骤序列，用于逐步前进/后退浏览
      parameters:
        - $ref: "#/components/parameters/HandIdPath"
      responses:
        "200":
          description: 回放步骤序列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayData"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Practice Stats ─────────────────────────────────────
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [Stats]
      summary: 获取练习统计汇总
      description: 从历史记录实时计算全部统计数据（KPI、按 street/位置/风格的分布）
      responses:
        "200":
          description: 统计汇总
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeStatsSummary"

  /stats/gto-trend:
    get:
      operationId: getGTOTrend
      tags: [Stats]
      summary: 获取 GTO 符合率趋势数据
      description: 返回最近 N 局的 GTO 符合率逐局数据，用于趋势折线图
      parameters:
        - name: lastN
          in: query
          required: true
          schema:
            type: integer
            enum: [20, 50, 100]
          description: 最近 N 局
      responses:
        "200":
          description: GTO 趋势数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GTOTrendData"

  # ── GTO Strategy Data ──────────────────────────────────
  /gto/preflop-ranges:
    get:
      operationId: getPreflopRanges
      tags: [GTO]
      summary: 查询 Preflop Range Chart
      description: |
        查询指定位置和场景下的 GTO preflop range（169 种起手牌的动作建议）。
        用于复盘分析中的 preflop 决策比对。
      parameters:
        - name: position
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SeatPosition"
        - name: scenario
          in: query
          required: true
          schema:
            type: string
            enum: [rfi, vs_rfi, vs_3bet, vs_4bet]
          description: "场景：RFI / vs RFI / vs 3bet / vs 4bet"
        - name: openerPosition
          in: query
          schema:
            $ref: "#/components/schemas/SeatPosition"
          description: 开局加注者的位置（vs_rfi / vs_3bet 场景必填）
      responses:
        "200":
          description: Preflop range 数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflopRange"

  /gto/postflop-advice:
    post:
      operationId: getPostflopAdvice
      tags: [GTO]
      summary: 获取 Postflop GTO 建议
      description: |
        基于当前牌面纹理、SPR、range 优势等因素，返回简化 GTO 决策建议。
        注意：这是简化规则引擎的建议，非 solver 精确解。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostflopAdviceRequest"
      responses:
        "200":
          description: Postflop 建议
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostflopAdvice"

  # ── Storage ────────────────────────────────────────────
  /storage/status:
    get:
      operationId: getStorageStatus
      tags: [Lobby]
      summary: 获取 localStorage 使用状态
      description: 返回当前 localStorage 使用量和估计容量，用于存储满警告
      responses:
        "200":
          description: 存储状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session 唯一标识

    HandId:
      name: handId
      in: path
      required: true
      schema:
        type: string
      description: 手牌唯一标识（Session 内）

    HandIdPath:
      name: handId
      in: path
      required: true
      schema:
        type: string
      description: 手牌全局唯一标识

  responses:
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Enums ──────────────────────────────────────────
    SeatPosition:
      type: string
      enum: [UTG, MP, CO, BTN, SB, BB]
      description: 六人桌座位位置

    BotStyle:
      type: string
      enum: [GTO, LAG, TAG, Fish]
      description: Bot AI 风格

    Street:
      type: string
      enum: [preflop, flop, turn, river]
      description: 下注轮

    ActionType:
      type: string
      enum: [fold, check, call, bet, raise, allin]
      description: 玩家操作类型

    SessionStatus:
      type: string
      enum: [active, paused, ended]
      description: Session 状态

    HandPhase:
      type: string
      enum: [preflop, flop, turn, river, showdown, ended]
      description: 手牌当前阶段

    DeviationLevel:
      type: string
      enum: [correct, acceptable, error]
      description: "GTO 偏差判定：correct(✓) / acceptable(△) / error(✗)"

    Suit:
      type: string
      enum: [s, h, d, c]
      description: "花色：s=黑桃, h=红心, d=方块, c=梅花"

    Rank:
      type: string
      enum: ["2", "3", "4", "5", "6", "7", "8", "9", "T", "J", "Q", "K", "A"]
      description: 牌面点数

    # ── Card ───────────────────────────────────────────
    Card:
      type: object
      required: [rank, suit]
      properties:
        rank:
          $ref: "#/components/schemas/Rank"
        suit:
          $ref: "#/components/schemas/Suit"
      description: "单张扑克牌，如 {rank: 'A', suit: 's'} 表示黑桃 A"

    # ── Player ─────────────────────────────────────────
    PlayerInfo:
      type: object
      required: [seatIndex, position, nickname, chipCount, isHuman, isActive]
      properties:
        seatIndex:
          type: integer
          minimum: 0
          maximum: 5
          description: 座位索引（0-5）
        position:
          $ref: "#/components/schemas/SeatPosition"
        nickname:
          type: string
          description: 玩家昵称
        chipCount:
          type: number
          description: 当前筹码数（以 BB 为单位）
        isHuman:
          type: boolean
          description: 是否为人类玩家
        botStyle:
          $ref: "#/components/schemas/BotStyle"
        isActive:
          type: boolean
          description: 是否仍在本手牌中（未 fold）
        isSittingOut:
          type: boolean
          description: 是否已出局（筹码为 0）
        holeCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          maxItems: 2
          description: 底牌（己方可见，对手仅摊牌后可见）
        currentBet:
          type: number
          description: 当前 street 已下注金额

    # ── Action ─────────────────────────────────────────
    PlayerAction:
      type: object
      required: [seatIndex, position, actionType, street, timestamp]
      properties:
        seatIndex:
          type: integer
        position:
          $ref: "#/components/schemas/SeatPosition"
        actionType:
          $ref: "#/components/schemas/ActionType"
        amount:
          type: number
          description: 下注/加注金额（fold/check 时为 null）
        street:
          $ref: "#/components/schemas/Street"
        isHuman:
          type: boolean
        timestamp:
          type: string
          format: date-time

    PlayerActionRequest:
      type: object
      required: [actionType]
      properties:
        actionType:
          $ref: "#/components/schemas/ActionType"
        amount:
          type: number
          description: 下注/加注金额（Bet/Raise 时必填），以 BB 为单位

    AvailableActions:
      type: object
      required: [actions, currentPlayer]
      properties:
        currentPlayer:
          type: integer
          description: 当前行动玩家的座位索引
        actions:
          type: array
          items:
            type: object
            required: [actionType, isAvailable]
            properties:
              actionType:
                $ref: "#/components/schemas/ActionType"
              isAvailable:
                type: boolean
              minAmount:
                type: number
                description: 最小金额（Bet/Raise 时）
              maxAmount:
                type: number
                description: 最大金额（即 all-in 金额）
              callAmount:
                type: number
                description: 跟注所需金额（Call 时）
        potSize:
          type: number
          description: 当前底池大小（用于计算快捷下注）
        quickBets:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
                description: "显示标签，如 '1/2 Pot'"
              amount:
                type: number
          description: 快捷下注选项（1/3 Pot, 1/2 Pot, 2/3 Pot, Pot）

    # ── Action Result ──────────────────────────────────
    ActionResult:
      type: object
      required: [handState, events]
      properties:
        handState:
          $ref: "#/components/schemas/HandState"
        events:
          type: array
          items:
            $ref: "#/components/schemas/GameEvent"
          description: 玩家操作后到下一个用户决策点之间发生的所有事件序列（Bot 动作、发牌等）

    GameEvent:
      type: object
      required: [type, timestamp]
      properties:
        type:
          type: string
          enum: [action, deal_community, showdown, pot_award, hand_end, new_street]
          description: 事件类型
        action:
          $ref: "#/components/schemas/PlayerAction"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: 发出的公共牌（deal_community 事件）
        street:
          $ref: "#/components/schemas/Street"
        winners:
          type: array
          items:
            type: object
            properties:
              seatIndex:
                type: integer
              amount:
                type: number
              handRank:
                type: string
                description: "牌型描述，如 'Two Pair, Aces and Kings'"
          description: 赢家信息（pot_award 事件）
        timestamp:
          type: string
          format: date-time

    # ── Hand State ─────────────────────────────────────
    HandState:
      type: object
      required: [handId, sessionId, handNumber, phase, players, pot, dealerSeat, communityCards]
      properties:
        handId:
          type: string
        sessionId:
          type: string
          format: uuid
        handNumber:
          type: integer
          description: Session 内的手牌序号
        phase:
          $ref: "#/components/schemas/HandPhase"
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerInfo"
          minItems: 6
          maxItems: 6
        communityCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          maxItems: 5
        pot:
          $ref: "#/components/schemas/PotInfo"
        dealerSeat:
          type: integer
          description: 庄家座位索引
        currentPlayerSeat:
          type: integer
          description: 当前行动玩家座位索引（null 表示非行动阶段）
        isUserTurn:
          type: boolean
          description: 是否轮到用户操作
        actionHistory:
          type: array
          items:
            $ref: "#/components/schemas/PlayerAction"
          description: 本手牌已发生的所有操作
        result:
          $ref: "#/components/schemas/HandResult"

    PotInfo:
      type: object
      required: [mainPot, totalPot]
      properties:
        mainPot:
          type: number
          description: 主池金额
        sidePots:
          type: array
          items:
            type: object
            properties:
              amount:
                type: number
              eligibleSeats:
                type: array
                items:
                  type: integer
          description: 边池列表
        totalPot:
          type: number
          description: 总底池金额

    HandResult:
      type: object
      properties:
        winners:
          type: array
          items:
            type: object
            properties:
              seatIndex:
                type: integer
              amount:
                type: number
              handRank:
                type: string
        userProfit:
          type: number
          description: 用户本手盈亏（以 BB 为单位，正数为赢）
        showdownPlayers:
          type: array
          items:
            type: object
            properties:
              seatIndex:
                type: integer
              holeCards:
                type: array
                items:
                  $ref: "#/components/schemas/Card"
              handRank:
                type: string
          description: 摊牌玩家的底牌和牌型

    # ── Session ────────────────────────────────────────
    CreateSessionRequest:
      type: object
      required: [userSeatPosition, botConfigs]
      properties:
        userSeatPosition:
          $ref: "#/components/schemas/SeatPosition"
        botConfigs:
          type: array
          items:
            type: object
            required: [seatPosition, style]
            properties:
              seatPosition:
                $ref: "#/components/schemas/SeatPosition"
              style:
                $ref: "#/components/schemas/BotStyle"
              nickname:
                type: string
          minItems: 5
          maxItems: 5
          description: 5 个对手 Bot 的配置
        startingChips:
          type: number
          default: 100
          description: 起始筹码（以 BB 为单位，默认 100BB）

    Session:
      type: object
      required: [sessionId, status, config, handCount, startTime, playerChips]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SessionStatus"
        config:
          $ref: "#/components/schemas/CreateSessionRequest"
        handCount:
          type: integer
          description: 已完成手数
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        playerChips:
          type: array
          items:
            type: object
            properties:
              seatIndex:
                type: integer
              chipCount:
                type: number
          description: 各座位当前筹码
        currentHandId:
          type: string
          description: 当前进行中的手牌 ID
        currentHandState:
          $ref: "#/components/schemas/HandState"
        totalProfit:
          type: number
          description: 用户累计盈亏

    SessionListItem:
      type: object
      required: [sessionId, status, handCount, startTime, totalProfit]
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/SessionStatus"
        handCount:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        totalProfit:
          type: number
        userPosition:
          $ref: "#/components/schemas/SeatPosition"

    SessionSummary:
      type: object
      required: [sessionId, handCount, totalProfit, gtoComplianceRate, duration]
      properties:
        sessionId:
          type: string
          format: uuid
        handCount:
          type: integer
        totalProfit:
          type: number
          description: 总盈亏（BB）
        gtoComplianceRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: GTO 符合率（0-1）
        gtoComplianceByStreet:
          type: object
          properties:
            preflop:
              type: number
              format: float
            flop:
              type: number
              format: float
            turn:
              type: number
              format: float
            river:
              type: number
              format: float
        totalEVLoss:
          type: number
          description: 累计 EV 损失（BB）
        duration:
          type: integer
          description: Session 持续时间（秒）
        handIds:
          type: array
          items:
            type: string
          description: 本 Session 所有手牌 ID（用于跳转复盘）

    # ── Hand History ───────────────────────────────────
    HandHistoryListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HandHistoryItem"
        total:
          type: integer
          description: 筛选后的总条数
        offset:
          type: integer
        limit:
          type: integer

    HandHistoryItem:
      type: object
      required: [handId, sessionId, handNumber, dateTime, userPosition, holeCards, result]
      properties:
        handId:
          type: string
        sessionId:
          type: string
          format: uuid
        handNumber:
          type: integer
        dateTime:
          type: string
          format: date-time
        userPosition:
          $ref: "#/components/schemas/SeatPosition"
        holeCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          maxItems: 2
          description: "起手牌"
        holeCardsShorthand:
          type: string
          description: "起手牌缩写，如 'AKs', 'QJo', 'TT'"
        communityCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        result:
          type: number
          description: 盈亏金额（BB）
        reachedStreet:
          $ref: "#/components/schemas/Street"
          description: 到达的最后一个 street

    HandRecord:
      type: object
      required: [handId, sessionId, handNumber, dateTime, players, communityCards, streets, result]
      properties:
        handId:
          type: string
        sessionId:
          type: string
          format: uuid
        handNumber:
          type: integer
        dateTime:
          type: string
          format: date-time
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerInfo"
        communityCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
        dealerSeat:
          type: integer
        streets:
          type: object
          required: [preflop]
          properties:
            preflop:
              $ref: "#/components/schemas/StreetRecord"
            flop:
              $ref: "#/components/schemas/StreetRecord"
            turn:
              $ref: "#/components/schemas/StreetRecord"
            river:
              $ref: "#/components/schemas/StreetRecord"
        result:
          $ref: "#/components/schemas/HandResult"
        potHistory:
          type: array
          items:
            type: object
            properties:
              street:
                $ref: "#/components/schemas/Street"
              potAfter:
                type: number
          description: 每个 street 结束时的底池大小

    StreetRecord:
      type: object
      required: [actions]
      properties:
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: 本 street 发出的公共牌
        actions:
          type: array
          items:
            $ref: "#/components/schemas/PlayerAction"
        potAtStart:
          type: number
          description: 本 street 开始时的底池

    HandHistoryExport:
      type: object
      required: [exportDate, version, hands]
      properties:
        exportDate:
          type: string
          format: date-time
        version:
          type: string
          description: 导出格式版本
        totalHands:
          type: integer
        hands:
          type: array
          items:
            $ref: "#/components/schemas/HandRecord"

    # ── Hand Review ────────────────────────────────────
    HandReview:
      type: object
      required: [handId, decisionPoints, overallScore, totalEVLoss]
      properties:
        handId:
          type: string
        decisionPoints:
          type: array
          items:
            $ref: "#/components/schemas/DecisionPoint"
        overallScore:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: 整手牌评分（0-100）
        totalEVLoss:
          type: number
          description: 整手牌累计 EV 损失（BB）
        gtoCompliance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 本手 GTO 符合率
        disclaimer:
          type: string
          default: "简化 GTO 参考，非 solver 精确解"

    DecisionPoint:
      type: object
      required: [street, stepIndex, userAction, gtoRecommendation, deviation, evLoss]
      properties:
        street:
          $ref: "#/components/schemas/Street"
        stepIndex:
          type: integer
          description: 在回放序列中的步骤索引
        boardCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: 当时的公共牌
        potSize:
          type: number
          description: 决策时的底池大小
        userAction:
          $ref: "#/components/schemas/PlayerAction"
        gtoRecommendation:
          type: object
          required: [primaryAction]
          properties:
            primaryAction:
              $ref: "#/components/schemas/ActionType"
            primaryAmount:
              type: number
              description: 推荐下注金额（如适用）
            amountRange:
              type: object
              properties:
                min:
                  type: number
                max:
                  type: number
              description: "可接受的金额范围"
            alternativeActions:
              type: array
              items:
                type: object
                properties:
                  actionType:
                    $ref: "#/components/schemas/ActionType"
                  frequency:
                    type: number
                    format: float
                    description: 混合策略中的频率
              description: GTO 混合策略中的其他动作选项
            reasoning:
              type: string
              description: 推荐理由简述
        deviation:
          $ref: "#/components/schemas/DeviationLevel"
        evLoss:
          type: number
          description: 该决策点的近似 EV 损失（BB，0 表示无损失）

    ReplayData:
      type: object
      required: [handId, steps, totalSteps]
      properties:
        handId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReplayStep"
        totalSteps:
          type: integer
        streetStartIndices:
          type: object
          properties:
            preflop:
              type: integer
            flop:
              type: integer
            turn:
              type: integer
            river:
              type: integer
            showdown:
              type: integer
          description: 各 street 在步骤序列中的起始索引（用于快速跳转）

    ReplayStep:
      type: object
      required: [stepIndex, type, street, tableState]
      properties:
        stepIndex:
          type: integer
        type:
          type: string
          enum: [deal_hole, action, deal_community, showdown, pot_award]
        street:
          $ref: "#/components/schemas/Street"
        action:
          $ref: "#/components/schemas/PlayerAction"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: 本步骤相关的牌
        tableState:
          $ref: "#/components/schemas/HandState"
        isUserDecisionPoint:
          type: boolean
          description: 是否为用户决策点
        decisionAnnotation:
          $ref: "#/components/schemas/DecisionPoint"

    # ── Practice Stats ─────────────────────────────────
    PracticeStatsSummary:
      type: object
      required: [totalHands, overallGTOCompliance, totalEVLoss]
      properties:
        totalHands:
          type: integer
          description: 总手数
        overallGTOCompliance:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: 整体 GTO 符合率
        totalEVLoss:
          type: number
          description: 累计 EV 损失（BB）
        gtoComplianceByStreet:
          type: object
          properties:
            preflop:
              type: number
              format: float
            flop:
              type: number
              format: float
            turn:
              type: number
              format: float
            river:
              type: number
              format: float
          description: 按 street 分类的 GTO 符合率
        winRateByPosition:
          type: array
          items:
            type: object
            required: [position, hands, winRate, avgProfit]
            properties:
              position:
                $ref: "#/components/schemas/SeatPosition"
              hands:
                type: integer
              winRate:
                type: number
                format: float
                description: 胜率（0-1）
              avgProfit:
                type: number
                description: 平均盈亏（BB/手）
          description: 按位置的胜率分布
        winRateByBotStyle:
          type: array
          items:
            type: object
            required: [botStyle, hands, winRate, avgProfit]
            properties:
              botStyle:
                $ref: "#/components/schemas/BotStyle"
              hands:
                type: integer
              winRate:
                type: number
                format: float
              avgProfit:
                type: number
          description: 按 Bot 风格的胜率分布

    GTOTrendData:
      type: object
      required: [lastN, dataPoints]
      properties:
        lastN:
          type: integer
        dataPoints:
          type: array
          items:
            type: object
            required: [handIndex, handId, gtoCompliance]
            properties:
              handIndex:
                type: integer
                description: 逆序索引（1 = 最近一局）
              handId:
                type: string
              gtoCompliance:
                type: number
                format: float
              dateTime:
                type: string
                format: date-time

    # ── GTO Strategy ───────────────────────────────────
    PreflopRange:
      type: object
      required: [position, scenario, hands]
      properties:
        position:
          $ref: "#/components/schemas/SeatPosition"
        scenario:
          type: string
        openerPosition:
          $ref: "#/components/schemas/SeatPosition"
        hands:
          type: array
          items:
            type: object
            required: [hand, action]
            properties:
              hand:
                type: string
                description: "起手牌简写，如 'AKs', 'QJo', '99'"
              action:
                $ref: "#/components/schemas/ActionType"
              raiseSize:
                type: number
                description: 加注大小（BB）（如适用）
              frequency:
                type: number
                format: float
                description: 混合策略频率（0-1，1=纯策略）
          description: 169 种起手牌的推荐动作

    PostflopAdviceRequest:
      type: object
      required: [position, street, boardCards, potSize, stackSize, actionHistory]
      properties:
        position:
          $ref: "#/components/schemas/SeatPosition"
        street:
          $ref: "#/components/schemas/Street"
        boardCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: 当前公共牌
        holeCards:
          type: array
          items:
            $ref: "#/components/schemas/Card"
          description: 玩家底牌
        potSize:
          type: number
          description: 当前底池（BB）
        stackSize:
          type: number
          description: 玩家剩余筹码（BB）
        activePlayers:
          type: integer
          description: 仍在局中的玩家数
        actionHistory:
          type: array
          items:
            $ref: "#/components/schemas/PlayerAction"
          description: 本 street 已发生的动作

    PostflopAdvice:
      type: object
      required: [recommendedAction, reasoning]
      properties:
        recommendedAction:
          $ref: "#/components/schemas/ActionType"
        recommendedAmount:
          type: number
        amountRange:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
        alternativeActions:
          type: array
          items:
            type: object
            properties:
              actionType:
                $ref: "#/components/schemas/ActionType"
              frequency:
                type: number
                format: float
        reasoning:
          type: string
          description: 推荐理由
        factors:
          type: object
          properties:
            spr:
              type: number
              description: Stack-to-Pot Ratio
            boardTexture:
              type: string
              description: "牌面纹理分类，如 'dry', 'wet', 'monotone'"
            rangeAdvantage:
              type: string
              enum: [strong, neutral, weak]
              description: Range 优势判定
            potOdds:
              type: number
              description: 底池赔率
            equity:
              type: number
              format: float
              description: 近似 equity
          description: 决策因子详情
        disclaimer:
          type: string
          default: "简化 GTO 参考，非 solver 精确解"

    # ── Lobby ──────────────────────────────────────────
    LobbySummary:
      type: object
      properties:
        activeSession:
          $ref: "#/components/schemas/SessionListItem"
        recentStats:
          type: object
          properties:
            totalHands:
              type: integer
            recentWinRate:
              type: number
              format: float
              description: 最近 20 局胜率
            overallGTOCompliance:
              type: number
              format: float
            totalProfit:
              type: number
        hasHistory:
          type: boolean
          description: 是否有历史记录

    # ── Storage ────────────────────────────────────────
    StorageStatus:
      type: object
      required: [usedBytes, estimatedCapacityBytes, handCount]
      properties:
        usedBytes:
          type: integer
          description: 已使用的 localStorage 字节数
        estimatedCapacityBytes:
          type: integer
          description: 估计总容量（约 5MB）
        usagePercent:
          type: number
          format: float
          description: 使用率（0-1）
        handCount:
          type: integer
          description: 已存储的手牌数
        isNearCapacity:
          type: boolean
          description: 是否接近上限（>80%）

    # ── Error ──────────────────────────────────────────
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: "错误码，如 'SESSION_NOT_FOUND', 'INVALID_ACTION'"
        message:
          type: string
          description: 人类可读的错误信息
        details:
          type: object
          description: 额外错误详情