<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreetAccuracyChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div style="max-width: 480px; margin: 0 auto;">

    <div class="bg-gray-800 rounded-xl border border-gray-600 p-6">

      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <div>
          <h3 class="text-white text-lg font-semibold">GTO Accuracy by Street</h3>
          <p class="text-gray-500 text-sm mt-0.5">Compliance rate per betting round</p>
        </div>
        <div class="text-right">
          <div class="text-2xl font-bold text-yellow-400">66%</div>
          <div class="text-gray-500 text-xs">Average</div>
        </div>
      </div>

      <!-- Bars -->
      <div class="space-y-4">

        <!-- Preflop: 85% -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-base">&#127138;</span>
              <span class="text-gray-300 text-sm font-medium">Preflop</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold text-green-400">85%</span>
              <span class="text-gray-500 text-xs w-20 text-right">Excellent</span>
            </div>
          </div>
          <div class="h-3 bg-gray-700 rounded-lg overflow-hidden">
            <div class="h-full rounded-lg bg-green-400" style="width: 85%;"></div>
          </div>
        </div>

        <!-- Flop: 72% -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-base">&#127183;</span>
              <span class="text-gray-300 text-sm font-medium">Flop</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold text-yellow-400">72%</span>
              <span class="text-gray-500 text-xs w-20 text-right">Good</span>
            </div>
          </div>
          <div class="h-3 bg-gray-700 rounded-lg overflow-hidden">
            <div class="h-full rounded-lg bg-yellow-400" style="width: 72%;"></div>
          </div>
        </div>

        <!-- Turn: 58% -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-base">&#127137;</span>
              <span class="text-gray-300 text-sm font-medium">Turn</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold text-amber-400">58%</span>
              <span class="text-gray-500 text-xs w-20 text-right">Fair</span>
            </div>
          </div>
          <div class="h-3 bg-gray-700 rounded-lg overflow-hidden">
            <div class="h-full rounded-lg bg-amber-400" style="width: 58%;"></div>
          </div>
        </div>

        <!-- River: 48% -->
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <div class="flex items-center gap-2">
              <span class="text-base">&#127150;</span>
              <span class="text-gray-300 text-sm font-medium">River</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-semibold text-amber-400">48%</span>
              <span class="text-gray-500 text-xs w-20 text-right">Fair</span>
            </div>
          </div>
          <div class="h-3 bg-gray-700 rounded-lg overflow-hidden">
            <div class="h-full rounded-lg bg-amber-400" style="width: 48%;"></div>
          </div>
        </div>

      </div>

      <!-- Legend -->
      <div class="flex items-center gap-4 mt-5 pt-4 border-t border-gray-700">
        <div class="flex items-center gap-1.5">
          <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
          <span class="text-gray-500 text-xs">&ge;80%</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
          <span class="text-gray-500 text-xs">60&ndash;79%</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-2.5 h-2.5 rounded-full bg-amber-400"></div>
          <span class="text-gray-500 text-xs">40&ndash;59%</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
          <span class="text-gray-500 text-xs">&lt;40%</span>
        </div>
      </div>

    </div>

  </div>
</body>
</html>
