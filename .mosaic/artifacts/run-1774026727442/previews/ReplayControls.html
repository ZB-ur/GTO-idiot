<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReplayControls Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-lg mx-auto space-y-8">

    <!-- State 1: Mid-replay, paused (step 5 of 12) -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wide">Paused — Step 5 / 12</p>
      <div class="w-full bg-gray-800 border border-gray-600 rounded-xl p-4 space-y-3">
        <!-- Progress bar with dots -->
        <div class="relative w-full h-1.5 bg-gray-700 rounded-full overflow-hidden">
          <div class="absolute inset-y-0 left-0 bg-emerald-600 rounded-full" style="width: 36.4%"></div>
          <div class="absolute inset-0 flex items-center justify-between px-0">
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-emerald-400/50"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
          </div>
        </div>
        <!-- Controls row -->
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-300 tabular-nums min-w-[80px]">
            <span class="text-white font-semibold">5</span>
            <span class="text-gray-500"> / 12</span>
          </span>
          <div class="flex items-center gap-2">
            <!-- Prev -->
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <!-- Play button (paused state) -->
            <button class="flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition-colors shadow-lg shadow-emerald-600/20">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5.14v13.72a1 1 0 001.5.86l11-6.86a1 1 0 000-1.72l-11-6.86A1 1 0 008 5.14z" />
              </svg>
            </button>
            <!-- Next -->
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <span class="text-xs text-gray-500 min-w-[80px] text-right">← → Space</span>
        </div>
      </div>
    </div>

    <!-- State 2: Playing (step 8 of 12) -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wide">Playing — Step 8 / 12</p>
      <div class="w-full bg-gray-800 border border-gray-600 rounded-xl p-4 space-y-3">
        <div class="relative w-full h-1.5 bg-gray-700 rounded-full overflow-hidden">
          <div class="absolute inset-y-0 left-0 bg-emerald-600 rounded-full" style="width: 63.6%"></div>
          <div class="absolute inset-0 flex items-center justify-between px-0">
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-emerald-400/50"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-300 tabular-nums min-w-[80px]">
            <span class="text-white font-semibold">8</span>
            <span class="text-gray-500"> / 12</span>
          </span>
          <div class="flex items-center gap-2">
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <!-- Pause button (playing state) -->
            <button class="flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition-colors shadow-lg shadow-emerald-600/20">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <rect x="6" y="4" width="4" height="16" rx="1" />
                <rect x="14" y="4" width="4" height="16" rx="1" />
              </svg>
            </button>
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <span class="text-xs text-gray-500 min-w-[80px] text-right">← → Space</span>
        </div>
      </div>
    </div>

    <!-- State 3: At beginning (step 1 of 12, prev disabled) -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wide">Start — Step 1 / 12 (Prev disabled)</p>
      <div class="w-full bg-gray-800 border border-gray-600 rounded-xl p-4 space-y-3">
        <div class="relative w-full h-1.5 bg-gray-700 rounded-full overflow-hidden">
          <div class="absolute inset-y-0 left-0 bg-emerald-600 rounded-full" style="width: 0%"></div>
          <div class="absolute inset-0 flex items-center justify-between px-0">
            <div class="w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-emerald-400/50"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
            <div class="w-2 h-2 rounded-full bg-gray-600"></div>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-300 tabular-nums min-w-[80px]">
            <span class="text-white font-semibold">1</span>
            <span class="text-gray-500"> / 12</span>
          </span>
          <div class="flex items-center gap-2">
            <!-- Prev disabled -->
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 opacity-30 cursor-not-allowed">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <button class="flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition-colors shadow-lg shadow-emerald-600/20">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5.14v13.72a1 1 0 001.5.86l11-6.86a1 1 0 000-1.72l-11-6.86A1 1 0 008 5.14z" />
              </svg>
            </button>
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <span class="text-xs text-gray-500 min-w-[80px] text-right">← → Space</span>
        </div>
      </div>
    </div>

    <!-- State 4: At end (step 12 of 12, next disabled) -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wide">End — Step 12 / 12 (Next disabled)</p>
      <div class="w-full bg-gray-800 border border-gray-600 rounded-xl p-4 space-y-3">
        <div class="relative w-full h-1.5 bg-gray-700 rounded-full overflow-hidden">
          <div class="absolute inset-y-0 left-0 bg-emerald-600 rounded-full" style="width: 100%"></div>
          <div class="absolute inset-0 flex items-center justify-between px-0">
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
            <div class="w-2 h-2 rounded-full bg-emerald-400 ring-2 ring-emerald-400/50"></div>
          </div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-300 tabular-nums min-w-[80px]">
            <span class="text-white font-semibold">12</span>
            <span class="text-gray-500"> / 12</span>
          </span>
          <div class="flex items-center gap-2">
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
              </svg>
            </button>
            <button class="flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-600 text-white hover:bg-emerald-500 transition-colors shadow-lg shadow-emerald-600/20">
              <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M8 5.14v13.72a1 1 0 001.5.86l11-6.86a1 1 0 000-1.72l-11-6.86A1 1 0 008 5.14z" />
              </svg>
            </button>
            <!-- Next disabled -->
            <button class="flex items-center justify-center w-10 h-10 rounded-lg bg-gray-700 text-gray-300 opacity-30 cursor-not-allowed">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>
          </div>
          <span class="text-xs text-gray-500 min-w-[80px] text-right">← → Space</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
