<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionStatusBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>

  <!-- SessionStatusBar -->
  <div class="flex items-center justify-between bg-gray-800 border-b border-gray-600 px-4 py-2 rounded-xl">
    <!-- Left: Session Stats -->
    <div class="flex items-center gap-6">
      <!-- Hand Count -->
      <div class="flex items-center gap-2">
        <span class="text-gray-500 text-xs uppercase tracking-wide font-medium">Hands</span>
        <span class="text-white text-sm font-semibold" style="font-variant-numeric: tabular-nums;">42</span>
      </div>

      <!-- Divider -->
      <div class="w-px h-4 bg-gray-600"></div>

      <!-- Total Profit (positive) -->
      <div class="flex items-center gap-2">
        <span class="text-gray-500 text-xs uppercase tracking-wide font-medium">Profit</span>
        <span class="text-green-400 text-sm font-semibold" style="font-variant-numeric: tabular-nums;">+23.5 BB</span>
      </div>

      <!-- Divider -->
      <div class="w-px h-4 bg-gray-600"></div>

      <!-- Chip Count -->
      <div class="flex items-center gap-2">
        <span class="text-gray-500 text-xs uppercase tracking-wide font-medium">Chips</span>
        <div class="flex items-center gap-1">
          <span class="text-amber-400 text-sm">●</span>
          <span class="text-white text-sm font-semibold" style="font-variant-numeric: tabular-nums;">123.5 BB</span>
        </div>
      </div>
    </div>

    <!-- Right: Action Buttons -->
    <div class="flex items-center gap-2">
      <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-700 hover:bg-gray-600 text-gray-300 hover:text-white text-sm font-medium transition-colors">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5 4a1 1 0 0 1 1 1v10a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1zm5 0a1 1 0 0 1 1 1v10a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1z" clip-rule="evenodd"/>
        </svg>
        Pause
      </button>
      <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-500/20 hover:bg-red-500/30 text-red-400 hover:text-red-300 text-sm font-medium transition-colors">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4z" clip-rule="evenodd"/>
        </svg>
        End
      </button>
    </div>
  </div>

  <!-- Variant: Negative profit -->
  <div class="mt-6 flex items-center justify-between bg-gray-800 border-b border-gray-600 px-4 py-2 rounded-xl">
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2">
        <span class="text-gray-500 text-xs uppercase tracking-wide font-medium">Hands</span>
        <span class="text-white text-sm font-semibold" style="font-variant-numeric: tabular-nums;">18</span>
      </div>
      <div class="w-px h-4 bg-gray-600"></div>
      <div class="flex items-center gap-2">
        <span class="text-gray-500 text-xs uppercase tracking-wide font-medium">Profit</span>
        <span class="text-red-400 text-sm font-semibold" style="font-variant-numeric: tabular-nums;">-15.0 BB</span>
      </div>
      <div class="w-px h-4 bg-gray-600"></div>
      <div class="flex items-center gap-2">
        <span class="text-gray-500 text-xs uppercase tracking-wide font-medium">Chips</span>
        <div class="flex items-center gap-1">
          <span class="text-amber-400 text-sm">●</span>
          <span class="text-white text-sm font-semibold" style="font-variant-numeric: tabular-nums;">85.0 BB</span>
        </div>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gray-700 text-gray-300 text-sm font-medium">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M5 4a1 1 0 0 1 1 1v10a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1zm5 0a1 1 0 0 1 1 1v10a1 1 0 1 1-2 0V5a1 1 0 0 1 1-1z" clip-rule="evenodd"/>
        </svg>
        Pause
      </button>
      <button class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-red-500/20 text-red-400 text-sm font-medium">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4 4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4z" clip-rule="evenodd"/>
        </svg>
        End
      </button>
    </div>
  </div>

  <!-- Label -->
  <p class="text-gray-500 text-xs mt-4 text-center">Top: Winning session (+23.5 BB) · Bottom: Losing session (-15.0 BB)</p>

</body>
</html>
