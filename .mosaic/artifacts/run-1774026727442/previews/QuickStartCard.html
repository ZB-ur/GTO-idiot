<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickStartCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-sm mx-auto">
    <!-- QuickStartCard -->
    <div class="bg-gray-800 border border-gray-600 rounded-xl p-6 flex flex-col items-center text-center space-y-5">
      <!-- Icon -->
      <div class="w-16 h-16 rounded-full bg-emerald-800/50 border border-emerald-600/30 flex items-center justify-center">
        <svg class="w-8 h-8 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <!-- Title & Description -->
      <div class="space-y-2">
        <h3 class="text-lg font-semibold text-white">快速开始</h3>
        <p class="text-sm text-gray-300 leading-relaxed max-w-xs">
          以默认设置立即开始一局 6 人桌德州扑克，100BB 深筹码
        </p>
      </div>

      <!-- Default Config Summary -->
      <div class="w-full bg-gray-700/50 rounded-lg px-4 py-3 space-y-1.5">
        <div class="flex justify-between text-sm">
          <span class="text-gray-400">座位</span>
          <span class="text-gray-200">BTN（庄位）</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-400">起始筹码</span>
          <span class="text-gray-200">100 BB</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-400">对手风格</span>
          <span class="text-gray-200">混合 (GTO/TAG/LAG)</span>
        </div>
      </div>

      <!-- CTA Button -->
      <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 px-6 rounded-lg transition-colors duration-150 flex items-center justify-center space-x-2">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <span>一键开始</span>
      </button>

      <!-- Hint -->
      <p class="text-xs text-gray-500">
        或在下方自定义牌桌设置
      </p>
    </div>
  </div>
</body>
</html>
