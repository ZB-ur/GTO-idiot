<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KPICard Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">KPI Cards</p>

    <div style="display: flex; gap: 16px; flex-wrap: wrap;">
      <!-- Total Hands -->
      <div class="bg-gray-800 border border-gray-600 rounded-xl p-5 flex flex-col gap-2 min-w-[160px]">
        <div class="flex items-center justify-between">
          <span class="text-gray-400 text-sm font-medium">Total Hands</span>
          <span class="text-gray-500 text-lg">🃏</span>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="text-white text-2xl font-bold">1,247</span>
          <span class="text-sm font-semibold text-green-400">↑</span>
        </div>
      </div>

      <!-- GTO Compliance -->
      <div class="bg-gray-800 border border-gray-600 rounded-xl p-5 flex flex-col gap-2 min-w-[160px]">
        <div class="flex items-center justify-between">
          <span class="text-gray-400 text-sm font-medium">GTO Compliance</span>
          <span class="text-gray-500 text-lg">📊</span>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="text-white text-2xl font-bold">73.2</span>
          <span class="text-gray-400 text-sm">%</span>
          <span class="text-sm font-semibold text-green-400">↑</span>
        </div>
      </div>

      <!-- Total EV Loss -->
      <div class="bg-gray-800 border border-gray-600 rounded-xl p-5 flex flex-col gap-2 min-w-[160px]">
        <div class="flex items-center justify-between">
          <span class="text-gray-400 text-sm font-medium">Total EV Loss</span>
          <span class="text-gray-500 text-lg">📉</span>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="text-white text-2xl font-bold">-42.5</span>
          <span class="text-gray-400 text-sm">BB</span>
          <span class="text-sm font-semibold text-red-400">↓</span>
        </div>
      </div>

      <!-- Win Rate -->
      <div class="bg-gray-800 border border-gray-600 rounded-xl p-5 flex flex-col gap-2 min-w-[160px]">
        <div class="flex items-center justify-between">
          <span class="text-gray-400 text-sm font-medium">Win Rate</span>
          <span class="text-gray-500 text-lg">🏆</span>
        </div>
        <div class="flex items-baseline gap-2">
          <span class="text-white text-2xl font-bold">52.1</span>
          <span class="text-gray-400 text-sm">%</span>
          <span class="text-sm font-semibold text-gray-400">→</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
