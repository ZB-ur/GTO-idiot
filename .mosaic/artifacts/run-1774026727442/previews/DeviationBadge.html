<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeviationBadge Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Deviation Badges</p>

    <div style="display: flex; gap: 12px; align-items: center;">
      <!-- Correct -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-sm font-semibold
        border bg-green-400/15 text-green-400 border-green-400/30 select-none">
        <span class="text-base leading-none">✓</span>
        Correct
      </span>

      <!-- Acceptable -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-sm font-semibold
        border bg-yellow-400/15 text-yellow-400 border-yellow-400/30 select-none">
        <span class="text-base leading-none">△</span>
        Acceptable
      </span>

      <!-- Error -->
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-sm font-semibold
        border bg-red-400/15 text-red-400 border-red-400/30 select-none">
        <span class="text-base leading-none">✗</span>
        Error
      </span>
    </div>

    <!-- In context: on a surface card -->
    <p class="text-gray-500 text-xs mt-4">On surface card</p>
    <div class="bg-gray-800 rounded-xl p-4 flex gap-4 items-center">
      <div class="flex flex-col gap-2">
        <div class="flex items-center gap-3">
          <span class="text-white text-sm">Preflop: Raise 2.5BB</span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-sm font-semibold
            border bg-green-400/15 text-green-400 border-green-400/30 select-none">
            <span class="text-base leading-none">✓</span>
            Correct
          </span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-white text-sm">Flop: Check</span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-sm font-semibold
            border bg-yellow-400/15 text-yellow-400 border-yellow-400/30 select-none">
            <span class="text-base leading-none">△</span>
            Acceptable
          </span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-white text-sm">Turn: Fold</span>
          <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-sm font-semibold
            border bg-red-400/15 text-red-400 border-red-400/30 select-none">
            <span class="text-base leading-none">✗</span>
            Error
          </span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
