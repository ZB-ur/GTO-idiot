<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #111827;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      padding-top: 40px;
    }
    .preview-label {
      color: #6b7280;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Variant 1: Main pot only -->
  <div>
    <div class="preview-label">Main Pot Only</div>
    <div class="bg-emerald-800/60 rounded-2xl p-8 flex items-center justify-center" style="min-width: 320px;">
      <div class="flex flex-col items-center gap-1.5">
        <div class="text-gray-300 text-xs font-medium tracking-wide uppercase">Total Pot</div>
        <div class="flex items-center gap-1.5 bg-black/40 rounded-full px-4 py-1.5 border border-amber-400/30 shadow-lg shadow-black/30" style="backdrop-filter: blur(8px);">
          <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <circle cx="10" cy="10" r="8" />
            <text x="10" y="14" text-anchor="middle" font-size="10" fill="#1a1a1a" font-weight="bold">$</text>
          </svg>
          <span class="text-amber-400 text-lg font-bold" style="font-variant-numeric: tabular-nums;">12.5 BB</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-center">
          <div class="flex items-center gap-1 bg-black/30 rounded-lg px-2.5 py-1 border border-gray-600/40">
            <div class="flex flex-col items-center gap-px">
              <div class="w-3.5 h-1 rounded-sm bg-amber-400 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-amber-500 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-amber-600 shadow-sm"></div>
            </div>
            <div class="flex flex-col items-start ml-0.5">
              <span class="text-gray-400 text-[10px] leading-tight">Main</span>
              <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">12.5</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Variant 2: Main pot + 1 side pot -->
  <div>
    <div class="preview-label">Main + 1 Side Pot</div>
    <div class="bg-emerald-800/60 rounded-2xl p-8 flex items-center justify-center" style="min-width: 380px;">
      <div class="flex flex-col items-center gap-1.5">
        <div class="text-gray-300 text-xs font-medium tracking-wide uppercase">Total Pot</div>
        <div class="flex items-center gap-1.5 bg-black/40 rounded-full px-4 py-1.5 border border-amber-400/30 shadow-lg shadow-black/30" style="backdrop-filter: blur(8px);">
          <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <circle cx="10" cy="10" r="8" />
            <text x="10" y="14" text-anchor="middle" font-size="10" fill="#1a1a1a" font-weight="bold">$</text>
          </svg>
          <span class="text-amber-400 text-lg font-bold" style="font-variant-numeric: tabular-nums;">85.0 BB</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-center">
          <div class="flex items-center gap-1 bg-black/30 rounded-lg px-2.5 py-1 border border-gray-600/40">
            <div class="flex flex-col items-center gap-px">
              <div class="w-3.5 h-1 rounded-sm bg-amber-400 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-amber-500 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-amber-600 shadow-sm"></div>
            </div>
            <div class="flex flex-col items-start ml-0.5">
              <span class="text-gray-400 text-[10px] leading-tight">Main</span>
              <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">60.0</span>
            </div>
          </div>
          <div class="flex items-center gap-1 bg-black/30 rounded-lg px-2.5 py-1 border border-gray-600/40">
            <div class="flex flex-col items-center gap-px">
              <div class="w-3.5 h-1 rounded-sm bg-emerald-400 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-emerald-500 shadow-sm"></div>
            </div>
            <div class="flex flex-col items-start ml-0.5">
              <span class="text-gray-400 text-[10px] leading-tight">Side</span>
              <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">25.0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Variant 3: Main pot + 2 side pots (large pot) -->
  <div>
    <div class="preview-label">Main + 2 Side Pots (Large)</div>
    <div class="bg-emerald-800/60 rounded-2xl p-8 flex items-center justify-center" style="min-width: 440px;">
      <div class="flex flex-col items-center gap-1.5">
        <div class="text-gray-300 text-xs font-medium tracking-wide uppercase">Total Pot</div>
        <div class="flex items-center gap-1.5 bg-black/40 rounded-full px-4 py-1.5 border border-amber-400/30 shadow-lg shadow-black/30" style="backdrop-filter: blur(8px);">
          <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <circle cx="10" cy="10" r="8" />
            <text x="10" y="14" text-anchor="middle" font-size="10" fill="#1a1a1a" font-weight="bold">$</text>
          </svg>
          <span class="text-amber-400 text-lg font-bold" style="font-variant-numeric: tabular-nums;">245.0 BB</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-center">
          <div class="flex items-center gap-1 bg-black/30 rounded-lg px-2.5 py-1 border border-gray-600/40">
            <div class="flex flex-col items-center gap-px">
              <div class="w-3.5 h-1 rounded-sm bg-amber-400 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-amber-500 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-amber-600 shadow-sm"></div>
            </div>
            <div class="flex flex-col items-start ml-0.5">
              <span class="text-gray-400 text-[10px] leading-tight">Main</span>
              <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">150.0</span>
            </div>
          </div>
          <div class="flex items-center gap-1 bg-black/30 rounded-lg px-2.5 py-1 border border-gray-600/40">
            <div class="flex flex-col items-center gap-px">
              <div class="w-3.5 h-1 rounded-sm bg-emerald-400 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-emerald-500 shadow-sm"></div>
            </div>
            <div class="flex flex-col items-start ml-0.5">
              <span class="text-gray-400 text-[10px] leading-tight">Side 1</span>
              <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">60.0</span>
            </div>
          </div>
          <div class="flex items-center gap-1 bg-black/30 rounded-lg px-2.5 py-1 border border-gray-600/40">
            <div class="flex flex-col items-center gap-px">
              <div class="w-3.5 h-1 rounded-sm bg-emerald-400 shadow-sm"></div>
              <div class="w-3.5 h-1 rounded-sm bg-emerald-500 shadow-sm"></div>
            </div>
            <div class="flex flex-col items-start ml-0.5">
              <span class="text-gray-400 text-[10px] leading-tight">Side 2</span>
              <span class="text-white text-xs font-semibold" style="font-variant-numeric: tabular-nums;">35.0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
