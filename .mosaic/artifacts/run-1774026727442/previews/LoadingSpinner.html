<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoadingSpinner Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen flex items-center justify-center">
    <div class="flex items-end gap-16">
      <!-- Small -->
      <div class="flex flex-col items-center gap-3">
        <div class="relative w-8 h-8">
          <div class="absolute inset-0 rounded-full border-2 border-gray-700 border-t-emerald-400 animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center text-sm text-emerald-400">♠</div>
        </div>
        <span class="text-xs text-gray-300 animate-pulse">加载中...</span>
        <span class="text-xs text-gray-500 mt-1">sm</span>
      </div>

      <!-- Medium -->
      <div class="flex flex-col items-center gap-3">
        <div class="relative w-12 h-12">
          <div class="absolute inset-0 rounded-full border-2 border-gray-700 border-t-emerald-400 animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center text-lg text-emerald-400">♠</div>
        </div>
        <span class="text-sm text-gray-300 animate-pulse">发牌中...</span>
        <span class="text-xs text-gray-500 mt-1">md</span>
      </div>

      <!-- Large -->
      <div class="flex flex-col items-center gap-3">
        <div class="relative w-16 h-16">
          <div class="absolute inset-0 rounded-full border-2 border-gray-700 border-t-emerald-400 animate-spin"></div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-emerald-400">♠</div>
        </div>
        <span class="text-base text-gray-300 animate-pulse">正在分析...</span>
        <span class="text-xs text-gray-500 mt-1">lg</span>
      </div>
    </div>
  </div>
</body>
</html>
