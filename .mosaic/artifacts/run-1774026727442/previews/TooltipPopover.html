<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TooltipPopover Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen flex items-center justify-center">
    <div class="flex gap-20 items-center">
      <!-- Tooltip: top placement -->
      <div class="relative inline-block">
        <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 z-50">
          <div class="bg-gray-700 border border-gray-600 text-gray-200 text-xs rounded-lg px-3 py-2 shadow-lg max-w-xs whitespace-normal">
            <strong>SPR</strong> (Stack-to-Pot Ratio)：有效筹码与底池的比值，影响承诺阈值。
          </div>
          <div class="absolute top-full left-1/2 -translate-x-1/2 border-t-gray-700 border-x-transparent border-b-transparent border-4"></div>
        </div>
        <span class="text-emerald-400 text-sm font-medium border-b border-dashed border-emerald-400 cursor-help">
          SPR 值
        </span>
      </div>

      <!-- Tooltip: bottom placement -->
      <div class="relative inline-block">
        <span class="text-emerald-400 text-sm font-medium border-b border-dashed border-emerald-400 cursor-help">
          EV 损失
        </span>
        <div class="absolute top-full left-1/2 -translate-x-1/2 mt-2 z-50">
          <div class="absolute bottom-full left-1/2 -translate-x-1/2 border-b-gray-700 border-x-transparent border-t-transparent border-4"></div>
          <div class="bg-gray-700 border border-gray-600 text-gray-200 text-xs rounded-lg px-3 py-2 shadow-lg max-w-xs whitespace-normal">
            Expected Value 损失：与 GTO 最优策略相比的期望收益差距（以 BB 计）。
          </div>
        </div>
      </div>

      <!-- Tooltip: right placement -->
      <div class="relative inline-block">
        <span class="text-emerald-400 text-sm font-medium border-b border-dashed border-emerald-400 cursor-help">
          3-Bet
        </span>
        <div class="absolute left-full top-1/2 -translate-y-1/2 ml-2 z-50">
          <div class="absolute right-full top-1/2 -translate-y-1/2 border-r-gray-700 border-y-transparent border-l-transparent border-4"></div>
          <div class="bg-gray-700 border border-gray-600 text-gray-200 text-xs rounded-lg px-3 py-2 shadow-lg max-w-xs whitespace-normal">
            对已有加注进行再加注的操作。
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
