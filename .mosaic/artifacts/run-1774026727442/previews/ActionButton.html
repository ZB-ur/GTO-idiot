<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ActionButton Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 20px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Action Buttons — Active</p>

    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <!-- Fold -->
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        transition-colors duration-150 select-none min-w-[80px]
        bg-red-500/20 text-red-400 border-red-500/40">
        <span class="text-sm">Fold</span>
      </button>

      <!-- Check -->
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        transition-colors duration-150 select-none min-w-[80px]
        bg-gray-700 text-white border-gray-600">
        <span class="text-sm">Check</span>
      </button>

      <!-- Call -->
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        transition-colors duration-150 select-none min-w-[80px]
        bg-emerald-600 text-white border-emerald-500">
        <span class="text-sm">Call</span>
        <span class="text-xs opacity-70 mt-0.5">2.0 BB</span>
      </button>

      <!-- Bet -->
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        transition-colors duration-150 select-none min-w-[80px]
        bg-emerald-600 text-white border-emerald-500">
        <span class="text-sm">Bet</span>
        <span class="text-xs opacity-70 mt-0.5">3.5 BB</span>
      </button>

      <!-- Raise -->
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        transition-colors duration-150 select-none min-w-[80px]
        bg-emerald-600 text-white border-emerald-500">
        <span class="text-sm">Raise</span>
        <span class="text-xs opacity-70 mt-0.5">7.0 BB</span>
      </button>

      <!-- All-in -->
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        transition-colors duration-150 select-none min-w-[80px]
        bg-red-500/20 text-red-400 border-red-500/40">
        <span class="text-sm">All-in</span>
        <span class="text-xs opacity-70 mt-0.5">100.0 BB</span>
      </button>
    </div>

    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider mt-4">Action Buttons — Disabled</p>

    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <!-- Fold disabled -->
      <button disabled class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-red-500/10 text-red-400/30 border-red-500/10 cursor-not-allowed">
        <span class="text-sm">Fold</span>
      </button>

      <!-- Check disabled -->
      <button disabled class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-gray-700/30 text-gray-400/40 border-gray-600/20 cursor-not-allowed">
        <span class="text-sm">Check</span>
      </button>

      <!-- Call disabled -->
      <button disabled class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-emerald-600/30 text-emerald-400/40 border-emerald-600/20 cursor-not-allowed">
        <span class="text-sm">Call</span>
        <span class="text-xs opacity-70 mt-0.5">2.0 BB</span>
      </button>

      <!-- Raise disabled -->
      <button disabled class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-emerald-600/30 text-emerald-400/40 border-emerald-600/20 cursor-not-allowed">
        <span class="text-sm">Raise</span>
        <span class="text-xs opacity-70 mt-0.5">7.0 BB</span>
      </button>
    </div>

    <!-- In context: action bar -->
    <p class="text-gray-500 text-xs mt-4">Typical action bar layout</p>
    <div class="bg-gray-800/80 rounded-xl p-4 flex justify-center gap-3">
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-red-500/20 text-red-400 border-red-500/40">
        <span class="text-sm">Fold</span>
      </button>
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-emerald-600 text-white border-emerald-500">
        <span class="text-sm">Call</span>
        <span class="text-xs opacity-70 mt-0.5">2.0 BB</span>
      </button>
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-emerald-600 text-white border-emerald-500">
        <span class="text-sm">Raise</span>
        <span class="text-xs opacity-70 mt-0.5">6.0 BB</span>
      </button>
      <button class="inline-flex flex-col items-center justify-center px-5 py-3 rounded-lg border font-semibold
        select-none min-w-[80px]
        bg-red-500/20 text-red-400 border-red-500/40">
        <span class="text-sm">All-in</span>
        <span class="text-xs opacity-70 mt-0.5">98.0 BB</span>
      </button>
    </div>
  </div>
</body>
</html>
