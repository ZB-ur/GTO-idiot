<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotStylePicker Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-10">

    <!-- === State 1: Closed, GTO selected === -->
    <div>
      <p class="text-xs text-gray-500 mb-3 uppercase tracking-wider">Closed — GTO Selected</p>
      <div class="relative w-56">
        <label class="block text-xs font-medium text-gray-400 mb-1">Seat 2 (MP)</label>
        <button class="w-full flex items-center justify-between gap-2 px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-sm text-white hover:border-gray-500 transition-colors">
          <span class="flex items-center gap-2">
            <span>🎯</span>
            <span class="font-semibold text-emerald-400">GTO</span>
          </span>
          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- === State 2: Closed, LAG selected === -->
    <div>
      <p class="text-xs text-gray-500 mb-3 uppercase tracking-wider">Closed — LAG Selected</p>
      <div class="relative w-56">
        <label class="block text-xs font-medium text-gray-400 mb-1">Seat 4 (BTN)</label>
        <button class="w-full flex items-center justify-between gap-2 px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-sm text-white hover:border-gray-500 transition-colors">
          <span class="flex items-center gap-2">
            <span>🔥</span>
            <span class="font-semibold text-amber-400">LAG</span>
          </span>
          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>
      </div>
    </div>

    <!-- === State 3: Open dropdown, TAG selected === -->
    <div>
      <p class="text-xs text-gray-500 mb-3 uppercase tracking-wider">Open — TAG Selected</p>
      <div class="relative w-56">
        <label class="block text-xs font-medium text-gray-400 mb-1">Seat 3 (CO)</label>
        <button class="w-full flex items-center justify-between gap-2 px-3 py-2 bg-gray-800 border border-emerald-500 ring-1 ring-emerald-500/30 rounded-lg text-sm text-white transition-colors">
          <span class="flex items-center gap-2">
            <span>🛡️</span>
            <span class="font-semibold text-blue-400">TAG</span>
          </span>
          <svg class="w-4 h-4 text-gray-400 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </button>

        <!-- Dropdown menu -->
        <div class="absolute z-20 mt-1 w-full bg-gray-800 border border-gray-600 rounded-lg shadow-lg overflow-hidden">
          <!-- GTO option -->
          <div class="w-full flex items-center gap-3 px-3 py-2.5 text-left text-sm hover:bg-gray-700/60 cursor-pointer">
            <span class="text-base">🎯</span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-emerald-400">GTO</div>
              <div class="text-xs text-gray-400 truncate">博弈论最优策略</div>
            </div>
          </div>
          <!-- TAG option (selected) -->
          <div class="w-full flex items-center gap-3 px-3 py-2.5 text-left text-sm bg-gray-700 cursor-pointer">
            <span class="text-base">🛡️</span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-blue-400">TAG</div>
              <div class="text-xs text-gray-400 truncate">紧凶型，范围紧、下注凶</div>
            </div>
            <svg class="w-4 h-4 text-emerald-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <!-- LAG option -->
          <div class="w-full flex items-center gap-3 px-3 py-2.5 text-left text-sm hover:bg-gray-700/60 cursor-pointer">
            <span class="text-base">🔥</span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-amber-400">LAG</div>
              <div class="text-xs text-gray-400 truncate">松凶型，范围宽、攻击性强</div>
            </div>
          </div>
          <!-- Fish option -->
          <div class="w-full flex items-center gap-3 px-3 py-2.5 text-left text-sm hover:bg-gray-700/60 cursor-pointer">
            <span class="text-base">🐟</span>
            <div class="flex-1 min-w-0">
              <div class="font-semibold text-red-400">Fish</div>
              <div class="text-xs text-gray-400 truncate">鱼型，松被动、容易犯错</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- === State 4: Row of closed pickers === -->
    <div>
      <p class="text-xs text-gray-500 mb-3 uppercase tracking-wider">Row Layout — Multiple Seats</p>
      <div class="flex gap-3">
        <!-- Seat 1 -->
        <div class="relative w-40">
          <label class="block text-xs font-medium text-gray-400 mb-1">Seat 1 (UTG)</label>
          <button class="w-full flex items-center justify-between gap-2 px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-sm text-white">
            <span class="flex items-center gap-2">
              <span>🎯</span>
              <span class="font-semibold text-emerald-400">GTO</span>
            </span>
            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>
        <!-- Seat 2 -->
        <div class="relative w-40">
          <label class="block text-xs font-medium text-gray-400 mb-1">Seat 2 (MP)</label>
          <button class="w-full flex items-center justify-between gap-2 px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-sm text-white">
            <span class="flex items-center gap-2">
              <span>🐟</span>
              <span class="font-semibold text-red-400">Fish</span>
            </span>
            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>
        <!-- Seat 3 -->
        <div class="relative w-40">
          <label class="block text-xs font-medium text-gray-400 mb-1">Seat 3 (CO)</label>
          <button class="w-full flex items-center justify-between gap-2 px-3 py-2 bg-gray-800 border border-gray-600 rounded-lg text-sm text-white">
            <span class="flex items-center gap-2">
              <span>🔥</span>
              <span class="font-semibold text-amber-400">LAG</span>
            </span>
            <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
