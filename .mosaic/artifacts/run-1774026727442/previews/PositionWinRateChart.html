<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PositionWinRateChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #111827; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div style="max-width: 560px; margin: 0 auto;">
    <div class="bg-gray-800 rounded-xl p-6 border border-gray-600">
      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-lg font-semibold text-white">按位置胜率分布</h3>
        <span class="text-sm text-gray-500">Win Rate by Position</span>
      </div>

      <!-- Chart area -->
      <div class="flex items-end gap-3 mb-4 px-2" style="height: 192px;">
        <!-- UTG - 38% -->
        <div class="flex-1 flex flex-col items-center gap-2 h-full">
          <span class="text-xs font-medium text-gray-300">38.0%</span>
          <div class="w-full flex justify-center flex-1">
            <div class="w-full max-w-[48px] flex items-end h-full">
              <div class="w-full bg-red-500 rounded-t-md" style="height: 63.3%;"></div>
            </div>
          </div>
        </div>
        <!-- MP - 42% -->
        <div class="flex-1 flex flex-col items-center gap-2 h-full">
          <span class="text-xs font-medium text-gray-300">42.0%</span>
          <div class="w-full flex justify-center flex-1">
            <div class="w-full max-w-[48px] flex items-end h-full">
              <div class="w-full bg-orange-500 rounded-t-md" style="height: 70.0%;"></div>
            </div>
          </div>
        </div>
        <!-- CO - 51% -->
        <div class="flex-1 flex flex-col items-center gap-2 h-full">
          <span class="text-xs font-medium text-gray-300">51.0%</span>
          <div class="w-full flex justify-center flex-1">
            <div class="w-full max-w-[48px] flex items-end h-full">
              <div class="w-full bg-amber-400 rounded-t-md" style="height: 85.0%;"></div>
            </div>
          </div>
        </div>
        <!-- BTN - 60% (highest) -->
        <div class="flex-1 flex flex-col items-center gap-2 h-full">
          <span class="text-xs font-medium text-gray-300">60.0%</span>
          <div class="w-full flex justify-center flex-1">
            <div class="w-full max-w-[48px] flex items-end h-full">
              <div class="w-full bg-emerald-400 rounded-t-md" style="height: 100%;"></div>
            </div>
          </div>
        </div>
        <!-- SB - 35% -->
        <div class="flex-1 flex flex-col items-center gap-2 h-full">
          <span class="text-xs font-medium text-gray-300">35.0%</span>
          <div class="w-full flex justify-center flex-1">
            <div class="w-full max-w-[48px] flex items-end h-full">
              <div class="w-full bg-blue-400 rounded-t-md" style="height: 58.3%;"></div>
            </div>
          </div>
        </div>
        <!-- BB - 32% -->
        <div class="flex-1 flex flex-col items-center gap-2 h-full">
          <span class="text-xs font-medium text-gray-300">32.0%</span>
          <div class="w-full flex justify-center flex-1">
            <div class="w-full max-w-[48px] flex items-end h-full">
              <div class="w-full bg-purple-400 rounded-t-md" style="height: 53.3%;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Position labels -->
      <div class="flex gap-3 px-2 mb-6">
        <div class="flex-1 text-center"><span class="text-sm font-bold text-red-500">UTG</span></div>
        <div class="flex-1 text-center"><span class="text-sm font-bold text-orange-500">MP</span></div>
        <div class="flex-1 text-center"><span class="text-sm font-bold text-amber-400">CO</span></div>
        <div class="flex-1 text-center"><span class="text-sm font-bold text-emerald-400">BTN</span></div>
        <div class="flex-1 text-center"><span class="text-sm font-bold text-blue-400">SB</span></div>
        <div class="flex-1 text-center"><span class="text-sm font-bold text-purple-400">BB</span></div>
      </div>

      <!-- Stats table -->
      <div class="border-t border-gray-700 pt-4">
        <div class="grid grid-cols-3 gap-2 text-xs text-gray-500 mb-2 px-1">
          <span>位置</span>
          <span class="text-center">手数</span>
          <span class="text-right">平均盈亏</span>
        </div>
        <!-- UTG -->
        <div class="grid grid-cols-3 gap-2 text-sm py-1.5 px-1 rounded">
          <span class="font-semibold text-red-500">UTG</span>
          <span class="text-center text-gray-300">87</span>
          <span class="text-right font-medium text-red-400">-1.2 BB</span>
        </div>
        <!-- MP -->
        <div class="grid grid-cols-3 gap-2 text-sm py-1.5 px-1 rounded">
          <span class="font-semibold text-orange-500">MP</span>
          <span class="text-center text-gray-300">92</span>
          <span class="text-right font-medium text-green-400">+0.8 BB</span>
        </div>
        <!-- CO -->
        <div class="grid grid-cols-3 gap-2 text-sm py-1.5 px-1 rounded">
          <span class="font-semibold text-amber-400">CO</span>
          <span class="text-center text-gray-300">105</span>
          <span class="text-right font-medium text-green-400">+2.4 BB</span>
        </div>
        <!-- BTN -->
        <div class="grid grid-cols-3 gap-2 text-sm py-1.5 px-1 rounded">
          <span class="font-semibold text-emerald-400">BTN</span>
          <span class="text-center text-gray-300">98</span>
          <span class="text-right font-medium text-green-400">+4.7 BB</span>
        </div>
        <!-- SB -->
        <div class="grid grid-cols-3 gap-2 text-sm py-1.5 px-1 rounded">
          <span class="font-semibold text-blue-400">SB</span>
          <span class="text-center text-gray-300">83</span>
          <span class="text-right font-medium text-red-400">-2.1 BB</span>
        </div>
        <!-- BB -->
        <div class="grid grid-cols-3 gap-2 text-sm py-1.5 px-1 rounded">
          <span class="font-semibold text-purple-400">BB</span>
          <span class="text-center text-gray-300">91</span>
          <span class="text-right font-medium text-red-400">-3.5 BB</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
