<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandList Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-lg mx-auto bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
    <div class="px-4 py-3 border-b border-gray-100">
      <h2 class="text-lg font-semibold text-gray-900">Hand History</h2>
      <p class="text-sm text-gray-500">Session — 42 hands played</p>
    </div>

    <div class="divide-y divide-gray-100">
      <!-- Hand 1: Win, conforming (selected) -->
      <div class="w-full flex items-center gap-4 px-4 py-3 text-left bg-blue-50 border-l-2 border-blue-600">
        <span class="text-xs text-gray-400 font-mono w-6 text-right shrink-0">#1</span>
        <div class="flex items-center gap-0.5 shrink-0 w-16">
          <span class="text-sm font-bold text-gray-900">A♠</span>
          <span class="text-sm font-bold text-red-500">K♥</span>
        </div>
        <span class="text-xs font-semibold text-gray-500 uppercase w-8 shrink-0">CO</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-green-700 bg-green-50 border border-green-200 shrink-0">GTO</span>
        <div class="flex-1"></div>
        <span class="text-sm font-semibold tabular-nums w-16 text-right shrink-0 text-green-600">+8.5BB</span>
      </div>

      <!-- Hand 2: Loss, major deviation -->
      <div class="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-gray-50 border-l-2 border-transparent">
        <span class="text-xs text-gray-400 font-mono w-6 text-right shrink-0">#2</span>
        <div class="flex items-center gap-0.5 shrink-0 w-16">
          <span class="text-sm font-bold text-red-500">Q♥</span>
          <span class="text-sm font-bold text-red-500">J♦</span>
        </div>
        <span class="text-xs font-semibold text-gray-500 uppercase w-8 shrink-0">BTN</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-red-700 bg-red-50 border border-red-200 shrink-0">Major</span>
        <div class="flex-1"></div>
        <span class="text-xs text-red-500 font-medium shrink-0">−4.2BB</span>
        <span class="text-sm font-semibold tabular-nums w-16 text-right shrink-0 text-red-600">−12.0BB</span>
      </div>

      <!-- Hand 3: Small win, minor deviation -->
      <div class="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-gray-50 border-l-2 border-transparent">
        <span class="text-xs text-gray-400 font-mono w-6 text-right shrink-0">#3</span>
        <div class="flex items-center gap-0.5 shrink-0 w-16">
          <span class="text-sm font-bold text-gray-900">T♠</span>
          <span class="text-sm font-bold text-gray-900">T♣</span>
        </div>
        <span class="text-xs font-semibold text-gray-500 uppercase w-8 shrink-0">HJ</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-yellow-700 bg-yellow-50 border border-yellow-200 shrink-0">Minor</span>
        <div class="flex-1"></div>
        <span class="text-xs text-red-500 font-medium shrink-0">−0.8BB</span>
        <span class="text-sm font-semibold tabular-nums w-16 text-right shrink-0 text-green-600">+3.0BB</span>
      </div>

      <!-- Hand 4: Fold, conforming -->
      <div class="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-gray-50 border-l-2 border-transparent">
        <span class="text-xs text-gray-400 font-mono w-6 text-right shrink-0">#4</span>
        <div class="flex items-center gap-0.5 shrink-0 w-16">
          <span class="text-sm font-bold text-blue-500">7♦</span>
          <span class="text-sm font-bold text-green-700">2♣</span>
        </div>
        <span class="text-xs font-semibold text-gray-500 uppercase w-8 shrink-0">UTG</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-green-700 bg-green-50 border border-green-200 shrink-0">GTO</span>
        <div class="flex-1"></div>
        <span class="text-sm font-semibold tabular-nums w-16 text-right shrink-0 text-red-600">−1.0BB</span>
      </div>

      <!-- Hand 5: Big win, conforming -->
      <div class="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-gray-50 border-l-2 border-transparent">
        <span class="text-xs text-gray-400 font-mono w-6 text-right shrink-0">#5</span>
        <div class="flex items-center gap-0.5 shrink-0 w-16">
          <span class="text-sm font-bold text-red-500">A♥</span>
          <span class="text-sm font-bold text-red-500">A♦</span>
        </div>
        <span class="text-xs font-semibold text-gray-500 uppercase w-8 shrink-0">SB</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-green-700 bg-green-50 border border-green-200 shrink-0">GTO</span>
        <div class="flex-1"></div>
        <span class="text-sm font-semibold tabular-nums w-16 text-right shrink-0 text-green-600">+24.5BB</span>
      </div>

      <!-- Hand 6: Loss, minor -->
      <div class="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-gray-50 border-l-2 border-transparent">
        <span class="text-xs text-gray-400 font-mono w-6 text-right shrink-0">#6</span>
        <div class="flex items-center gap-0.5 shrink-0 w-16">
          <span class="text-sm font-bold text-gray-900">K♣</span>
          <span class="text-sm font-bold text-blue-500">9♦</span>
        </div>
        <span class="text-xs font-semibold text-gray-500 uppercase w-8 shrink-0">BB</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-yellow-700 bg-yellow-50 border border-yellow-200 shrink-0">Minor</span>
        <div class="flex-1"></div>
        <span class="text-xs text-red-500 font-medium shrink-0">−1.2BB</span>
        <span class="text-sm font-semibold tabular-nums w-16 text-right shrink-0 text-red-600">−6.0BB</span>
      </div>

      <!-- Hand 7: Break-even, conforming -->
      <div class="w-full flex items-center gap-4 px-4 py-3 text-left hover:bg-gray-50 border-l-2 border-transparent">
        <span class="text-xs text-gray-400 font-mono w-6 text-right shrink-0">#7</span>
        <div class="flex items-center gap-0.5 shrink-0 w-16">
          <span class="text-sm font-bold text-gray-900">8♠</span>
          <span class="text-sm font-bold text-red-500">8♥</span>
        </div>
        <span class="text-xs font-semibold text-gray-500 uppercase w-8 shrink-0">CO</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-semibold text-green-700 bg-green-50 border border-green-200 shrink-0">GTO</span>
        <div class="flex-1"></div>
        <span class="text-sm font-semibold tabular-nums w-16 text-right shrink-0 text-gray-400">0.0BB</span>
      </div>
    </div>
  </div>
</body>
</html>
