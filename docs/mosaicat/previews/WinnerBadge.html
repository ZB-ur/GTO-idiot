<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinnerBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col items-start gap-4 pt-8 pl-8">
    <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide">Winner Badges</p>

    <!-- Royal Flush -->
    <div class="inline-flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/30">
      <span class="text-xs font-bold text-amber-300 uppercase tracking-wide">Royal Flush</span>
      <span class="text-sm font-bold text-amber-400">+2400</span>
    </div>

    <!-- Full House -->
    <div class="inline-flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/30">
      <span class="text-xs font-bold text-amber-300 uppercase tracking-wide">Full House</span>
      <span class="text-sm font-bold text-amber-400">+180</span>
    </div>

    <!-- Two Pair -->
    <div class="inline-flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/30">
      <span class="text-xs font-bold text-amber-300 uppercase tracking-wide">Two Pair</span>
      <span class="text-sm font-bold text-amber-400">+45</span>
    </div>

    <!-- High Card -->
    <div class="inline-flex flex-col items-center gap-0.5 px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-500/30">
      <span class="text-xs font-bold text-amber-300 uppercase tracking-wide">High Card</span>
      <span class="text-sm font-bold text-amber-400">+12</span>
    </div>
  </div>
</body>
</html>
