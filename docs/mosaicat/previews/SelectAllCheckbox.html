<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SelectAllCheckbox Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-4">
    <!-- Unchecked with label -->
    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
      <div class="w-5 h-5 rounded-lg border-2 border-gray-200 bg-white flex items-center justify-center"></div>
      <span class="text-sm font-medium text-gray-600">Select All</span>
    </label>
    <!-- Indeterminate with label -->
    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
      <div class="w-5 h-5 rounded-lg border-2 border-blue-600 bg-blue-600 flex items-center justify-center">
        <svg class="w-3 h-3 text-white" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h6"/></svg>
      </div>
      <span class="text-sm font-medium text-gray-600">Select All (3 of 12)</span>
    </label>
    <!-- Checked with label -->
    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
      <div class="w-5 h-5 rounded-lg border-2 border-blue-600 bg-blue-600 flex items-center justify-center">
        <svg class="w-3 h-3 text-white" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6l3 3 5-5"/></svg>
      </div>
      <span class="text-sm font-medium text-gray-600">Select All (12 of 12)</span>
    </label>
    <!-- In context: header of a list -->
    <div class="mt-4 bg-white border border-gray-200 rounded-xl shadow-sm max-w-md overflow-hidden">
      <div class="px-4 py-3 border-b border-gray-200 flex items-center justify-between">
        <label class="inline-flex items-center gap-2 cursor-pointer select-none">
          <div class="w-5 h-5 rounded-lg border-2 border-blue-600 bg-blue-600 flex items-center justify-center">
            <svg class="w-3 h-3 text-white" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h6"/></svg>
          </div>
          <span class="text-sm font-medium text-gray-600">Select All</span>
        </label>
        <span class="text-xs text-gray-400">3 selected</span>
      </div>
      <div class="px-4 py-3 border-b border-gray-100 flex items-center gap-3">
        <div class="w-5 h-5 rounded-lg border-2 border-blue-600 bg-blue-600 flex items-center justify-center flex-shrink-0">
          <svg class="w-3 h-3 text-white" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6l3 3 5-5"/></svg>
        </div>
        <span class="text-sm text-gray-900">Hand #1042</span>
      </div>
      <div class="px-4 py-3 flex items-center gap-3">
        <div class="w-5 h-5 rounded-lg border-2 border-gray-200 bg-white flex items-center justify-center flex-shrink-0"></div>
        <span class="text-sm text-gray-900">Hand #1041</span>
      </div>
    </div>
  </div>
</body>
</html>
