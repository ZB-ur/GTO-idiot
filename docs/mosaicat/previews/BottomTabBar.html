<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BottomTabBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Spacer to simulate page content -->
  <div class="flex-1 p-4">
    <div class="max-w-md mx-auto">
      <p class="text-gray-400 text-sm text-center mt-8">Page content area</p>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav class="bg-white border-t border-gray-200 px-2">
    <div class="flex items-center justify-around h-16">
      <!-- Play (active) -->
      <button class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-blue-600">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-xs font-medium text-blue-600">Play</span>
      </button>

      <!-- History -->
      <button class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-xs font-medium text-gray-400">History</span>
      </button>

      <!-- Charts -->
      <button class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 5a1 1 0 011-1h14a1 1 0 011 1v2a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm0 8a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H5a1 1 0 01-1-1v-6zm10 0a1 1 0 011-1h4a1 1 0 011 1v6a1 1 0 01-1 1h-4a1 1 0 01-1-1v-6z" />
        </svg>
        <span class="text-xs font-medium text-gray-400">Charts</span>
      </button>

      <!-- Stats -->
      <button class="flex flex-col items-center justify-center gap-1 flex-1 h-full text-gray-400">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <span class="text-xs font-medium text-gray-400">Stats</span>
      </button>
    </div>
  </nav>
</body>
</html>
