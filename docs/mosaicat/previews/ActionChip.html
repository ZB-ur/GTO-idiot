<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionChip Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #064e3b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-wrap items-center gap-3">
    <!-- Fold -->
    <div class="inline-flex items-center rounded-lg border bg-gray-700/80 text-gray-300 border-gray-600/50 px-2.5 py-1 text-xs font-bold uppercase tracking-wide backdrop-blur-sm">
      Fold
    </div>

    <!-- Check -->
    <div class="inline-flex items-center rounded-lg border bg-emerald-700/80 text-emerald-200 border-emerald-600/50 px-2.5 py-1 text-xs font-bold uppercase tracking-wide backdrop-blur-sm">
      Check
    </div>

    <!-- Call -->
    <div class="inline-flex items-center rounded-lg border bg-sky-700/80 text-sky-200 border-sky-600/50 px-2.5 py-1 text-xs font-bold uppercase tracking-wide backdrop-blur-sm">
      Call 8
    </div>

    <!-- Raise -->
    <div class="inline-flex items-center rounded-lg border bg-amber-600/80 text-amber-100 border-amber-500/50 px-2.5 py-1 text-xs font-bold uppercase tracking-wide backdrop-blur-sm">
      Raise 12
    </div>

    <!-- All-in -->
    <div class="inline-flex items-center rounded-lg border bg-red-600/80 text-red-100 border-red-500/50 px-2.5 py-1 text-xs font-bold uppercase tracking-wide backdrop-blur-sm">
      All-In 240
    </div>
  </div>
</body>
</html>
