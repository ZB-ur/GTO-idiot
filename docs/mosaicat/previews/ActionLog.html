<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionLog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="bg-gray-900 border border-gray-700 rounded-xl overflow-hidden flex flex-col" style="width: 320px; height: 420px;">
    <div class="px-4 py-3 border-b border-gray-800 flex-shrink-0">
      <h3 class="text-sm font-semibold text-gray-50">Action Log</h3>
    </div>
    <div class="overflow-y-auto flex-1 p-2 space-y-0.5">
      <!-- Preflop -->
      <div class="px-3 py-1.5">
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-500">Preflop</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-60">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">UTG</span>
        <span class="text-sm font-medium flex-1 text-gray-500">Fold</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 3</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-60">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">MP</span>
        <span class="text-sm font-medium flex-1 text-amber-400">Raise 6</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 9</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-60">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">CO</span>
        <span class="text-sm font-medium flex-1 text-gray-500">Fold</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 9</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-60">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">BTN</span>
        <span class="text-sm font-medium flex-1 text-emerald-400">Call 6</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 15</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-60">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">SB</span>
        <span class="text-sm font-medium flex-1 text-gray-500">Fold</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 15</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-60">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">BB</span>
        <span class="text-sm font-medium flex-1 text-emerald-400">Call 4</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 19</span>
      </div>

      <!-- Flop -->
      <div class="px-3 py-1.5 mt-1">
        <span class="text-xs font-semibold uppercase tracking-wider text-amber-500">Flop</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-60">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">BB</span>
        <span class="text-sm font-medium flex-1 text-gray-400">Check</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 19</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg bg-amber-500/15 border border-amber-500/30">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">MP</span>
        <span class="text-sm font-medium flex-1 text-amber-400">Raise 12</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 31</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-40">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">BTN</span>
        <span class="text-sm font-medium flex-1 text-emerald-400">Call 12</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 43</span>
      </div>
      <div class="flex items-center gap-3 px-3 py-2 rounded-lg opacity-40">
        <span class="text-xs font-mono text-gray-500 w-8 text-right flex-shrink-0">BB</span>
        <span class="text-sm font-medium flex-1 text-gray-500">Fold</span>
        <span class="text-xs text-gray-500 flex-shrink-0">Pot: 43</span>
      </div>
    </div>
  </div>
</body>
</html>
