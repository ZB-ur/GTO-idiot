<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeviationDetail Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xl mx-auto space-y-4">
    <!-- Conforming (collapsed) -->
    <div class="border border-green-200 bg-green-50 rounded-lg overflow-hidden">
      <div class="w-full flex items-center justify-between px-4 py-3 text-left">
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold text-green-700 bg-green-50 border border-green-200">GTO</span>
          <span class="text-sm text-gray-900 font-medium">You: Raise 3.0BB</span>
        </div>
        <div class="flex items-center gap-3">
          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Minor deviation (collapsed) -->
    <div class="border border-yellow-200 bg-yellow-50 rounded-lg overflow-hidden">
      <div class="w-full flex items-center justify-between px-4 py-3 text-left">
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold text-yellow-700 bg-yellow-50 border border-yellow-200">Minor</span>
          <span class="text-sm text-gray-900 font-medium">You: Bet 2.0BB</span>
          <span class="text-sm text-gray-400">→</span>
          <span class="text-sm text-blue-600 font-medium">GTO: Bet 66% pot</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold text-red-600">−0.8BB</span>
          <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Major deviation (expanded) -->
    <div class="border border-red-200 bg-red-50 rounded-lg overflow-hidden">
      <div class="w-full flex items-center justify-between px-4 py-3 text-left">
        <div class="flex items-center gap-3">
          <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold text-red-700 bg-red-50 border border-red-200">Major</span>
          <span class="text-sm text-gray-900 font-medium">You: Fold</span>
          <span class="text-sm text-gray-400">→</span>
          <span class="text-sm text-blue-600 font-medium">GTO: Raise to 2.5BB</span>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-sm font-semibold text-red-600">−4.2BB</span>
          <svg class="w-4 h-4 text-gray-400 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
      <div class="px-4 pb-4 pt-1 border-t border-white/60">
        <div class="grid grid-cols-2 gap-4 mb-3">
          <div class="bg-white/60 rounded-lg p-3">
            <p class="text-xs text-gray-500 mb-1">Your Action</p>
            <p class="text-sm font-semibold text-gray-900">Fold</p>
          </div>
          <div class="bg-white/60 rounded-lg p-3">
            <p class="text-xs text-gray-500 mb-1">GTO Recommendation</p>
            <p class="text-sm font-semibold text-blue-600">Raise to 2.5BB</p>
          </div>
        </div>
        <div class="bg-white/60 rounded-lg p-3">
          <p class="text-xs text-gray-500 mb-1">Explanation</p>
          <p class="text-sm text-gray-700">你 fold 了 AQs 在 CO 位置，GTO 建议 raise 到 2.5BB。这是一手强牌，在有利位置应该主动加注。</p>
        </div>
        <div class="mt-3 flex items-center gap-2">
          <div class="h-1.5 flex-1 bg-white/60 rounded-full overflow-hidden">
            <div class="h-full bg-red-400 rounded-full" style="width: 42%"></div>
          </div>
          <span class="text-xs text-red-600 font-medium whitespace-nowrap">EV Loss: 4.2BB</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
