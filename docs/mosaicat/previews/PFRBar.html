<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PFRBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-sm mx-auto space-y-5">
    <!-- Passive: 8% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">PFR</span>
        <span class="text-sm font-bold text-gray-900">8%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-sky-500" style="width: 8%"></div>
      </div>
    </div>
    <!-- Normal: 17% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">PFR</span>
        <span class="text-sm font-bold text-gray-900">17%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-emerald-500" style="width: 17%"></div>
      </div>
    </div>
    <!-- Aggressive: 25% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">PFR</span>
        <span class="text-sm font-bold text-gray-900">25%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-amber-500" style="width: 25%"></div>
      </div>
    </div>
    <!-- Hyper-aggressive: 35% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">PFR</span>
        <span class="text-sm font-bold text-gray-900">35%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-red-500" style="width: 35%"></div>
      </div>
    </div>
  </div>
</body>
</html>
