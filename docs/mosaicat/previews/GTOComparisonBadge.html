<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTOComparisonBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-4">
    <h2 class="text-lg font-semibold text-gray-900 mb-2">GTOComparisonBadge</h2>

    <!-- Conforming -->
    <div class="space-y-1">
      <p class="text-sm text-gray-500">Conforming</p>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-sm font-medium bg-green-50 text-green-700 border-green-200">
        <span class="font-bold">✓</span>
        <span>Raise — GTO</span>
      </span>
    </div>

    <!-- Minor deviation -->
    <div class="space-y-1">
      <p class="text-sm text-gray-500">Minor Deviation</p>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-sm font-medium bg-yellow-50 text-yellow-700 border-yellow-200">
        <span class="font-bold">~</span>
        <span>Bet</span>
        <span class="opacity-50">→</span>
        <span>Raise 到 2.5BB</span>
        <span class="ml-0.5 opacity-75">(-0.8BB)</span>
      </span>
    </div>

    <!-- Major deviation -->
    <div class="space-y-1">
      <p class="text-sm text-gray-500">Major Deviation</p>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-sm font-medium bg-red-50 text-red-700 border-red-200">
        <span class="font-bold">✗</span>
        <span>Fold</span>
        <span class="opacity-50">→</span>
        <span>Raise 到 3BB</span>
        <span class="ml-0.5 opacity-75">(-3.2BB)</span>
      </span>
    </div>

    <!-- Another conforming -->
    <div class="space-y-1">
      <p class="text-sm text-gray-500">Conforming (Call)</p>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-sm font-medium bg-green-50 text-green-700 border-green-200">
        <span class="font-bold">✓</span>
        <span>Call — GTO</span>
      </span>
    </div>

    <!-- Major deviation - check vs bet -->
    <div class="space-y-1">
      <p class="text-sm text-gray-500">Major Deviation (Check → Bet)</p>
      <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-sm font-medium bg-red-50 text-red-700 border-red-200">
        <span class="font-bold">✗</span>
        <span>Check</span>
        <span class="opacity-50">→</span>
        <span>66% Pot</span>
        <span class="ml-0.5 opacity-75">(-1.5BB)</span>
      </span>
    </div>
  </div>
</body>
</html>
