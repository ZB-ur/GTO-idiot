<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="max-w-xs mx-auto space-y-2">
  <label class="text-sm font-semibold text-gray-900">Bot Speed</label>
  <div class="flex rounded-lg border border-gray-200 overflow-hidden">
    <button class="flex-1 flex items-center justify-center gap-1.5 py-2.5 text-sm font-semibold bg-white text-gray-600">
      <span class="text-xs">⚡</span> Fast
    </button>
    <button class="flex-1 flex items-center justify-center gap-1.5 py-2.5 text-sm font-semibold bg-blue-600 text-white">
      <span class="text-xs">▶</span> Normal
    </button>
    <button class="flex-1 flex items-center justify-center gap-1.5 py-2.5 text-sm font-semibold bg-white text-gray-600">
      <span class="text-xs">🐢</span> Slow
    </button>
  </div>
</div>
</body>
</html>
