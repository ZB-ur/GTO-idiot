<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="space-y-6 max-w-lg mx-auto">
  <div>
    <p class="text-sm text-gray-500 mb-2">Flop Active</p>
    <div class="flex items-center gap-1 bg-slate-100 rounded-lg p-1 w-fit">
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md text-gray-700 hover:bg-white">Preflop</button>
      <div class="w-6 h-0.5 bg-blue-300"></div>
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md bg-blue-600 text-white shadow-sm">Flop</button>
      <div class="w-6 h-0.5 bg-blue-300"></div>
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md text-gray-700 hover:bg-white">Turn</button>
      <div class="w-6 h-0.5 bg-gray-200"></div>
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md text-gray-300 cursor-not-allowed">River</button>
    </div>
  </div>

  <div>
    <p class="text-sm text-gray-500 mb-2">River Active (all available)</p>
    <div class="flex items-center gap-1 bg-slate-100 rounded-lg p-1 w-fit">
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md text-gray-700 hover:bg-white">Preflop</button>
      <div class="w-6 h-0.5 bg-blue-300"></div>
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md text-gray-700 hover:bg-white">Flop</button>
      <div class="w-6 h-0.5 bg-blue-300"></div>
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md text-gray-700 hover:bg-white">Turn</button>
      <div class="w-6 h-0.5 bg-blue-300"></div>
      <button class="px-3 py-1.5 text-sm font-semibold rounded-md bg-blue-600 text-white shadow-sm">River</button>
    </div>
  </div>
</div>
</body>
</html>
