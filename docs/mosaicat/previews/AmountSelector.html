<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmountSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
    input[type="range"] { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 9999px; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #f59e0b; border: 2px solid #030712; cursor: pointer; }
  </style>
</head>
<body>
  <div class="space-y-8 max-w-sm">

    <!-- Default state: 1/2 pot selected -->
    <div>
      <p class="text-xs text-gray-500 mb-2">1/2 Pot selected (Pot=24, amount=12)</p>
      <div class="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 space-y-4">
        <!-- Quick Buttons -->
        <div class="flex gap-2">
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">1/3 Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-amber-500/20 border-amber-500/50 text-amber-400">1/2 Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">2/3 Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">All In</button>
        </div>
        <!-- Slider -->
        <div class="relative">
          <input type="range" min="6" max="98" value="12" class="w-full" style="background: linear-gradient(to right, #f59e0b 0%, #f59e0b 6.5%, #374151 6.5%, #374151 100%);" />
          <div class="flex justify-between mt-1">
            <span class="text-[10px] text-gray-500">6 BB</span>
            <span class="text-[10px] text-gray-500">98 BB</span>
          </div>
        </div>
        <!-- Input + Buttons -->
        <div class="flex items-center gap-3">
          <div class="flex items-center bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 flex-1">
            <span class="text-sm font-bold text-gray-50">12</span>
            <span class="text-xs text-gray-500 ml-1">BB</span>
          </div>
          <button class="px-4 py-2 rounded-lg border border-gray-700 text-gray-400 text-sm font-medium">取消</button>
          <button class="px-4 py-2 rounded-lg bg-amber-500 text-gray-950 text-sm font-bold">确认</button>
        </div>
      </div>
    </div>

    <!-- All-in state -->
    <div>
      <p class="text-xs text-gray-500 mb-2">All In selected (amount=98)</p>
      <div class="w-full bg-gray-800 border border-gray-700 rounded-xl p-4 space-y-4">
        <div class="flex gap-2">
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">1/3 Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">1/2 Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">2/3 Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-gray-900 border-gray-700 text-gray-400">Pot</button>
          <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-red-500/20 border-red-500/50 text-red-400">All In</button>
        </div>
        <div class="relative">
          <input type="range" min="6" max="98" value="98" class="w-full" style="background: linear-gradient(to right, #f59e0b 0%, #f59e0b 100%, #374151 100%, #374151 100%);" />
          <div class="flex justify-between mt-1">
            <span class="text-[10px] text-gray-500">6 BB</span>
            <span class="text-[10px] text-gray-500">98 BB</span>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 flex-1">
            <span class="text-sm font-bold text-red-400">98</span>
            <span class="text-xs text-gray-500 ml-1">BB</span>
          </div>
          <button class="px-4 py-2 rounded-lg border border-gray-700 text-gray-400 text-sm font-medium">取消</button>
          <button class="px-4 py-2 rounded-lg bg-amber-500 text-gray-950 text-sm font-bold">确认</button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
