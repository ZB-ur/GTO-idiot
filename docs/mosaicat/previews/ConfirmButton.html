<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xs flex flex-col gap-4">
    <!-- Active -->
    <button class="w-full px-6 py-3 rounded-xl font-bold text-base bg-emerald-500 text-gray-950 transition-all duration-150">
      Confirm 120
    </button>
    <!-- Disabled -->
    <button class="w-full px-6 py-3 rounded-xl font-bold text-base bg-gray-700 text-gray-500 cursor-not-allowed" disabled>
      Confirm 0
    </button>
  </div>
</body>
</html>
