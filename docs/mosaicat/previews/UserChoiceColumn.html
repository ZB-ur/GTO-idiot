<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UserChoiceColumn Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex gap-4 max-w-md">

    <!-- Example: Call -->
    <div class="flex-1 flex flex-col items-center gap-3 p-4 bg-gray-900 rounded-xl border border-gray-700">
      <div class="text-xs font-medium text-gray-400 uppercase tracking-wider">你的选择</div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-xl font-bold text-sky-400">跟注</span>
        <span class="text-sm text-gray-400 font-mono">3 BB</span>
      </div>
    </div>

    <!-- Example: Fold -->
    <div class="flex-1 flex flex-col items-center gap-3 p-4 bg-gray-900 rounded-xl border border-gray-700">
      <div class="text-xs font-medium text-gray-400 uppercase tracking-wider">你的选择</div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-xl font-bold text-gray-500">弃牌</span>
      </div>
    </div>

    <!-- Example: Raise -->
    <div class="flex-1 flex flex-col items-center gap-3 p-4 bg-gray-900 rounded-xl border border-gray-700">
      <div class="text-xs font-medium text-gray-400 uppercase tracking-wider">你的选择</div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-xl font-bold text-amber-500">加注</span>
        <span class="text-sm text-gray-400 font-mono">8 BB</span>
      </div>
    </div>

  </div>
</body>
</html>
