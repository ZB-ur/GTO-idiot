<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimelineDot Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-8">
    <!-- Label -->
    <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider">TimelineDot — Variants</p>

    <!-- Row: Inactive dots -->
    <div>
      <p class="text-xs text-gray-400 mb-3">Inactive (villain)</p>
      <div class="flex items-center gap-4">
        <div class="w-3.5 h-3.5 rounded-full bg-gray-300"></div>
        <div class="w-3.5 h-3.5 rounded-full bg-gray-300"></div>
        <div class="w-3.5 h-3.5 rounded-full bg-gray-300"></div>
        <div class="w-3.5 h-3.5 rounded-full bg-gray-300"></div>
      </div>
    </div>

    <!-- Row: Active dots per street -->
    <div>
      <p class="text-xs text-gray-400 mb-3">Active per street (villain)</p>
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-center gap-1">
          <div class="w-3.5 h-3.5 rounded-full bg-blue-600 scale-125 relative">
            <span class="absolute -inset-1 rounded-full bg-blue-600 opacity-25 animate-ping"></span>
          </div>
          <span class="text-[10px] text-gray-400 mt-2">Preflop</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <div class="w-3.5 h-3.5 rounded-full bg-emerald-600 scale-125 relative">
            <span class="absolute -inset-1 rounded-full bg-emerald-600 opacity-25 animate-ping"></span>
          </div>
          <span class="text-[10px] text-gray-400 mt-2">Flop</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <div class="w-3.5 h-3.5 rounded-full bg-amber-500 scale-125 relative">
            <span class="absolute -inset-1 rounded-full bg-amber-500 opacity-25 animate-ping"></span>
          </div>
          <span class="text-[10px] text-gray-400 mt-2">Turn</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <div class="w-3.5 h-3.5 rounded-full bg-red-500 scale-125 relative">
            <span class="absolute -inset-1 rounded-full bg-red-500 opacity-25 animate-ping"></span>
          </div>
          <span class="text-[10px] text-gray-400 mt-2">River</span>
        </div>
      </div>
    </div>

    <!-- Row: Hero dots -->
    <div>
      <p class="text-xs text-gray-400 mb-3">Hero variants (larger + ring)</p>
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-center gap-1">
          <div class="w-5 h-5 rounded-full bg-gray-300 relative">
            <span class="absolute inset-0 rounded-full border-2 border-gray-500"></span>
          </div>
          <span class="text-[10px] text-gray-400 mt-1">Inactive</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <div class="w-5 h-5 rounded-full bg-blue-600 scale-125 relative">
            <span class="absolute inset-0 rounded-full border-2 border-white"></span>
            <span class="absolute -inset-1 rounded-full bg-blue-600 opacity-25 animate-ping"></span>
          </div>
          <span class="text-[10px] text-gray-400 mt-2">Active</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <div class="w-5 h-5 rounded-full bg-emerald-600 scale-125 relative">
            <span class="absolute inset-0 rounded-full border-2 border-white"></span>
            <span class="absolute -inset-1 rounded-full bg-emerald-600 opacity-25 animate-ping"></span>
          </div>
          <span class="text-[10px] text-gray-400 mt-2">Flop</span>
        </div>
      </div>
    </div>

    <!-- Row: Full timeline example -->
    <div>
      <p class="text-xs text-gray-400 mb-3">Example timeline (7 decisions)</p>
      <div class="flex items-center gap-1 bg-white rounded-xl shadow-sm border border-gray-200 px-4 py-3">
        <!-- Preflop -->
        <div class="w-3.5 h-3.5 rounded-full bg-blue-600 scale-125 relative">
          <span class="absolute -inset-1 rounded-full bg-blue-600 opacity-25 animate-ping"></span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200"></div>
        <div class="w-5 h-5 rounded-full bg-blue-600 relative">
          <span class="absolute inset-0 rounded-full border-2 border-white"></span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200"></div>
        <!-- Flop -->
        <div class="w-3.5 h-3.5 rounded-full bg-gray-300"></div>
        <div class="flex-1 h-0.5 bg-gray-200"></div>
        <div class="w-5 h-5 rounded-full bg-gray-300 relative">
          <span class="absolute inset-0 rounded-full border-2 border-gray-500"></span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200"></div>
        <!-- Turn -->
        <div class="w-3.5 h-3.5 rounded-full bg-gray-300"></div>
        <div class="flex-1 h-0.5 bg-gray-200"></div>
        <div class="w-5 h-5 rounded-full bg-gray-300 relative">
          <span class="absolute inset-0 rounded-full border-2 border-gray-500"></span>
        </div>
        <div class="flex-1 h-0.5 bg-gray-200"></div>
        <!-- River -->
        <div class="w-3.5 h-3.5 rounded-full bg-gray-300"></div>
      </div>
    </div>
  </div>
</body>
</html>
