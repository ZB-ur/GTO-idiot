<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetChips Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="bg-emerald-800 rounded-xl p-8">
    <div class="flex items-end gap-10">
      <!-- Small bet -->
      <div class="inline-flex flex-col items-center gap-1">
        <div class="relative" style="height: 20px; width: 32px;">
          <div class="absolute left-0 w-8 h-5 rounded-full bg-red-500 border border-red-700 shadow-sm" style="bottom: 0; z-index: 0;"></div>
        </div>
        <span class="text-xs font-semibold text-gray-900 bg-white/80 px-1.5 py-0.5 rounded">10</span>
      </div>
      <!-- Medium bet -->
      <div class="inline-flex flex-col items-center gap-1">
        <div class="relative" style="height: 28px; width: 32px;">
          <div class="absolute left-0 w-8 h-5 rounded-full bg-green-500 border border-green-700 shadow-sm" style="bottom: 0; z-index: 0;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-green-500 border border-green-700 shadow-sm" style="bottom: 4px; z-index: 1;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-green-500 border border-green-700 shadow-sm" style="bottom: 8px; z-index: 2;"></div>
        </div>
        <span class="text-xs font-semibold text-gray-900 bg-white/80 px-1.5 py-0.5 rounded">250</span>
      </div>
      <!-- Large bet -->
      <div class="inline-flex flex-col items-center gap-1">
        <div class="relative" style="height: 32px; width: 32px;">
          <div class="absolute left-0 w-8 h-5 rounded-full bg-purple-500 border border-purple-700 shadow-sm" style="bottom: 0; z-index: 0;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-purple-500 border border-purple-700 shadow-sm" style="bottom: 4px; z-index: 1;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-purple-500 border border-purple-700 shadow-sm" style="bottom: 8px; z-index: 2;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-purple-500 border border-purple-700 shadow-sm" style="bottom: 12px; z-index: 3;"></div>
        </div>
        <span class="text-xs font-semibold text-gray-900 bg-white/80 px-1.5 py-0.5 rounded">500</span>
      </div>
      <!-- Huge bet -->
      <div class="inline-flex flex-col items-center gap-1">
        <div class="relative" style="height: 32px; width: 32px;">
          <div class="absolute left-0 w-8 h-5 rounded-full bg-yellow-400 border border-yellow-600 shadow-sm" style="bottom: 0; z-index: 0;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-yellow-400 border border-yellow-600 shadow-sm" style="bottom: 4px; z-index: 1;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-yellow-400 border border-yellow-600 shadow-sm" style="bottom: 8px; z-index: 2;"></div>
          <div class="absolute left-0 w-8 h-5 rounded-full bg-yellow-400 border border-yellow-600 shadow-sm" style="bottom: 12px; z-index: 3;"></div>
        </div>
        <span class="text-xs font-semibold text-gray-900 bg-white/80 px-1.5 py-0.5 rounded">1.5K</span>
      </div>
    </div>
  </div>
</body>
</html>
