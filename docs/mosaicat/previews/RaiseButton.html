<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaiseButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xs mx-auto space-y-4">
    <p class="text-sm text-gray-500 font-medium">Default (collapsed)</p>
    <button class="w-full py-3 px-6 rounded-lg font-semibold text-base transition-all bg-amber-500 text-white shadow-sm">
      <span class="flex items-center justify-center gap-1.5">
        加注
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </span>
    </button>

    <p class="text-sm text-gray-500 font-medium mt-6">Expanded</p>
    <button class="w-full py-3 px-6 rounded-lg font-semibold text-base transition-all bg-amber-600 text-white ring-2 ring-amber-300 shadow-md">
      <span class="flex items-center justify-center gap-1.5">
        加注
        <svg class="w-4 h-4 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </span>
    </button>

    <p class="text-sm text-gray-500 font-medium mt-6">Disabled</p>
    <button class="w-full py-3 px-6 rounded-lg font-semibold text-base bg-gray-200 text-gray-400 cursor-not-allowed" disabled>
      <span class="flex items-center justify-center gap-1.5">
        加注
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </span>
    </button>
  </div>
</body>
</html>
