<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TrendChart Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="max-width:640px;">
    <!-- With Data -->
    <div class="bg-[#1e293b] border border-gray-700 rounded-xl p-6 mb-6">
      <h3 class="text-lg font-semibold text-gray-100 mb-4">GTO Conformance Trend</h3>
      <svg viewBox="0 0 600 200" class="w-full" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
          </linearGradient>
        </defs>
        <!-- Grid lines -->
        <line x1="40" y1="20" x2="560" y2="20" stroke="#374151" stroke-width="0.5"/>
        <text x="34" y="23" text-anchor="end" fill="#6b7280" font-size="9">100%</text>
        <line x1="40" y1="60" x2="560" y2="60" stroke="#374151" stroke-width="0.5"/>
        <text x="34" y="63" text-anchor="end" fill="#6b7280" font-size="9">75%</text>
        <line x1="40" y1="100" x2="560" y2="100" stroke="#374151" stroke-width="0.5"/>
        <text x="34" y="103" text-anchor="end" fill="#6b7280" font-size="9">50%</text>
        <line x1="40" y1="140" x2="560" y2="140" stroke="#374151" stroke-width="0.5"/>
        <text x="34" y="143" text-anchor="end" fill="#6b7280" font-size="9">25%</text>
        <line x1="40" y1="180" x2="560" y2="180" stroke="#374151" stroke-width="0.5"/>
        <text x="34" y="183" text-anchor="end" fill="#6b7280" font-size="9">0%</text>
        <!-- Area -->
        <path d="M 40 148 L 144 132 L 248 116 L 352 100 L 456 84 L 560 72 L 560 180 L 40 180 Z" fill="url(#tg)"/>
        <!-- Line -->
        <path d="M 40 148 L 144 132 L 248 116 L 352 100 L 456 84 L 560 72" fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>
        <!-- Dots -->
        <circle cx="40" cy="148" r="3" fill="#10b981" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="144" cy="132" r="3" fill="#10b981" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="248" cy="116" r="3" fill="#10b981" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="352" cy="100" r="3" fill="#10b981" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="456" cy="84" r="3" fill="#10b981" stroke="#1e293b" stroke-width="1.5"/>
        <circle cx="560" cy="72" r="3" fill="#10b981" stroke="#1e293b" stroke-width="1.5"/>
        <!-- Labels -->
        <text x="40" y="194" text-anchor="middle" fill="#6b7280" font-size="8">1-10</text>
        <text x="144" y="194" text-anchor="middle" fill="#6b7280" font-size="8">11-20</text>
        <text x="248" y="194" text-anchor="middle" fill="#6b7280" font-size="8">21-30</text>
        <text x="352" y="194" text-anchor="middle" fill="#6b7280" font-size="8">31-40</text>
        <text x="456" y="194" text-anchor="middle" fill="#6b7280" font-size="8">41-50</text>
        <text x="560" y="194" text-anchor="middle" fill="#6b7280" font-size="8">51-60</text>
      </svg>
    </div>

    <!-- Not enough data -->
    <div class="bg-[#1e293b] border border-gray-700 rounded-xl p-6">
      <h3 class="text-lg font-semibold text-gray-100 mb-4">GTO Conformance Trend</h3>
      <div class="flex flex-col items-center justify-center py-12 text-center">
        <svg class="w-12 h-12 text-gray-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 13l4-4 4 4 4-8 4 4"/>
        </svg>
        <p class="text-gray-400 text-sm">
          Play at least <span class="text-emerald-400 font-semibold">10</span> hands to see your trend
        </p>
        <div class="w-full max-w-xs mt-4">
          <div class="flex justify-between text-xs text-gray-500 mb-1">
            <span>3 / 10 hands</span>
            <span>30%</span>
          </div>
          <div class="h-2 bg-gray-700 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500 rounded-full" style="width: 30%"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
