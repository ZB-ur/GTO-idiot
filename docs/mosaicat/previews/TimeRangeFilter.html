<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimeRangeFilter Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <!-- Selected: 100 -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">Selected: 最近 100 手</p>
      <div class="inline-flex items-center bg-gray-900 border border-gray-700 rounded-xl p-1 gap-0.5">
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">最近 100 手</button>
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-50 hover:bg-gray-800 border border-transparent">最近 500 手</button>
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-50 hover:bg-gray-800 border border-transparent">全部</button>
      </div>
    </div>

    <!-- Selected: 500 -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">Selected: 最近 500 手</p>
      <div class="inline-flex items-center bg-gray-900 border border-gray-700 rounded-xl p-1 gap-0.5">
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-50 hover:bg-gray-800 border border-transparent">最近 100 手</button>
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">最近 500 手</button>
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-50 hover:bg-gray-800 border border-transparent">全部</button>
      </div>
    </div>

    <!-- Selected: all -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">Selected: 全部</p>
      <div class="inline-flex items-center bg-gray-900 border border-gray-700 rounded-xl p-1 gap-0.5">
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-50 hover:bg-gray-800 border border-transparent">最近 100 手</button>
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-50 hover:bg-gray-800 border border-transparent">最近 500 手</button>
        <button class="px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">全部</button>
      </div>
    </div>

    <!-- In context: stats page header -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">In context — Stats Page Header</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-5">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-gray-50">统计总览</h2>
          <div class="inline-flex items-center bg-gray-800 border border-gray-700 rounded-xl p-1 gap-0.5">
            <button class="px-3 py-1.5 rounded-lg text-sm font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">最近 100 手</button>
            <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 border border-transparent">最近 500 手</button>
            <button class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 border border-transparent">全部</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
