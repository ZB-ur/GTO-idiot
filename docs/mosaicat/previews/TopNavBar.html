<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TopNavBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>

  <!-- State 1: Game page active, has active game -->
  <nav class="bg-white border-b border-gray-200 px-4 lg:px-6">
    <div class="max-w-4xl mx-auto flex items-center justify-between h-14">
      <!-- Logo -->
      <div class="flex items-center gap-2 shrink-0 cursor-pointer group">
        <span class="text-2xl">🃏</span>
        <span class="text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors">GTO Idiot</span>
      </div>
      <!-- Nav Items -->
      <div class="flex items-center gap-1">
        <!-- Game - Active -->
        <button class="relative flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-blue-600 bg-blue-50 transition-colors duration-150">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>开始牌局</span>
          <!-- Active game dot -->
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-green-500 rounded-full ring-2 ring-white"></span>
        </button>
        <!-- History - Inactive -->
        <button class="relative flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors duration-150">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>手牌历史</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="px-4 py-3 text-xs text-gray-400 max-w-4xl mx-auto">▲ activePage="game", hasActiveGame=true</div>

  <!-- State 2: History page active, no active game -->
  <nav class="bg-white border-b border-gray-200 px-4 lg:px-6 mt-6">
    <div class="max-w-4xl mx-auto flex items-center justify-between h-14">
      <!-- Logo -->
      <div class="flex items-center gap-2 shrink-0 cursor-pointer group">
        <span class="text-2xl">🃏</span>
        <span class="text-lg font-bold text-gray-900 group-hover:text-blue-600 transition-colors">GTO Idiot</span>
      </div>
      <!-- Nav Items -->
      <div class="flex items-center gap-1">
        <!-- Game - Inactive, no active game -->
        <button class="relative flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors duration-150">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>开始牌局</span>
        </button>
        <!-- History - Active -->
        <button class="relative flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-blue-600 bg-blue-50 transition-colors duration-150">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span>手牌历史</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="px-4 py-3 text-xs text-gray-400 max-w-4xl mx-auto">▲ activePage="history", hasActiveGame=false</div>

</body>
</html>
