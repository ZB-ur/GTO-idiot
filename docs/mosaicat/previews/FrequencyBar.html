<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrequencyBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-6">
    <p class="text-sm font-semibold text-gray-900">GTO Action Frequencies</p>

    <!-- Example 1: 3-way split -->
    <div class="w-full">
      <div class="flex h-8 rounded-lg overflow-hidden border border-gray-200">
        <div class="relative flex items-center justify-center text-xs font-semibold text-white bg-emerald-500" style="width:45%">
          <span class="truncate px-1">Fold 45%</span>
        </div>
        <div class="relative flex items-center justify-center text-xs font-semibold text-white bg-blue-600" style="width:35%">
          <span class="truncate px-1">Call 35%</span>
        </div>
        <div class="relative flex items-center justify-center text-xs font-semibold text-white bg-red-500" style="width:20%">
          <span class="truncate px-1">Raise 20%</span>
        </div>
      </div>
      <div class="flex flex-wrap gap-3 mt-2">
        <div class="flex items-center gap-1.5 text-xs text-gray-600">
          <span class="inline-block w-2.5 h-2.5 rounded-sm bg-emerald-500"></span>
          <span>Fold</span>
          <span class="font-medium text-gray-900">45.0%</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs text-gray-600">
          <span class="inline-block w-2.5 h-2.5 rounded-sm bg-blue-600"></span>
          <span>Call</span>
          <span class="font-medium text-gray-900">35.0%</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs text-gray-600">
          <span class="inline-block w-2.5 h-2.5 rounded-sm bg-red-500"></span>
          <span>Raise</span>
          <span class="font-medium text-gray-900">20.0%</span>
        </div>
      </div>
    </div>

    <!-- Example 2: Check/Bet -->
    <div class="w-full">
      <div class="flex h-8 rounded-lg overflow-hidden border border-gray-200">
        <div class="relative flex items-center justify-center text-xs font-semibold text-white bg-sky-500" style="width:62%">
          <span class="truncate px-1">Check 62%</span>
        </div>
        <div class="relative flex items-center justify-center text-xs font-semibold text-white bg-amber-500" style="width:38%">
          <span class="truncate px-1">Bet 38%</span>
        </div>
      </div>
      <div class="flex flex-wrap gap-3 mt-2">
        <div class="flex items-center gap-1.5 text-xs text-gray-600">
          <span class="inline-block w-2.5 h-2.5 rounded-sm bg-sky-500"></span>
          <span>Check</span>
          <span class="font-medium text-gray-900">62.0%</span>
        </div>
        <div class="flex items-center gap-1.5 text-xs text-gray-600">
          <span class="inline-block w-2.5 h-2.5 rounded-sm bg-amber-500"></span>
          <span>Bet</span>
          <span class="font-medium text-gray-900">38.0%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
