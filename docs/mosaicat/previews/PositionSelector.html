<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PositionSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xl mx-auto space-y-6">
    <!-- With BTN selected -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-600">位置选择</label>
      <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">UTG</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">HJ</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">CO</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white shadow-sm transition-all duration-150">BTN</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">SB</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">BB</button>
      </div>
    </div>

    <!-- With UTG selected -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-600">位置选择</label>
      <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
        <button class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white shadow-sm transition-all duration-150">UTG</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">HJ</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">CO</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">BTN</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">SB</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 hover:text-gray-900 hover:bg-slate-100 transition-all duration-150">BB</button>
      </div>
    </div>
  </div>
</body>
</html>
