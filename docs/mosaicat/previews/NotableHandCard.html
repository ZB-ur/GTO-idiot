<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-lg space-y-3">
    <!-- Notable Hand 1 - Blunder -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex items-center gap-4 cursor-pointer hover:bg-gray-800 transition-colors">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-xs text-gray-500 font-medium">Hand</span>
        <span class="text-lg font-bold text-amber-500">#12</span>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <div class="bg-gray-800 border border-gray-600 rounded-lg w-10 h-14 flex flex-col items-center justify-center">
          <span class="text-sm font-bold text-gray-50">A</span>
          <span class="text-xs text-gray-50">♠</span>
        </div>
        <div class="bg-gray-800 border border-gray-600 rounded-lg w-10 h-14 flex flex-col items-center justify-center">
          <span class="text-sm font-bold text-red-400">K</span>
          <span class="text-xs text-red-400">♥</span>
        </div>
      </div>
      <div class="flex-1"></div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <span class="text-lg font-bold text-red-400">-24</span>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-red-500/20 text-red-400">Blunder</span>
      </div>
    </div>

    <!-- Notable Hand 2 - Mistake -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex items-center gap-4 cursor-pointer hover:bg-gray-800 transition-colors">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-xs text-gray-500 font-medium">Hand</span>
        <span class="text-lg font-bold text-amber-500">#31</span>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <div class="bg-gray-800 border border-gray-600 rounded-lg w-10 h-14 flex flex-col items-center justify-center">
          <span class="text-sm font-bold text-sky-400">Q</span>
          <span class="text-xs text-sky-400">♦</span>
        </div>
        <div class="bg-gray-800 border border-gray-600 rounded-lg w-10 h-14 flex flex-col items-center justify-center">
          <span class="text-sm font-bold text-sky-400">J</span>
          <span class="text-xs text-sky-400">♦</span>
        </div>
      </div>
      <div class="flex-1"></div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <span class="text-lg font-bold text-emerald-400">+18</span>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-amber-500/20 text-amber-400">Mistake</span>
      </div>
    </div>

    <!-- Notable Hand 3 - Minor -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex items-center gap-4 cursor-pointer hover:bg-gray-800 transition-colors">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-xs text-gray-500 font-medium">Hand</span>
        <span class="text-lg font-bold text-amber-500">#44</span>
      </div>
      <div class="flex gap-1.5 shrink-0">
        <div class="bg-gray-800 border border-gray-600 rounded-lg w-10 h-14 flex flex-col items-center justify-center">
          <span class="text-sm font-bold text-emerald-400">9</span>
          <span class="text-xs text-emerald-400">♣</span>
        </div>
        <div class="bg-gray-800 border border-gray-600 rounded-lg w-10 h-14 flex flex-col items-center justify-center">
          <span class="text-sm font-bold text-emerald-400">9</span>
          <span class="text-xs text-emerald-400">♣</span>
        </div>
      </div>
      <div class="flex-1"></div>
      <div class="flex flex-col items-end gap-1.5 shrink-0">
        <span class="text-lg font-bold text-red-400">-6</span>
        <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold bg-sky-500/20 text-sky-400">Minor</span>
      </div>
    </div>
  </div>
</body>
</html>
