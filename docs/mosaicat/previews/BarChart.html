<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="max-w-sm mx-auto">
  <p class="text-sm text-gray-500 mb-4">Per-Street GTO Compliance</p>
  <div class="bg-white border border-gray-200 rounded-xl p-6">
    <div class="flex items-end justify-around gap-3" style="height: 200px;">
      <!-- Preflop 82% -->
      <div class="flex flex-col items-center gap-1 flex-1">
        <span class="text-xs font-bold text-gray-700">82%</span>
        <div class="w-full max-w-[48px] relative" style="height: 100%;">
          <div class="absolute bottom-0 w-full rounded-t-md bg-blue-500" style="height: 82%;"></div>
        </div>
        <span class="text-xs text-gray-500 font-medium mt-1">Preflop</span>
      </div>
      <!-- Flop 71% -->
      <div class="flex flex-col items-center gap-1 flex-1">
        <span class="text-xs font-bold text-gray-700">71%</span>
        <div class="w-full max-w-[48px] relative" style="height: 100%;">
          <div class="absolute bottom-0 w-full rounded-t-md bg-emerald-500" style="height: 71%;"></div>
        </div>
        <span class="text-xs text-gray-500 font-medium mt-1">Flop</span>
      </div>
      <!-- Turn 65% -->
      <div class="flex flex-col items-center gap-1 flex-1">
        <span class="text-xs font-bold text-gray-700">65%</span>
        <div class="w-full max-w-[48px] relative" style="height: 100%;">
          <div class="absolute bottom-0 w-full rounded-t-md bg-amber-500" style="height: 65%;"></div>
        </div>
        <span class="text-xs text-gray-500 font-medium mt-1">Turn</span>
      </div>
      <!-- River 58% -->
      <div class="flex flex-col items-center gap-1 flex-1">
        <span class="text-xs font-bold text-gray-700">58%</span>
        <div class="w-full max-w-[48px] relative" style="height: 100%;">
          <div class="absolute bottom-0 w-full rounded-t-md bg-red-500" style="height: 58%;"></div>
        </div>
        <span class="text-xs text-gray-500 font-medium mt-1">River</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
