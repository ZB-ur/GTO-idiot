<!DOCTYPE html>
<html lang="en">
<head>

  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>

  <div class="flex flex-col gap-4 max-w-lg">
    <h2 class="text-lg font-semibold text-gray-900">ExplanationText</h2>

    <div class="flex flex-col gap-3 bg-white rounded-xl border border-gray-200 p-4">
      <p class="text-sm text-gray-600 leading-relaxed pl-1">
        <span class="text-gray-400 mr-1">💡</span>
        干燥牌面 IP 位置倾向于 c-bet，利用位置优势持续施压

        <span class="text-gray-400 mr-1">💡</span>

      </p>

      <p class="text-sm text-gray-600 leading-relaxed pl-1">
        <span class="text-gray-400 mr-1">💡</span>

      </p>
