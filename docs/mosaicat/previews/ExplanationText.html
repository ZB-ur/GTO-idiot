<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExplanationText Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="max-width: 400px;">
    <div class="bg-gray-800 border border-gray-700 rounded-xl p-4">
      <!-- Header -->
      <div class="flex items-center gap-2 mb-3">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" class="text-emerald-400 flex-shrink-0">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 7v4M8 5h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span class="text-sm font-semibold text-gray-100">GTO 策略解释</span>
      </div>

      <!-- Text content -->
      <div class="space-y-2">
        <p class="text-sm text-gray-300 leading-relaxed">
          在CO位置，A5s是一手边缘手牌。GTO建议以60%的频率加注，40%弃牌。加注是为了保持你的范围平衡——如果你只加注强牌，对手可以轻松应对。
        </p>
        <p class="text-sm text-gray-300 leading-relaxed">
          A5s的价值在于：它有坚果同花潜力（A高同花），也有一定的顺子潜力。作为半诈唬手牌，它比完全的垃圾牌更好，因为即使被跟注也有胜率。
        </p>
        <p class="text-sm text-gray-300 leading-relaxed">
          如果你总是加注A5s，你CO位置的加注范围会过宽，对手在大盲位可以更频繁地3-bet来利用你。
        </p>
      </div>
    </div>
  </div>
</body>
</html>
