<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex gap-3 items-center flex-wrap">
    <!-- Fold -->
    <div class="inline-flex items-center justify-center px-3 py-1 bg-gray-900/90 border border-gray-700 rounded-lg text-sm font-semibold text-gray-50 whitespace-nowrap select-none">
      Fold
    </div>
    <!-- Call with amount -->
    <div class="inline-flex items-center justify-center px-3 py-1 bg-gray-900/90 border border-gray-700 rounded-lg text-sm font-semibold text-gray-50 whitespace-nowrap select-none">
      Call 120
    </div>
    <!-- Raise -->
    <div class="inline-flex items-center justify-center px-3 py-1 bg-gray-900/90 border border-gray-700 rounded-lg text-sm font-semibold text-gray-50 whitespace-nowrap select-none">
      Raise 350
    </div>
    <!-- Check -->
    <div class="inline-flex items-center justify-center px-3 py-1 bg-gray-900/90 border border-gray-700 rounded-lg text-sm font-semibold text-gray-50 whitespace-nowrap select-none">
      Check
    </div>
    <!-- All In -->
    <div class="inline-flex items-center justify-center px-3 py-1 bg-gray-900/90 border border-gray-700 rounded-lg text-sm font-semibold text-red-500 whitespace-nowrap select-none">
      All In
    </div>
  </div>
</body>
</html>
