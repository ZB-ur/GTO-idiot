<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionLabel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-wrap gap-3 items-start">
    <!-- Fold -->
    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-gray-700/50 bg-gray-800/80">
      <span class="text-xs font-bold uppercase tracking-wide text-gray-400">Fold</span>
    </div>
    <!-- Check -->
    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-gray-700/50 bg-sky-400/15">
      <span class="text-xs font-bold uppercase tracking-wide text-sky-400">Check</span>
    </div>
    <!-- Call -->
    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-gray-700/50 bg-emerald-400/15">
      <span class="text-xs font-bold uppercase tracking-wide text-emerald-400">Call</span>
      <span class="text-xs font-semibold text-emerald-400">$150</span>
    </div>
    <!-- Bet -->
    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-gray-700/50 bg-amber-400/15">
      <span class="text-xs font-bold uppercase tracking-wide text-amber-400">Bet</span>
      <span class="text-xs font-semibold text-amber-400">$300</span>
    </div>
    <!-- Raise -->
    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-gray-700/50 bg-orange-400/15">
      <span class="text-xs font-bold uppercase tracking-wide text-orange-400">Raise</span>
      <span class="text-xs font-semibold text-orange-400">$1.2k</span>
    </div>
    <!-- All-In -->
    <div class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border border-gray-700/50 bg-red-400/15">
      <span class="text-xs font-bold uppercase tracking-wide text-red-400">All-In</span>
      <span class="text-xs font-semibold text-red-400">$5k</span>
    </div>
  </div>
</body>
</html>
