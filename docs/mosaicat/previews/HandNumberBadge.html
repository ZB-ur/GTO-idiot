<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandNumberBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #064e3b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex items-center gap-4">
    <!-- Hand 1 -->
    <div class="inline-flex items-center gap-1.5 rounded-lg bg-emerald-900/70 border border-emerald-700/40 px-2.5 py-1 backdrop-blur-sm">
      <span class="text-[10px] font-medium text-emerald-400/60 uppercase tracking-wider">Hand</span>
      <span class="text-xs font-bold text-emerald-200" style="font-variant-numeric: tabular-nums;">#1</span>
    </div>

    <!-- Hand 42 -->
    <div class="inline-flex items-center gap-1.5 rounded-lg bg-emerald-900/70 border border-emerald-700/40 px-2.5 py-1 backdrop-blur-sm">
      <span class="text-[10px] font-medium text-emerald-400/60 uppercase tracking-wider">Hand</span>
      <span class="text-xs font-bold text-emerald-200" style="font-variant-numeric: tabular-nums;">#42</span>
    </div>

    <!-- Hand 100 -->
    <div class="inline-flex items-center gap-1.5 rounded-lg bg-emerald-900/70 border border-emerald-700/40 px-2.5 py-1 backdrop-blur-sm">
      <span class="text-[10px] font-medium text-emerald-400/60 uppercase tracking-wider">Hand</span>
      <span class="text-xs font-bold text-emerald-200" style="font-variant-numeric: tabular-nums;">#100</span>
    </div>
  </div>
</body>
</html>
