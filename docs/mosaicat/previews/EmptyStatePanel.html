<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmptyStatePanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col items-center justify-center py-16 px-6">
    <div class="mb-6 p-6 bg-gray-800 rounded-full">
      <svg class="w-16 h-16 text-gray-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="4" width="12" height="16" rx="2" />
        <rect x="9" y="2" width="12" height="16" rx="2" />
      </svg>
    </div>
    <h3 class="text-xl font-semibold text-gray-50 mb-2 text-center">No Sessions Yet</h3>
    <p class="text-gray-400 text-sm text-center max-w-sm mb-8">Start your first poker session to begin tracking your progress and improving your game.</p>
    <button class="px-6 py-3 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-semibold rounded-xl transition-colors">
      Start First Session
    </button>
  </div>
</body>
</html>
