<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.pulse { animation: pulse 2s ease-in-out infinite; }
</style>
</head>
<body>
<div class="flex flex-col gap-4 max-w-sm">
  <!-- Text line skeletons -->
  <div class="bg-gray-800 rounded-lg pulse" style="width:80%;height:1rem"></div>
  <div class="bg-gray-800 rounded-lg pulse" style="width:60%;height:1rem"></div>
  <div class="bg-gray-800 rounded-lg pulse" style="width:100%;height:1rem"></div>

  <!-- Block skeleton -->
  <div class="bg-gray-800 rounded-lg pulse" style="width:100%;height:4rem"></div>

  <!-- Rounded avatar skeleton -->
  <div class="bg-gray-800 rounded-full pulse" style="width:3rem;height:3rem"></div>
</div>
</body>
</html>
