<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ErrorScreen Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col items-center justify-center min-h-[400px] px-6 py-12 text-center">
    <!-- Error icon -->
    <div class="flex items-center justify-center w-16 h-16 rounded-full bg-red-100 mb-6">
      <svg class="w-8 h-8 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 mb-2">Something Went Wrong</h1>
    <p class="text-sm text-gray-500 max-w-md mb-8">We couldn't load the equity analysis. Please check your connection and try again.</p>
    <button class="px-6 py-2.5 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
      Try Again
    </button>
  </div>
</body>
</html>
