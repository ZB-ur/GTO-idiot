<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BankrollGraph Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div style="max-width: 560px;">
    <div class="rounded-xl bg-gray-900 border border-gray-700 p-4">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-semibold text-gray-50">Bankroll</span>
        <span class="text-lg font-bold text-emerald-400">+340</span>
      </div>
      <div style="height: 240px;">
        <svg width="100%" height="100%" viewBox="0 0 520 240" preserveAspectRatio="none">
          <defs>
            <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <!-- Grid lines -->
          <line x1="56" y1="24" x2="496" y2="24" stroke="#374151" stroke-dasharray="4,4"/>
          <text x="48" y="28" text-anchor="end" fill="#6b7280" font-size="10">400</text>
          <line x1="56" y1="68" x2="496" y2="68" stroke="#374151" stroke-dasharray="4,4"/>
          <text x="48" y="72" text-anchor="end" fill="#6b7280" font-size="10">300</text>
          <line x1="56" y1="112" x2="496" y2="112" stroke="#374151" stroke-dasharray="4,4"/>
          <text x="48" y="116" text-anchor="end" fill="#6b7280" font-size="10">200</text>
          <line x1="56" y1="156" x2="496" y2="156" stroke="#374151" stroke-dasharray="4,4"/>
          <text x="48" y="160" text-anchor="end" fill="#6b7280" font-size="10">100</text>

          <!-- Zero line -->
          <line x1="56" y1="195" x2="496" y2="195" stroke="#4b5563" stroke-width="1"/>
          <text x="48" y="199" text-anchor="end" fill="#6b7280" font-size="10">0</text>

          <line x1="56" y1="220" x2="496" y2="220" stroke="#374151" stroke-dasharray="4,4"/>
          <text x="48" y="224" text-anchor="end" fill="#6b7280" font-size="10">-100</text>

          <!-- X-axis labels -->
          <text x="56" y="238" text-anchor="middle" fill="#6b7280" font-size="10">#0</text>
          <text x="146" y="238" text-anchor="middle" fill="#6b7280" font-size="10">#30</text>
          <text x="236" y="238" text-anchor="middle" fill="#6b7280" font-size="10">#60</text>
          <text x="326" y="238" text-anchor="middle" fill="#6b7280" font-size="10">#90</text>
          <text x="416" y="238" text-anchor="middle" fill="#6b7280" font-size="10">#120</text>
          <text x="496" y="238" text-anchor="middle" fill="#6b7280" font-size="10">#150</text>

          <!-- Area fill -->
          <path d="M56,195 L76,190 L96,182 L116,176 L136,185 L156,178 L176,165 L196,158 L216,170 L236,175 L256,168 L276,155 L296,140 L316,148 L336,135 L356,120 L376,130 L396,115 L416,105 L436,95 L456,100 L476,85 L496,75 L496,195 L56,195 Z" fill="url(#areaGrad)"/>

          <!-- Line -->
          <path d="M56,195 L76,190 L96,182 L116,176 L136,185 L156,178 L176,165 L196,158 L216,170 L236,175 L256,168 L276,155 L296,140 L316,148 L336,135 L356,120 L376,130 L396,115 L416,105 L436,95 L456,100 L476,85 L496,75" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>

          <!-- Hover tooltip example (static for preview) -->
          <line x1="396" y1="24" x2="396" y2="200" stroke="#6b7280" stroke-dasharray="2,2"/>
          <circle cx="396" cy="115" r="5" fill="#34d399" stroke="#030712" stroke-width="2"/>
        </svg>
      </div>

      <!-- Static tooltip -->
      <div class="absolute bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 shadow-xl" style="position: relative; display: inline-block; margin-top: -60px; margin-left: 340px;">
        <div class="text-[10px] text-gray-500">Hand #120</div>
        <div class="text-sm font-bold text-emerald-400">+280</div>
      </div>
    </div>
  </div>
</body>
</html>
