<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandRankLabel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <!-- Dark background to simulate table context -->
  <div class="inline-flex flex-col gap-3 rounded-xl bg-emerald-900 p-6">
    <!-- Winner label -->
    <span class="inline-block rounded-lg px-2 py-0.5 text-xs font-semibold bg-amber-400/20 text-amber-300">
      👑 Two Pair, Aces and Kings
    </span>

    <!-- Non-winner label -->
    <span class="inline-block rounded-lg px-2 py-0.5 text-xs font-semibold bg-gray-800/60 text-gray-300">
      Pair of Jacks
    </span>

    <!-- Another winner -->
    <span class="inline-block rounded-lg px-2 py-0.5 text-xs font-semibold bg-amber-400/20 text-amber-300">
      👑 Straight Flush
    </span>

    <!-- Another non-winner -->
    <span class="inline-block rounded-lg px-2 py-0.5 text-xs font-semibold bg-gray-800/60 text-gray-300">
      High Card, Ace
    </span>
  </div>
</body>
</html>
