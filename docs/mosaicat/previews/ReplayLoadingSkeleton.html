<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReplayLoadingSkeleton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <div class="max-w-5xl mx-auto animate-pulse space-y-6 p-6">
    <!-- Header skeleton -->
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 bg-gray-800 rounded-lg"></div>
        <div class="h-6 w-40 bg-gray-800 rounded-lg"></div>
      </div>
      <div class="h-8 w-24 bg-gray-800 rounded-lg"></div>
    </div>

    <!-- Timeline skeleton -->
    <div class="bg-gray-900 rounded-xl border border-gray-800 p-4">
      <div class="flex items-center justify-center gap-4 py-3">
        <div class="flex flex-col items-center gap-1.5">
          <div class="w-10 h-10 bg-gray-800 rounded-full"></div>
          <div class="h-3 w-8 bg-gray-800 rounded"></div>
        </div>
        <div class="flex-1 h-0.5 bg-gray-800 rounded-full max-w-16"></div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="w-10 h-10 bg-gray-800 rounded-full"></div>
          <div class="h-3 w-8 bg-gray-800 rounded"></div>
        </div>
        <div class="flex-1 h-0.5 bg-gray-800 rounded-full max-w-16"></div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="w-10 h-10 bg-gray-800 rounded-full"></div>
          <div class="h-3 w-8 bg-gray-800 rounded"></div>
        </div>
        <div class="flex-1 h-0.5 bg-gray-800 rounded-full max-w-16"></div>
        <div class="flex flex-col items-center gap-1.5">
          <div class="w-10 h-10 bg-gray-800 rounded-full"></div>
          <div class="h-3 w-8 bg-gray-800 rounded"></div>
        </div>
      </div>
    </div>

    <!-- Main content area -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Table view skeleton -->
      <div class="lg:col-span-2 bg-gray-900 rounded-xl border border-gray-800 aspect-[16/10] flex items-center justify-center">
        <div class="w-64 h-40 bg-emerald-900/30 rounded-full border-2 border-emerald-800/30 flex items-center justify-center">
          <div class="h-4 w-20 bg-gray-800 rounded"></div>
        </div>
      </div>

      <!-- Side panels skeleton -->
      <div class="space-y-4">
        <!-- Action sequence skeleton -->
        <div class="bg-gray-900 rounded-xl border border-gray-800 overflow-hidden">
          <div class="px-4 py-3 border-b border-gray-800">
            <div class="h-4 w-20 bg-gray-800 rounded"></div>
          </div>
          <div>
            <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-800/30">
              <div class="h-3 w-4 bg-gray-800 rounded"></div>
              <div class="h-3 w-14 bg-gray-800 rounded"></div>
              <div class="h-5 w-16 bg-gray-800 rounded-lg"></div>
              <div class="ml-auto h-3 w-12 bg-gray-800 rounded"></div>
            </div>
            <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-800/30">
              <div class="h-3 w-4 bg-gray-800 rounded"></div>
              <div class="h-3 w-14 bg-gray-800 rounded"></div>
              <div class="h-5 w-16 bg-gray-800 rounded-lg"></div>
              <div class="ml-auto h-3 w-12 bg-gray-800 rounded"></div>
            </div>
            <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-800/30">
              <div class="h-3 w-4 bg-gray-800 rounded"></div>
              <div class="h-3 w-14 bg-gray-800 rounded"></div>
              <div class="h-5 w-16 bg-gray-800 rounded-lg"></div>
              <div class="ml-auto h-3 w-12 bg-gray-800 rounded"></div>
            </div>
            <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-800/30">
              <div class="h-3 w-4 bg-gray-800 rounded"></div>
              <div class="h-3 w-14 bg-gray-800 rounded"></div>
              <div class="h-5 w-16 bg-gray-800 rounded-lg"></div>
              <div class="ml-auto h-3 w-12 bg-gray-800 rounded"></div>
            </div>
            <div class="flex items-center gap-3 px-4 py-3">
              <div class="h-3 w-4 bg-gray-800 rounded"></div>
              <div class="h-3 w-14 bg-gray-800 rounded"></div>
              <div class="h-5 w-16 bg-gray-800 rounded-lg"></div>
              <div class="ml-auto h-3 w-12 bg-gray-800 rounded"></div>
            </div>
          </div>
        </div>

        <!-- Decision panel skeleton -->
        <div class="bg-gray-900 rounded-xl border border-gray-800 p-4 space-y-4">
          <div class="h-4 w-28 bg-gray-800 rounded"></div>
          <div class="grid grid-cols-2 gap-3">
            <div class="space-y-2 p-3 bg-gray-800/50 rounded-lg">
              <div class="h-3 w-16 bg-gray-800 rounded"></div>
              <div class="h-6 w-20 bg-gray-800 rounded"></div>
            </div>
            <div class="space-y-2 p-3 bg-gray-800/50 rounded-lg">
              <div class="h-3 w-16 bg-gray-800 rounded"></div>
              <div class="h-6 w-20 bg-gray-800 rounded"></div>
            </div>
          </div>
          <div class="space-y-2">
            <div class="h-3 w-full bg-gray-800 rounded"></div>
            <div class="h-3 w-3/4 bg-gray-800 rounded"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
