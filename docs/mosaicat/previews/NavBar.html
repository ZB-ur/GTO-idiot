<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <nav class="bg-gray-900 border-b border-gray-800 px-4 h-14 flex items-center justify-between">
    <!-- Logo -->
    <div class="flex items-center gap-2 text-gray-50">
      <div class="w-8 h-8 rounded-lg bg-amber-500 flex items-center justify-center">
        <span class="text-gray-950 font-bold text-sm">♠</span>
      </div>
      <span class="text-lg font-bold tracking-tight">Poker<span class="text-amber-500">Coach</span></span>
    </div>

    <!-- Nav links -->
    <div class="flex items-center gap-1">
      <!-- New Session — active -->
      <button class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium bg-amber-500/15 text-amber-400">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" class="text-amber-400">
          <path d="M6 4l8 5-8 5V4z" />
        </svg>
        <span>New Session</span>
      </button>

      <!-- Hand History -->
      <button class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-gray-400 hover:text-gray-50 hover:bg-gray-800">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" class="text-gray-500">
          <circle cx="9" cy="9" r="6.5" />
          <path d="M9 5.5V9l2.5 2.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Hand History</span>
      </button>

      <!-- Divider -->
      <div class="w-px h-6 bg-gray-800 mx-1"></div>

      <!-- Settings -->
      <button class="flex items-center justify-center w-9 h-9 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="9" cy="9" r="2.5" />
          <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.1 3.1l1.4 1.4M13.5 13.5l1.4 1.4M3.1 14.9l1.4-1.4M13.5 4.5l1.4-1.4" stroke-linecap="round" />
        </svg>
      </button>
    </div>
  </nav>
</body>
</html>
