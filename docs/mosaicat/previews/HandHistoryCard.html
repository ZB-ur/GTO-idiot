<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandHistoryCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-3">

    <!-- Card 1: Win -->
    <div class="group relative flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 hover:shadow-sm transition-all duration-150">
      <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold bg-green-50 text-green-600">
        胜
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-900 truncate">A♠K♥ — 两对</span>
          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-blue-100 text-blue-700">BTN</span>
        </div>
        <div class="mt-0.5 text-xs text-gray-400">03-26 14:32</div>
      </div>
      <div class="flex-shrink-0 text-right font-mono text-sm font-semibold text-green-500">+450</div>
      <svg class="flex-shrink-0 w-4 h-4 text-gray-300 group-hover:text-gray-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </div>

    <!-- Card 2: Lose -->
    <div class="group relative flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 hover:shadow-sm transition-all duration-150">
      <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold bg-red-50 text-red-600">
        负
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-900 truncate">Q♦J♦ — 高牌</span>
          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-cyan-100 text-cyan-700">SB</span>
        </div>
        <div class="mt-0.5 text-xs text-gray-400">03-26 14:28</div>
      </div>
      <div class="flex-shrink-0 text-right font-mono text-sm font-semibold text-red-500">-1,200</div>
      <svg class="flex-shrink-0 w-4 h-4 text-gray-300 group-hover:text-gray-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </div>

    <!-- Card 3: Tie -->
    <div class="group relative flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 hover:shadow-sm transition-all duration-150">
      <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold bg-amber-50 text-amber-600">
        平
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-900 truncate">8♣8♠ — 三条</span>
          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-indigo-100 text-indigo-700">CO</span>
        </div>
        <div class="mt-0.5 text-xs text-gray-400">03-26 14:15</div>
      </div>
      <div class="flex-shrink-0 text-right font-mono text-sm font-semibold text-gray-600">0</div>
      <svg class="flex-shrink-0 w-4 h-4 text-gray-300 group-hover:text-gray-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </div>

    <!-- Divider label -->
    <div class="pt-4 pb-1">
      <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">Selection Mode</span>
    </div>

    <!-- Card 4: Selection mode — selected -->
    <div class="group relative flex items-center gap-3 rounded-xl border border-blue-600 bg-blue-50/40 ring-1 ring-blue-600/20 p-4 cursor-pointer transition-all duration-150">
      <div class="flex-shrink-0 flex items-center justify-center">
        <div class="w-5 h-5 rounded-md border-2 bg-blue-600 border-blue-600 flex items-center justify-center">
          <svg class="w-3 h-3 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
      </div>
      <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold bg-green-50 text-green-600">
        胜
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-900 truncate">T♥T♣ — 对子</span>
          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-purple-100 text-purple-700">UTG</span>
        </div>
        <div class="mt-0.5 text-xs text-gray-400">03-26 14:05</div>
      </div>
      <div class="flex-shrink-0 text-right font-mono text-sm font-semibold text-green-500">+800</div>
    </div>

    <!-- Card 5: Selection mode — not selected -->
    <div class="group relative flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 hover:shadow-sm transition-all duration-150">
      <div class="flex-shrink-0 flex items-center justify-center">
        <div class="w-5 h-5 rounded-md border-2 border-gray-300 flex items-center justify-center">
        </div>
      </div>
      <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold bg-red-50 text-red-600">
        负
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-900 truncate">5♦6♦ — 高牌</span>
          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-teal-100 text-teal-700">BB</span>
        </div>
        <div class="mt-0.5 text-xs text-gray-400">03-26 13:58</div>
      </div>
      <div class="flex-shrink-0 text-right font-mono text-sm font-semibold text-red-500">-300</div>
    </div>

    <!-- Card 6: Large profit number -->
    <div class="group relative flex items-center gap-3 rounded-xl border border-gray-200 bg-white p-4 cursor-pointer hover:border-gray-300 hover:shadow-sm transition-all duration-150">
      <div class="flex-shrink-0 w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold bg-green-50 text-green-600">
        胜
      </div>
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold text-gray-900 truncate">A♠A♣ — 葫芦</span>
          <span class="inline-flex items-center px-1.5 py-0.5 rounded text-xs font-medium bg-violet-100 text-violet-700">MP</span>
        </div>
        <div class="mt-0.5 text-xs text-gray-400">03-26 13:42</div>
      </div>
      <div class="flex-shrink-0 text-right font-mono text-sm font-semibold text-green-500">+12,500</div>
      <svg class="flex-shrink-0 w-4 h-4 text-gray-300 group-hover:text-gray-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </div>

  </div>
</body>
</html>
