<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandHistoryCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-xl mx-auto space-y-3">
    <!-- Card 1: Won, GTO green -->
    <div class="flex items-center justify-between p-4 bg-[#1e293b] border border-gray-700 rounded-xl cursor-pointer">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <span class="text-sm font-bold text-gray-100">#12</span>
          <span class="text-[10px] text-gray-500">Mar 25, 10:05</span>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30">BTN</span>
        <div class="flex gap-1">
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-gray-900">A</span>
            <span class="text-sm leading-none text-gray-900">&#9824;</span>
          </div>
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-gray-900">K</span>
            <span class="text-sm leading-none text-gray-900">&#9824;</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">GTO</span>
          <span class="text-[10px] text-gray-500 mt-0.5">92%</span>
        </div>
        <span class="text-sm font-bold tabular-nums text-emerald-400">+12.5 BB</span>
        <svg class="w-4 h-4 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>

    <!-- Card 2: Lost, GTO yellow -->
    <div class="flex items-center justify-between p-4 bg-[#1e293b] border border-gray-700 rounded-xl cursor-pointer">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <span class="text-sm font-bold text-gray-100">#11</span>
          <span class="text-[10px] text-gray-500">Mar 25, 10:02</span>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30">UTG</span>
        <div class="flex gap-1">
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-red-500">T</span>
            <span class="text-sm leading-none text-red-500">&#9829;</span>
          </div>
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-gray-900">9</span>
            <span class="text-sm leading-none text-gray-900">&#9827;</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-400/20 text-amber-400 border border-amber-400/30">OK</span>
          <span class="text-[10px] text-gray-500 mt-0.5">67%</span>
        </div>
        <span class="text-sm font-bold tabular-nums text-red-400">-3.0 BB</span>
        <svg class="w-4 h-4 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>

    <!-- Card 3: Lost big, GTO red -->
    <div class="flex items-center justify-between p-4 bg-[#1e293b] border border-gray-700 rounded-xl cursor-pointer">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <span class="text-sm font-bold text-gray-100">#10</span>
          <span class="text-[10px] text-gray-500">Mar 25, 09:58</span>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30">BB</span>
        <div class="flex gap-1">
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-red-500">7</span>
            <span class="text-sm leading-none text-red-500">&#9830;</span>
          </div>
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-gray-900">2</span>
            <span class="text-sm leading-none text-gray-900">&#9827;</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-red-500/20 text-red-400 border border-red-500/30">Leak</span>
          <span class="text-[10px] text-gray-500 mt-0.5">33%</span>
        </div>
        <span class="text-sm font-bold tabular-nums text-red-400">-25.0 BB</span>
        <svg class="w-4 h-4 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>

    <!-- Card 4: Incomplete -->
    <div class="flex items-center justify-between p-4 bg-[#1e293b] border border-gray-700 rounded-xl cursor-pointer opacity-60">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <span class="text-sm font-bold text-gray-100">#9</span>
          <span class="text-[10px] text-gray-500">Mar 25, 09:55</span>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-500/20 text-blue-400 border border-blue-500/30">CO</span>
        <div class="flex gap-1">
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-gray-900">Q</span>
            <span class="text-sm leading-none text-gray-900">&#9824;</span>
          </div>
          <div class="w-9 h-12 bg-white rounded-md border border-gray-300 flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-red-500">J</span>
            <span class="text-sm leading-none text-red-500">&#9829;</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex flex-col items-center">
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-gray-600/20 text-gray-400 border border-gray-600/30">N/A</span>
          <span class="text-[10px] text-gray-500 mt-0.5">0%</span>
        </div>
        <span class="text-sm font-bold tabular-nums text-red-400">-1.0 BB</span>
        <svg class="w-4 h-4 text-gray-600" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
