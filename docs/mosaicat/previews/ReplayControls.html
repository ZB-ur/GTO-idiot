<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReplayControls Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-2xl mx-auto space-y-8">

    <!-- State 1: Mid-replay with deviation available -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Mid-replay · Step 7 of 14 · Deviation available</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-3">
        <!-- Progress bar -->
        <div class="relative w-full h-2 bg-gray-800 rounded-full cursor-pointer group">
          <div class="absolute top-0 left-0 h-full bg-emerald-500 rounded-full" style="width: 46%;"></div>
          <div class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-emerald-400 border-2 border-gray-900 rounded-full shadow-md" style="left: calc(46% - 8px);"></div>
        </div>
        <!-- Controls row -->
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-400 font-mono min-w-[80px]">7 / 14</span>
          <div class="flex items-center gap-2">
            <!-- Jump to start -->
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="3" x2="2" y2="13" />
                <polyline points="10,3 4,8 10,13" />
              </svg>
            </button>
            <!-- Prev -->
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="13,4 7,10 13,16" />
              </svg>
            </button>
            <!-- Next -->
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7,4 13,10 7,16" />
              </svg>
            </button>
            <!-- Jump to end -->
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6,3 12,8 6,13" />
                <line x1="14" y1="3" x2="14" y2="13" />
              </svg>
            </button>
          </div>
          <div class="min-w-[80px] flex justify-end">
            <button class="flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-yellow-400 bg-yellow-400/10 hover:bg-yellow-400/20 border border-yellow-400/30 rounded-lg transition-colors">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 1L7 9" />
                <polyline points="3,5 7,9 11,5" />
                <line x1="3" y1="13" x2="11" y2="13" />
              </svg>
              Next Deviation
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- State 2: At the beginning (prev disabled) -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Start of replay · Step 1 of 14</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-3">
        <div class="relative w-full h-2 bg-gray-800 rounded-full cursor-pointer">
          <div class="absolute top-0 left-0 h-full bg-emerald-500 rounded-full" style="width: 0%;"></div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-400 font-mono min-w-[80px]">1 / 14</span>
          <div class="flex items-center gap-2">
            <button class="p-2 rounded-lg text-gray-400 opacity-30 cursor-not-allowed">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="3" x2="2" y2="13" />
                <polyline points="10,3 4,8 10,13" />
              </svg>
            </button>
            <button class="p-2 rounded-lg text-gray-400 opacity-30 cursor-not-allowed">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="13,4 7,10 13,16" />
              </svg>
            </button>
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7,4 13,10 7,16" />
              </svg>
            </button>
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6,3 12,8 6,13" />
                <line x1="14" y1="3" x2="14" y2="13" />
              </svg>
            </button>
          </div>
          <div class="min-w-[80px] flex justify-end">
            <span class="text-sm text-gray-500">← →</span>
          </div>
        </div>
      </div>
    </div>

    <!-- State 3: At the end (next disabled), no deviation -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">End of replay · Step 14 of 14</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-3">
        <div class="relative w-full h-2 bg-gray-800 rounded-full cursor-pointer">
          <div class="absolute top-0 left-0 h-full bg-emerald-500 rounded-full" style="width: 100%;"></div>
          <div class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-emerald-400 border-2 border-gray-900 rounded-full shadow-md" style="left: calc(100% - 16px);"></div>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-sm text-gray-400 font-mono min-w-[80px]">14 / 14</span>
          <div class="flex items-center gap-2">
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="2" y1="3" x2="2" y2="13" />
                <polyline points="10,3 4,8 10,13" />
              </svg>
            </button>
            <button class="p-2 rounded-lg text-gray-400 hover:text-gray-50 hover:bg-gray-800 transition-colors">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="13,4 7,10 13,16" />
              </svg>
            </button>
            <button class="p-2 rounded-lg text-gray-400 opacity-30 cursor-not-allowed">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="7,4 13,10 7,16" />
              </svg>
            </button>
            <button class="p-2 rounded-lg text-gray-400 opacity-30 cursor-not-allowed">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6,3 12,8 6,13" />
                <line x1="14" y1="3" x2="14" y2="13" />
              </svg>
            </button>
          </div>
          <div class="min-w-[80px] flex justify-end">
            <span class="text-sm text-gray-500">← →</span>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
