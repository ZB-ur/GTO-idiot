<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReplayControls Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 24px; max-width: 400px;">
    <!-- Normal state: mid-replay -->
    <div class="flex items-center gap-3 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
      <button class="p-2 rounded-lg text-gray-100 hover:bg-gray-700 transition-colors">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4v12M7 10l7-6v12l-7-6z" fill="currentColor"/></svg>
      </button>
      <button class="p-2 rounded-lg text-gray-100 hover:bg-gray-700 transition-colors">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-8 6 8 6V4z" fill="currentColor"/></svg>
      </button>
      <span class="text-sm text-gray-400 font-mono min-w-[80px] text-center">12 / 24</span>
      <button class="p-2 rounded-lg text-gray-100 hover:bg-gray-700 transition-colors">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4l8 6-8 6V4z" fill="currentColor"/></svg>
      </button>
      <button class="p-2 rounded-lg text-gray-100 hover:bg-gray-700 transition-colors">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M16 4v12M13 10l-7-6v12l7-6z" fill="currentColor"/></svg>
      </button>
    </div>

    <!-- At start: first two buttons disabled -->
    <div class="flex items-center gap-3 bg-gray-800 border border-gray-700 rounded-xl px-4 py-3">
      <button class="p-2 rounded-lg text-gray-500 cursor-not-allowed">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 4v12M7 10l7-6v12l-7-6z" fill="currentColor"/></svg>
      </button>
      <button class="p-2 rounded-lg text-gray-500 cursor-not-allowed">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-8 6 8 6V4z" fill="currentColor"/></svg>
      </button>
      <span class="text-sm text-gray-400 font-mono min-w-[80px] text-center">1 / 24</span>
      <button class="p-2 rounded-lg text-gray-100 hover:bg-gray-700 transition-colors">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 4l8 6-8 6V4z" fill="currentColor"/></svg>
      </button>
      <button class="p-2 rounded-lg text-gray-100 hover:bg-gray-700 transition-colors">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M16 4v12M13 10l-7-6v12l7-6z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>
</body>
</html>
