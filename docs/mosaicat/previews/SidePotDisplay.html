<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SidePotDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #064e3b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col items-start gap-4">
    <!-- Side Pot 1 -->
    <div class="inline-flex items-center gap-2 rounded-lg bg-emerald-900/80 border border-emerald-700/50 px-3 py-1.5 backdrop-blur-sm">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-emerald-300/70 uppercase tracking-wide">Side Pot 1</span>
        <span class="text-sm font-bold text-amber-400">1,200</span>
      </div>
      <div class="h-4 w-px bg-emerald-700/50"></div>
      <div class="flex -space-x-1.5">
        <div class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-700 border border-emerald-600 text-[10px] font-semibold text-emerald-100">1</div>
        <div class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-700 border border-emerald-600 text-[10px] font-semibold text-emerald-100">3</div>
        <div class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-700 border border-emerald-600 text-[10px] font-semibold text-emerald-100">5</div>
      </div>
    </div>

    <!-- Side Pot 2 -->
    <div class="inline-flex items-center gap-2 rounded-lg bg-emerald-900/80 border border-emerald-700/50 px-3 py-1.5 backdrop-blur-sm">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-emerald-300/70 uppercase tracking-wide">Side Pot 2</span>
        <span class="text-sm font-bold text-amber-400">450</span>
      </div>
      <div class="h-4 w-px bg-emerald-700/50"></div>
      <div class="flex -space-x-1.5">
        <div class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-700 border border-emerald-600 text-[10px] font-semibold text-emerald-100">1</div>
        <div class="flex h-5 w-5 items-center justify-center rounded-full bg-emerald-700 border border-emerald-600 text-[10px] font-semibold text-emerald-100">3</div>
      </div>
    </div>
  </div>
</body>
</html>
