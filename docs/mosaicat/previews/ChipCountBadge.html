<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChipCountBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-8">

    <!-- Title -->
    <h1 class="text-2xl font-bold text-gray-900">ChipCountBadge</h1>
    <p class="text-sm text-gray-600">Displays chip count with a poker chip icon. Used inside SeatWidget.</p>

    <!-- Size Variants -->
    <section class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-900">Sizes</h2>
      <div class="flex items-end gap-4">

        <!-- Small -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">sm</span>
          <div>
            <span class="inline-flex items-center px-1.5 py-0.5 gap-1 rounded-md bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-3 h-3 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-xs font-medium tabular-nums leading-none">1,250</span>
            </span>
          </div>
        </div>

        <!-- Medium (default) -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">md (default)</span>
          <div>
            <span class="inline-flex items-center px-2 py-1 gap-1.5 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-sm font-semibold tabular-nums leading-none">1,250</span>
            </span>
          </div>
        </div>

        <!-- Large -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">lg</span>
          <div>
            <span class="inline-flex items-center px-3 py-1.5 gap-2 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-base font-bold tabular-nums leading-none">1,250</span>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- Amount Variations -->
    <section class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-900">Amount Formats</h2>
      <div class="flex flex-wrap items-center gap-3">

        <!-- Small amount -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">Small</span>
          <div>
            <span class="inline-flex items-center px-2 py-1 gap-1.5 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-sm font-semibold tabular-nums leading-none">50</span>
            </span>
          </div>
        </div>

        <!-- Medium amount -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">Medium</span>
          <div>
            <span class="inline-flex items-center px-2 py-1 gap-1.5 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-sm font-semibold tabular-nums leading-none">5,000</span>
            </span>
          </div>
        </div>

        <!-- Large amount (K format) -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">10K+</span>
          <div>
            <span class="inline-flex items-center px-2 py-1 gap-1.5 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-sm font-semibold tabular-nums leading-none">25.5K</span>
            </span>
          </div>
        </div>

        <!-- Huge amount (M format) -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">1M+</span>
          <div>
            <span class="inline-flex items-center px-2 py-1 gap-1.5 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-sm font-semibold tabular-nums leading-none">2.3M</span>
            </span>
          </div>
        </div>

        <!-- Zero -->
        <div class="space-y-1 text-center">
          <span class="text-xs text-gray-400">Zero</span>
          <div>
            <span class="inline-flex items-center px-2 py-1 gap-1.5 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
              <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
                <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
                <circle cx="12" cy="12" r="3" fill="#eab308"/>
              </svg>
              <span class="text-sm font-semibold tabular-nums leading-none">0</span>
            </span>
          </div>
        </div>
      </div>
    </section>

    <!-- On Table Felt Context -->
    <section class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-900">On Table Felt (Context)</h2>
      <div class="bg-emerald-800 rounded-xl p-8 flex items-center justify-center gap-6">

        <span class="inline-flex items-center px-1.5 py-0.5 gap-1 rounded-md bg-gray-900/80 text-white backdrop-blur-sm">
          <svg class="w-3 h-3 flex-shrink-0" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
            <circle cx="12" cy="12" r="3" fill="#eab308"/>
          </svg>
          <span class="text-xs font-medium tabular-nums leading-none">485</span>
        </span>

        <span class="inline-flex items-center px-2 py-1 gap-1.5 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
          <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
            <circle cx="12" cy="12" r="3" fill="#eab308"/>
          </svg>
          <span class="text-sm font-semibold tabular-nums leading-none">1,250</span>
        </span>

        <span class="inline-flex items-center px-3 py-1.5 gap-2 rounded-lg bg-gray-900/80 text-white backdrop-blur-sm">
          <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" fill="#facc15" stroke="#eab308" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="6.5" fill="none" stroke="#eab308" stroke-width="1" stroke-dasharray="3 2"/>
            <circle cx="12" cy="12" r="3" fill="#eab308"/>
          </svg>
          <span class="text-base font-bold tabular-nums leading-none">3,500</span>
        </span>

      </div>
    </section>

  </div>
</body>
</html>
