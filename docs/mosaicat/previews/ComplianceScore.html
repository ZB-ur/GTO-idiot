<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex gap-8 items-end justify-center">
  <!-- Large 78% -->
  <div class="flex flex-col items-center gap-2">
    <div class="relative" style="width: 160px; height: 160px;">
      <svg width="160" height="160" style="transform: rotate(-90deg);">
        <circle cx="80" cy="80" r="75" fill="none" stroke="#e5e7eb" stroke-width="10" />
        <circle cx="80" cy="80" r="75" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="471.24" stroke-dashoffset="103.67" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="font-bold text-emerald-500 text-4xl">78%</span>
      </div>
    </div>
    <span class="font-medium text-gray-500 text-sm">GTO Compliance</span>
  </div>

  <!-- Small 45% -->
  <div class="flex flex-col items-center gap-2">
    <div class="relative" style="width: 96px; height: 96px;">
      <svg width="96" height="96" style="transform: rotate(-90deg);">
        <circle cx="48" cy="48" r="45" fill="none" stroke="#e5e7eb" stroke-width="6" />
        <circle cx="48" cy="48" r="45" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="282.74" stroke-dashoffset="155.51" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="font-bold text-amber-400 text-xl">45%</span>
      </div>
    </div>
    <span class="font-medium text-gray-500 text-xs">Preflop</span>
  </div>

  <!-- Small 92% -->
  <div class="flex flex-col items-center gap-2">
    <div class="relative" style="width: 96px; height: 96px;">
      <svg width="96" height="96" style="transform: rotate(-90deg);">
        <circle cx="48" cy="48" r="45" fill="none" stroke="#e5e7eb" stroke-width="6" />
        <circle cx="48" cy="48" r="45" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="282.74" stroke-dashoffset="22.62" />
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center">
        <span class="font-bold text-emerald-500 text-xl">92%</span>
      </div>
    </div>
    <span class="font-medium text-gray-500 text-xs">Postflop</span>
  </div>
</div>
</body>
</html>
