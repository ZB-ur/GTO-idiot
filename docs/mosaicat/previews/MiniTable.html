<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniTable Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-lg mx-auto">
    <!-- Mini Table -->
    <div class="relative bg-emerald-800 border-4 border-emerald-900 rounded-xl p-6 shadow-md">
      <!-- Pot -->
      <div class="absolute top-3 left-1/2 -translate-x-1/2">
        <div class="flex items-center gap-1.5 bg-black/30 rounded-full px-3 py-1">
          <div class="w-3 h-3 rounded-full bg-yellow-400 border border-yellow-500"></div>
          <span class="text-xs font-bold text-yellow-100">Pot: 12.5BB</span>
        </div>
      </div>

      <!-- Community cards -->
      <div class="flex items-center justify-center gap-1.5 mt-6 mb-4">
        <!-- A♠ -->
        <div class="inline-flex items-center justify-center w-9 h-12 bg-white border border-gray-200 rounded-lg shadow-sm">
          <span class="text-sm font-bold text-gray-900">A♠</span>
        </div>
        <!-- K♥ -->
        <div class="inline-flex items-center justify-center w-9 h-12 bg-white border border-gray-200 rounded-lg shadow-sm">
          <span class="text-sm font-bold text-red-500">K♥</span>
        </div>
        <!-- 7♦ -->
        <div class="inline-flex items-center justify-center w-9 h-12 bg-white border border-gray-200 rounded-lg shadow-sm">
          <span class="text-sm font-bold text-blue-500">7♦</span>
        </div>
        <!-- 2♣ -->
        <div class="inline-flex items-center justify-center w-9 h-12 bg-white border border-gray-200 rounded-lg shadow-sm">
          <span class="text-sm font-bold text-green-700">2♣</span>
        </div>
        <!-- Empty slot -->
        <div class="w-9 h-12 bg-emerald-700/50 border border-emerald-600/50 rounded-lg"></div>
      </div>

      <!-- Players -->
      <div class="flex flex-wrap justify-center gap-2 mt-2">
        <!-- UTG (folded) -->
        <div class="flex flex-col items-center px-3 py-2 rounded-lg opacity-40 bg-white/10">
          <span class="text-[10px] font-bold text-emerald-200 uppercase tracking-wide">UTG</span>
          <span class="text-xs font-semibold text-white truncate max-w-[60px]">Player1</span>
          <span class="text-[10px] text-emerald-300">95BB</span>
        </div>
        <!-- HJ (folded) -->
        <div class="flex flex-col items-center px-3 py-2 rounded-lg opacity-40 bg-white/10">
          <span class="text-[10px] font-bold text-emerald-200 uppercase tracking-wide">HJ</span>
          <span class="text-xs font-semibold text-white truncate max-w-[60px]">Player2</span>
          <span class="text-[10px] text-emerald-300">102BB</span>
        </div>
        <!-- CO (active, human, highlight) -->
        <div class="flex flex-col items-center px-3 py-2 rounded-lg bg-yellow-400/20 ring-1 ring-yellow-400/60 ring-2 ring-blue-400/80">
          <span class="text-[10px] font-bold text-emerald-200 uppercase tracking-wide">CO</span>
          <span class="text-xs font-semibold text-blue-300 truncate max-w-[60px]">Hero</span>
          <span class="text-[10px] text-emerald-300">88BB</span>
          <span class="text-[10px] text-yellow-300 font-medium mt-0.5">↳ 3.0BB</span>
        </div>
        <!-- BTN (active) -->
        <div class="flex flex-col items-center px-3 py-2 rounded-lg bg-white/10">
          <span class="text-[10px] font-bold text-emerald-200 uppercase tracking-wide">BTN</span>
          <span class="text-xs font-semibold text-white truncate max-w-[60px]">Player4</span>
          <span class="text-[10px] text-emerald-300">110BB</span>
        </div>
        <!-- SB (folded) -->
        <div class="flex flex-col items-center px-3 py-2 rounded-lg opacity-40 bg-white/10">
          <span class="text-[10px] font-bold text-emerald-200 uppercase tracking-wide">SB</span>
          <span class="text-xs font-semibold text-white truncate max-w-[60px]">Player5</span>
          <span class="text-[10px] text-emerald-300">97BB</span>
        </div>
        <!-- BB (active) -->
        <div class="flex flex-col items-center px-3 py-2 rounded-lg bg-yellow-400/20 ring-1 ring-yellow-400/60">
          <span class="text-[10px] font-bold text-emerald-200 uppercase tracking-wide">BB</span>
          <span class="text-xs font-semibold text-white truncate max-w-[60px]">Player6</span>
          <span class="text-[10px] text-emerald-300">100BB</span>
          <span class="text-[10px] text-yellow-300 font-medium mt-0.5">↳ 6.5BB</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
