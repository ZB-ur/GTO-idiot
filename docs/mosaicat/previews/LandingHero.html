<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandingHero Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <section class="flex flex-col items-center justify-center min-h-[80vh] px-4 text-center">
    <!-- Hero Illustration -->
    <div class="relative mb-8">
      <div class="flex items-end">
        <div class="w-20 h-28 bg-gray-800 border border-gray-700 rounded-xl shadow-lg -rotate-12 flex items-center justify-center">
          <span class="text-3xl font-bold text-red-500">A&#9829;</span>
        </div>
        <div class="w-20 h-28 bg-gray-800 border border-gray-700 rounded-xl shadow-lg rotate-6 -ml-4 flex items-center justify-center">
          <span class="text-3xl font-bold text-gray-50">A&#9824;</span>
        </div>
      </div>
      <div class="absolute inset-0 -z-10 blur-3xl opacity-20 bg-amber-400 rounded-full scale-150"></div>
    </div>

    <!-- Product Name -->
    <h1 class="text-5xl sm:text-6xl font-extrabold text-gray-50 mb-3 tracking-tight">
      Poker<span class="text-amber-400">Lab</span>
    </h1>

    <!-- Tagline -->
    <p class="text-lg sm:text-xl text-gray-400 mb-10 max-w-md">
      Practice 6-max No-Limit Hold'em against adaptive bots. Learn GTO. Improve your game.
    </p>

    <!-- CTA -->
    <button class="px-8 py-3.5 bg-amber-500 hover:bg-amber-400 text-gray-950 font-bold text-lg rounded-xl transition-colors shadow-lg shadow-amber-500/20">
      Start Playing
    </button>

    <!-- Sub-text -->
    <p class="mt-4 text-sm text-gray-500">
      No signup required · 100BB deep · Free forever
    </p>
  </section>
</body>
</html>
