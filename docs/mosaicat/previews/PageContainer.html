<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PageContainer Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <!-- Sample card content to show container bounds -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 mb-6">
      <h2 class="text-xl font-bold text-gray-50 mb-2">Sample Card Inside PageContainer</h2>
      <p class="text-gray-400 text-sm">This card sits inside the max-w-4xl centered container with responsive horizontal padding.</p>
    </div>
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-6">
      <h2 class="text-xl font-bold text-gray-50 mb-2">Another Section</h2>
      <p class="text-gray-400 text-sm">Content is constrained to a readable width and centered on the page.</p>
    </div>
  </div>
