<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionTimeline Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xl mx-auto bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">Flop Actions</h3>

    <div class="relative">
      <!-- Timeline line -->
      <div class="absolute left-5 top-0 bottom-0 w-px bg-gray-200"></div>

      <div class="space-y-1">
        <!-- Action 1: BB checks (opponent) -->
        <div class="relative">
          <div class="absolute left-3.5 top-3.5 w-3 h-3 rounded-full border-2 bg-gray-300 border-gray-300 z-10"></div>
          <div class="ml-10 py-2">
            <div class="flex items-center gap-3 px-3 py-1.5 rounded-lg">
              <span class="text-xs text-gray-400 font-mono w-6 text-center">✓</span>
              <span class="text-xs font-medium text-gray-500 uppercase tracking-wide w-8">BB</span>
              <span class="text-sm text-gray-700">Player6</span>
              <span class="text-sm text-gray-900 font-medium">Check</span>
            </div>
          </div>
        </div>

        <!-- Action 2: Hero bets (human, conforming) -->
        <div class="relative">
          <div class="absolute left-3.5 top-3.5 w-3 h-3 rounded-full border-2 bg-blue-500 border-blue-500 z-10"></div>
          <div class="ml-10">
            <div class="border border-green-200 bg-green-50 rounded-lg overflow-hidden">
              <div class="w-full flex items-center justify-between px-4 py-3 text-left">
                <div class="flex items-center gap-3">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold text-green-700 bg-green-50 border border-green-200">GTO</span>
                  <span class="text-sm text-gray-900 font-medium">You: Bet 4.5BB</span>
                </div>
                <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Action 3: BB raises (opponent) -->
        <div class="relative">
          <div class="absolute left-3.5 top-3.5 w-3 h-3 rounded-full border-2 bg-gray-300 border-gray-300 z-10"></div>
          <div class="ml-10 py-2">
            <div class="flex items-center gap-3 px-3 py-1.5 rounded-lg">
              <span class="text-xs text-gray-400 font-mono w-6 text-center">▲</span>
              <span class="text-xs font-medium text-gray-500 uppercase tracking-wide w-8">BB</span>
              <span class="text-sm text-gray-700">Player6</span>
              <span class="text-sm text-gray-900 font-medium">Raise <span class="text-gray-500 ml-1">12.0BB</span></span>
            </div>
          </div>
        </div>

        <!-- Action 4: Hero folds (human, major deviation, expanded, current) -->
        <div class="relative">
          <div class="absolute left-3.5 top-3.5 w-3 h-3 rounded-full border-2 bg-blue-600 border-blue-600 ring-4 ring-blue-100 z-10"></div>
          <div class="ml-10">
            <div class="border border-red-200 bg-red-50 rounded-lg overflow-hidden">
              <div class="w-full flex items-center justify-between px-4 py-3 text-left">
                <div class="flex items-center gap-3">
                  <span class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-semibold text-red-700 bg-red-50 border border-red-200">Major</span>
                  <span class="text-sm text-gray-900 font-medium">You: Fold</span>
                  <span class="text-sm text-gray-400">→</span>
                  <span class="text-sm text-blue-600 font-medium">GTO: Call</span>
                </div>
                <div class="flex items-center gap-3">
                  <span class="text-sm font-semibold text-red-600">−3.5BB</span>
                  <svg class="w-4 h-4 text-gray-400 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                  </svg>
                </div>
              </div>
              <div class="px-4 pb-4 pt-1 border-t border-white/60">
                <div class="grid grid-cols-2 gap-4 mb-3">
                  <div class="bg-white/60 rounded-lg p-3">
                    <p class="text-xs text-gray-500 mb-1">Your Action</p>
                    <p class="text-sm font-semibold text-gray-900">Fold</p>
                  </div>
                  <div class="bg-white/60 rounded-lg p-3">
                    <p class="text-xs text-gray-500 mb-1">GTO Recommendation</p>
                    <p class="text-sm font-semibold text-blue-600">Call 12.0BB</p>
                  </div>
                </div>
                <div class="bg-white/60 rounded-lg p-3">
                  <p class="text-xs text-gray-500 mb-1">Explanation</p>
                  <p class="text-sm text-gray-700">你有 top pair + flush draw，底池赔率足够，GTO 建议跟注。对手的加注范围中你有足够的胜率。</p>
                </div>
                <div class="mt-3 flex items-center gap-2">
                  <div class="h-1.5 flex-1 bg-white/60 rounded-full overflow-hidden">
                    <div class="h-full bg-red-400 rounded-full" style="width: 35%"></div>
                  </div>
                  <span class="text-xs text-red-600 font-medium whitespace-nowrap">EV Loss: 3.5BB</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
