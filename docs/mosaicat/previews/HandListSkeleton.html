<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandListSkeleton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .skeleton-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-3">

    <!-- Row 1 -->
    <div class="flex items-center gap-4 p-4 bg-gray-900 border border-gray-800 rounded-xl skeleton-pulse">
      <div class="w-8 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="flex gap-0.5">
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
      </div>
      <div class="flex flex-col gap-1.5 flex-1">
        <div class="w-12 h-3 bg-gray-800 rounded"></div>
        <div class="w-20 h-3 bg-gray-800 rounded"></div>
      </div>
      <div class="w-16 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="w-4 h-4 bg-gray-800 rounded shrink-0"></div>
    </div>

    <!-- Row 2 -->
    <div class="flex items-center gap-4 p-4 bg-gray-900 border border-gray-800 rounded-xl skeleton-pulse" style="animation-delay: 0.15s;">
      <div class="w-8 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="flex gap-0.5">
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
      </div>
      <div class="flex flex-col gap-1.5 flex-1">
        <div class="w-12 h-3 bg-gray-800 rounded"></div>
        <div class="w-20 h-3 bg-gray-800 rounded"></div>
      </div>
      <div class="w-16 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="w-4 h-4 bg-gray-800 rounded shrink-0"></div>
    </div>

    <!-- Row 3 -->
    <div class="flex items-center gap-4 p-4 bg-gray-900 border border-gray-800 rounded-xl skeleton-pulse" style="animation-delay: 0.3s;">
      <div class="w-8 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="flex gap-0.5">
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
      </div>
      <div class="flex flex-col gap-1.5 flex-1">
        <div class="w-12 h-3 bg-gray-800 rounded"></div>
        <div class="w-20 h-3 bg-gray-800 rounded"></div>
      </div>
      <div class="w-16 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="w-4 h-4 bg-gray-800 rounded shrink-0"></div>
    </div>

    <!-- Row 4 -->
    <div class="flex items-center gap-4 p-4 bg-gray-900 border border-gray-800 rounded-xl skeleton-pulse" style="animation-delay: 0.45s;">
      <div class="w-8 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="flex gap-0.5">
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
      </div>
      <div class="flex flex-col gap-1.5 flex-1">
        <div class="w-12 h-3 bg-gray-800 rounded"></div>
        <div class="w-20 h-3 bg-gray-800 rounded"></div>
      </div>
      <div class="w-16 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="w-4 h-4 bg-gray-800 rounded shrink-0"></div>
    </div>

    <!-- Row 5 -->
    <div class="flex items-center gap-4 p-4 bg-gray-900 border border-gray-800 rounded-xl skeleton-pulse" style="animation-delay: 0.6s;">
      <div class="w-8 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="flex gap-0.5">
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
        <div class="w-8 h-10 bg-gray-800 rounded"></div>
      </div>
      <div class="flex flex-col gap-1.5 flex-1">
        <div class="w-12 h-3 bg-gray-800 rounded"></div>
        <div class="w-20 h-3 bg-gray-800 rounded"></div>
      </div>
      <div class="w-16 h-4 bg-gray-800 rounded shrink-0"></div>
      <div class="w-4 h-4 bg-gray-800 rounded shrink-0"></div>
    </div>

  </div>
</body>
</html>
