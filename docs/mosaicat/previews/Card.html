<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex gap-4 items-start flex-wrap">
  <!-- Ace of spades -->
  <div class="relative w-16 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col justify-between p-1.5 select-none" style="height:5.5rem">
    <div class="flex flex-col items-start leading-none text-gray-900">
      <span class="text-sm font-bold">A</span>
      <span class="text-xs">♠</span>
    </div>
    <div class="text-2xl text-center text-gray-900">♠</div>
    <div class="flex flex-col items-end leading-none rotate-180 text-gray-900">
      <span class="text-sm font-bold">A</span>
      <span class="text-xs">♠</span>
    </div>
  </div>

  <!-- King of hearts -->
  <div class="relative w-16 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col justify-between p-1.5 select-none" style="height:5.5rem">
    <div class="flex flex-col items-start leading-none text-red-500">
      <span class="text-sm font-bold">K</span>
      <span class="text-xs">♥</span>
    </div>
    <div class="text-2xl text-center text-red-500">♥</div>
    <div class="flex flex-col items-end leading-none rotate-180 text-red-500">
      <span class="text-sm font-bold">K</span>
      <span class="text-xs">♥</span>
    </div>
  </div>

  <!-- Queen of diamonds -->
  <div class="relative w-16 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col justify-between p-1.5 select-none" style="height:5.5rem">
    <div class="flex flex-col items-start leading-none text-red-500">
      <span class="text-sm font-bold">Q</span>
      <span class="text-xs">♦</span>
    </div>
    <div class="text-2xl text-center text-red-500">♦</div>
    <div class="flex flex-col items-end leading-none rotate-180 text-red-500">
      <span class="text-sm font-bold">Q</span>
      <span class="text-xs">♦</span>
    </div>
  </div>

  <!-- Ten of clubs -->
  <div class="relative w-16 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col justify-between p-1.5 select-none" style="height:5.5rem">
    <div class="flex flex-col items-start leading-none text-gray-900">
      <span class="text-sm font-bold">T</span>
      <span class="text-xs">♣</span>
    </div>
    <div class="text-2xl text-center text-gray-900">♣</div>
    <div class="flex flex-col items-end leading-none rotate-180 text-gray-900">
      <span class="text-sm font-bold">T</span>
      <span class="text-xs">♣</span>
    </div>
  </div>

  <!-- Face-down card -->
  <div class="relative w-16 rounded-lg bg-gradient-to-br from-amber-500 to-amber-700 border-2 border-amber-400 shadow-md flex items-center justify-center select-none" style="height:5.5rem">
    <div class="w-10 h-14 rounded border border-amber-300/40 bg-amber-600/50"></div>
  </div>
</div>
</body>
</html>
