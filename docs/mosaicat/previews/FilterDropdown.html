<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FilterDropdown Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div style="display: flex; gap: 24px; align-items: flex-start;">
    <!-- Closed / no value -->
    <div class="relative">
      <button class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm border bg-gray-800 border-gray-700 text-gray-400">
        <span>位置</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>

    <!-- Active / has value -->
    <div class="relative">
      <button class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm border bg-emerald-500/10 border-emerald-500/30 text-emerald-400">
        <span>BTN</span>
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>

    <!-- Open state -->
    <div class="relative">
      <button class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm border bg-gray-800 border-gray-700 text-gray-400">
        <span>盈亏</span>
        <svg class="w-4 h-4 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      <div class="absolute z-50 mt-1 w-48 bg-gray-800 border border-gray-700 rounded-xl shadow-md py-1">
        <button class="w-full text-left px-3 py-2 text-sm text-gray-100 hover:bg-gray-700/50">全部</button>
        <button class="w-full text-left px-3 py-2 text-sm text-emerald-400 bg-emerald-500/10">盈利</button>
        <button class="w-full text-left px-3 py-2 text-sm text-gray-100 hover:bg-gray-700/50">亏损</button>
        <button class="w-full text-left px-3 py-2 text-sm text-gray-100 hover:bg-gray-700/50">持平</button>
      </div>
    </div>
  </div>
</body>
</html>
