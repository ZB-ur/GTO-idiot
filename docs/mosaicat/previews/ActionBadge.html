<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes action-pop {
      0% { transform: scale(0.7); opacity: 0; }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-action-pop {
      animation: action-pop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
  </style>
</head>
<body>
  <div class="space-y-4">
    <p class="text-sm font-semibold text-gray-600">Action Badges</p>

    <!-- On dark background to simulate table felt -->
    <div class="bg-emerald-800 rounded-xl p-6 space-y-3">
      <div class="inline-flex items-center px-3 py-1.5 bg-gray-900/80 text-white text-sm font-semibold rounded-lg shadow-md">
        Fold
      </div>
      <br />
      <div class="inline-flex items-center px-3 py-1.5 bg-gray-900/80 text-white text-sm font-semibold rounded-lg shadow-md">
        Check
      </div>
      <br />
      <div class="inline-flex items-center px-3 py-1.5 bg-gray-900/80 text-white text-sm font-semibold rounded-lg shadow-md">
        Call 10
      </div>
      <br />
      <div class="inline-flex items-center px-3 py-1.5 bg-gray-900/80 text-white text-sm font-semibold rounded-lg shadow-md">
        Raise to 25
      </div>
      <br />
      <div class="inline-flex items-center px-3 py-1.5 bg-gray-900/80 text-white text-sm font-semibold rounded-lg shadow-md">
        All-In 500
      </div>
    </div>

    <p class="text-sm font-semibold text-gray-600 mt-4">With Animation</p>
    <div class="bg-emerald-800 rounded-xl p-6">
      <div class="inline-flex items-center px-3 py-1.5 bg-gray-900/80 text-white text-sm font-semibold rounded-lg shadow-md animate-action-pop">
        Raise to 25
      </div>
    </div>
  </div>
</body>
</html>
