<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="max-width: 360px;" class="space-y-4">
    <!-- Default state -->
    <button class="w-full px-4 py-3 rounded-lg font-semibold text-sm bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20">
      Clear All Data
    </button>
    <!-- Confirming state -->
    <button class="w-full px-4 py-3 rounded-lg font-semibold text-sm bg-red-500 text-white">
      Tap again to confirm
    </button>
  </div>
</body>
</html>
