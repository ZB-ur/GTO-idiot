<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfirmDialog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60" style="backdrop-filter: blur(4px);"></div>

    <!-- Dialog -->
    <div class="relative bg-gray-900 border border-gray-700 rounded-xl shadow-lg w-full max-w-sm mx-4 p-6">
      <h3 class="text-lg font-semibold text-gray-50 mb-2">Leave Table?</h3>
      <p class="text-sm text-gray-400 mb-6">You still have chips in play. Are you sure you want to leave the table now?</p>

      <div class="flex gap-3">
        <button class="flex-1 px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-50 text-sm font-medium rounded-lg border border-gray-700 transition-colors">
          Stay
        </button>
        <button class="flex-1 px-4 py-2.5 bg-amber-500 hover:bg-amber-400 text-gray-950 text-sm font-semibold rounded-lg transition-colors">
          Leave
        </button>
      </div>
    </div>
  </div>
</body>
</html>
