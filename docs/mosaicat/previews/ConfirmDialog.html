<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfirmDialog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <!-- Default variant -->
  <div class="mb-8">
    <p class="text-sm text-gray-400 mb-4">Default Variant</p>
    <div class="relative flex items-center justify-center" style="height: 240px;">
      <div class="absolute inset-0 bg-black/50 rounded-xl"></div>
      <div class="relative bg-white rounded-xl shadow-md max-w-md w-full mx-4 p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-2">确认操作</h2>
        <p class="text-base text-gray-600 mb-6">确定要执行此操作吗？此操作无法撤销。</p>
        <div class="flex justify-end gap-3">
          <button class="px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50">取消</button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Danger variant -->
  <div>
    <p class="text-sm text-gray-400 mb-4">Danger Variant</p>
    <div class="relative flex items-center justify-center" style="height: 240px;">
      <div class="absolute inset-0 bg-black/50 rounded-xl"></div>
      <div class="relative bg-white rounded-xl shadow-md max-w-md w-full mx-4 p-6">
        <h2 class="text-lg font-semibold text-gray-900 mb-2">删除手牌记录</h2>
        <p class="text-base text-gray-600 mb-6">确定要删除所有手牌历史记录吗？此操作不可恢复。</p>
        <div class="flex justify-end gap-3">
          <button class="px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-gray-50">取消</button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600">删除全部</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
