<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfirmDialog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #1a1a2e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/60" style="backdrop-filter: blur(4px);"></div>
    <!-- Dialog -->
    <div class="relative z-10 w-full max-w-md mx-4 border rounded-xl shadow-lg p-6" style="background: #1e293b; border-color: #374151;">
      <h2 class="text-lg font-semibold text-gray-100 mb-2">Leave Table?</h2>
      <p class="text-gray-400 text-sm mb-6">Your current hand will be forfeited and session progress may be lost. Are you sure you want to leave?</p>
      <div class="flex justify-end gap-3">
        <button class="px-4 py-2 text-sm font-medium text-gray-300 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">Stay</button>
        <button class="px-4 py-2 text-sm font-medium text-white bg-red-500 hover:bg-red-400 rounded-lg transition-colors">Leave Table</button>
      </div>
    </div>
  </div>
</body>
</html>
