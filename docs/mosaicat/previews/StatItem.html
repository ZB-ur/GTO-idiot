<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StatItem Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto flex items-start gap-8">
    <!-- Default -->
    <div class="flex flex-col items-center gap-1">
      <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Hands</span>
      <span class="text-2xl font-bold text-gray-900">142</span>
    </div>
    <!-- Green -->
    <div class="flex flex-col items-center gap-1">
      <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Win Rate</span>
      <span class="text-2xl font-bold text-emerald-500">64%</span>
    </div>
    <!-- Red -->
    <div class="flex flex-col items-center gap-1">
      <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">Loss</span>
      <span class="text-2xl font-bold text-red-500">-$230</span>
    </div>
    <!-- Amber -->
    <div class="flex flex-col items-center gap-1">
      <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">BB/100</span>
      <span class="text-2xl font-bold text-amber-500">3.2</span>
    </div>
  </div>
</body>
</html>
