<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppLoadingScreen Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #1a1a2e; font-family: system-ui, sans-serif; }
    @keyframes cardFlip {
      0%, 100% { transform: rotateY(0deg); opacity: 1; }
      50% { transform: rotateY(90deg); opacity: 0.6; }
    }
    .card-anim { animation: cardFlip 1.5s ease-in-out infinite; }
    .card-anim:nth-child(2) { animation-delay: 0.15s; }
    .card-anim:nth-child(3) { animation-delay: 0.3s; }
    .card-anim:nth-child(4) { animation-delay: 0.45s; }
  </style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex flex-col items-center justify-center" style="background: #1a1a2e;">
    <div class="flex gap-2 mb-8">
      <div class="card-anim w-12 h-16 rounded-md flex items-center justify-center text-2xl font-bold" style="background: #1e293b; border: 1px solid #334155; color: #ecf0f1;">♠</div>
      <div class="card-anim w-12 h-16 rounded-md flex items-center justify-center text-2xl font-bold" style="background: #1e293b; border: 1px solid #334155; color: #e74c3c;">♥</div>
      <div class="card-anim w-12 h-16 rounded-md flex items-center justify-center text-2xl font-bold" style="background: #1e293b; border: 1px solid #334155; color: #e74c3c;">♦</div>
      <div class="card-anim w-12 h-16 rounded-md flex items-center justify-center text-2xl font-bold" style="background: #1e293b; border: 1px solid #334155; color: #ecf0f1;">♣</div>
    </div>
    <h1 class="text-2xl font-bold text-gray-100 mb-1">GTO Idiot</h1>
    <p class="text-gray-500 text-sm">Loading your poker trainer…</p>
  </div>
</body>
</html>
