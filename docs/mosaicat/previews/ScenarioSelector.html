<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScenarioSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xl mx-auto space-y-6">
    <!-- With 'Open' selected -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-600">翻前场景</label>
      <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
        <button class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white shadow-sm transition-all duration-150">Open</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 transition-all duration-150">vs Raise</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 transition-all duration-150">vs 3-Bet</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 transition-all duration-150">vs 4-Bet</button>
      </div>
    </div>

    <!-- With 'vs 3-Bet' selected -->
    <div class="space-y-2">
      <label class="block text-sm font-semibold text-gray-600">翻前场景</label>
      <div class="inline-flex rounded-lg border border-gray-200 bg-white p-1 shadow-sm">
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 transition-all duration-150">Open</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 transition-all duration-150">vs Raise</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg bg-blue-600 text-white shadow-sm transition-all duration-150">vs 3-Bet</button>
        <button class="px-4 py-2 text-sm font-medium rounded-lg text-gray-600 transition-all duration-150">vs 4-Bet</button>
      </div>
    </div>
  </div>
</body>
</html>
