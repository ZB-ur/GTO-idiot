<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-8">

    <!-- State 1: Fold / Call / Raise -->
    <div>
      <p class="text-sm text-gray-400 mb-2">Fold / Call / Raise</p>
      <div class="bg-white border-t border-gray-200 px-4 py-3 rounded-xl shadow-sm">
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-gray-600 bg-gray-100 rounded-lg">弃牌</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-blue-600 rounded-lg">跟注 200</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-green-500 rounded-lg">加注</button>
        </div>
      </div>
    </div>

    <!-- State 2: Fold / Check / Bet -->
    <div>
      <p class="text-sm text-gray-400 mb-2">Fold / Check / Bet</p>
      <div class="bg-white border-t border-gray-200 px-4 py-3 rounded-xl shadow-sm">
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-gray-600 bg-gray-100 rounded-lg">弃牌</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-blue-600 bg-blue-50 rounded-lg">过牌</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-green-500 rounded-lg">下注</button>
        </div>
      </div>
    </div>

    <!-- State 3: With raise slider expanded -->
    <div>
      <p class="text-sm text-gray-400 mb-2">Raise Slider Expanded</p>
      <div class="bg-white border-t border-gray-200 px-4 py-3 rounded-xl shadow-sm">
        <!-- Presets -->
        <div class="mb-3 px-2">
          <div class="flex gap-2 mb-2">
            <button class="px-3 py-1 text-xs font-medium rounded-lg border bg-white text-gray-600 border-gray-200">2x</button>
            <button class="px-3 py-1 text-xs font-medium rounded-lg border bg-blue-600 text-white border-blue-600">3x</button>
            <button class="px-3 py-1 text-xs font-medium rounded-lg border bg-white text-gray-600 border-gray-200">Pot</button>
            <button class="px-3 py-1 text-xs font-medium rounded-lg border bg-white text-red-500 border-gray-200">All-in</button>
          </div>
          <!-- Slider -->
          <div class="flex items-center gap-3">
            <span class="text-xs text-gray-400 w-12 text-right">400</span>
            <input type="range" min="400" max="10000" value="600" class="flex-1 h-2 accent-blue-600" />
            <span class="text-xs text-gray-400 w-12">10,000</span>
          </div>
          <div class="text-center mt-1">
            <span class="text-lg font-bold text-gray-900">600</span>
          </div>
        </div>
        <!-- Buttons -->
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-gray-600 bg-gray-100 rounded-lg">弃牌</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-blue-600 rounded-lg">跟注 200</button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-green-500 rounded-lg">确认 加注 600</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
