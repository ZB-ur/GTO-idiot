<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- State 1: Normal action bar -->
  <div class="mb-8">
    <p class="text-gray-500 text-xs mb-2 uppercase tracking-wide">Default — All Actions Available</p>
    <div class="w-full bg-gray-900/95 border-t border-gray-700 px-4 py-3 rounded-b-2xl">
      <div class="flex items-center justify-center gap-3">
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-gray-700 text-gray-200 hover:bg-gray-600 transition-all duration-150">
          Fold
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-emerald-600 text-white hover:bg-emerald-500 transition-all duration-150">
          Call 4
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-amber-500 text-gray-950 hover:bg-amber-400 transition-all duration-150">
          Raise
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-red-500 text-white hover:bg-red-400 ring-1 ring-red-400/50 transition-all duration-150">
          All In
        </button>
      </div>
    </div>
  </div>

  <!-- State 2: Check available (no bet to call) -->
  <div class="mb-8">
    <p class="text-gray-500 text-xs mb-2 uppercase tracking-wide">Check Available — No Bet Facing</p>
    <div class="w-full bg-gray-900/95 border-t border-gray-700 px-4 py-3 rounded-b-2xl">
      <div class="flex items-center justify-center gap-3">
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-gray-700 text-gray-200">
          Fold
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-emerald-600 text-white">
          Check
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-amber-500 text-gray-950">
          Raise
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-red-500 text-white ring-1 ring-red-400/50">
          All In
        </button>
      </div>
    </div>
  </div>

  <!-- State 3: Raise controls expanded -->
  <div class="mb-8">
    <p class="text-gray-500 text-xs mb-2 uppercase tracking-wide">Raise Controls Expanded</p>
    <div class="w-full bg-gray-900/95 border-t border-gray-700 px-4 py-3 rounded-b-2xl">
      <div class="flex flex-col gap-3">
        <div class="flex items-center gap-3">
          <span class="text-gray-400 text-sm font-medium min-w-[40px]">12</span>
          <div class="flex-1 h-2 bg-gray-700 rounded-lg relative">
            <div class="absolute left-0 top-0 h-2 bg-amber-500 rounded-lg" style="width: 30%;"></div>
            <div class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-amber-400 rounded-full border-2 border-amber-600 shadow-md" style="left: 30%;"></div>
          </div>
          <span class="text-gray-500 text-xs min-w-[40px] text-right">200</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 text-xs font-medium border border-gray-700 hover:bg-gray-700">½ Pot</button>
          <button class="px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 text-xs font-medium border border-gray-700 hover:bg-gray-700">¾ Pot</button>
          <button class="px-3 py-1.5 rounded-lg bg-gray-800 text-gray-300 text-xs font-medium border border-gray-700 hover:bg-gray-700">Pot</button>
          <div class="flex-1"></div>
          <button class="px-4 py-2 rounded-lg bg-gray-700 text-gray-300 text-sm font-medium hover:bg-gray-600">Cancel</button>
          <button class="px-6 py-2 rounded-lg bg-amber-500 text-gray-950 text-sm font-bold hover:bg-amber-400">Raise to 12</button>
        </div>
      </div>
    </div>
  </div>

  <!-- State 4: Disabled -->
  <div>
    <p class="text-gray-500 text-xs mb-2 uppercase tracking-wide">Disabled State — Not Your Turn</p>
    <div class="w-full bg-gray-900/95 border-t border-gray-700 px-4 py-3 rounded-b-2xl">
      <div class="flex items-center justify-center gap-3">
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-gray-700 text-gray-200 opacity-40 cursor-not-allowed">
          Fold
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-emerald-600 text-white opacity-40 cursor-not-allowed">
          Call 4
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-amber-500 text-gray-950 opacity-40 cursor-not-allowed">
          Raise
        </button>
        <button class="px-6 py-3 rounded-xl text-sm font-bold uppercase tracking-wide bg-red-500 text-white ring-1 ring-red-400/50 opacity-40 cursor-not-allowed">
          All In
        </button>
      </div>
    </div>
  </div>
</body>
</html>
