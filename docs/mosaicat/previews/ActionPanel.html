<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-8">
    <!-- State 1: With raise controls expanded -->
    <div>
      <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider">Raise Controls Expanded</p>
      <div class="bg-white/95 backdrop-blur-sm rounded-xl border border-gray-200 shadow-md p-4">
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-xs text-gray-500">Pot: <span class="font-bold text-gray-900">$120</span></span>
          <span class="text-xs text-gray-500">To call: <span class="font-bold text-gray-900">$30</span></span>
        </div>
        <!-- Raise slider -->
        <div class="mb-3 p-3 bg-slate-50 rounded-lg border border-gray-100">
          <div class="flex items-center justify-between mb-2">
            <span class="text-xs font-medium text-gray-500">Raise to</span>
            <span class="text-lg font-bold text-gray-900 font-mono">$80</span>
          </div>
          <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
            <div class="h-full bg-amber-500 rounded-full" style="width: 40%"></div>
          </div>
          <div class="flex items-center justify-between mt-1 text-[10px] text-gray-400">
            <span>$60</span>
            <span>$500</span>
          </div>
          <div class="flex gap-1.5 mt-2">
            <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">1/3 pot</button>
            <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-amber-100 border-amber-300 text-amber-700">1/2 pot</button>
            <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">2/3 pot</button>
            <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">Pot</button>
            <button class="flex-1 py-1.5 text-xs font-medium rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">All-In</button>
          </div>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-gray-100 hover:bg-gray-200 text-gray-600">Fold</button>
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-blue-600 hover:bg-blue-700 text-white">Call <span class="ml-1 opacity-80">$30</span></button>
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-amber-500 hover:bg-amber-600 text-white">Raise $80</button>
        </div>
      </div>
    </div>

    <!-- State 2: Basic actions (check available) -->
    <div>
      <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider">Check Available</p>
      <div class="bg-white/95 backdrop-blur-sm rounded-xl border border-gray-200 shadow-md p-4">
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-xs text-gray-500">Pot: <span class="font-bold text-gray-900">$45</span></span>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-gray-100 hover:bg-gray-200 text-gray-600">Fold</button>
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-blue-50 hover:bg-blue-100 text-blue-700">Check</button>
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-amber-500 hover:bg-amber-600 text-white">Raise</button>
        </div>
      </div>
    </div>

    <!-- State 3: Disabled -->
    <div>
      <p class="text-xs text-gray-400 mb-2 uppercase tracking-wider">Disabled (Not Your Turn)</p>
      <div class="bg-white/95 backdrop-blur-sm rounded-xl border border-gray-200 shadow-md p-4">
        <div class="flex items-center justify-between mb-3 px-1">
          <span class="text-xs text-gray-500">Pot: <span class="font-bold text-gray-900">$90</span></span>
          <span class="text-xs text-gray-500">To call: <span class="font-bold text-gray-900">$20</span></span>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-gray-100 text-gray-600 opacity-40 cursor-not-allowed">Fold</button>
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-blue-600 text-white opacity-40 cursor-not-allowed">Call <span class="ml-1 opacity-80">$20</span></button>
          <button class="flex-1 py-3 rounded-lg font-semibold text-sm bg-amber-500 text-white opacity-40 cursor-not-allowed">Raise</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
