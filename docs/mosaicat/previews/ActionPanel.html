<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen bg-gray-950 flex flex-col justify-end">

    <!-- State 1: With raise slider expanded -->
    <div class="mb-4 px-4">
      <p class="text-gray-500 text-xs mb-2 uppercase tracking-wider">State: Raise Slider Open</p>
    </div>
    <div class="w-full bg-gray-900 border-t border-gray-700 px-4 py-3 mb-6">
      <!-- Raise slider row -->
      <div class="flex items-center gap-3 mb-3 px-2">
        <span class="text-gray-400 text-sm min-w-[40px]">8</span>
        <input type="range" min="8" max="400" value="24" class="flex-1 h-2" style="accent-color: #f59e0b;" />
        <span class="text-gray-400 text-sm min-w-[40px] text-right">400</span>
        <div class="bg-gray-800 border border-gray-700 rounded-lg px-3 py-1 min-w-[64px] text-center">
          <span class="text-amber-500 font-bold text-lg">24</span>
        </div>
      </div>

      <!-- Quick presets -->
      <div class="flex gap-2 mb-3 px-2">
        <button class="flex-1 py-1.5 text-sm rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700">2.5x</button>
        <button class="flex-1 py-1.5 text-sm rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700">3x</button>
        <button class="flex-1 py-1.5 text-sm rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700">½ Pot</button>
        <button class="flex-1 py-1.5 text-sm rounded-lg bg-gray-800 border border-gray-700 text-gray-300 hover:bg-gray-700">Pot</button>
      </div>

      <!-- Buttons -->
      <div class="flex items-center gap-3">
        <button class="flex-1 py-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-300 font-semibold text-base">弃牌</button>
        <button class="flex-1 py-3 rounded-xl bg-sky-900 border border-sky-700 text-sky-300 font-semibold text-base">跟注 4</button>
        <div class="flex-1 flex gap-2">
          <button class="flex-1 py-3 rounded-xl bg-amber-500 text-gray-950 font-bold text-base">加注 24</button>
          <button class="py-3 px-4 rounded-xl bg-red-600 text-gray-50 font-bold text-base">全押</button>
        </div>
      </div>
    </div>

    <!-- State 2: Default buttons (no slider) -->
    <div class="px-4">
      <p class="text-gray-500 text-xs mb-2 uppercase tracking-wider">State: Default Actions</p>
    </div>
    <div class="w-full bg-gray-900 border-t border-gray-700 px-4 py-3 mb-6">
      <div class="flex items-center gap-3">
        <button class="flex-1 py-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-300 font-semibold text-base">弃牌</button>
        <button class="flex-1 py-3 rounded-xl bg-sky-900 border border-sky-700 text-sky-300 font-semibold text-base">跟注 4</button>
        <button class="flex-1 py-3 rounded-xl bg-amber-500 text-gray-950 font-bold text-base">加注</button>
      </div>
    </div>

    <!-- State 3: Check available (no bet to call) -->
    <div class="px-4">
      <p class="text-gray-500 text-xs mb-2 uppercase tracking-wider">State: Check Available</p>
    </div>
    <div class="w-full bg-gray-900 border-t border-gray-700 px-4 py-3">
      <div class="flex items-center gap-3">
        <button class="flex-1 py-3 rounded-xl bg-gray-800 border border-gray-700 text-gray-300 font-semibold text-base">弃牌</button>
        <button class="flex-1 py-3 rounded-xl bg-emerald-900 border border-emerald-700 text-emerald-300 font-semibold text-base">过牌</button>
        <button class="flex-1 py-3 rounded-xl bg-amber-500 text-gray-950 font-bold text-base">加注</button>
      </div>
    </div>
  </div>
</body>
</html>
