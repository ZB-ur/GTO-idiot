<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameSpeedSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-8 max-w-sm">
    <!-- Normal selected -->
    <div>
      <p class="text-xs text-gray-400 mb-2">Normal selected</p>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Game Speed</label>
      <div class="flex gap-2">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-900">Slow</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-blue-600 bg-blue-600 text-white shadow-sm">Normal</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-900">Fast</button>
      </div>
    </div>
    <!-- Fast selected with tooltip visible -->
    <div>
      <p class="text-xs text-gray-400 mb-2">Fast selected with tooltip</p>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Game Speed</label>
      <div class="flex gap-2">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-900">Slow</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-900">Normal</button>
        <div class="relative flex-1">
          <button class="w-full px-4 py-2.5 text-sm font-medium rounded-lg border border-blue-600 bg-blue-600 text-white shadow-sm">Fast</button>
          <div class="absolute -top-9 left-1/2 -translate-x-1/2 px-2.5 py-1 bg-gray-900 text-white text-xs rounded-md whitespace-nowrap shadow-md z-10">
            0.5s delay
            <div class="absolute top-full left-1/2 -translate-x-1/2 w-0 h-0 border-l-4 border-r-4 border-t-4 border-l-transparent border-r-transparent border-t-gray-900"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
