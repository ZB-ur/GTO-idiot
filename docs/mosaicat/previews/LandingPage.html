<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandingPage Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-4xl mx-auto space-y-8 py-8 px-4">

    <!-- Hero / CTA -->
    <div class="text-center space-y-4">
      <h1 class="text-3xl font-bold text-gray-900">GTO Idiot</h1>
      <p class="text-gray-600 text-lg">Texas Hold'em GTO 策略训练器</p>
      <button class="inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold px-8 py-3 rounded-lg text-lg transition-colors shadow-sm">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        开始新会话
      </button>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <!-- Total Hands -->
      <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-1">
        <div class="flex items-center gap-2 text-gray-500 text-sm">
          <span>🃏</span><span>总手数</span>
        </div>
        <div class="text-xl font-bold text-gray-900">1,247</div>
      </div>
      <!-- Total Sessions -->
      <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-1">
        <div class="flex items-center gap-2 text-gray-500 text-sm">
          <span>📋</span><span>总场次</span>
        </div>
        <div class="text-xl font-bold text-gray-900">18</div>
      </div>
      <!-- P/L -->
      <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-1">
        <div class="flex items-center gap-2 text-gray-500 text-sm">
          <span>💰</span><span>总盈亏</span>
        </div>
        <div class="text-xl font-bold text-green-500">+34.5 BB</div>
      </div>
      <!-- GTO Conformance -->
      <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-1">
        <div class="flex items-center gap-2 text-gray-500 text-sm">
          <span>🎯</span><span>GTO 符合率</span>
        </div>
        <div class="text-xl font-bold text-green-500">72.3%</div>
      </div>
    </div>

    <!-- Recent Sessions -->
    <div class="space-y-4">
      <h2 class="text-lg font-semibold text-gray-900">最近会话</h2>
      <div class="space-y-3">

        <!-- Session 1 - Active -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center text-lg">▶️</div>
            <div>
              <div class="text-sm font-medium text-gray-900">3月22日 14:30</div>
              <div class="text-xs text-gray-500">23 手 <span class="text-blue-600 font-medium">· 进行中</span></div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-sm font-semibold text-green-500">+12.5 BB</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-green-100 text-green-700">81%</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

        <!-- Session 2 -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center text-lg">✅</div>
            <div>
              <div class="text-sm font-medium text-gray-900">3月21日 20:15</div>
              <div class="text-xs text-gray-500">85 手</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-sm font-semibold text-red-500">-8.0 BB</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-yellow-100 text-yellow-700">65%</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

        <!-- Session 3 -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center text-lg">✅</div>
            <div>
              <div class="text-sm font-medium text-gray-900">3月20日 19:00</div>
              <div class="text-xs text-gray-500">102 手</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-sm font-semibold text-green-500">+22.0 BB</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-green-100 text-green-700">78%</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

        <!-- Session 4 -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center text-lg">✅</div>
            <div>
              <div class="text-sm font-medium text-gray-900">3月19日 21:30</div>
              <div class="text-xs text-gray-500">67 手</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-sm font-semibold text-green-500">+5.5 BB</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-red-100 text-red-700">52%</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

        <!-- Session 5 -->
        <div class="w-full bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between hover:border-blue-300 hover:shadow-sm transition-all cursor-pointer">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-slate-100 rounded-lg flex items-center justify-center text-lg">✅</div>
            <div>
              <div class="text-sm font-medium text-gray-900">3月18日 15:45</div>
              <div class="text-xs text-gray-500">41 手</div>
            </div>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-sm font-semibold text-gray-600">+0.0 BB</span>
            <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-green-100 text-green-700">84%</span>
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

      </div>
    </div>

  </div>
</body>
</html>
