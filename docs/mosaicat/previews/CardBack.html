<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardBack Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-wrap gap-4 items-end">

    <!-- Large -->
    <div class="w-20 h-28 rounded-lg shadow-md border border-gray-700 overflow-hidden relative" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
      <svg class="absolute inset-0 w-full h-full opacity-20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 56" preserveAspectRatio="none">
        <defs>
          <pattern id="cp1" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M5 0 L10 5 L5 10 L0 5 Z" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="40" height="56" fill="url(#cp1)"/>
      </svg>
      <div class="absolute inset-1 rounded border border-amber-600/30"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-5 h-5 rounded-full border border-amber-500/50 flex items-center justify-center">
          <div class="w-2.5 h-2.5 rounded-full bg-amber-500/40"></div>
        </div>
      </div>
    </div>

    <!-- Medium -->
    <div class="w-14 h-20 rounded-lg shadow-md border border-gray-700 overflow-hidden relative" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
      <svg class="absolute inset-0 w-full h-full opacity-20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 56" preserveAspectRatio="none">
        <defs>
          <pattern id="cp2" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M5 0 L10 5 L5 10 L0 5 Z" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="40" height="56" fill="url(#cp2)"/>
      </svg>
      <div class="absolute inset-1 rounded border border-amber-600/30"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-4 h-4 rounded-full border border-amber-500/50 flex items-center justify-center">
          <div class="w-2 h-2 rounded-full bg-amber-500/40"></div>
        </div>
      </div>
    </div>

    <!-- Small -->
    <div class="w-10 h-14 rounded-lg shadow-md border border-gray-700 overflow-hidden relative" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
      <svg class="absolute inset-0 w-full h-full opacity-20" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 56" preserveAspectRatio="none">
        <defs>
          <pattern id="cp3" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
            <path d="M5 0 L10 5 L5 10 L0 5 Z" fill="none" stroke="#fbbf24" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="40" height="56" fill="url(#cp3)"/>
      </svg>
      <div class="absolute inset-1 rounded border border-amber-600/30"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-3 h-3 rounded-full border border-amber-500/50 flex items-center justify-center">
          <div class="w-1.5 h-1.5 rounded-full bg-amber-500/40"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="flex flex-wrap gap-4 mt-3 text-gray-400 text-xs">
    <span class="w-20 text-center">lg</span>
    <span class="w-14 text-center">md</span>
    <span class="w-10 text-center">sm</span>
  </div>
</body>
</html>
