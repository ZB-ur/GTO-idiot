<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardBack Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <p class="text-sm font-semibold text-gray-600">Small</p>
    <div class="w-10 h-14 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
      <div class="w-6 h-9 rounded border border-blue-600 bg-blue-700 opacity-80"
           style="background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px);"></div>
    </div>

    <p class="text-sm font-semibold text-gray-600 mt-4">Medium</p>
    <div class="w-14 h-20 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
      <div class="w-9 h-14 rounded border border-blue-600 bg-blue-700 opacity-80"
           style="background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px);"></div>
    </div>

    <p class="text-sm font-semibold text-gray-600 mt-4">Large</p>
    <div class="w-20 h-28 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
      <div class="w-14 h-20 rounded border border-blue-600 bg-blue-700 opacity-80"
           style="background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px);"></div>
    </div>

    <p class="text-sm font-semibold text-gray-600 mt-4">Two Card Backs (opponent hole cards)</p>
    <div class="flex gap-1.5">
      <div class="w-14 h-20 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
        <div class="w-9 h-14 rounded border border-blue-600 bg-blue-700 opacity-80"
             style="background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px);"></div>
      </div>
      <div class="w-14 h-20 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
        <div class="w-9 h-14 rounded border border-blue-600 bg-blue-700 opacity-80"
             style="background-image: repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 4px);"></div>
      </div>
    </div>
  </div>
</body>
</html>
