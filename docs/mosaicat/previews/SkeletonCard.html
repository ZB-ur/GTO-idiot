<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-sm space-y-4">
    <!-- Card 1 -->
    <div class="rounded-2xl bg-gray-900 border border-gray-800 p-5 animate-pulse">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-lg bg-gray-800"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 w-3/5 rounded-lg bg-gray-800"></div>
          <div class="h-3 w-2/5 rounded-lg bg-gray-800"></div>
        </div>
      </div>
      <div class="space-y-2">
        <div class="h-3 w-full rounded-lg bg-gray-800"></div>
        <div class="h-3 w-4/5 rounded-lg bg-gray-800"></div>
      </div>
    </div>
    <!-- Card 2 -->
    <div class="rounded-2xl bg-gray-900 border border-gray-800 p-5 animate-pulse">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-10 w-10 rounded-lg bg-gray-800"></div>
        <div class="flex-1 space-y-2">
          <div class="h-4 w-3/5 rounded-lg bg-gray-800"></div>
          <div class="h-3 w-2/5 rounded-lg bg-gray-800"></div>
        </div>
      </div>
      <div class="space-y-2">
        <div class="h-3 w-full rounded-lg bg-gray-800"></div>
        <div class="h-3 w-4/5 rounded-lg bg-gray-800"></div>
      </div>
    </div>
  </div>
</body>
</html>
