<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <p class="text-sm text-gray-500 mb-4 font-semibold">SkeletonCard — Loading Placeholder</p>

  <div class="max-w-sm">
    <!-- Single skeleton card -->
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm pulse">
      <div class="h-4 bg-gray-200 rounded-lg w-3/4 mb-4"></div>
      <div class="h-3 bg-gray-100 rounded-lg w-1/2 mb-6"></div>
      <div class="space-y-3">
        <div class="h-3 bg-gray-100 rounded-lg w-full"></div>
        <div class="h-3 bg-gray-100 rounded-lg w-5/6"></div>
        <div class="h-3 bg-gray-100 rounded-lg w-2/3"></div>
      </div>
      <div class="mt-6 flex items-center gap-3">
        <div class="w-8 h-8 bg-gray-200 rounded-full"></div>
        <div class="h-3 bg-gray-100 rounded-lg w-24"></div>
      </div>
    </div>

    <!-- Stacked skeleton list -->
    <div class="mt-4 bg-white border border-gray-200 rounded-xl p-6 shadow-sm pulse">
      <div class="h-4 bg-gray-200 rounded-lg w-2/3 mb-4"></div>
      <div class="h-3 bg-gray-100 rounded-lg w-1/3 mb-6"></div>
      <div class="space-y-3">
        <div class="h-3 bg-gray-100 rounded-lg w-full"></div>
        <div class="h-3 bg-gray-100 rounded-lg w-4/5"></div>
      </div>
      <div class="mt-6 flex items-center gap-3">
        <div class="w-8 h-8 bg-gray-200 rounded-full"></div>
        <div class="h-3 bg-gray-100 rounded-lg w-20"></div>
      </div>
    </div>
  </div>
</body>
</html>
