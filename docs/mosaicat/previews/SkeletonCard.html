<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="max-w-sm">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
      <!-- Title -->
      <div class="h-5 w-2/5 bg-gray-200 rounded-lg animate-pulse mb-4"></div>
      <!-- Lines -->
      <div class="h-3.5 w-full bg-gray-200 rounded-lg animate-pulse mb-3"></div>
      <div class="h-3.5 w-full bg-gray-200 rounded-lg animate-pulse mb-3"></div>
      <div class="h-3.5 w-3/5 bg-gray-200 rounded-lg animate-pulse"></div>
    </div>
  </div>
</body>
</html>
