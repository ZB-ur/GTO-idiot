<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommunityCards Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #064e3b; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-10 p-6">
    <p class="text-gray-300 text-sm font-semibold uppercase tracking-wider">CommunityCards — Stages</p>

    <!-- Preflop: no cards -->
    <div>
      <p class="text-gray-400 text-xs mb-3">Preflop (0 cards)</p>
      <div class="flex items-center gap-2">
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
      </div>
    </div>

    <!-- Flop: 3 cards -->
    <div>
      <p class="text-gray-400 text-xs mb-3">Flop (3 cards)</p>
      <div class="flex items-center gap-2">
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♥</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
        </div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative" style="color:#1f2937">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♠</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
        </div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♦</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
        </div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
      </div>
    </div>

    <!-- Turn: 4 cards -->
    <div>
      <p class="text-gray-400 text-xs mb-3">Turn (4 cards)</p>
      <div class="flex items-center gap-2">
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♥</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
        </div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative" style="color:#1f2937">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♠</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
        </div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♦</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
        </div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative" style="color:#1f2937">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">J</span><span class="text-base">♣</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♣</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">J</span><span class="text-base">♣</span></div>
        </div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg border-2 border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
      </div>
    </div>

    <!-- River: 5 cards -->
    <div>
      <p class="text-gray-400 text-xs mb-3">River (5 cards)</p>
      <div class="flex items-center gap-2">
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♥</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
        </div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative" style="color:#1f2937">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♠</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
        </div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♦</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
        </div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative" style="color:#1f2937">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">J</span><span class="text-base">♣</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♣</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">J</span><span class="text-base">♣</span></div>
        </div>
        <div class="w-1"></div>
        <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative" style="color:#1f2937">
          <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">2</span><span class="text-base">♠</span></div>
          <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♠</span></div>
          <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">2</span><span class="text-base">♠</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
