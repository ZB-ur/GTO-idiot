<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommunityCards Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 40px; align-items: center; padding-top: 24px;">

    <!-- Preflop — no cards -->
    <div>
      <p class="text-gray-400 text-sm mb-3 text-center">Preflop — No cards</p>
      <div class="flex items-center justify-center gap-2">
        <div class="w-16 rounded-lg border-2 border-dashed border-gray-600" style="min-height: 88px; background: rgba(31,41,55,0.3);"></div>
        <div class="w-16 rounded-lg border-2 border-dashed border-gray-600" style="min-height: 88px; background: rgba(31,41,55,0.3);"></div>
        <div class="w-16 rounded-lg border-2 border-dashed border-gray-600" style="min-height: 88px; background: rgba(31,41,55,0.3);"></div>
        <div class="w-16 rounded-lg border-2 border-dashed border-gray-600" style="min-height: 88px; background: rgba(31,41,55,0.3);"></div>
        <div class="w-16 rounded-lg border-2 border-dashed border-gray-600" style="min-height: 88px; background: rgba(31,41,55,0.3);"></div>
      </div>
    </div>

    <!-- Flop — 3 cards -->
    <div>
      <p class="text-gray-400 text-sm mb-3 text-center">Flop — A♠ K♥ 7♦</p>
      <div class="flex items-center justify-center gap-2">
        <!-- A♠ -->
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-gray-900">
            <div>A</div><div class="text-xs">♠</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-gray-900">♠</div>
        </div>
        <!-- K♥ -->
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-red-500">
            <div>K</div><div class="text-xs">♥</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-red-500">♥</div>
        </div>
        <!-- 7♦ -->
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-red-500">
            <div>7</div><div class="text-xs">♦</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-red-500">♦</div>
        </div>
        <!-- empty slots -->
        <div class="w-16 rounded-lg border-2 border-dashed border-gray-600" style="min-height: 88px; background: rgba(31,41,55,0.3);"></div>
        <div class="w-16 rounded-lg border-2 border-dashed border-gray-600" style="min-height: 88px; background: rgba(31,41,55,0.3);"></div>
      </div>
    </div>

    <!-- River — 5 cards -->
    <div>
      <p class="text-gray-400 text-sm mb-3 text-center">River — A♠ K♥ 7♦ 2♣ T♠</p>
      <div class="flex items-center justify-center gap-2">
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-gray-900">
            <div>A</div><div class="text-xs">♠</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-gray-900">♠</div>
        </div>
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-red-500">
            <div>K</div><div class="text-xs">♥</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-red-500">♥</div>
        </div>
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-red-500">
            <div>7</div><div class="text-xs">♦</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-red-500">♦</div>
        </div>
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-gray-900">
            <div>2</div><div class="text-xs">♣</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-gray-900">♣</div>
        </div>
        <div class="relative w-16 rounded-lg border-2 border-gray-300 shadow-md bg-white" style="min-height: 88px;">
          <div class="absolute top-1 left-1.5 font-bold text-sm leading-none text-gray-900">
            <div>T</div><div class="text-xs">♠</div>
          </div>
          <div class="absolute inset-0 flex items-center justify-center text-2xl text-gray-900">♠</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
