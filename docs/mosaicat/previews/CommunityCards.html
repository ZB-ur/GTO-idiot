<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="space-y-6">
  <div>
    <p class="text-sm text-gray-500 mb-2">Flop (3 cards)</p>
    <div class="flex items-center justify-center gap-2 bg-emerald-800 rounded-xl p-4 max-w-sm">
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-red-600">K</span>
        <span class="text-sm text-red-600">♥</span>
      </div>
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-gray-900">9</span>
        <span class="text-sm text-gray-900">♠</span>
      </div>
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-red-600">4</span>
        <span class="text-sm text-red-600">♦</span>
      </div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/30"></div>
      <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-600/30"></div>
    </div>
  </div>

  <div>
    <p class="text-sm text-gray-500 mb-2">River (5 cards)</p>
    <div class="flex items-center justify-center gap-2 bg-emerald-800 rounded-xl p-4 max-w-sm">
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-red-600">K</span>
        <span class="text-sm text-red-600">♥</span>
      </div>
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-gray-900">9</span>
        <span class="text-sm text-gray-900">♠</span>
      </div>
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-red-600">4</span>
        <span class="text-sm text-red-600">♦</span>
      </div>
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-gray-900">7</span>
        <span class="text-sm text-gray-900">♣</span>
      </div>
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-sm font-bold text-red-600">A</span>
        <span class="text-sm text-red-600">♥</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
