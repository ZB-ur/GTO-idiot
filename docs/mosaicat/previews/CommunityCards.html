<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CommunityCards Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-8">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wide">CommunityCards — Progressive Reveal</p>

    <!-- Preflop: no cards -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Preflop (0 cards)</p>
      <div class="inline-flex items-center justify-center gap-2 p-4 rounded-2xl bg-emerald-900/40 border border-emerald-700/30">
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
      </div>
    </div>

    <!-- Flop: 3 cards -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Flop (3 cards)</p>
      <div class="inline-flex items-center justify-center gap-2 p-4 rounded-2xl bg-emerald-900/40 border border-emerald-700/30">
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-gray-900">A</span>
          <span class="text-sm leading-none text-gray-900">♠</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-red-500">K</span>
          <span class="text-sm leading-none text-red-500">♥</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-gray-900">7</span>
          <span class="text-sm leading-none text-gray-900">♣</span>
        </div>
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
      </div>
    </div>

    <!-- Turn: 4 cards -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Turn (4 cards)</p>
      <div class="inline-flex items-center justify-center gap-2 p-4 rounded-2xl bg-emerald-900/40 border border-emerald-700/30">
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-gray-900">A</span>
          <span class="text-sm leading-none text-gray-900">♠</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-red-500">K</span>
          <span class="text-sm leading-none text-red-500">♥</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-gray-900">7</span>
          <span class="text-sm leading-none text-gray-900">♣</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-red-500">Q</span>
          <span class="text-sm leading-none text-red-500">♦</span>
        </div>
        <div class="w-14 h-20 rounded-lg border border-dashed border-emerald-700/50 bg-emerald-900/30"></div>
      </div>
    </div>

    <!-- River: 5 cards -->
    <div>
      <p class="text-gray-500 text-xs mb-2">River (5 cards)</p>
      <div class="inline-flex items-center justify-center gap-2 p-4 rounded-2xl bg-emerald-900/40 border border-emerald-700/30">
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-gray-900">A</span>
          <span class="text-sm leading-none text-gray-900">♠</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-red-500">K</span>
          <span class="text-sm leading-none text-red-500">♥</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-gray-900">7</span>
          <span class="text-sm leading-none text-gray-900">♣</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-red-500">Q</span>
          <span class="text-sm leading-none text-red-500">♦</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-white border border-gray-300 shadow-lg shadow-black/40 flex flex-col items-center justify-center gap-0 select-none">
          <span class="text-lg font-bold leading-none text-gray-900">2</span>
          <span class="text-sm leading-none text-gray-900">♠</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
