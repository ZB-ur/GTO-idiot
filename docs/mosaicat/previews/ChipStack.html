<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChipStack Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">ChipStack Component</h2>

  <p class="text-sm text-gray-600 mb-2">Sizes: sm / md / lg</p>
  <div class="flex items-end gap-8 mb-8">
    <!-- Small - 5BB -->
    <div class="flex flex-col items-center">
      <div class="flex flex-col-reverse items-center w-6">
        <div class="w-6 h-2 rounded-full border-2 bg-green-500 border-green-700"></div>
        <div class="w-6 h-2 rounded-full border-2 bg-gray-100 border-gray-300 -mt-1"></div>
      </div>
      <span class="text-xs font-semibold text-gray-900 mt-1">5 BB</span>
    </div>

    <!-- Medium - 25BB -->
    <div class="flex flex-col items-center">
      <div class="flex flex-col-reverse items-center w-8">
        <div class="w-8 h-2.5 rounded-full border-2 bg-green-500 border-green-700"></div>
        <div class="w-8 h-2.5 rounded-full border-2 bg-red-500 border-red-700 -mt-1"></div>
        <div class="w-8 h-2.5 rounded-full border-2 bg-blue-500 border-blue-700 -mt-1"></div>
      </div>
      <span class="text-sm font-semibold text-gray-900 mt-1">25 BB</span>
    </div>

    <!-- Large - 150BB -->
    <div class="flex flex-col items-center">
      <div class="flex flex-col-reverse items-center w-10">
        <div class="w-10 h-3 rounded-full border-2 bg-gray-800 border-gray-900"></div>
        <div class="w-10 h-3 rounded-full border-2 bg-blue-500 border-blue-700 -mt-1.5"></div>
        <div class="w-10 h-3 rounded-full border-2 bg-green-500 border-green-700 -mt-1.5"></div>
        <div class="w-10 h-3 rounded-full border-2 bg-red-500 border-red-700 -mt-1.5"></div>
        <div class="w-10 h-3 rounded-full border-2 bg-gray-100 border-gray-300 -mt-1.5"></div>
      </div>
      <span class="text-base font-semibold text-gray-900 mt-1">150 BB</span>
    </div>
  </div>

  <!-- On felt context -->
  <p class="text-sm text-gray-600 mb-2">On Table Felt</p>
  <div class="bg-emerald-800 border-2 border-emerald-900 rounded-xl p-6 flex items-end justify-center gap-10">
    <!-- Pot -->
    <div class="flex flex-col items-center">
      <span class="text-xs text-emerald-200 mb-1">Pot</span>
      <div class="flex flex-col-reverse items-center w-8">
        <div class="w-8 h-2.5 rounded-full border-2 bg-gray-800 border-gray-900"></div>
        <div class="w-8 h-2.5 rounded-full border-2 bg-blue-500 border-blue-700 -mt-1"></div>
        <div class="w-8 h-2.5 rounded-full border-2 bg-red-500 border-red-700 -mt-1"></div>
        <div class="w-8 h-2.5 rounded-full border-2 bg-green-500 border-green-700 -mt-1"></div>
      </div>
      <span class="text-sm font-semibold text-white mt-1">42 BB</span>
    </div>

    <!-- Player bet -->
    <div class="flex flex-col items-center">
      <span class="text-xs text-emerald-200 mb-1">Your Bet</span>
      <div class="flex flex-col-reverse items-center w-8">
        <div class="w-8 h-2.5 rounded-full border-2 bg-red-500 border-red-700"></div>
        <div class="w-8 h-2.5 rounded-full border-2 bg-gray-100 border-gray-300 -mt-1"></div>
      </div>
      <span class="text-sm font-semibold text-white mt-1">8 BB</span>
    </div>

    <!-- Opponent bet -->
    <div class="flex flex-col items-center">
      <span class="text-xs text-emerald-200 mb-1">Opponent</span>
      <div class="flex flex-col-reverse items-center w-8">
        <div class="w-8 h-2.5 rounded-full border-2 bg-green-500 border-green-700"></div>
        <div class="w-8 h-2.5 rounded-full border-2 bg-red-500 border-red-700 -mt-1"></div>
      </div>
      <span class="text-sm font-semibold text-white mt-1">12 BB</span>
    </div>
  </div>
</body>
</html>
