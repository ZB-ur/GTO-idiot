<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChipStack Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="space-y-6">
    <p class="text-sm font-semibold text-gray-500 mb-3">Chip Stacks</p>
    <div class="flex items-end gap-10">

      <!-- Small stack: 15 -->
      <div class="inline-flex flex-col items-center">
        <div class="flex flex-col-reverse items-center">
          <div class="w-6 h-1.5 rounded-full border-2 bg-red-500 border-red-700" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-6 h-1.5 rounded-full border-2 bg-red-500 border-red-700 -mt-0.5" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-6 h-1.5 rounded-full border-2 bg-red-500 border-red-700 -mt-0.5" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
        </div>
        <span class="text-xs font-semibold text-gray-900 mt-1">15</span>
      </div>

      <!-- Medium stack: 250 -->
      <div class="inline-flex flex-col items-center">
        <div class="flex flex-col-reverse items-center">
          <div class="w-8 h-2 rounded-full border-2 bg-gray-800 border-gray-950" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-8 h-2 rounded-full border-2 bg-gray-800 border-gray-950 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-8 h-2 rounded-full border-2 bg-green-500 border-green-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-8 h-2 rounded-full border-2 bg-green-500 border-green-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
        </div>
        <span class="text-sm font-semibold text-gray-900 mt-1">250</span>
      </div>

      <!-- Large stack: 1,500 -->
      <div class="inline-flex flex-col items-center">
        <div class="flex flex-col-reverse items-center">
          <div class="w-10 h-2.5 rounded-full border-2 bg-yellow-400 border-yellow-600" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-purple-500 border-purple-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-gray-800 border-gray-950 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-gray-800 border-gray-950 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-gray-800 border-gray-950 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-gray-800 border-gray-950 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-gray-800 border-gray-950 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
        </div>
        <span class="text-base font-semibold text-gray-900 mt-1">1,500</span>
      </div>

      <!-- Big stack: 5,000 -->
      <div class="inline-flex flex-col items-center">
        <div class="flex flex-col-reverse items-center">
          <div class="w-10 h-2.5 rounded-full border-2 bg-yellow-400 border-yellow-600" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-yellow-400 border-yellow-600 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-yellow-400 border-yellow-600 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-yellow-400 border-yellow-600 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-yellow-400 border-yellow-600 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-purple-500 border-purple-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-purple-500 border-purple-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-purple-500 border-purple-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-purple-500 border-purple-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
          <div class="w-10 h-2.5 rounded-full border-2 bg-purple-500 border-purple-700 -mt-1" style="box-shadow:0 1px 1px rgba(0,0,0,0.15)"></div>
        </div>
        <span class="text-base font-semibold text-gray-900 mt-1">5,000</span>
      </div>
    </div>
  </div>
</body>
</html>
