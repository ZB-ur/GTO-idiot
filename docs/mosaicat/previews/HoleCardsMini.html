<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoleCardsMini Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-4">
    <p class="text-sm font-semibold text-gray-600">Mini Cards — History List Context</p>

    <!-- Row 1: A♥ K♠ -->
    <div class="flex items-center gap-3">
      <div class="flex gap-0.5">
        <div class="w-7 h-10 rounded bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
          <span class="text-xs font-bold leading-none text-red-600">A</span>
          <span class="leading-none text-red-600" style="font-size: 9px;">♥</span>
        </div>
        <div class="w-7 h-10 rounded bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
          <span class="text-xs font-bold leading-none text-gray-900">K</span>
          <span class="leading-none text-gray-900" style="font-size: 9px;">♠</span>
        </div>
      </div>
      <span class="text-sm text-gray-600">A♥ K♠</span>
    </div>

    <!-- Row 2: Q♦ J♣ -->
    <div class="flex items-center gap-3">
      <div class="flex gap-0.5">
        <div class="w-7 h-10 rounded bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
          <span class="text-xs font-bold leading-none text-red-600">Q</span>
          <span class="leading-none text-red-600" style="font-size: 9px;">♦</span>
        </div>
        <div class="w-7 h-10 rounded bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
          <span class="text-xs font-bold leading-none text-gray-900">J</span>
          <span class="leading-none text-gray-900" style="font-size: 9px;">♣</span>
        </div>
      </div>
      <span class="text-sm text-gray-600">Q♦ J♣</span>
    </div>

    <!-- Row 3: 7♥ 2♠ -->
    <div class="flex items-center gap-3">
      <div class="flex gap-0.5">
        <div class="w-7 h-10 rounded bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
          <span class="text-xs font-bold leading-none text-red-600">7</span>
          <span class="leading-none text-red-600" style="font-size: 9px;">♥</span>
        </div>
        <div class="w-7 h-10 rounded bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
          <span class="text-xs font-bold leading-none text-gray-900">2</span>
          <span class="leading-none text-gray-900" style="font-size: 9px;">♠</span>
        </div>
      </div>
      <span class="text-sm text-gray-600">7♥ 2♠</span>
    </div>
  </div>
</body>
</html>
