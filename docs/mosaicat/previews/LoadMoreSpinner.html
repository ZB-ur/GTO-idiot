<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoadMoreSpinner Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div class="max-w-sm bg-gray-900 rounded-xl border border-gray-700 overflow-hidden">
    <!-- Mock list items above spinner -->
    <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
      <span class="text-sm text-gray-100">Hand #4821 — KK vs AQs</span>
      <span class="text-xs text-emerald-400">+$340</span>
    </div>
    <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
      <span class="text-sm text-gray-100">Hand #4820 — 97s bluff</span>
      <span class="text-xs text-red-400">-$180</span>
    </div>
    <div class="px-4 py-3 border-b border-gray-800 flex items-center justify-between">
      <span class="text-sm text-gray-100">Hand #4819 — AA 3-bet pot</span>
      <span class="text-xs text-emerald-400">+$560</span>
    </div>

    <!-- Spinner -->
    <div class="flex items-center justify-center py-4">
      <svg class="animate-spin h-6 w-6 text-emerald-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span class="ml-2 text-sm text-gray-500">Loading...</span>
    </div>
  </div>
</body>
</html>
