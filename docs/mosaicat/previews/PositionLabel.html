<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PositionLabel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <!-- Dark background to simulate table context -->
  <div class="inline-flex flex-wrap gap-3 rounded-xl bg-emerald-900 p-6">
    <span class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide bg-sky-500/20 text-sky-300 border-sky-500/30">UTG</span>
    <span class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide bg-violet-500/20 text-violet-300 border-violet-500/30">MP</span>
    <span class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide bg-amber-500/20 text-amber-300 border-amber-500/30">CO</span>
    <span class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide bg-emerald-500/20 text-emerald-300 border-emerald-500/30">BTN</span>
    <span class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide bg-gray-500/20 text-gray-300 border-gray-500/30">SB</span>
    <span class="inline-flex items-center rounded-md border px-1.5 py-0.5 text-[10px] font-bold uppercase tracking-wide bg-gray-500/20 text-gray-300 border-gray-500/30">BB</span>
  </div>
</body>
</html>
