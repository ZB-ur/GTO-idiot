<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ErrorCategoryList Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 24px; max-width: 480px; margin: 0 auto;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">ErrorCategoryList — With Expanded Card</p>

    <!-- Header -->
    <div class="flex items-center justify-between">
      <h3 class="text-sm font-semibold text-gray-200">Error Categories</h3>
      <span class="text-xs text-gray-500" style="font-variant-numeric: tabular-nums;">45 total errors</span>
    </div>

    <!-- List -->
    <div class="flex flex-col gap-2">

      <!-- 1: Over-opening UTG (red, expanded) -->
      <div>
        <div class="w-full text-left rounded-xl border p-4 bg-red-900/15 border-red-800/30">
          <div class="flex items-center gap-3">
            <span class="flex-shrink-0 w-3 h-3 rounded-full bg-red-400"></span>
            <div class="flex-1 min-w-0">
              <div class="flex items-center justify-between mb-1">
                <span class="text-sm text-gray-200 font-medium">Over-opening from UTG</span>
                <span class="text-xs text-gray-400 font-semibold ml-2 flex-shrink-0" style="font-variant-numeric: tabular-nums;">15x (33.3%)</span>
              </div>
              <div class="w-full h-1.5 bg-gray-700/50 rounded-full overflow-hidden">
                <div class="h-full rounded-full bg-red-500" style="width: 33.3%;"></div>
              </div>
            </div>
            <svg class="w-4 h-4 text-gray-500 flex-shrink-0 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>
        <!-- Expanded detail -->
        <div class="px-4 py-3 ml-6 mt-1 rounded-lg bg-gray-800/40 border border-gray-700/40">
          <div class="flex items-center justify-between">
            <div>
              <span class="inline-block px-2 py-0.5 rounded text-[10px] font-bold bg-red-400 text-black mr-2">Major</span>
              <span class="text-xs text-gray-400">15 occurrences</span>
            </div>
            <button class="text-xs text-emerald-400 font-medium">View Hands →</button>
          </div>
        </div>
      </div>

      <!-- 2: Missing 3-bet (red) -->
      <div class="w-full text-left rounded-xl border p-4 bg-red-900/15 border-red-800/30">
        <div class="flex items-center gap-3">
          <span class="flex-shrink-0 w-3 h-3 rounded-full bg-red-400"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-sm text-gray-200 font-medium">Missing 3-bet with premium hands</span>
              <span class="text-xs text-gray-400 font-semibold ml-2 flex-shrink-0" style="font-variant-numeric: tabular-nums;">10x (22.2%)</span>
            </div>
            <div class="w-full h-1.5 bg-gray-700/50 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-red-500" style="width: 22.2%;"></div>
            </div>
          </div>
          <svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- 3: C-bet sizing (yellow) -->
      <div class="w-full text-left rounded-xl border p-4 bg-amber-900/15 border-amber-800/30">
        <div class="flex items-center gap-3">
          <span class="flex-shrink-0 w-3 h-3 rounded-full bg-amber-400"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-sm text-gray-200 font-medium">C-bet sizing too large</span>
              <span class="text-xs text-gray-400 font-semibold ml-2 flex-shrink-0" style="font-variant-numeric: tabular-nums;">8x (17.8%)</span>
            </div>
            <div class="w-full h-1.5 bg-gray-700/50 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-amber-500" style="width: 17.8%;"></div>
            </div>
          </div>
          <svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- 4: Calling too wide (yellow) -->
      <div class="w-full text-left rounded-xl border p-4 bg-amber-900/15 border-amber-800/30">
        <div class="flex items-center gap-3">
          <span class="flex-shrink-0 w-3 h-3 rounded-full bg-amber-400"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-sm text-gray-200 font-medium">Calling too wide on river</span>
              <span class="text-xs text-gray-400 font-semibold ml-2 flex-shrink-0" style="font-variant-numeric: tabular-nums;">7x (15.6%)</span>
            </div>
            <div class="w-full h-1.5 bg-gray-700/50 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-amber-500" style="width: 15.6%;"></div>
            </div>
          </div>
          <svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

      <!-- 5: Check-raising frequency (green/low) -->
      <div class="w-full text-left rounded-xl border p-4 bg-emerald-900/15 border-emerald-800/30">
        <div class="flex items-center gap-3">
          <span class="flex-shrink-0 w-3 h-3 rounded-full bg-emerald-400"></span>
          <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
              <span class="text-sm text-gray-200 font-medium">Low check-raise frequency</span>
              <span class="text-xs text-gray-400 font-semibold ml-2 flex-shrink-0" style="font-variant-numeric: tabular-nums;">5x (11.1%)</span>
            </div>
            <div class="w-full h-1.5 bg-gray-700/50 rounded-full overflow-hidden">
              <div class="h-full rounded-full bg-emerald-500" style="width: 11.1%;"></div>
            </div>
          </div>
          <svg class="w-4 h-4 text-gray-500 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
