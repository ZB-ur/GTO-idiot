<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="grid grid-cols-3 gap-6 p-8 max-w-3xl">
    <!-- Card 1 -->
    <div class="bg-[#1e293b] border border-gray-700 rounded-xl p-6 hover:border-emerald-500/50 transition-colors">
      <div class="w-12 h-12 rounded-lg bg-emerald-500/10 flex items-center justify-center text-2xl mb-4">🎯</div>
      <h3 class="text-gray-100 text-lg font-semibold mb-2">Real-Time Replay</h3>
      <p class="text-gray-400 text-sm leading-relaxed">Replay every hand with animated action sequences and decision breakdowns.</p>
    </div>
    <!-- Card 2 -->
    <div class="bg-[#1e293b] border border-gray-700 rounded-xl p-6 hover:border-emerald-500/50 transition-colors">
      <div class="w-12 h-12 rounded-lg bg-emerald-500/10 flex items-center justify-center text-2xl mb-4">📊</div>
      <h3 class="text-gray-100 text-lg font-semibold mb-2">Deep Analytics</h3>
      <p class="text-gray-400 text-sm leading-relaxed">Track your VPIP, PFR, aggression factor, and dozens of key metrics over time.</p>
    </div>
    <!-- Card 3 -->
    <div class="bg-[#1e293b] border border-gray-700 rounded-xl p-6 hover:border-emerald-500/50 transition-colors">
      <div class="w-12 h-12 rounded-lg bg-emerald-500/10 flex items-center justify-center text-2xl mb-4">🃏</div>
      <h3 class="text-gray-100 text-lg font-semibold mb-2">Range Viewer</h3>
      <p class="text-gray-400 text-sm leading-relaxed">Visualize preflop ranges with intuitive color-coded 13×13 grid charts.</p>
    </div>
  </div>
</body>
</html>
