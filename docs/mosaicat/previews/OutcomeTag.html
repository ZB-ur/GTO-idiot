<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OutcomeTag Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-wrap gap-3">
    <!-- Won at Showdown -->
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-emerald-400/15 text-emerald-400 border-emerald-400/30">
      Won at Showdown
    </span>

    <!-- Lost at Showdown -->
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-red-400/15 text-red-400 border-red-400/30">
      Lost at Showdown
    </span>

    <!-- Folded Preflop -->
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-gray-400/15 text-gray-400 border-gray-400/30">
      Folded Preflop
    </span>

    <!-- Folded Postflop -->
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-amber-400/15 text-amber-400 border-amber-400/30">
      Folded Postflop
    </span>

    <!-- Won (No Showdown) -->
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-emerald-400/15 text-emerald-400 border-emerald-400/30">
      Won (No Showdown)
    </span>

    <!-- Split Pot -->
    <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-sky-400/15 text-sky-400 border-sky-400/30">
      Split Pot
    </span>
  </div>
</body>
</html>
