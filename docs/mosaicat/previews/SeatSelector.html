<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeatSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-6">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wide">SeatSelector — States</p>

    <div class="flex items-center gap-4 flex-wrap">
      <!-- Empty / unselected -->
      <div class="flex flex-col items-center gap-1">
        <p class="text-gray-500 text-xs">Empty</p>
        <button class="relative flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-gray-800 border-2 border-gray-700">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-500">UTG</span>
          <span class="text-sm text-gray-600 mt-1">Empty</span>
        </button>
      </div>

      <!-- Player selected -->
      <div class="flex flex-col items-center gap-1">
        <p class="text-gray-500 text-xs">Player</p>
        <button class="relative flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-amber-500/20 border-2 border-amber-500 shadow-lg shadow-amber-500/20">
          <span class="text-xs font-bold uppercase tracking-wider text-amber-400">CO</span>
          <span class="text-sm font-semibold mt-1 text-amber-300">You</span>
          <div class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-amber-500 flex items-center justify-center">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#030712" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12" />
            </svg>
          </div>
        </button>
      </div>

      <!-- Bot TAG -->
      <div class="flex flex-col items-center gap-1">
        <p class="text-gray-500 text-xs">Bot (TAG)</p>
        <button class="relative flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-emerald-600/20 border-2 border-emerald-600 shadow-lg shadow-emerald-600/20">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">BTN</span>
          <span class="text-sm font-semibold mt-1 text-emerald-300">TAG</span>
        </button>
      </div>

      <!-- Bot LAG -->
      <div class="flex flex-col items-center gap-1">
        <p class="text-gray-500 text-xs">Bot (LAG)</p>
        <button class="relative flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-emerald-600/20 border-2 border-emerald-600 shadow-lg shadow-emerald-600/20">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">SB</span>
          <span class="text-sm font-semibold mt-1 text-emerald-300">LAG</span>
        </button>
      </div>

      <!-- Bot Fish -->
      <div class="flex flex-col items-center gap-1">
        <p class="text-gray-500 text-xs">Bot (Fish)</p>
        <button class="relative flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-emerald-600/20 border-2 border-emerald-600 shadow-lg shadow-emerald-600/20">
          <span class="text-xs font-bold uppercase tracking-wider text-emerald-400">BB</span>
          <span class="text-sm font-semibold mt-1 text-emerald-300">Fish</span>
        </button>
      </div>

      <!-- Empty MP -->
      <div class="flex flex-col items-center gap-1">
        <p class="text-gray-500 text-xs">Empty</p>
        <button class="relative flex flex-col items-center justify-center w-20 h-20 rounded-2xl bg-gray-800 border-2 border-gray-700">
          <span class="text-xs font-bold uppercase tracking-wider text-gray-500">MP</span>
          <span class="text-sm text-gray-600 mt-1">Empty</span>
        </button>
      </div>
    </div>

    <!-- Table layout arrangement -->
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wide mt-4">6-Max Table Layout</p>
    <div class="relative w-80 h-56 mx-auto">
      <!-- Oval table -->
      <div class="absolute inset-4 rounded-full bg-emerald-900/40 border-2 border-emerald-700/30"></div>

      <!-- UTG - top left -->
      <button class="absolute top-0 left-8 flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-emerald-600/20 border-2 border-emerald-600">
        <span class="text-[10px] font-bold uppercase text-emerald-400">UTG</span>
        <span class="text-xs font-semibold text-emerald-300">TAG</span>
      </button>

      <!-- MP - top right -->
      <button class="absolute top-0 right-8 flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-emerald-600/20 border-2 border-emerald-600">
        <span class="text-[10px] font-bold uppercase text-emerald-400">MP</span>
        <span class="text-xs font-semibold text-emerald-300">Nit</span>
      </button>

      <!-- CO - right -->
      <button class="absolute top-1/2 -translate-y-1/2 right-0 flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-amber-500/20 border-2 border-amber-500 shadow-lg shadow-amber-500/20">
        <span class="text-[10px] font-bold uppercase text-amber-400">CO</span>
        <span class="text-xs font-semibold text-amber-300">You</span>
      </button>

      <!-- BTN - bottom right -->
      <button class="absolute bottom-0 right-8 flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-emerald-600/20 border-2 border-emerald-600">
        <span class="text-[10px] font-bold uppercase text-emerald-400">BTN</span>
        <span class="text-xs font-semibold text-emerald-300">LAG</span>
      </button>

      <!-- SB - bottom left -->
      <button class="absolute bottom-0 left-8 flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-emerald-600/20 border-2 border-emerald-600">
        <span class="text-[10px] font-bold uppercase text-emerald-400">SB</span>
        <span class="text-xs font-semibold text-emerald-300">Fish</span>
      </button>

      <!-- BB - left -->
      <button class="absolute top-1/2 -translate-y-1/2 left-0 flex flex-col items-center justify-center w-16 h-16 rounded-xl bg-gray-800 border-2 border-gray-700">
        <span class="text-[10px] font-bold uppercase text-gray-500">BB</span>
        <span class="text-xs text-gray-600">Empty</span>
      </button>
    </div>
  </div>
</body>
</html>
