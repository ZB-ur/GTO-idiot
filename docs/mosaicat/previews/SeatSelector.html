<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeatSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }
    @keyframes pulse-soft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .pulse-anim { animation: pulse-soft 2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 32px; align-items: center; padding-top: 24px;">
    <p class="text-gray-400 text-sm text-center">Seat Selection — 6 seats around table</p>

    <div class="flex flex-wrap justify-center gap-4" style="max-width: 480px;">

      <!-- Seat 1: Available (pulsing) -->
      <button class="relative flex flex-col items-center justify-center gap-1.5 w-28 h-28 rounded-xl border-2 border-gray-600 transition-all duration-300 cursor-pointer pulse-anim" style="background: rgba(31,41,55,0.4);">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold bg-gray-700 text-gray-300 border border-gray-600">1</div>
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">UTG</span>
      </button>

      <!-- Seat 2: Available (pulsing) -->
      <button class="relative flex flex-col items-center justify-center gap-1.5 w-28 h-28 rounded-xl border-2 border-gray-600 transition-all duration-300 cursor-pointer pulse-anim" style="background: rgba(31,41,55,0.4);">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold bg-gray-700 text-gray-300 border border-gray-600">2</div>
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">MP</span>
      </button>

      <!-- Seat 3: Occupied -->
      <button class="relative flex flex-col items-center justify-center gap-1.5 w-28 h-28 rounded-xl border-2 border-gray-700 cursor-not-allowed opacity-50" style="background: rgba(31,41,55,0.4);" disabled>
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold bg-gray-700 text-gray-500">3</div>
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-600">CO</span>
        <span class="text-[10px] font-medium text-gray-500">Occupied</span>
      </button>

      <!-- Seat 4: Selected -->
      <button class="relative flex flex-col items-center justify-center gap-1.5 w-28 h-28 rounded-xl border-2 border-emerald-500 shadow-lg" style="background: rgba(16,185,129,0.2); box-shadow: 0 0 15px rgba(16,185,129,0.2);">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold bg-emerald-500 text-white">4</div>
        <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">BTN</span>
        <!-- Checkmark -->
        <div class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-emerald-500 flex items-center justify-center">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="2,6 5,9 10,3"></polyline>
          </svg>
        </div>
      </button>

      <!-- Seat 5: Available (pulsing) -->
      <button class="relative flex flex-col items-center justify-center gap-1.5 w-28 h-28 rounded-xl border-2 border-gray-600 transition-all duration-300 cursor-pointer pulse-anim" style="background: rgba(31,41,55,0.4);">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold bg-gray-700 text-gray-300 border border-gray-600">5</div>
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">SB</span>
      </button>

      <!-- Seat 6: Available (pulsing) -->
      <button class="relative flex flex-col items-center justify-center gap-1.5 w-28 h-28 rounded-xl border-2 border-gray-600 transition-all duration-300 cursor-pointer pulse-anim" style="background: rgba(31,41,55,0.4);">
        <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold bg-gray-700 text-gray-300 border border-gray-600">6</div>
        <span class="text-xs font-semibold uppercase tracking-wider text-gray-400">BB</span>
      </button>

    </div>
  </div>
</body>
</html>
