<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex gap-4 items-center">
    <!-- Has data -->
    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-xl text-xs font-medium bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
      GTO
    </span>
    <!-- No data -->
    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-xl text-xs font-medium bg-gray-800 text-gray-500 border border-gray-700">
      <span class="w-1.5 h-1.5 rounded-full bg-gray-600"></span>
      GTO
    </span>
  </div>
</body>
</html>
