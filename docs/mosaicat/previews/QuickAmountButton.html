<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex gap-2 flex-wrap">
    <!-- Inactive buttons -->
    <button class="px-3 py-1.5 rounded-xl text-sm font-medium border bg-gray-800 border-gray-700 text-gray-400 transition-all duration-150">
      1/3 Pot
    </button>
    <!-- Active button -->
    <button class="px-3 py-1.5 rounded-xl text-sm font-medium border bg-amber-500/20 border-amber-500 text-amber-400 transition-all duration-150">
      1/2 Pot
    </button>
    <button class="px-3 py-1.5 rounded-xl text-sm font-medium border bg-gray-800 border-gray-700 text-gray-400 transition-all duration-150">
      2/3 Pot
    </button>
    <button class="px-3 py-1.5 rounded-xl text-sm font-medium border bg-gray-800 border-gray-700 text-gray-400 transition-all duration-150">
      Pot
    </button>
    <button class="px-3 py-1.5 rounded-xl text-sm font-medium border bg-gray-800 border-gray-700 text-gray-400 transition-all duration-150">
      All-in
    </button>
  </div>
</body>
</html>
