<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandingScreen Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="min-h-screen bg-gray-950 flex flex-col items-center justify-center px-4 py-12">

    <!-- Logo & Title -->
    <div class="text-center mb-12">
      <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-emerald-900 border border-emerald-700 mb-6 shadow-lg shadow-black/40">
        <svg class="w-10 h-10 text-amber-500" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C10.08 2 8.5 3.58 8.5 5.5c0 .517.115 1.006.32 1.447L5.25 12l3.57 5.053A3.49 3.49 0 008.5 18.5C8.5 20.42 10.08 22 12 22s3.5-1.58 3.5-3.5c0-.517-.115-1.006-.32-1.447L18.75 12l-3.57-5.053c.205-.441.32-.93.32-1.447C15.5 3.58 13.92 2 12 2z"/>
        </svg>
      </div>
      <h1 class="text-4xl font-bold text-gray-50 mb-2 tracking-tight">GTO Idiot</h1>
      <p class="text-lg text-gray-400 max-w-md mx-auto">Master Texas Hold'em GTO strategy through practice and real-time feedback</p>
    </div>

    <!-- Action Buttons -->
    <div class="w-full max-w-sm space-y-4">

      <!-- Quick Start -->
      <button class="w-full flex items-center justify-center gap-3 px-6 py-4 bg-amber-500 hover:bg-amber-400 text-gray-950 font-semibold text-lg rounded-xl shadow-lg shadow-black/40 transition-colors duration-150">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
        </svg>
        Quick Start
      </button>

      <!-- New Session -->
      <button class="w-full flex items-center justify-center gap-3 px-6 py-4 bg-gray-800 hover:bg-gray-700 text-gray-50 font-semibold text-lg rounded-xl border border-gray-700 shadow-lg shadow-black/40 transition-colors duration-150">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/>
        </svg>
        New Session
      </button>

      <!-- Hand History Link -->
      <button class="w-full flex items-center justify-center gap-2 px-6 py-3 text-gray-400 hover:text-amber-400 font-medium text-base rounded-lg transition-colors duration-150">
        <svg class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/>
        </svg>
        View Hand History
      </button>
    </div>

    <!-- Footer -->
    <div class="mt-16 text-center">
      <p class="text-sm text-gray-500">6-max · GTO Reference · Real-time Feedback</p>
    </div>
  </div>
</body>
</html>
