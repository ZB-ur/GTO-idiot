<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotAvatar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 32px; background: #1a1a2e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex gap-8 items-start">
    <!-- TAG bot (md) -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="flex items-center justify-center w-12 h-12 text-2xl rounded-full border select-none" style="background: #334155; border-color: #4b5563;">🦊</div>
      <span class="text-sm font-medium text-gray-100">SlyFox</span>
      <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded-md border bg-red-500/20 text-red-400 border-red-500/30">TAG</span>
    </div>
    <!-- LAG bot (md) -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="flex items-center justify-center w-12 h-12 text-2xl rounded-full border select-none" style="background: #334155; border-color: #4b5563;">🔥</div>
      <span class="text-sm font-medium text-gray-100">Blaze</span>
      <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded-md border bg-amber-500/20 text-amber-400 border-amber-500/30">LAG</span>
    </div>
    <!-- Nit bot (md) -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="flex items-center justify-center w-12 h-12 text-2xl rounded-full border select-none" style="background: #334155; border-color: #4b5563;">🐢</div>
      <span class="text-sm font-medium text-gray-100">Turtle</span>
      <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded-md border bg-blue-500/20 text-blue-400 border-blue-500/30">Nit</span>
    </div>
    <!-- Fish bot (sm) -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="flex items-center justify-center w-8 h-8 text-lg rounded-full border select-none" style="background: #334155; border-color: #4b5563;">🐟</div>
      <span class="text-xs font-medium text-gray-100">Goldie</span>
      <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded-md border bg-cyan-500/20 text-cyan-400 border-cyan-500/30">Fish</span>
    </div>
    <!-- GTO bot (sm) -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="flex items-center justify-center w-8 h-8 text-lg rounded-full border select-none" style="background: #334155; border-color: #4b5563;">🤖</div>
      <span class="text-xs font-medium text-gray-100">Solver</span>
      <span class="inline-block px-2 py-0.5 text-xs font-semibold rounded-md border bg-emerald-500/20 text-emerald-400 border-emerald-500/30">GTO</span>
    </div>
  </div>
</body>
</html>
