<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTOAlignmentBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-wrap gap-4">
    <!-- Aligned -->
    <span class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-emerald-400/15 text-emerald-400 border-emerald-400/30">
      <span>✓</span>
      <span>GTO Aligned</span>
    </span>

    <!-- Deviation -->
    <span class="inline-flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded-lg border bg-orange-400/15 text-orange-400 border-orange-400/30">
      <span>✗</span>
      <span>Deviation</span>
    </span>
  </div>
</body>
</html>
