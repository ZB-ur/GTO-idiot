<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
input[type="range"] { -webkit-appearance: none; height: 8px; border-radius: 9999px; background: #e5e7eb; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #2563eb; cursor: pointer; }
</style>
</head>
<body>
<div class="max-w-md mx-auto space-y-6">
  <p class="text-sm text-gray-500 mb-2">Raise Slider — $150 selected</p>
  <div class="bg-white border border-gray-200 rounded-xl p-4 space-y-3">
    <div class="flex items-center gap-3">
      <input type="range" min="20" max="500" value="150" class="flex-1" />
      <div class="relative">
        <span class="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400 text-sm">$</span>
        <input type="text" value="150" class="w-24 pl-6 pr-2 py-1.5 text-sm font-medium border border-gray-200 rounded-lg text-right" />
      </div>
    </div>
    <div class="flex gap-2">
      <button class="flex-1 py-1.5 text-xs font-semibold rounded-lg border bg-white text-gray-700 border-gray-200">1/3 Pot</button>
      <button class="flex-1 py-1.5 text-xs font-semibold rounded-lg border bg-blue-600 text-white border-blue-600">1/2 Pot</button>
      <button class="flex-1 py-1.5 text-xs font-semibold rounded-lg border bg-white text-gray-700 border-gray-200">2/3 Pot</button>
      <button class="flex-1 py-1.5 text-xs font-semibold rounded-lg border bg-white text-gray-700 border-gray-200">Pot</button>
      <button class="flex-1 py-1.5 text-xs font-semibold rounded-lg border bg-white text-gray-700 border-gray-200">All-In</button>
    </div>
  </div>
</div>
</body>
</html>
