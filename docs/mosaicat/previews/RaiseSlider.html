<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaiseSlider Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 8px;
      background: transparent;
      cursor: pointer;
      position: absolute;
      top: 4px;
      left: 0;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="max-w-sm mx-auto space-y-8">

    <!-- State 1: Default / Mid-range raise -->
    <div>
      <p class="text-xs text-gray-400 mb-2 font-medium uppercase tracking-wide">Default — Mid Range</p>
      <div class="w-full bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
        <!-- Header -->
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-600">加注到</span>
          <div class="flex items-center gap-2">
            <div class="w-24 text-right text-lg font-bold text-gray-900 bg-slate-50 border border-gray-200 rounded-lg px-3 py-1.5">
              600
            </div>
          </div>
        </div>
        <!-- Slider -->
        <div class="relative pt-1 pb-1">
          <div class="relative h-2 bg-gray-200 rounded-full">
            <div class="absolute h-2 bg-blue-600 rounded-full" style="width: 4.2%"></div>
          </div>
          <div class="absolute top-0 w-5 h-5 bg-white border-2 border-blue-600 rounded-full shadow-md -translate-y-[6px] pointer-events-none" style="left: 4.2%; transform: translateX(-50%) translateY(-6px)"></div>
        </div>
        <div class="flex justify-between text-xs text-gray-400">
          <span>400</span>
          <span>10,000</span>
        </div>
        <!-- Presets -->
        <div class="flex gap-2">
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-gray-700 border-gray-200">2x</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-blue-600 text-white border-blue-600">3x</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-gray-700 border-gray-200">Pot</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-red-500 border-gray-200">All In</button>
        </div>
        <!-- Actions -->
        <div class="flex gap-3 pt-1">
          <button class="flex-1 py-2.5 text-sm font-semibold text-gray-600 bg-slate-50 border border-gray-200 rounded-lg">取消</button>
          <button class="flex-1 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg">加注 600</button>
        </div>
      </div>
    </div>

    <!-- State 2: High raise, near pot -->
    <div>
      <p class="text-xs text-gray-400 mb-2 font-medium uppercase tracking-wide">High Raise — Pot Selected</p>
      <div class="w-full bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-600">加注到</span>
          <div class="flex items-center gap-2">
            <div class="w-24 text-right text-lg font-bold text-gray-900 bg-slate-50 border border-gray-200 rounded-lg px-3 py-1.5">
              1,500
            </div>
          </div>
        </div>
        <div class="relative pt-1 pb-1">
          <div class="relative h-2 bg-gray-200 rounded-full">
            <div class="absolute h-2 bg-blue-600 rounded-full" style="width: 11.5%"></div>
          </div>
          <div class="absolute top-0 w-5 h-5 bg-white border-2 border-blue-600 rounded-full shadow-md pointer-events-none" style="left: 11.5%; transform: translateX(-50%) translateY(-6px)"></div>
        </div>
        <div class="flex justify-between text-xs text-gray-400">
          <span>400</span>
          <span>10,000</span>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-gray-700 border-gray-200">2x</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-gray-700 border-gray-200">3x</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-blue-600 text-white border-blue-600">Pot</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-red-500 border-gray-200">All In</button>
        </div>
        <div class="flex gap-3 pt-1">
          <button class="flex-1 py-2.5 text-sm font-semibold text-gray-600 bg-slate-50 border border-gray-200 rounded-lg">取消</button>
          <button class="flex-1 py-2.5 text-sm font-semibold text-white bg-blue-600 rounded-lg">加注 1,500</button>
        </div>
      </div>
    </div>

    <!-- State 3: All In -->
    <div>
      <p class="text-xs text-gray-400 mb-2 font-medium uppercase tracking-wide">All In State</p>
      <div class="w-full bg-white rounded-xl border border-gray-200 shadow-sm p-4 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-600">加注到</span>
          <div class="flex items-center gap-2">
            <div class="w-24 text-right text-lg font-bold text-gray-900 bg-slate-50 border border-gray-200 rounded-lg px-3 py-1.5">
              10,000
            </div>
            <span class="text-xs font-semibold text-red-500 bg-red-50 px-2 py-0.5 rounded-full">ALL IN</span>
          </div>
        </div>
        <div class="relative pt-1 pb-1">
          <div class="relative h-2 bg-gray-200 rounded-full">
            <div class="absolute h-2 bg-blue-600 rounded-full" style="width: 100%"></div>
          </div>
          <div class="absolute top-0 w-5 h-5 bg-white border-2 border-blue-600 rounded-full shadow-md pointer-events-none" style="left: 100%; transform: translateX(-50%) translateY(-6px)"></div>
        </div>
        <div class="flex justify-between text-xs text-gray-400">
          <span>400</span>
          <span>10,000</span>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-gray-700 border-gray-200">2x</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-gray-700 border-gray-200">3x</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-slate-50 text-gray-700 border-gray-200">Pot</button>
          <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-red-500 text-white border-red-500">All In</button>
        </div>
        <div class="flex gap-3 pt-1">
          <button class="flex-1 py-2.5 text-sm font-semibold text-gray-600 bg-slate-50 border border-gray-200 rounded-lg">取消</button>
          <button class="flex-1 py-2.5 text-sm font-semibold text-white bg-red-500 rounded-lg">All In 10,000</button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
