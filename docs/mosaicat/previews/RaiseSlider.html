<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaiseSlider Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #030712;
      border: 2px solid #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
      margin-top: -6px;
    }
    input[type="range"]::-moz-range-thumb {
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #030712;
      border: 2px solid #10b981;
      box-shadow: 0 0 6px rgba(16, 185, 129, 0.4);
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px;
      border-radius: 9999px;
      background: transparent;
    }
    input[type="range"]::-moz-range-track {
      height: 8px;
      border-radius: 9999px;
      background: transparent;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .all-in-badge { animation: pulse-glow 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="max-w-sm mx-auto space-y-8">

    <!-- Example 1: Mid-range raise (⅔ Pot selected) -->
    <div class="rounded-xl border border-gray-700 bg-gray-900 p-5 shadow-sm">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Mid Raise — ⅔ Pot</h3>
      <div class="w-full space-y-3">
        <!-- Header -->
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-gray-50">Raise to</span>
          <div class="flex items-center gap-2">
            <div class="relative">
              <input
                type="text"
                value="160"
                readonly
                class="w-24 rounded-lg border border-gray-700 bg-gray-800 px-3 py-1.5 text-right text-sm font-semibold text-gray-50"
              />
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">BB</span>
            </div>
          </div>
        </div>

        <!-- Slider -->
        <div class="relative px-1 py-2">
          <div class="relative h-2 w-full rounded-full bg-gray-800">
            <div class="absolute left-0 top-0 h-full rounded-full bg-emerald-500" style="width: 43%"></div>
          </div>
          <input type="range" min="6" max="360" value="160" class="absolute inset-0 h-2 w-full" />
        </div>

        <!-- Min / Max -->
        <div class="flex justify-between px-1">
          <span class="text-xs text-gray-500">Min 6</span>
          <span class="text-xs text-gray-500">Max 360</span>
        </div>

        <!-- Presets: 33% / 66% (active) / 100% -->
        <div class="grid grid-cols-3 gap-2">
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            ⅓ Pot
          </button>
          <button class="rounded-lg border border-emerald-500 bg-emerald-500 px-2 py-2 text-xs font-semibold text-white" style="box-shadow: 0 0 8px rgba(16,185,129,0.3);">
            ⅔ Pot
          </button>
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            Pot
          </button>
        </div>
      </div>
    </div>

    <!-- Example 2: All-In -->
    <div class="rounded-xl border border-gray-700 bg-gray-900 p-5 shadow-sm">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">All-In State</h3>
      <div class="w-full space-y-3">
        <!-- Header -->
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-gray-50">Raise to</span>
          <div class="flex items-center gap-2">
            <div class="relative">
              <input
                type="text"
                value="360"
                readonly
                class="w-24 rounded-lg border border-gray-700 bg-gray-800 px-3 py-1.5 text-right text-sm font-semibold text-gray-50"
              />
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">BB</span>
            </div>
            <span class="all-in-badge rounded-lg bg-red-500 px-2 py-1 text-xs font-bold text-white">ALL IN</span>
          </div>
        </div>

        <!-- Slider (100%) -->
        <div class="relative px-1 py-2">
          <div class="relative h-2 w-full rounded-full bg-gray-800">
            <div class="absolute left-0 top-0 h-full rounded-full bg-emerald-500" style="width: 100%"></div>
          </div>
          <input type="range" min="6" max="360" value="360" class="absolute inset-0 h-2 w-full" />
        </div>

        <!-- Min / Max -->
        <div class="flex justify-between px-1">
          <span class="text-xs text-gray-500">Min 6</span>
          <span class="text-xs text-gray-500">Max 360</span>
        </div>

        <!-- Presets: none active -->
        <div class="grid grid-cols-3 gap-2">
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            ⅓ Pot
          </button>
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            ⅔ Pot
          </button>
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            Pot
          </button>
        </div>
      </div>
    </div>

    <!-- Example 3: Min Raise (⅓ Pot selected) -->
    <div class="rounded-xl border border-gray-700 bg-gray-900 p-5 shadow-sm">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Min Raise — ⅓ Pot</h3>
      <div class="w-full space-y-3">
        <!-- Header -->
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-gray-50">Raise to</span>
          <div class="flex items-center gap-2">
            <div class="relative">
              <input
                type="text"
                value="4"
                readonly
                class="w-24 rounded-lg border border-gray-700 bg-gray-800 px-3 py-1.5 text-right text-sm font-semibold text-gray-50"
              />
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">BB</span>
            </div>
          </div>
        </div>

        <!-- Slider (0%) -->
        <div class="relative px-1 py-2">
          <div class="relative h-2 w-full rounded-full bg-gray-800">
            <div class="absolute left-0 top-0 h-full rounded-full bg-emerald-500" style="width: 0%"></div>
          </div>
          <input type="range" min="4" max="100" value="4" class="absolute inset-0 h-2 w-full" />
        </div>

        <!-- Min / Max -->
        <div class="flex justify-between px-1">
          <span class="text-xs text-gray-500">Min 4</span>
          <span class="text-xs text-gray-500">Max 100</span>
        </div>

        <!-- Presets: ⅓ Pot active -->
        <div class="grid grid-cols-3 gap-2">
          <button class="rounded-lg border border-emerald-500 bg-emerald-500 px-2 py-2 text-xs font-semibold text-white" style="box-shadow: 0 0 8px rgba(16,185,129,0.3);">
            ⅓ Pot
          </button>
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            ⅔ Pot
          </button>
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            Pot
          </button>
        </div>
      </div>
    </div>

    <!-- Example 4: Custom Presets (4 buttons) -->
    <div class="rounded-xl border border-gray-700 bg-gray-900 p-5 shadow-sm">
      <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Custom Presets (½/¾/Pot/2×)</h3>
      <div class="w-full space-y-3">
        <!-- Header -->
        <div class="flex items-center justify-between">
          <span class="text-sm font-semibold text-gray-50">Raise to</span>
          <div class="flex items-center gap-2">
            <div class="relative">
              <input
                type="text"
                value="180"
                readonly
                class="w-24 rounded-lg border border-gray-700 bg-gray-800 px-3 py-1.5 text-right text-sm font-semibold text-gray-50"
              />
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">BB</span>
            </div>
          </div>
        </div>

        <!-- Slider -->
        <div class="relative px-1 py-2">
          <div class="relative h-2 w-full rounded-full bg-gray-800">
            <div class="absolute left-0 top-0 h-full rounded-full bg-emerald-500" style="width: 49%"></div>
          </div>
          <input type="range" min="6" max="360" value="180" class="absolute inset-0 h-2 w-full" />
        </div>

        <!-- Min / Max -->
        <div class="flex justify-between px-1">
          <span class="text-xs text-gray-500">Min 6</span>
          <span class="text-xs text-gray-500">Max 360</span>
        </div>

        <!-- 4 Custom Presets: ¾ Pot active -->
        <div class="grid grid-cols-4 gap-2">
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            ½ Pot
          </button>
          <button class="rounded-lg border border-emerald-500 bg-emerald-500 px-2 py-2 text-xs font-semibold text-white" style="box-shadow: 0 0 8px rgba(16,185,129,0.3);">
            ¾ Pot
          </button>
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            Pot
          </button>
          <button class="rounded-lg border border-gray-700 bg-gray-800 px-2 py-2 text-xs font-semibold text-gray-400">
            2× Pot
          </button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
