<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-6 max-w-2xl">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">SkeletonChart — Loading Statistics</p>

    <!-- Default height chart -->
    <div class="w-full bg-gray-900 rounded-xl border border-gray-700 p-6" style="height: 200px">
      <div class="flex h-full gap-4">
        <div class="flex flex-col justify-between py-2">
          <div class="h-3 w-8 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-6 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-8 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-6 rounded bg-gray-800 animate-pulse"></div>
        </div>
        <div class="flex-1 flex items-end gap-2">
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 40%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 65%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 30%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 80%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 55%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 70%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 45%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 60%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 35%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 75%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 50%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 68%"></div>
        </div>
      </div>
    </div>

    <!-- Taller chart variant -->
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Tall Variant (300px)</p>
    <div class="w-full bg-gray-900 rounded-xl border border-gray-700 p-6" style="height: 300px">
      <div class="flex h-full gap-4">
        <div class="flex flex-col justify-between py-2">
          <div class="h-3 w-8 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-6 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-8 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-6 rounded bg-gray-800 animate-pulse"></div>
          <div class="h-3 w-8 rounded bg-gray-800 animate-pulse"></div>
        </div>
        <div class="flex-1 flex items-end gap-2">
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 50%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 70%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 25%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 90%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 60%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 45%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 75%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 55%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 40%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 85%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 35%"></div>
          <div class="flex-1 bg-gray-800 rounded-t animate-pulse" style="height: 65%"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
