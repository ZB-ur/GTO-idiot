<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col items-center gap-4 pt-4">
    <!-- Success Toast -->
    <div class="flex items-center gap-3 px-4 py-3 rounded-lg border bg-emerald-400/10 border-emerald-400/30 shadow-md">
      <span class="text-emerald-400 text-base font-bold">✓</span>
      <span class="text-emerald-400 text-sm font-medium">Hand won! +2,400 chips added to your stack.</span>
      <button class="ml-2 text-gray-500 hover:text-gray-300 transition-colors text-sm">✕</button>
    </div>

    <!-- Warning Toast -->
    <div class="flex items-center gap-3 px-4 py-3 rounded-lg border bg-amber-400/10 border-amber-400/30 shadow-md">
      <span class="text-amber-400 text-base font-bold">⚠</span>
      <span class="text-amber-400 text-sm font-medium">10 seconds remaining — make your move!</span>
      <button class="ml-2 text-gray-500 hover:text-gray-300 transition-colors text-sm">✕</button>
    </div>

    <!-- Error Toast -->
    <div class="flex items-center gap-3 px-4 py-3 rounded-lg border bg-red-500/10 border-red-500/30 shadow-md">
      <span class="text-red-400 text-base font-bold">✕</span>
      <span class="text-red-400 text-sm font-medium">Connection lost. Reconnecting...</span>
      <button class="ml-2 text-gray-500 hover:text-gray-300 transition-colors text-sm">✕</button>
    </div>
  </div>
</body>
</html>
