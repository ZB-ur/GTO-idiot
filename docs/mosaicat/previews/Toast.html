<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex flex-col gap-4 max-w-md">
  <!-- Success toast -->
  <div class="flex items-center gap-3 px-4 py-3 rounded-xl border bg-emerald-500/15 border-emerald-500/40 shadow-lg">
    <span class="text-lg font-bold text-emerald-500">✓</span>
    <span class="text-gray-50 text-sm">Hand saved to history successfully.</span>
    <button class="ml-2 text-gray-500 hover:text-gray-300 text-sm">✕</button>
  </div>

  <!-- Error toast -->
  <div class="flex items-center gap-3 px-4 py-3 rounded-xl border bg-red-500/15 border-red-500/40 shadow-lg">
    <span class="text-lg font-bold text-red-500">✕</span>
    <span class="text-gray-50 text-sm">Failed to calculate equity. Try again.</span>
    <button class="ml-2 text-gray-500 hover:text-gray-300 text-sm">✕</button>
  </div>

  <!-- Info toast -->
  <div class="flex items-center gap-3 px-4 py-3 rounded-xl border bg-amber-500/15 border-amber-500/40 shadow-lg">
    <span class="text-lg font-bold text-amber-500">ℹ</span>
    <span class="text-gray-50 text-sm">Simulation running with 10,000 iterations.</span>
    <button class="ml-2 text-gray-500 hover:text-gray-300 text-sm">✕</button>
  </div>
</div>
</body>
</html>
