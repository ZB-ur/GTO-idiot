<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Toast Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="min-h-[400px] relative">
    <!-- Success Toast -->
    <div class="absolute bottom-36 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-5 py-3 rounded-xl border bg-emerald-400/10 border-emerald-400/30 shadow-lg shadow-black/40 max-w-md w-80">
      <span class="text-base font-bold text-emerald-400">✓</span>
      <span class="text-sm text-gray-50 flex-1">Hand imported successfully!</span>
      <button class="text-gray-500 hover:text-gray-300 text-sm ml-2">✕</button>
    </div>
    <!-- Error Toast -->
    <div class="absolute bottom-20 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-5 py-3 rounded-xl border bg-red-500/10 border-red-500/30 shadow-lg shadow-black/40 max-w-md w-80">
      <span class="text-base font-bold text-red-400">✕</span>
      <span class="text-sm text-gray-50 flex-1">Failed to save hand history.</span>
      <button class="text-gray-500 hover:text-gray-300 text-sm ml-2">✕</button>
    </div>
    <!-- Info Toast -->
    <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-3 px-5 py-3 rounded-xl border bg-sky-400/10 border-sky-400/30 shadow-lg shadow-black/40 max-w-md w-80">
      <span class="text-base font-bold text-sky-400">ℹ</span>
      <span class="text-sm text-gray-50 flex-1">Analysis is running in background.</span>
      <button class="text-gray-500 hover:text-gray-300 text-sm ml-2">✕</button>
    </div>
  </div>
</body>
</html>
