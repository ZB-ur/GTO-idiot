<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HintButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <!-- Default state -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">Default</p>
      <button class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/25 hover:border-emerald-400/50 transition-all duration-150">
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 2a6 6 0 00-2.11 11.62c.18.07.31.26.31.46v1.42a.5.5 0 00.5.5h2.6a.5.5 0 00.5-.5v-1.42c0-.2.13-.39.31-.46A6 6 0 0010 2zm-1.3 15h2.6a.5.5 0 01.5.5v.5a1 1 0 01-1 1h-1.6a1 1 0 01-1-1v-.5a.5.5 0 01.5-.5z"/>
        </svg>
        GTO 提示
      </button>
    </div>

    <!-- Loading state -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">Loading</p>
      <button class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700" disabled>
        <svg class="animate-spin h-4 w-4 text-emerald-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        GTO 计算中…
      </button>
    </div>

    <!-- Disabled state -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">Disabled</p>
      <button class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold bg-gray-800 text-gray-500 cursor-not-allowed border border-gray-700" disabled>
        <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
          <path d="M10 2a6 6 0 00-2.11 11.62c.18.07.31.26.31.46v1.42a.5.5 0 00.5.5h2.6a.5.5 0 00.5-.5v-1.42c0-.2.13-.39.31-.46A6 6 0 0010 2zm-1.3 15h2.6a.5.5 0 01.5.5v.5a1 1 0 01-1 1h-1.6a1 1 0 01-1-1v-.5a.5.5 0 01.5-.5z"/>
        </svg>
        GTO 提示
      </button>
    </div>

    <!-- In context: above action panel -->
    <div>
      <p class="text-gray-500 text-xs mb-3 uppercase tracking-wide">In context — Action Panel</p>
      <div class="max-w-sm bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-3">
        <div class="flex justify-end">
          <button class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/25">
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path d="M10 2a6 6 0 00-2.11 11.62c.18.07.31.26.31.46v1.42a.5.5 0 00.5.5h2.6a.5.5 0 00.5-.5v-1.42c0-.2.13-.39.31-.46A6 6 0 0010 2zm-1.3 15h2.6a.5.5 0 01.5.5v.5a1 1 0 01-1 1h-1.6a1 1 0 01-1-1v-.5a.5.5 0 01.5-.5z"/>
            </svg>
            GTO 提示
          </button>
        </div>
        <div class="flex gap-2">
          <button class="flex-1 py-2.5 rounded-lg text-sm font-semibold bg-blue-500/20 text-blue-400 border border-blue-500/30">Fold</button>
          <button class="flex-1 py-2.5 rounded-lg text-sm font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Call</button>
          <button class="flex-1 py-2.5 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400 border border-red-500/30">Raise</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
