<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-8">
    <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Stats Cards</p>

    <!-- Row of stats -->
    <div class="grid grid-cols-3 gap-4 max-w-2xl">
      <!-- Total Hands -->
      <div class="bg-white border border-gray-200 rounded-xl p-6 flex flex-col gap-2 min-w-[160px]">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-500">Total Hands</span>
          <span class="text-gray-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
          </span>
        </div>
        <div class="flex items-end gap-2">
          <span class="text-2xl font-bold text-gray-900">1,247</span>
          <span class="text-sm font-medium text-gray-400 pb-0.5">→</span>
        </div>
      </div>

      <!-- Total P&L -->
      <div class="bg-white border border-gray-200 rounded-xl p-6 flex flex-col gap-2 min-w-[160px]">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-500">Total P&L</span>
          <span class="text-gray-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          </span>
        </div>
        <div class="flex items-end gap-2">
          <span class="text-2xl font-bold text-gray-900">+$3,420</span>
          <span class="text-sm font-medium text-emerald-500 pb-0.5">↑</span>
        </div>
      </div>

      <!-- Avg Profit/Hand -->
      <div class="bg-white border border-gray-200 rounded-xl p-6 flex flex-col gap-2 min-w-[160px]">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-500">Avg Profit/Hand</span>
          <span class="text-gray-400">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
          </span>
        </div>
        <div class="flex items-end gap-2">
          <span class="text-2xl font-bold text-gray-900">$2.74</span>
          <span class="text-sm font-medium text-emerald-500 pb-0.5">↑</span>
        </div>
      </div>
    </div>

    <!-- Negative trend example -->
    <div class="max-w-[200px]">
      <div class="bg-white border border-gray-200 rounded-xl p-6 flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-sm font-medium text-gray-500">Win Rate</span>
        </div>
        <div class="flex items-end gap-2">
          <span class="text-2xl font-bold text-gray-900">-2.5 BB</span>
          <span class="text-sm font-medium text-red-500 pb-0.5">↓</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
