<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimaryButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-6">
    <h2 class="text-lg font-semibold text-gray-900">PrimaryButton States</h2>

    <!-- Default -->
    <div class="space-y-2">
      <p class="text-sm text-gray-600">Default</p>
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 px-6 py-3 text-base font-semibold text-white bg-blue-600 rounded-lg transition-colors duration-150 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      >
        开始游戏
      </button>
    </div>

    <!-- Hover (simulated) -->
    <div class="space-y-2">
      <p class="text-sm text-gray-600">Hover</p>
      <button
        type="button"
        class="inline-flex items-center justify-center gap-2 px-6 py-3 text-base font-semibold text-white bg-blue-700 rounded-lg focus:outline-none"
      >
        开始游戏
      </button>
    </div>

    <!-- Loading -->
    <div class="space-y-2">
      <p class="text-sm text-gray-600">Loading</p>
      <button
        type="button"
        disabled
        class="inline-flex items-center justify-center gap-2 px-6 py-3 text-base font-semibold text-white bg-blue-600 rounded-lg opacity-50 cursor-not-allowed"
      >
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        处理中…
      </button>
    </div>

    <!-- Disabled -->
    <div class="space-y-2">
      <p class="text-sm text-gray-600">Disabled</p>
      <button
        type="button"
        disabled
        class="inline-flex items-center justify-center gap-2 px-6 py-3 text-base font-semibold text-white bg-blue-600 rounded-lg opacity-50 cursor-not-allowed"
      >
        开始游戏
      </button>
    </div>

    <!-- Custom Loading Text -->
    <div class="space-y-2">
      <p class="text-sm text-gray-600">Custom Loading Text</p>
      <button
        type="button"
        disabled
        class="inline-flex items-center justify-center gap-2 px-6 py-3 text-base font-semibold text-white bg-blue-600 rounded-lg opacity-50 cursor-not-allowed"
      >
        <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        正在发牌…
      </button>
    </div>
  </div>
</body>
</html>
