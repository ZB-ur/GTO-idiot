<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 40px; align-items: center; padding-top: 32px;">

    <!-- Simple pot, no side pots -->
    <div>
      <p class="text-gray-400 text-sm mb-3 text-center">Simple Pot</p>
      <div class="flex flex-col items-center gap-1">
        <div class="flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-700 shadow-lg" style="background: rgba(17,24,39,0.8);">
          <span class="text-amber-400 text-lg font-bold">$</span>
          <span class="text-white font-bold text-lg tracking-tight">12.5 BB</span>
        </div>
      </div>
    </div>

    <!-- Large pot with side pots -->
    <div>
      <p class="text-gray-400 text-sm mb-3 text-center">Main Pot + 2 Side Pots</p>
      <div class="flex flex-col items-center gap-1">
        <div class="flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-700 shadow-lg" style="background: rgba(17,24,39,0.8);">
          <span class="text-amber-400 text-lg font-bold">$</span>
          <span class="text-white font-bold text-lg tracking-tight">125.5 BB</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap justify-center">
          <span class="text-xs font-medium text-gray-400 px-2 py-0.5 rounded-lg border border-gray-700" style="background: rgba(31,41,55,0.6);">
            Main: 60 BB
          </span>
          <span class="text-xs font-medium text-amber-300 px-2 py-0.5 rounded-lg border border-gray-700" style="background: rgba(31,41,55,0.6);">
            Side 1: 40.5 BB
          </span>
          <span class="text-xs font-medium text-amber-300 px-2 py-0.5 rounded-lg border border-gray-700" style="background: rgba(31,41,55,0.6);">
            Side 2: 25 BB
          </span>
        </div>
      </div>
    </div>

    <!-- Small pot -->
    <div>
      <p class="text-gray-400 text-sm mb-3 text-center">Blinds Only</p>
      <div class="flex flex-col items-center gap-1">
        <div class="flex items-center gap-2 px-4 py-2 rounded-xl border border-gray-700 shadow-lg" style="background: rgba(17,24,39,0.8);">
          <span class="text-amber-400 text-lg font-bold">$</span>
          <span class="text-white font-bold text-lg tracking-tight">1.5 BB</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
