<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="space-y-10">
    <p class="text-gray-400 text-sm font-semibold tracking-wide uppercase">PotDisplay — Various Amounts</p>

    <!-- On felt background -->
    <div class="flex flex-col items-center gap-8">

      <!-- Small pot -->
      <div class="bg-emerald-900/60 rounded-2xl px-16 py-10 border border-emerald-800/40 flex items-center justify-center">
        <div class="relative inline-flex items-center justify-center">
          <div class="absolute inset-0 rounded-full bg-amber-500/20 blur-xl scale-150"></div>
          <div class="relative flex items-center gap-2 bg-gray-900/80 rounded-full px-4 py-2 border border-amber-700/50 shadow-lg" style="backdrop-filter:blur(8px)">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-amber-300 to-amber-500 border-2 border-amber-600 flex items-center justify-center shadow-md">
              <div class="w-3 h-3 rounded-full border border-amber-200/60"></div>
            </div>
            <span class="text-amber-400 font-bold text-lg tracking-tight" style="font-variant-numeric:tabular-nums">7</span>
          </div>
        </div>
      </div>

      <!-- Medium pot -->
      <div class="bg-emerald-900/60 rounded-2xl px-16 py-10 border border-emerald-800/40 flex items-center justify-center">
        <div class="relative inline-flex items-center justify-center">
          <div class="absolute inset-0 rounded-full bg-amber-500/20 blur-xl scale-150"></div>
          <div class="relative flex items-center gap-2 bg-gray-900/80 rounded-full px-4 py-2 border border-amber-700/50 shadow-lg" style="backdrop-filter:blur(8px)">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-amber-300 to-amber-500 border-2 border-amber-600 flex items-center justify-center shadow-md">
              <div class="w-3 h-3 rounded-full border border-amber-200/60"></div>
            </div>
            <span class="text-amber-400 font-bold text-lg tracking-tight" style="font-variant-numeric:tabular-nums">156</span>
          </div>
        </div>
      </div>

      <!-- Large pot -->
      <div class="bg-emerald-900/60 rounded-2xl px-16 py-10 border border-emerald-800/40 flex items-center justify-center">
        <div class="relative inline-flex items-center justify-center">
          <div class="absolute inset-0 rounded-full bg-amber-500/20 blur-xl scale-150"></div>
          <div class="relative flex items-center gap-2 bg-gray-900/80 rounded-full px-4 py-2 border border-amber-700/50 shadow-lg" style="backdrop-filter:blur(8px)">
            <div class="w-6 h-6 rounded-full bg-gradient-to-br from-amber-300 to-amber-500 border-2 border-amber-600 flex items-center justify-center shadow-md">
              <div class="w-3 h-3 rounded-full border border-amber-200/60"></div>
            </div>
            <span class="text-amber-400 font-bold text-lg tracking-tight" style="font-variant-numeric:tabular-nums">1,200</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
