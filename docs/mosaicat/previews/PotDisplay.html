<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col items-center gap-10">
    <!-- Simple main pot only -->
    <div>
      <p class="text-xs text-gray-500 mb-3 text-center">Main pot only</p>
      <div class="flex flex-col items-center gap-1.5">
        <div class="flex items-center gap-2 rounded-xl bg-gray-800/80 border border-gray-700 px-4 py-2 shadow-md">
          <svg class="w-4 h-4 text-yellow-500" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5" />
            <circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1" opacity="0.5" />
          </svg>
          <span class="text-lg font-bold text-gray-50">45</span>
        </div>
      </div>
    </div>

    <!-- Main pot + side pots -->
    <div>
      <p class="text-xs text-gray-500 mb-3 text-center">Main pot + 2 side pots</p>
      <div class="flex flex-col items-center gap-1.5">
        <!-- Main pot -->
        <div class="flex items-center gap-2 rounded-xl bg-gray-800/80 border border-gray-700 px-4 py-2 shadow-md">
          <svg class="w-4 h-4 text-yellow-500" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5" />
            <circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1" opacity="0.5" />
          </svg>
          <span class="text-lg font-bold text-gray-50">320</span>
        </div>
        <!-- Side pots -->
        <div class="flex items-center gap-2">
          <div class="flex items-center gap-1.5 rounded-lg bg-gray-800/60 border border-gray-700/60 px-3 py-1 shadow-sm">
            <svg class="w-3 h-3 text-amber-400" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5" />
              <circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1" opacity="0.5" />
            </svg>
            <span class="text-sm font-semibold text-gray-300">150</span>
            <span class="text-xs text-gray-500">(3)</span>
          </div>
          <div class="flex items-center gap-1.5 rounded-lg bg-gray-800/60 border border-gray-700/60 px-3 py-1 shadow-sm">
            <svg class="w-3 h-3 text-amber-400" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5" />
              <circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1" opacity="0.5" />
            </svg>
            <span class="text-sm font-semibold text-gray-300">80</span>
            <span class="text-xs text-gray-500">(2)</span>
          </div>
        </div>
        <!-- Total -->
        <span class="text-xs text-gray-500">Total: 550</span>
      </div>
    </div>

    <!-- Large pot -->
    <div>
      <p class="text-xs text-gray-500 mb-3 text-center">Large pot (1k+ formatting)</p>
      <div class="flex flex-col items-center gap-1.5">
        <div class="flex items-center gap-2 rounded-xl bg-gray-800/80 border border-gray-700 px-4 py-2 shadow-md">
          <svg class="w-4 h-4 text-yellow-500" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" fill="currentColor" opacity="0.2" stroke="currentColor" stroke-width="1.5" />
            <circle cx="8" cy="8" r="4" stroke="currentColor" stroke-width="1" opacity="0.5" />
          </svg>
          <span class="text-lg font-bold text-gray-50">2.5k</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
