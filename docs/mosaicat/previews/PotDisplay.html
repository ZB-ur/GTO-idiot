<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 32px; align-items: center;">

    <!-- Simple pot -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gray-900/80 border border-gray-700 shadow-lg shadow-black/40">
        <span class="text-base">🪙</span>
        <span class="text-lg font-bold tabular-nums text-amber-400 tracking-tight">1,250</span>
      </div>
    </div>

    <!-- Large pot -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gray-900/80 border border-gray-700 shadow-lg shadow-black/40">
        <span class="text-base">🪙</span>
        <span class="text-lg font-bold tabular-nums text-amber-400 tracking-tight">24.5K</span>
      </div>
    </div>

    <!-- Pot with side pots -->
    <div class="flex flex-col items-center gap-1.5">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-gray-900/80 border border-gray-700 shadow-lg shadow-black/40">
        <span class="text-base">🪙</span>
        <span class="text-lg font-bold tabular-nums text-amber-400 tracking-tight">8,400</span>
      </div>
      <div class="flex items-center gap-2 flex-wrap justify-center">
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-gray-800/80 border border-gray-700 shadow-md shadow-black/30">
          <span class="text-xs text-gray-500 font-medium">Side</span>
          <span class="text-sm font-bold tabular-nums text-amber-300">3,200</span>
        </div>
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-gray-800/80 border border-gray-700 shadow-md shadow-black/30">
          <span class="text-xs text-gray-500 font-medium">Side</span>
          <span class="text-sm font-bold tabular-nums text-amber-300">1,600</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
