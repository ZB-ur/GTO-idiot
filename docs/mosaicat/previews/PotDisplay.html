<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="space-y-6">
  <div>
    <p class="text-sm text-gray-500 mb-2">Main Pot Only</p>
    <div class="bg-emerald-800 rounded-xl p-6 flex justify-center">
      <div class="flex items-center gap-2 bg-black/30 backdrop-blur-sm rounded-lg px-3 py-1.5">
        <div class="flex -space-x-1">
          <div class="w-4 h-4 rounded-full bg-yellow-400 border border-yellow-500 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-yellow-400 border border-yellow-500 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-red-500 border border-red-600 shadow-sm"></div>
        </div>
        <span class="text-yellow-400 font-bold text-sm">$1,250</span>
      </div>
    </div>
  </div>

  <div>
    <p class="text-sm text-gray-500 mb-2">Main Pot + Side Pots</p>
    <div class="bg-emerald-800 rounded-xl p-6 flex justify-center">
      <div class="flex flex-col items-center gap-1">
        <div class="flex items-center gap-2 bg-black/30 backdrop-blur-sm rounded-lg px-3 py-1.5">
          <div class="flex -space-x-1">
            <div class="w-4 h-4 rounded-full bg-yellow-400 border border-yellow-500 shadow-sm"></div>
            <div class="w-4 h-4 rounded-full bg-yellow-400 border border-yellow-500 shadow-sm"></div>
            <div class="w-4 h-4 rounded-full bg-red-500 border border-red-600 shadow-sm"></div>
            <div class="w-4 h-4 rounded-full bg-blue-500 border border-blue-600 shadow-sm"></div>
          </div>
          <span class="text-yellow-400 font-bold text-sm">$3,400</span>
        </div>
        <div class="flex gap-2">
          <div class="flex items-center gap-1 bg-black/20 rounded-md px-2 py-0.5">
            <span class="text-yellow-300/80 text-xs font-medium">Side $800</span>
          </div>
          <div class="flex items-center gap-1 bg-black/20 rounded-md px-2 py-0.5">
            <span class="text-yellow-300/80 text-xs font-medium">Side $400</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
