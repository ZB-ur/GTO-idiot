<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #065f46; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-10 items-center">

    <!-- Label -->
    <span class="text-emerald-200 text-sm font-medium">Small Pot (Main only)</span>
    <!-- Small pot, no side pots -->
    <div class="flex flex-col items-center gap-2">
      <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-black/40 border border-emerald-500/30 shadow-lg">
        <!-- Chip stack left -->
        <div class="flex flex-col-reverse items-center">
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1.5"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1.5"></div>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[10px] uppercase tracking-wider text-emerald-300/70 font-medium">Pot</span>
          <span class="text-lg font-bold text-amber-300">24 BB</span>
        </div>
        <!-- Chip stack right -->
        <div class="flex flex-col-reverse items-center">
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1.5"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1.5"></div>
        </div>
      </div>
    </div>

    <!-- Label -->
    <span class="text-emerald-200 text-sm font-medium">Large Pot with Side Pots</span>
    <!-- Large pot with side pots -->
    <div class="flex flex-col items-center gap-2">
      <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-black/40 border border-emerald-500/30 shadow-lg">
        <div class="flex flex-col-reverse items-center">
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1.5"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1.5"></div>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[10px] uppercase tracking-wider text-emerald-300/70 font-medium">Pot</span>
          <span class="text-lg font-bold text-amber-300">2.4K BB</span>
        </div>
        <div class="flex flex-col-reverse items-center">
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1.5"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1.5"></div>
        </div>
      </div>
      <!-- Side pots -->
      <div class="flex gap-2 flex-wrap justify-center">
        <div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-black/30 border border-emerald-600/20">
          <div class="flex flex-col-reverse items-center">
            <div class="w-3 h-3 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
            <div class="w-3 h-3 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1"></div>
            <div class="w-3 h-3 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1"></div>
          </div>
          <div class="flex flex-col">
            <span class="text-[9px] uppercase tracking-wider text-emerald-300/60 font-medium">Side 1</span>
            <span class="text-sm font-semibold text-amber-200">800 BB</span>
          </div>
        </div>
        <div class="flex items-center gap-1.5 px-3 py-1 rounded-lg bg-black/30 border border-emerald-600/20">
          <div class="flex flex-col-reverse items-center">
            <div class="w-3 h-3 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
            <div class="w-3 h-3 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1"></div>
            <div class="w-3 h-3 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1"></div>
          </div>
          <div class="flex flex-col">
            <span class="text-[9px] uppercase tracking-wider text-emerald-300/60 font-medium">Side 2</span>
            <span class="text-sm font-semibold text-amber-200">350 BB</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Label -->
    <span class="text-emerald-200 text-sm font-medium">Animated Pot (pulsing)</span>
    <!-- Animated pot -->
    <div class="flex flex-col items-center gap-2">
      <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-black/40 border border-emerald-500/30 shadow-lg animate-pulse">
        <div class="flex flex-col-reverse items-center">
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1.5"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1.5"></div>
        </div>
        <div class="flex flex-col items-center">
          <span class="text-[10px] uppercase tracking-wider text-emerald-300/70 font-medium">Pot</span>
          <span class="text-lg font-bold text-amber-300">156 BB</span>
        </div>
        <div class="flex flex-col-reverse items-center">
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-blue-400 to-blue-600 border border-blue-700 shadow-sm -mb-1.5"></div>
          <div class="w-4 h-4 rounded-full bg-gradient-to-b from-green-400 to-green-600 border border-green-700 shadow-sm -mb-1.5"></div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
