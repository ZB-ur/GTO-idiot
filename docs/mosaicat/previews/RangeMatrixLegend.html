<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RangeMatrixLegend Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="p-8 max-w-md">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-4">
      <!-- Action Colors -->
      <div>
        <h4 class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-2.5">
          Action Colors
        </h4>
        <div class="flex flex-wrap gap-x-4 gap-y-2">
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-sm bg-amber-400"></div>
            <span class="text-xs text-gray-300 font-medium">Raise / Bet</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-sm bg-sky-400"></div>
            <span class="text-xs text-gray-300 font-medium">Call</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-sm bg-gray-400"></div>
            <span class="text-xs text-gray-300 font-medium">Check</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-sm bg-gray-500"></div>
            <span class="text-xs text-gray-300 font-medium">Fold</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="w-3 h-3 rounded-sm bg-red-400"></div>
            <span class="text-xs text-gray-300 font-medium">All In</span>
          </div>
        </div>
      </div>

      <!-- Frequency Opacity -->
      <div>
        <h4 class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-2.5">
          Frequency (opacity)
        </h4>
        <div class="flex items-center gap-1">
          <div class="flex flex-col items-center gap-1">
            <div class="w-8 h-5 rounded-sm bg-amber-400 opacity-10"></div>
            <span class="text-[10px] text-gray-500 tabular-nums">0%</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <div class="w-8 h-5 rounded-sm bg-amber-400 opacity-25"></div>
            <span class="text-[10px] text-gray-500 tabular-nums">25%</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <div class="w-8 h-5 rounded-sm bg-amber-400 opacity-50"></div>
            <span class="text-[10px] text-gray-500 tabular-nums">50%</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <div class="w-8 h-5 rounded-sm bg-amber-400 opacity-75"></div>
            <span class="text-[10px] text-gray-500 tabular-nums">75%</span>
          </div>
          <div class="flex flex-col items-center gap-1">
            <div class="w-8 h-5 rounded-sm bg-amber-400 opacity-100"></div>
            <span class="text-[10px] text-gray-500 tabular-nums">100%</span>
          </div>
        </div>
      </div>

      <!-- Notation Guide -->
      <div>
        <h4 class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-2.5">
          Notation
        </h4>
        <div class="flex flex-wrap gap-x-4 gap-y-1.5">
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-gray-300 bg-gray-800 px-1.5 py-0.5 rounded">AKs</span>
            <span class="text-[10px] text-gray-500">= Suited</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-gray-300 bg-gray-800 px-1.5 py-0.5 rounded">AKo</span>
            <span class="text-[10px] text-gray-500">= Offsuit</span>
          </div>
          <div class="flex items-center gap-1.5">
            <span class="text-xs font-bold text-gray-300 bg-gray-800 px-1.5 py-0.5 rounded">AA</span>
            <span class="text-[10px] text-gray-500">= Pair</span>
          </div>
          <div class="flex items-center gap-1.5">
            <div class="flex gap-px">
              <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
              <div class="w-1.5 h-1.5 rounded-full bg-sky-400"></div>
            </div>
            <span class="text-[10px] text-gray-500">= Mixed actions</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
