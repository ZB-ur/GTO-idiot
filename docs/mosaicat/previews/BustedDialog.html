<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BustedDialog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm px-4">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm shadow-xl">
      <!-- Busted Icon -->
      <div class="w-16 h-16 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <h3 class="text-xl font-bold text-gray-100 text-center mb-2">筹码归零！</h3>
      <p class="text-sm text-gray-400 text-center mb-6">
        你的筹码已经用完了。你可以重新买入继续游戏，或者结束本次 Session。
      </p>

      <!-- Rebuy Info -->
      <div class="bg-gray-800 border border-gray-700/50 rounded-lg p-4 mb-6 flex items-center justify-between">
        <span class="text-sm text-gray-400">重新买入</span>
        <div class="flex items-center gap-2">
          <span class="text-xl font-bold text-amber-400">100</span>
          <span class="text-sm text-gray-500">BB</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="space-y-3">
        <button class="w-full py-3 rounded-lg font-semibold bg-emerald-500 text-gray-950">
          重新买入
        </button>
        <button class="w-full py-3 rounded-lg font-semibold border border-gray-600 text-gray-300">
          结束游戏
        </button>
      </div>
    </div>
  </div>
</body>
</html>
