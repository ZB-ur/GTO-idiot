<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeakSeverityBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-3 items-start">
    <!-- High -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-red-400/15 text-red-400">
      <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>
      High
    </span>
    <!-- Medium -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-400/15 text-amber-400">
      <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      Medium
    </span>
    <!-- Low -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-sky-400/15 text-sky-400">
      <span class="w-1.5 h-1.5 rounded-full bg-sky-400"></span>
      Low
    </span>
  </div>
</body>
</html>
