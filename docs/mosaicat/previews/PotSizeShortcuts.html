<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PotSizeShortcuts Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-sm mx-auto space-y-4">
    <p class="text-xs text-gray-500">Pot: $120</p>
    <div class="flex items-center gap-2">
      <button class="flex-1 px-3 py-2 text-sm font-semibold rounded-lg border border-gray-200 bg-white text-gray-900 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-colors">1/3</button>
      <button class="flex-1 px-3 py-2 text-sm font-semibold rounded-lg border border-gray-200 bg-white text-gray-900 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-colors">1/2</button>
      <button class="flex-1 px-3 py-2 text-sm font-semibold rounded-lg border border-gray-200 bg-white text-gray-900 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-colors">2/3</button>
      <button class="flex-1 px-3 py-2 text-sm font-semibold rounded-lg border border-blue-600 bg-blue-600 text-white transition-colors">Pot</button>
    </div>
  </div>
</body>
</html>
