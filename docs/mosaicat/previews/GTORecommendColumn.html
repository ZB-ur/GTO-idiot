<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTORecommendColumn Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex gap-4 max-w-md">

    <!-- Exact recommendation -->
    <div class="flex-1 flex flex-col items-center gap-3 p-4 bg-gray-900 rounded-xl border border-amber-500/30">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-amber-500 uppercase tracking-wider">GTO推荐</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-xl font-bold text-amber-500">加注</span>
        <span class="text-sm text-gray-400 font-mono">7.5 BB</span>
      </div>
    </div>

    <!-- Approximate recommendation -->
    <div class="flex-1 flex flex-col items-center gap-3 p-4 bg-gray-900 rounded-xl border border-amber-500/30">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-amber-500 uppercase tracking-wider">GTO推荐</span>
        <span class="text-[10px] bg-yellow-500/20 text-yellow-500 px-1.5 py-0.5 rounded-full font-medium">近似</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-xl font-bold text-sky-400">跟注</span>
        <span class="text-sm text-gray-400 font-mono">3 BB</span>
      </div>
    </div>

    <!-- Fold recommendation -->
    <div class="flex-1 flex flex-col items-center gap-3 p-4 bg-gray-900 rounded-xl border border-amber-500/30">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-amber-500 uppercase tracking-wider">GTO推荐</span>
      </div>
      <div class="flex flex-col items-center gap-1">
        <span class="text-xl font-bold text-gray-500">弃牌</span>
      </div>
    </div>

  </div>
</body>
</html>
