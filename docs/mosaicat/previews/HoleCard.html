<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoleCard Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <!-- Large cards -->
    <div class="flex items-end gap-3">
      <!-- Ace of Spades (face up, lg) -->
      <div class="relative flex w-20 h-28 flex-col items-center justify-between rounded-lg border border-gray-200 bg-white p-1 shadow-md">
        <div class="self-start leading-none text-gray-900">
          <div class="text-2xl font-bold">A</div>
          <div class="text-lg">♠</div>
        </div>
        <div class="absolute bottom-1 right-1 rotate-180 self-end leading-none text-gray-900">
          <div class="text-2xl font-bold">A</div>
          <div class="text-lg">♠</div>
        </div>
      </div>
      <!-- King of Hearts (face up, lg) -->
      <div class="relative flex w-20 h-28 flex-col items-center justify-between rounded-lg border border-gray-200 bg-white p-1 shadow-md">
        <div class="self-start leading-none text-red-600">
          <div class="text-2xl font-bold">K</div>
          <div class="text-lg">♥</div>
        </div>
        <div class="absolute bottom-1 right-1 rotate-180 self-end leading-none text-red-600">
          <div class="text-2xl font-bold">K</div>
          <div class="text-lg">♥</div>
        </div>
      </div>
      <!-- Face down (lg) -->
      <div class="flex w-20 h-28 items-center justify-center rounded-lg border border-gray-300 bg-gradient-to-br from-blue-700 to-blue-900 shadow-md">
        <div class="h-3/4 w-3/4 rounded-md border border-blue-400/30 bg-blue-800/50"></div>
      </div>
    </div>

    <!-- Medium cards -->
    <div class="flex items-end gap-3">
      <!-- Queen of Diamonds (md) -->
      <div class="relative flex w-14 h-20 flex-col items-center justify-between rounded-lg border border-gray-200 bg-white p-1 shadow-md">
        <div class="self-start leading-none text-red-600">
          <div class="text-lg font-bold">Q</div>
          <div class="text-sm">♦</div>
        </div>
        <div class="absolute bottom-1 right-1 rotate-180 self-end leading-none text-red-600">
          <div class="text-lg font-bold">Q</div>
          <div class="text-sm">♦</div>
        </div>
      </div>
      <!-- 10 of Clubs (md) -->
      <div class="relative flex w-14 h-20 flex-col items-center justify-between rounded-lg border border-gray-200 bg-white p-1 shadow-md">
        <div class="self-start leading-none text-gray-900">
          <div class="text-lg font-bold">10</div>
          <div class="text-sm">♣</div>
        </div>
        <div class="absolute bottom-1 right-1 rotate-180 self-end leading-none text-gray-900">
          <div class="text-lg font-bold">10</div>
          <div class="text-sm">♣</div>
        </div>
      </div>
      <!-- Face down (md) -->
      <div class="flex w-14 h-20 items-center justify-center rounded-lg border border-gray-300 bg-gradient-to-br from-blue-700 to-blue-900 shadow-md">
        <div class="h-3/4 w-3/4 rounded-md border border-blue-400/30 bg-blue-800/50"></div>
      </div>
    </div>

    <!-- Small cards -->
    <div class="flex items-end gap-2">
      <!-- 7 of Hearts (sm) -->
      <div class="relative flex w-10 h-14 flex-col items-center justify-between rounded-lg border border-gray-200 bg-white p-1 shadow-md">
        <div class="self-start leading-none text-red-600">
          <div class="text-sm font-bold">7</div>
          <div class="text-xs">♥</div>
        </div>
        <div class="absolute bottom-1 right-1 rotate-180 self-end leading-none text-red-600">
          <div class="text-sm font-bold">7</div>
          <div class="text-xs">♥</div>
        </div>
      </div>
      <!-- 2 of Spades (sm) -->
      <div class="relative flex w-10 h-14 flex-col items-center justify-between rounded-lg border border-gray-200 bg-white p-1 shadow-md">
        <div class="self-start leading-none text-gray-900">
          <div class="text-sm font-bold">2</div>
          <div class="text-xs">♠</div>
        </div>
        <div class="absolute bottom-1 right-1 rotate-180 self-end leading-none text-gray-900">
          <div class="text-sm font-bold">2</div>
          <div class="text-xs">♠</div>
        </div>
      </div>
      <!-- Face down (sm) -->
      <div class="flex w-10 h-14 items-center justify-center rounded-lg border border-gray-300 bg-gradient-to-br from-blue-700 to-blue-900 shadow-md">
        <div class="h-3/4 w-3/4 rounded-md border border-blue-400/30 bg-blue-800/50"></div>
      </div>
    </div>
  </div>
</body>
</html>
