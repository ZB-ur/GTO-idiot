<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col items-center gap-6 pt-6">
    <!-- Default state -->
    <div class="text-center">
      <p class="text-gray-500 text-xs mb-2 uppercase tracking-wide">Default</p>
      <button class="inline-flex items-center justify-center gap-2 px-6 py-3 min-w-[120px] rounded-lg font-semibold text-sm uppercase tracking-wide border bg-gray-800 border-gray-600 text-gray-300 hover:bg-gray-700 hover:border-gray-500 hover:text-gray-100 active:scale-95 transition-all duration-150">
        <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="4" x2="12" y2="12" />
          <line x1="12" y1="4" x2="4" y2="12" />
        </svg>
        Fold
      </button>
    </div>

    <!-- Hover state (simulated) -->
    <div class="text-center">
      <p class="text-gray-500 text-xs mb-2 uppercase tracking-wide">Hover</p>
      <button class="inline-flex items-center justify-center gap-2 px-6 py-3 min-w-[120px] rounded-lg font-semibold text-sm uppercase tracking-wide border bg-gray-700 border-gray-500 text-gray-100 transition-all duration-150">
        <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="4" x2="12" y2="12" />
          <line x1="12" y1="4" x2="4" y2="12" />
        </svg>
        Fold
      </button>
    </div>

    <!-- Disabled state -->
    <div class="text-center">
      <p class="text-gray-500 text-xs mb-2 uppercase tracking-wide">Disabled</p>
      <button disabled class="inline-flex items-center justify-center gap-2 px-6 py-3 min-w-[120px] rounded-lg font-semibold text-sm uppercase tracking-wide border bg-gray-800/50 border-gray-700/50 text-gray-600 cursor-not-allowed transition-all duration-150">
        <svg class="w-4 h-4" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="4" x2="12" y2="12" />
          <line x1="12" y1="4" x2="4" y2="12" />
        </svg>
        Fold
      </button>
    </div>
  </div>
</body>
</html>
