<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandListItem Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="p-8 max-w-xl space-y-2">

    <!-- Won at showdown - positive result -->
    <button class="w-full flex items-center gap-4 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700/50 hover:border-gray-600 rounded-xl transition-all group text-left">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Hand</span>
        <span class="text-lg font-bold text-gray-50 tabular-nums leading-tight">#23</span>
      </div>
      <span class="shrink-0 px-2.5 py-1 rounded-lg bg-gray-800 border border-gray-700 text-xs font-bold text-gray-300">BTN</span>
      <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-emerald-400/15 text-emerald-400 border-emerald-400/30">Won at Showdown</span>
      <div class="flex-1"></div>
      <span class="text-emerald-400 text-sm font-semibold tabular-nums inline-flex items-center gap-1">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity="0.2"></circle>
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
          <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="bold" fill="currentColor">$</text>
        </svg>
        <span>+245</span>
      </span>
      <svg class="w-4 h-4 text-gray-600 group-hover:text-gray-400 transition-colors shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

    <!-- Lost at showdown - negative result -->
    <button class="w-full flex items-center gap-4 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700/50 hover:border-gray-600 rounded-xl transition-all group text-left">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Hand</span>
        <span class="text-lg font-bold text-gray-50 tabular-nums leading-tight">#31</span>
      </div>
      <span class="shrink-0 px-2.5 py-1 rounded-lg bg-gray-800 border border-gray-700 text-xs font-bold text-gray-300">SB</span>
      <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-red-400/15 text-red-400 border-red-400/30">Lost at Showdown</span>
      <div class="flex-1"></div>
      <span class="text-red-400 text-sm font-semibold tabular-nums inline-flex items-center gap-1">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity="0.2"></circle>
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
          <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="bold" fill="currentColor">$</text>
        </svg>
        <span>-180</span>
      </span>
      <svg class="w-4 h-4 text-gray-600 group-hover:text-gray-400 transition-colors shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

    <!-- Folded preflop - zero result -->
    <button class="w-full flex items-center gap-4 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700/50 hover:border-gray-600 rounded-xl transition-all group text-left">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Hand</span>
        <span class="text-lg font-bold text-gray-50 tabular-nums leading-tight">#32</span>
      </div>
      <span class="shrink-0 px-2.5 py-1 rounded-lg bg-gray-800 border border-gray-700 text-xs font-bold text-gray-300">UTG</span>
      <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-gray-400/15 text-gray-400 border-gray-400/30">Folded Preflop</span>
      <div class="flex-1"></div>
      <span class="text-gray-50 text-sm font-semibold tabular-nums inline-flex items-center gap-1">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity="0.2"></circle>
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
          <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="bold" fill="currentColor">$</text>
        </svg>
        <span>0</span>
      </span>
      <svg class="w-4 h-4 text-gray-600 group-hover:text-gray-400 transition-colors shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

    <!-- Won without showdown - small positive -->
    <button class="w-full flex items-center gap-4 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700/50 hover:border-gray-600 rounded-xl transition-all group text-left">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Hand</span>
        <span class="text-lg font-bold text-gray-50 tabular-nums leading-tight">#33</span>
      </div>
      <span class="shrink-0 px-2.5 py-1 rounded-lg bg-gray-800 border border-gray-700 text-xs font-bold text-gray-300">CO</span>
      <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-emerald-400/15 text-emerald-400 border-emerald-400/30">Won (No Showdown)</span>
      <div class="flex-1"></div>
      <span class="text-emerald-400 text-sm font-semibold tabular-nums inline-flex items-center gap-1">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity="0.2"></circle>
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
          <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="bold" fill="currentColor">$</text>
        </svg>
        <span>+15</span>
      </span>
      <svg class="w-4 h-4 text-gray-600 group-hover:text-gray-400 transition-colors shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

    <!-- Split pot -->
    <button class="w-full flex items-center gap-4 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700/50 hover:border-gray-600 rounded-xl transition-all group text-left">
      <div class="flex flex-col items-center shrink-0">
        <span class="text-[10px] text-gray-500 uppercase tracking-wider font-medium">Hand</span>
        <span class="text-lg font-bold text-gray-50 tabular-nums leading-tight">#34</span>
      </div>
      <span class="shrink-0 px-2.5 py-1 rounded-lg bg-gray-800 border border-gray-700 text-xs font-bold text-gray-300">BB</span>
      <span class="inline-flex items-center px-2 py-0.5 text-xs font-medium rounded-lg border bg-sky-400/15 text-sky-400 border-sky-400/30">Split Pot</span>
      <div class="flex-1"></div>
      <span class="text-gray-50 text-sm font-semibold tabular-nums inline-flex items-center gap-1">
        <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <circle cx="10" cy="10" r="9" fill="currentColor" opacity="0.2"></circle>
          <circle cx="10" cy="10" r="9" stroke="currentColor" stroke-width="1.5" fill="none"></circle>
          <text x="10" y="14" text-anchor="middle" font-size="10" font-weight="bold" fill="currentColor">$</text>
        </svg>
        <span>0</span>
      </span>
      <svg class="w-4 h-4 text-gray-600 group-hover:text-gray-400 transition-colors shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    </button>

  </div>
</body>
</html>
