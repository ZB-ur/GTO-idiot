<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YourActionDisplay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-sm mx-auto space-y-6">
    <!-- Fold -->
    <div class="rounded-xl border border-gray-200 bg-white shadow-sm p-6">
      <div class="space-y-2">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Your Action</p>
        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border bg-gray-100 border-gray-300">
          <span class="text-sm font-semibold text-gray-700">Fold</span>
        </div>
      </div>
    </div>

    <!-- Raise with amount -->
    <div class="rounded-xl border border-gray-200 bg-white shadow-sm p-6">
      <div class="space-y-2">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Your Action</p>
        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border bg-orange-50 border-orange-300">
          <span class="text-sm font-semibold text-orange-700">Raise</span>
          <span class="text-sm font-bold text-orange-700">$150</span>
        </div>
      </div>
    </div>

    <!-- Call with amount -->
    <div class="rounded-xl border border-gray-200 bg-white shadow-sm p-6">
      <div class="space-y-2">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Your Action</p>
        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border bg-blue-50 border-blue-300">
          <span class="text-sm font-semibold text-blue-700">Call</span>
          <span class="text-sm font-bold text-blue-700">$50</span>
        </div>
      </div>
    </div>

    <!-- All-in -->
    <div class="rounded-xl border border-gray-200 bg-white shadow-sm p-6">
      <div class="space-y-2">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Your Action</p>
        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border bg-red-50 border-red-300">
          <span class="text-sm font-semibold text-red-700">All-in</span>
          <span class="text-sm font-bold text-red-700">$1,200</span>
        </div>
      </div>
    </div>

    <!-- Check -->
    <div class="rounded-xl border border-gray-200 bg-white shadow-sm p-6">
      <div class="space-y-2">
        <p class="text-xs font-medium text-gray-500 uppercase tracking-wide">Your Action</p>
        <div class="inline-flex items-center gap-2 px-4 py-2.5 rounded-lg border bg-sky-50 border-sky-300">
          <span class="text-sm font-semibold text-sky-700">Check</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
