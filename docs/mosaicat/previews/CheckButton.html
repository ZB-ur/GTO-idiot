<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex gap-4 items-center">
    <!-- Default -->
    <button class="flex items-center justify-center px-6 py-3 min-w-[100px] bg-gray-800 hover:bg-gray-700 border border-gray-700 hover:border-gray-600 text-gray-50 font-bold rounded-xl transition-colors duration-150">
      <span class="text-sm font-semibold uppercase tracking-wide">Check</span>
    </button>
    <!-- Disabled -->
    <button disabled class="flex items-center justify-center px-6 py-3 min-w-[100px] bg-gray-800 border border-gray-800 text-gray-500 cursor-not-allowed font-bold rounded-xl">
      <span class="text-sm font-semibold uppercase tracking-wide">Check</span>
    </button>
  </div>
</body>
</html>
