<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionControls Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xl mx-auto space-y-8">
    <!-- State: Not in session (Landing) -->
    <div class="space-y-2">
      <span class="block text-xs font-medium text-gray-400 uppercase tracking-wide">未在牌局中</span>
      <button class="px-6 py-3 bg-blue-600 text-white text-base font-semibold rounded-xl shadow-sm hover:bg-blue-700 transition-colors duration-150">
        开始新牌局
      </button>
    </div>

    <!-- State: In session -->
    <div class="space-y-2">
      <span class="block text-xs font-medium text-gray-400 uppercase tracking-wide">牌局进行中</span>
      <button class="px-4 py-2 bg-red-500 text-white text-sm font-medium rounded-lg hover:bg-red-600 transition-colors duration-150">
        结束牌局
      </button>
    </div>

    <!-- State: Confirmation Modal -->
    <div class="space-y-2">
      <span class="block text-xs font-medium text-gray-400 uppercase tracking-wide">确认弹窗</span>
      <div class="relative bg-black/40 rounded-xl p-8 flex items-center justify-center" style="min-height: 200px;">
        <div class="bg-white rounded-xl shadow-md p-6 w-full max-w-sm space-y-4">
          <h3 class="text-lg font-semibold text-gray-900">确认结束</h3>
          <p class="text-sm text-gray-600">确定要结束当前牌局吗？你的进度会被保存。</p>
          <div class="flex justify-end gap-3">
            <button class="px-4 py-2 text-sm font-medium text-gray-600 bg-white border border-gray-200 rounded-lg hover:bg-slate-100 transition-colors duration-150">取消</button>
            <button class="px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors duration-150">确认结束</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
