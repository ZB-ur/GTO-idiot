<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionControls Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
    @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-pulse-dot { animation: pulse-dot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <div style="max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">

    <!-- State 1: Active -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Active State</p>
      <div class="flex items-center justify-between bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5">
        <!-- Left -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse-dot"></span>
            <span class="text-sm font-medium text-gray-50">进行中</span>
          </div>
          <div class="w-px h-4 bg-gray-700"></div>
          <span class="text-sm text-gray-400">第 <span class="text-gray-50 font-medium">42</span> 手</span>
        </div>
        <!-- Right -->
        <div class="flex items-center gap-2">
          <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-gray-50 bg-gray-800 hover:bg-gray-700 border border-gray-700 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6" />
            </svg>
            暂停
          </button>
          <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-red-500 bg-gray-800 border border-gray-700 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
            </svg>
            结束
          </button>
        </div>
      </div>
    </div>

    <!-- State 2: Paused -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">Paused State</p>
      <div class="flex items-center justify-between bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5">
        <!-- Left -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-yellow-500"></span>
            <span class="text-sm font-medium text-gray-50">已暂停</span>
          </div>
          <div class="w-px h-4 bg-gray-700"></div>
          <span class="text-sm text-gray-400">第 <span class="text-gray-50 font-medium">42</span> 手</span>
        </div>
        <!-- Right -->
        <div class="flex items-center gap-2">
          <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-gray-950 bg-emerald-500 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
            </svg>
            继续
          </button>
          <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-red-500 bg-gray-800 border border-gray-700 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z" />
            </svg>
            结束
          </button>
        </div>
      </div>
    </div>

    <!-- State 3: End Confirmation -->
    <div>
      <p class="text-xs text-gray-500 mb-2 uppercase tracking-wider">End Confirmation State</p>
      <div class="flex items-center justify-between bg-gray-900 border border-gray-700 rounded-xl px-4 py-2.5">
        <!-- Left -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2">
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse-dot"></span>
            <span class="text-sm font-medium text-gray-50">进行中</span>
          </div>
          <div class="w-px h-4 bg-gray-700"></div>
          <span class="text-sm text-gray-400">第 <span class="text-gray-50 font-medium">42</span> 手</span>
        </div>
        <!-- Right -->
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-400 mr-1">确认结束？</span>
          <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-white bg-red-500 rounded-lg transition-colors">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            确认
          </button>
          <button class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-gray-400 bg-gray-800 rounded-lg transition-colors">
            取消
          </button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
