<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HistoryEmptyState Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col items-center justify-center py-20 px-6">
    <!-- Illustration -->
    <div class="relative w-32 h-32 mb-8">
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-16 h-24 bg-gray-800 border border-gray-700 rounded-xl -rotate-12 absolute shadow-md"></div>
        <div class="w-16 h-24 bg-gray-800 border border-gray-700 rounded-xl rotate-0 absolute shadow-md"></div>
        <div class="w-16 h-24 bg-gray-800 border border-gray-700 rounded-xl rotate-12 absolute shadow-md"></div>
      </div>
      <div class="absolute inset-0 flex items-center justify-center">
        <svg class="w-12 h-12 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>
    </div>

    <h3 class="text-xl font-semibold text-gray-50 mb-2">暂无手牌记录</h3>
    <p class="text-gray-500 text-sm text-center max-w-xs mb-8">
      开始一局游戏，你的手牌历史将会显示在这里。每手牌的关键决策都会被自动记录。
    </p>

    <button class="px-6 py-3 bg-amber-500 hover:bg-amber-400 text-gray-950 font-semibold rounded-xl transition-colors">
      开始游戏
    </button>
  </div>
</body>
</html>
