<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniRangeMatrix Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
  <script>
    // Generate matrix cell HTML
    const RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
    // Simplified raise frequencies for demo
    const raiseFreqs = [
      [100,95,90,85,70,50,45,40,35,30,25,22,20],
      [80,100,75,70,55,35,30,28,25,22,20,18,15],
      [70,60,100,60,50,30,25,22,20,18,15,12,10],
      [65,55,50,100,45,28,22,20,18,15,12,10,8],
      [50,40,38,35,100,25,20,18,15,12,10,8,5],
      [35,25,22,20,18,80,15,12,10,8,5,4,3],
      [30,22,18,15,14,12,70,10,8,6,4,3,2],
      [28,20,16,14,12,10,8,60,6,5,3,2,2],
      [25,18,14,12,10,8,6,5,50,4,3,2,1],
      [22,16,12,10,8,6,5,4,3,40,2,2,1],
      [20,14,10,8,6,5,4,3,2,2,30,1,1],
      [18,12,8,6,5,4,3,2,2,1,1,20,1],
      [15,10,6,5,4,3,2,2,1,1,1,1,15],
    ];
    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('matrix-grid');
      const highlightR = 0, highlightC = 1; // AKs highlighted
      for (let r = 0; r < 13; r++) {
        for (let c = 0; c < 13; c++) {
          const freq = raiseFreqs[r][c];
          const isHL = r === highlightR && c === highlightC;
          const isPair = r === c;
          const isSuited = r < c;
          const label = isPair ? RANKS[r]+RANKS[c] : isSuited ? RANKS[r]+RANKS[c]+'s' : RANKS[c]+RANKS[r]+'o';
          const isRaise = freq > 50;
          const isCall = freq > 20 && freq <= 50;
          const color = isRaise ? '#34d399' : isCall ? '#38bdf8' : '#4b5563';
          const opacity = Math.max(0.15, freq / 100);
          const cell = document.createElement('div');
          cell.style.cssText = `width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:6px;font-weight:500;background:${color};opacity:${isHL?1:opacity};color:${isHL?'#fbbf24':'#e5e7eb'};`;
          if (isHL) {
            cell.style.outline = '2px solid #facc15';
            cell.style.outlineOffset = '1px';
            cell.style.borderRadius = '2px';
            cell.style.zIndex = '10';
            cell.style.position = 'relative';
          }
          cell.title = label;
          grid.appendChild(cell);
        }
      }
    });
  </script>
</head>
<body>
  <div style="max-width: 320px;">
    <div class="rounded-xl bg-gray-900 border border-gray-700 p-3">
      <!-- Header -->
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs font-semibold text-gray-50">Range Matrix</span>
        <button class="text-[10px] text-emerald-400 hover:text-emerald-300 font-medium">Expand</button>
      </div>

      <!-- Matrix Grid -->
      <div id="matrix-grid" style="display:inline-grid;grid-template-columns:repeat(13,20px);gap:1px;background:#1f2937;border-radius:8px;overflow:hidden;"></div>

      <!-- Legend -->
      <div class="flex items-center gap-3 mt-2 text-[10px] text-gray-500">
        <div class="flex items-center gap-1">
          <div class="w-2 h-2 rounded-sm" style="background:#34d399"></div>
          <span>Raise</span>
        </div>
        <div class="flex items-center gap-1">
          <div class="w-2 h-2 rounded-sm" style="background:#38bdf8"></div>
          <span>Call</span>
        </div>
        <div class="flex items-center gap-1">
          <div class="w-2 h-2 rounded-sm" style="background:#4b5563"></div>
          <span>Fold</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
