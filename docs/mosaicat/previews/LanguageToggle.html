<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LanguageToggle Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- English selected -->
  <div class="mb-6">
    <p class="text-gray-400 text-xs mb-2 uppercase tracking-wide">English Selected</p>
    <div class="inline-flex items-center rounded-xl border border-gray-700 bg-gray-800 p-0.5">
      <button class="px-3 py-1.5 text-sm font-medium rounded-lg bg-emerald-500 text-gray-950 transition-all duration-150">
        EN
      </button>
      <button class="px-3 py-1.5 text-sm font-medium rounded-lg text-gray-400 transition-all duration-150">
        中文
      </button>
    </div>
  </div>

  <!-- Chinese selected -->
  <div class="mb-6">
    <p class="text-gray-400 text-xs mb-2 uppercase tracking-wide">Chinese Selected</p>
    <div class="inline-flex items-center rounded-xl border border-gray-700 bg-gray-800 p-0.5">
      <button class="px-3 py-1.5 text-sm font-medium rounded-lg text-gray-400 transition-all duration-150">
        EN
      </button>
      <button class="px-3 py-1.5 text-sm font-medium rounded-lg bg-emerald-500 text-gray-950 transition-all duration-150">
        中文
      </button>
    </div>
  </div>

  <!-- In context (simulated nav bar) -->
  <div>
    <p class="text-gray-400 text-xs mb-2 uppercase tracking-wide">In Navigation Context</p>
    <div class="flex items-center justify-between bg-gray-900 border border-gray-700 rounded-xl px-4 py-3">
      <span class="text-gray-50 font-semibold text-base">PokerCoach</span>
      <div class="flex items-center gap-4">
        <div class="inline-flex items-center rounded-xl border border-gray-700 bg-gray-800 p-0.5">
          <button class="px-3 py-1.5 text-sm font-medium rounded-lg bg-emerald-500 text-gray-950">
            EN
          </button>
          <button class="px-3 py-1.5 text-sm font-medium rounded-lg text-gray-400">
            中文
          </button>
        </div>
        <div class="w-8 h-8 rounded-full bg-gray-700"></div>
      </div>
    </div>
  </div>
</body>
</html>
