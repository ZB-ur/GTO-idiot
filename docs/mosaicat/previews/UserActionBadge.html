<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UserActionBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-4">
    <h2 class="text-lg font-semibold text-gray-900">UserActionBadge</h2>
    <div class="flex flex-wrap items-center gap-3">
      <!-- Fold -->
      <span class="inline-flex items-center gap-1 px-2.5 py-1 text-sm font-medium rounded-lg border bg-gray-100 text-gray-600 border-gray-200">
        <span class="text-xs">✕</span>
        <span>Fold</span>
      </span>
      <!-- Check -->
      <span class="inline-flex items-center gap-1 px-2.5 py-1 text-sm font-medium rounded-lg border bg-blue-50 text-blue-600 border-blue-200">
        <span class="text-xs">✓</span>
        <span>Check</span>
      </span>
      <!-- Call -->
      <span class="inline-flex items-center gap-1 px-2.5 py-1 text-sm font-medium rounded-lg border bg-blue-100 text-blue-700 border-blue-200">
        <span class="text-xs">→</span>
        <span>Call 10</span>
      </span>
      <!-- Raise -->
      <span class="inline-flex items-center gap-1 px-2.5 py-1 text-sm font-medium rounded-lg border bg-orange-100 text-orange-700 border-orange-200">
        <span class="text-xs">⬆</span>
        <span>Raise to 25</span>
      </span>
      <!-- All-In -->
      <span class="inline-flex items-center gap-1 px-2.5 py-1 text-sm font-medium rounded-lg border bg-red-100 text-red-700 border-red-200">
        <span class="text-xs">🔥</span>
        <span>All-In 500</span>
      </span>
    </div>
  </div>
</body>
</html>
