<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PositionBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-wrap gap-3 items-center">

    <!-- UTG -->
    <span class="inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold tracking-wider rounded bg-red-500/20 text-red-400 border border-red-500/40">
      UTG
    </span>

    <!-- MP -->
    <span class="inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold tracking-wider rounded bg-orange-500/20 text-orange-400 border border-orange-500/40">
      MP
    </span>

    <!-- CO -->
    <span class="inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold tracking-wider rounded bg-amber-500/20 text-amber-400 border border-amber-500/40">
      CO
    </span>

    <!-- BTN -->
    <span class="inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold tracking-wider rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
      BTN
    </span>

    <!-- SB -->
    <span class="inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold tracking-wider rounded bg-sky-500/20 text-sky-400 border border-sky-500/40">
      SB
    </span>

    <!-- BB -->
    <span class="inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold tracking-wider rounded bg-violet-500/20 text-violet-400 border border-violet-500/40">
      BB
    </span>

  </div>

  <div class="flex flex-wrap gap-3 mt-4 text-gray-500 text-xs">
    <span>Early</span>
    <span>Middle</span>
    <span>Cutoff</span>
    <span>Button</span>
    <span>Small Blind</span>
    <span>Big Blind</span>
  </div>
</body>
</html>
