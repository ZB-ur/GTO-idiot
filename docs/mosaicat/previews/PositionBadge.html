<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PositionBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>

  <!-- Section: Small size (default) -->
  <div class="mb-6">
    <p class="text-sm font-semibold text-gray-600 mb-3">Size: sm (default)</p>
    <div class="flex flex-wrap items-center gap-2">

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-rose-50 text-rose-700 border-rose-200">
        UTG
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-orange-50 text-orange-700 border-orange-200">
        UTG1
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-amber-50 text-amber-700 border-amber-200">
        MP
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-emerald-50 text-emerald-700 border-emerald-200">
        CO
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-blue-50 text-blue-700 border-blue-200">
        BTN
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-violet-50 text-violet-700 border-violet-200">
        SB
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-purple-50 text-purple-700 border-purple-200">
        BB
      </span>

    </div>
  </div>

  <!-- Section: Medium size -->
  <div class="mb-6">
    <p class="text-sm font-semibold text-gray-600 mb-3">Size: md</p>
    <div class="flex flex-wrap items-center gap-2">

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-rose-50 text-rose-700 border-rose-200">
        UTG
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-orange-50 text-orange-700 border-orange-200">
        UTG1
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-amber-50 text-amber-700 border-amber-200">
        MP
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-emerald-50 text-emerald-700 border-emerald-200">
        CO
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-blue-50 text-blue-700 border-blue-200">
        BTN
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-violet-50 text-violet-700 border-violet-200">
        SB
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-purple-50 text-purple-700 border-purple-200">
        BB
      </span>

    </div>
  </div>

  <!-- Section: With full names (sm) -->
  <div class="mb-6">
    <p class="text-sm font-semibold text-gray-600 mb-3">With full name (sm)</p>
    <div class="flex flex-wrap items-center gap-2">

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-rose-50 text-rose-700 border-rose-200">
        UTG <span class="font-normal opacity-80">枪口位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-emerald-50 text-emerald-700 border-emerald-200">
        CO <span class="font-normal opacity-80">关煞位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-blue-50 text-blue-700 border-blue-200">
        BTN <span class="font-normal opacity-80">按钮位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-purple-50 text-purple-700 border-purple-200">
        BB <span class="font-normal opacity-80">大盲位</span>
      </span>

    </div>
  </div>

  <!-- Section: With full names (md) -->
  <div class="mb-6">
    <p class="text-sm font-semibold text-gray-600 mb-3">With full name (md)</p>
    <div class="flex flex-wrap items-center gap-2">

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-rose-50 text-rose-700 border-rose-200">
        UTG <span class="font-normal opacity-80">枪口位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-amber-50 text-amber-700 border-amber-200">
        MP <span class="font-normal opacity-80">中位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-emerald-50 text-emerald-700 border-emerald-200">
        CO <span class="font-normal opacity-80">关煞位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-blue-50 text-blue-700 border-blue-200">
        BTN <span class="font-normal opacity-80">按钮位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-violet-50 text-violet-700 border-violet-200">
        SB <span class="font-normal opacity-80">小盲位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-purple-50 text-purple-700 border-purple-200">
        BB <span class="font-normal opacity-80">大盲位</span>
      </span>

    </div>
  </div>

  <!-- Section: In-context usage (dark table surface) -->
  <div>
    <p class="text-sm font-semibold text-gray-600 mb-3">On dark surface (table felt context)</p>
    <div class="bg-emerald-800 rounded-xl p-4 flex flex-wrap items-center gap-3">

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-rose-50 text-rose-700 border-rose-200">
        UTG
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-amber-50 text-amber-700 border-amber-200">
        MP
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-emerald-50 text-emerald-700 border-emerald-200">
        CO
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-2 py-1 text-sm bg-blue-50 text-blue-700 border-blue-200">
        BTN <span class="font-normal opacity-80">按钮位</span>
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-violet-50 text-violet-700 border-violet-200">
        SB
      </span>

      <span class="inline-flex items-center gap-1 font-semibold rounded-lg border px-1.5 py-0.5 text-xs bg-purple-50 text-purple-700 border-purple-200">
        BB
      </span>

    </div>
  </div>

</body>
</html>
