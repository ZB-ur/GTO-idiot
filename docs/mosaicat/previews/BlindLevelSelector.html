<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="max-w-xs mx-auto space-y-2">
  <label class="text-sm font-semibold text-gray-900">Blind Level</label>
  <div class="flex gap-2">
    <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border-2 bg-white text-gray-700 border-gray-200">1/2</button>
    <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border-2 bg-blue-600 text-white border-blue-600 shadow-sm">2/5</button>
    <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border-2 bg-white text-gray-700 border-gray-200">5/10</button>
  </div>
</div>
</body>
</html>
