<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaiseInput Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xs mx-auto space-y-8">
    <!-- Default state -->
    <div>
      <p class="text-xs text-gray-400 mb-2 uppercase tracking-wide">Default</p>
      <div class="flex flex-col gap-1.5">
        <div class="relative">
          <input
            type="text"
            value="25"
            readonly
            class="w-full px-4 py-2.5 text-center text-lg font-semibold bg-white border-2 border-gray-200 rounded-lg outline-none text-gray-900 hover:border-gray-300"
          />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400 pointer-events-none">筹码</span>
        </div>
        <p class="text-xs text-gray-400 text-center">范围 10 – 500</p>
      </div>
    </div>

    <!-- Focused state -->
    <div>
      <p class="text-xs text-gray-400 mb-2 uppercase tracking-wide">Focused</p>
      <div class="flex flex-col gap-1.5">
        <div class="relative">
          <input
            type="text"
            value="50"
            readonly
            class="w-full px-4 py-2.5 text-center text-lg font-semibold bg-white border-2 border-blue-600 rounded-lg outline-none text-gray-900 ring-2 ring-blue-100"
          />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400 pointer-events-none">筹码</span>
        </div>
        <p class="text-xs text-gray-400 text-center">范围 10 – 500</p>
      </div>
    </div>

    <!-- Error state -->
    <div>
      <p class="text-xs text-gray-400 mb-2 uppercase tracking-wide">Error</p>
      <div class="flex flex-col gap-1.5">
        <div class="relative">
          <input
            type="text"
            value="5"
            readonly
            class="w-full px-4 py-2.5 text-center text-lg font-semibold bg-white border-2 border-red-500 rounded-lg outline-none text-red-600 ring-2 ring-red-200"
          />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-gray-400 pointer-events-none">筹码</span>
        </div>
        <p class="text-xs text-red-500 text-center">最小加注 10 筹码</p>
      </div>
    </div>
  </div>
</body>
</html>
