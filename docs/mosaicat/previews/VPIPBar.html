<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPIPBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-sm mx-auto space-y-5">
    <!-- Tight: 15% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">VPIP</span>
        <span class="text-sm font-bold text-gray-900">15%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-blue-500" style="width: 15%"></div>
      </div>
    </div>
    <!-- Normal: 26% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">VPIP</span>
        <span class="text-sm font-bold text-gray-900">26%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-emerald-500" style="width: 26%"></div>
      </div>
    </div>
    <!-- Loose: 38% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">VPIP</span>
        <span class="text-sm font-bold text-gray-900">38%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-amber-500" style="width: 38%"></div>
      </div>
    </div>
    <!-- Very loose: 52% -->
    <div class="w-full">
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">VPIP</span>
        <span class="text-sm font-bold text-gray-900">52%</span>
      </div>
      <div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-red-500" style="width: 52%"></div>
      </div>
    </div>
  </div>
</body>
</html>
