<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TutorialOverlay Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #1a1a2e; font-family: system-ui, sans-serif; min-height: 100vh; }
  </style>
</head>
<body>

  <!-- Simulated background content (poker table) -->
  <div class="flex items-center justify-center min-h-screen bg-emerald-900/80">
    <div class="w-96 h-56 rounded-full bg-emerald-800 border-4 border-amber-400/30 flex items-center justify-center">
      <span class="text-emerald-600 text-lg font-bold">TABLE</span>
    </div>
  </div>

  <!-- Overlay -->
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60" style="backdrop-filter: blur(4px);">
    <div class="relative mx-4 flex w-full max-w-lg flex-col overflow-hidden rounded-xl bg-white shadow-xl">

      <!-- Skip button -->
      <button class="absolute right-4 top-4 z-10 rounded-lg px-3 py-1.5 text-sm font-medium text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors">
        Skip
      </button>

      <!-- Step content -->
      <div class="flex flex-col items-center px-8 pb-6 pt-10 text-center">
        <!-- Icon -->
        <div class="mb-6 flex h-16 w-16 items-center justify-center rounded-2xl bg-blue-50 text-blue-600">
          <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 1 1-3 0m3 0a1.5 1.5 0 1 0-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 0 1-3 0m3 0a1.5 1.5 0 0 0-3 0m-9.75 0h9.75" />
          </svg>
        </div>

        <!-- Title -->
        <h2 class="mb-3 text-2xl font-bold text-gray-900">Welcome to GTO Idiot</h2>

        <!-- Description -->
        <p class="max-w-sm text-base leading-relaxed text-gray-500">
          Learn Texas Hold'em strategy by playing against AI bots and comparing your decisions to Game Theory Optimal (GTO) play.
        </p>
      </div>

      <!-- Progress dots -->
      <div class="flex items-center justify-center gap-2 pb-6">
        <!-- Active dot (step 1) -->
        <div class="h-2 w-6 rounded-full bg-blue-600"></div>
        <!-- Inactive dots -->
        <div class="h-2 w-2 rounded-full bg-gray-200"></div>
        <div class="h-2 w-2 rounded-full bg-gray-200"></div>
        <div class="h-2 w-2 rounded-full bg-gray-200"></div>
        <div class="h-2 w-2 rounded-full bg-gray-200"></div>
      </div>

      <!-- Navigation -->
      <div class="flex items-center justify-between border-t border-gray-200 px-8 py-4">
        <button class="rounded-lg px-4 py-2.5 text-sm font-medium text-gray-300 cursor-not-allowed">
          Back
        </button>

        <span class="text-sm text-gray-400">1 / 5</span>

        <button class="rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 transition-colors">
          Next
        </button>
      </div>
    </div>
  </div>

</body>
</html>
