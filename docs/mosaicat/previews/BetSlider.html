<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetSlider Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #030712; font-family: system-ui, sans-serif; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <div style="max-width: 360px;">
    <div class="rounded-xl bg-gray-900 border border-gray-700 p-4 space-y-3">
      <!-- Header -->
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold text-gray-50">Bet Size</span>
        <span class="text-xs text-gray-500">Pot: <span class="text-gray-300 font-medium">45</span></span>
      </div>

      <!-- Slider Track -->
      <div class="relative" style="padding: 6px 0;">
        <div class="h-2 rounded-full bg-gray-800 overflow-hidden">
          <div class="h-full rounded-full bg-emerald-500" style="width: 35%;"></div>
        </div>
        <!-- Thumb -->
        <div class="absolute top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-emerald-500 border-2 border-gray-950 shadow-md" style="left: calc(35% - 10px);"></div>
      </div>

      <!-- Numeric Input -->
      <div class="flex items-center gap-2">
        <div class="flex-1">
          <input type="number" value="24" class="w-full rounded-lg bg-gray-800 border border-gray-700 text-gray-50 text-sm font-bold px-3 py-2 text-center focus:outline-none" />
        </div>
      </div>

      <!-- Preset Buttons -->
      <div class="flex gap-2 flex-wrap">
        <button class="px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-xs font-semibold text-gray-300 hover:bg-gray-700 hover:text-emerald-400 hover:border-emerald-500/50 transition-colors">1/2 Pot</button>
        <button class="px-3 py-1.5 rounded-lg bg-gray-800 border border-emerald-500/50 text-xs font-semibold text-emerald-400 bg-gray-700">3/4 Pot</button>
        <button class="px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-xs font-semibold text-gray-300 hover:bg-gray-700 hover:text-emerald-400 hover:border-emerald-500/50 transition-colors">Pot</button>
        <button class="px-3 py-1.5 rounded-lg bg-gray-800 border border-gray-700 text-xs font-semibold text-gray-300 hover:bg-gray-700 hover:text-emerald-400 hover:border-emerald-500/50 transition-colors">All In</button>
      </div>

      <!-- Min/Max -->
      <div class="flex justify-between text-[10px] text-gray-500">
        <span>Min: 8</span>
        <span>Max: 985</span>
      </div>
    </div>
  </div>
</body>
</html>
