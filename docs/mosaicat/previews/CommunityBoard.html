<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 24px;">
    <!-- Flop (3 cards) -->
    <div>
      <p class="text-gray-400 text-sm mb-2">Flop</p>
      <div class="flex items-center gap-2">
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-red-500">10</span>
          <span class="text-xl leading-none text-red-500">♥</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-gray-900">J</span>
          <span class="text-xl leading-none text-gray-900">♠</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-red-500">Q</span>
          <span class="text-xl leading-none text-red-500">♦</span>
        </div>
        <div class="w-14 h-20 rounded-lg border-2 border-dashed border-gray-700 bg-gray-800/50 flex items-center justify-center">
          <span class="text-gray-600 text-xs">?</span>
        </div>
        <div class="w-14 h-20 rounded-lg border-2 border-dashed border-gray-700 bg-gray-800/50 flex items-center justify-center">
          <span class="text-gray-600 text-xs">?</span>
        </div>
      </div>
    </div>
    <!-- River (5 cards) -->
    <div>
      <p class="text-gray-400 text-sm mb-2">River</p>
      <div class="flex items-center gap-2">
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-red-500">10</span>
          <span class="text-xl leading-none text-red-500">♥</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-gray-900">J</span>
          <span class="text-xl leading-none text-gray-900">♠</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-red-500">Q</span>
          <span class="text-xl leading-none text-red-500">♦</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-gray-900">K</span>
          <span class="text-xl leading-none text-gray-900">♣</span>
        </div>
        <div class="w-14 h-20 rounded-lg bg-gray-50 border border-gray-200 shadow-md flex flex-col items-center justify-center gap-0.5">
          <span class="text-base font-bold leading-none text-red-500">A</span>
          <span class="text-xl leading-none text-red-500">♥</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
