<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameSettingsPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto">
    <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6 space-y-6">
      <h3 class="text-lg font-semibold text-gray-900">Game Settings</h3>

      <!-- Blind Level -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Blind Level</label>
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-blue-600 text-white border-blue-600 shadow-sm">
            1 / 2
          </button>
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-white text-gray-700 border-gray-200">
            2 / 5
          </button>
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-white text-gray-700 border-gray-200">
            5 / 10
          </button>
        </div>
      </div>

      <!-- Stack Size -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Starting Stack</label>
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-blue-600 text-white border-blue-600 shadow-sm">
            100 BB
          </button>
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-white text-gray-700 border-gray-200">
            200 BB
          </button>
        </div>
      </div>

      <!-- Game Speed -->
      <div class="space-y-2">
        <label class="block text-sm font-medium text-gray-700">Bot Speed</label>
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-white text-gray-700 border-gray-200">
            <span class="mr-1.5">🐢</span>Slow
          </button>
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-blue-600 text-white border-blue-600 shadow-sm">
            <span class="mr-1.5">▶️</span>Normal
          </button>
          <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border bg-white text-gray-700 border-gray-200">
            <span class="mr-1.5">⚡</span>Fast
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
