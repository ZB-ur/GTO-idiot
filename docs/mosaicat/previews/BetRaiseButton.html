<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-4 items-start">
    <!-- Active Bet -->
    <button class="px-6 py-3 rounded-xl font-semibold text-base bg-amber-500 text-gray-950 hover:bg-amber-400 transition-all duration-150">
      Bet
    </button>
    <!-- Active Raise -->
    <button class="px-6 py-3 rounded-xl font-semibold text-base bg-amber-500 text-gray-950 hover:bg-amber-400 transition-all duration-150">
      Raise
    </button>
    <!-- Disabled -->
    <button class="px-6 py-3 rounded-xl font-semibold text-base bg-gray-700 text-gray-500 cursor-not-allowed" disabled>
      Bet
    </button>
  </div>
</body>
</html>
