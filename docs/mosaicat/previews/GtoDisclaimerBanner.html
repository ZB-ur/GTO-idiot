<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GtoDisclaimerBanner Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-4 max-w-lg">
    <!-- Default banner -->
    <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 flex items-start gap-3">
      <span class="flex-shrink-0 text-amber-500 mt-0.5">
        <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
        </svg>
      </span>
      <p class="flex-1 text-sm text-amber-800 leading-relaxed">
        GTO suggestions are approximate and intended for learning purposes only. Results may differ from solver-computed optimal strategies. Use at your own discretion.
      </p>
      <button class="flex-shrink-0 text-amber-400 hover:text-amber-600 mt-0.5" aria-label="Dismiss">
        <svg class="w-4 h-4" viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 4.646a.5.5 0 01.708 0L8 7.293l2.646-2.647a.5.5 0 01.708.708L8.707 8l2.647 2.646a.5.5 0 01-.708.708L8 8.707l-2.646 2.647a.5.5 0 01-.708-.708L7.293 8 4.646 5.354a.5.5 0 010-.708z"/></svg>
      </button>
    </div>

    <!-- In context: above seat selection -->
    <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
      <div class="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 flex items-start gap-3 mb-6">
        <span class="flex-shrink-0 text-amber-500 mt-0.5">
          <svg class="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
          </svg>
        </span>
        <p class="flex-1 text-sm text-amber-800 leading-relaxed">
          This tool uses simplified GTO approximations. For precise play, consult a dedicated poker solver.
        </p>
        <button class="flex-shrink-0 text-amber-400 hover:text-amber-600 mt-0.5" aria-label="Dismiss">
          <svg class="w-4 h-4" viewBox="0 0 16 16" fill="currentColor"><path d="M4.646 4.646a.5.5 0 01.708 0L8 7.293l2.646-2.647a.5.5 0 01.708.708L8.707 8l2.647 2.646a.5.5 0 01-.708.708L8 8.707l-2.646 2.647a.5.5 0 01-.708-.708L7.293 8 4.646 5.354a.5.5 0 010-.708z"/></svg>
        </button>
      </div>
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Select Your Seat</h2>
      <div class="grid grid-cols-3 gap-3">
        <div class="border border-gray-200 rounded-lg p-3 text-center text-sm text-gray-600 hover:border-blue-400 cursor-pointer">Seat 1</div>
        <div class="border border-blue-600 bg-blue-50 rounded-lg p-3 text-center text-sm text-blue-600 font-medium">Seat 2</div>
        <div class="border border-gray-200 rounded-lg p-3 text-center text-sm text-gray-600 hover:border-blue-400 cursor-pointer">Seat 3</div>
      </div>
    </div>
  </div>
</body>
</html>
