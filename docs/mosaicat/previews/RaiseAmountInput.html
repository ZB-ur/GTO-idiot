<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-4 max-w-[160px]">
    <!-- Normal -->
    <div class="flex flex-col gap-1">
      <input type="number" value="250" class="w-full px-4 py-2.5 bg-gray-800 text-gray-50 text-lg font-bold text-center border border-gray-700 rounded-xl outline-none" />
    </div>
    <!-- With error -->
    <div class="flex flex-col gap-1">
      <input type="number" value="5" class="w-full px-4 py-2.5 bg-gray-800 text-gray-50 text-lg font-bold text-center border border-red-500 rounded-xl outline-none" />
      <span class="text-red-500 text-xs font-medium px-1">Min raise is 20</span>
    </div>
  </div>
</body>
</html>
