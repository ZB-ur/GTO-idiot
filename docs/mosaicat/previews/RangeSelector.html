<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="max-w-sm mx-auto space-y-2">
  <div class="flex items-center justify-between">
    <label class="text-sm font-semibold text-gray-900">Analysis Range</label>
    <span class="text-xs text-gray-400">of 847 hands</span>
  </div>
  <div class="flex gap-2">
    <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-white text-gray-700 border-gray-200">50</button>
    <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-blue-600 text-white border-blue-600">100</button>
    <button class="flex-1 py-2 text-sm font-semibold rounded-lg border bg-white text-gray-700 border-gray-200">200</button>
    <input type="text" placeholder="Custom" class="flex-1 py-2 text-sm font-medium text-center border border-gray-200 rounded-lg w-full" />
  </div>
</div>
</body>
</html>
