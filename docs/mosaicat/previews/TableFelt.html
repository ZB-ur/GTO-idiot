<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TableFelt Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 32px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-12">

    <!-- State 1: Flop (3 community cards + pot) -->
    <div>
      <p class="text-gray-500 text-xs mb-4 uppercase tracking-wider">State: Flop — 3 community cards, pot 15</p>
      <div class="relative mx-auto" style="width: 700px; height: 320px;">
        <!-- Felt -->
        <div class="absolute inset-0 rounded-[50%] bg-emerald-900 border-4 border-emerald-700" style="box-shadow: inset 0 2px 40px rgba(0,0,0,0.4);">
          <div class="absolute inset-4 rounded-[50%] border border-emerald-600/30"></div>
        </div>
        <!-- Content -->
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4">
          <!-- Pot -->
          <div class="flex items-center gap-1.5 bg-gray-950/60 px-4 py-1.5 rounded-full">
            <svg class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
            <span class="text-amber-500 font-bold text-base">15</span>
          </div>
          <!-- Cards -->
          <div class="flex gap-2">
            <!-- Ah -->
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-red-500">A</span>
              <span class="text-lg leading-none text-red-500">♥</span>
            </div>
            <!-- Ks -->
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-gray-800">K</span>
              <span class="text-lg leading-none text-gray-800">♠</span>
            </div>
            <!-- 7d -->
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-red-500">7</span>
              <span class="text-lg leading-none text-red-500">♦</span>
            </div>
            <!-- empty -->
            <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-700/50"></div>
            <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-700/50"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- State 2: River (5 cards + pot + side pot) -->
    <div>
      <p class="text-gray-500 text-xs mb-4 uppercase tracking-wider">State: River — 5 cards, pot 120, side pot 50</p>
      <div class="relative mx-auto" style="width: 700px; height: 320px;">
        <div class="absolute inset-0 rounded-[50%] bg-emerald-900 border-4 border-emerald-700" style="box-shadow: inset 0 2px 40px rgba(0,0,0,0.4);">
          <div class="absolute inset-4 rounded-[50%] border border-emerald-600/30"></div>
        </div>
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4">
          <!-- Pot + side pot -->
          <div class="flex flex-col items-center gap-1">
            <div class="flex items-center gap-1.5 bg-gray-950/60 px-4 py-1.5 rounded-full">
              <svg class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
              <span class="text-amber-500 font-bold text-base">120</span>
            </div>
            <div class="flex gap-2">
              <span class="text-amber-400/70 text-xs bg-gray-950/40 px-2 py-0.5 rounded-full">边池 50</span>
            </div>
          </div>
          <!-- 5 cards -->
          <div class="flex gap-2">
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-red-500">A</span>
              <span class="text-lg leading-none text-red-500">♥</span>
            </div>
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-gray-800">K</span>
              <span class="text-lg leading-none text-gray-800">♠</span>
            </div>
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-red-500">7</span>
              <span class="text-lg leading-none text-red-500">♦</span>
            </div>
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-gray-800">T</span>
              <span class="text-lg leading-none text-gray-800">♣</span>
            </div>
            <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
              <span class="text-base font-bold leading-none text-red-500">2</span>
              <span class="text-lg leading-none text-red-500">♥</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- State 3: Preflop (no community cards) -->
    <div>
      <p class="text-gray-500 text-xs mb-4 uppercase tracking-wider">State: Preflop — no community cards, pot 3</p>
      <div class="relative mx-auto" style="width: 700px; height: 320px;">
        <div class="absolute inset-0 rounded-[50%] bg-emerald-900 border-4 border-emerald-700" style="box-shadow: inset 0 2px 40px rgba(0,0,0,0.4);">
          <div class="absolute inset-4 rounded-[50%] border border-emerald-600/30"></div>
        </div>
        <div class="absolute inset-0 flex flex-col items-center justify-center gap-4">
          <div class="flex items-center gap-1.5 bg-gray-950/60 px-4 py-1.5 rounded-full">
            <svg class="w-4 h-4 text-amber-500" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
            <span class="text-amber-500 font-bold text-base">3</span>
          </div>
          <div class="flex gap-2">
            <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-700/50"></div>
            <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-700/50"></div>
            <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-700/50"></div>
            <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-700/50"></div>
            <div class="w-14 h-20 rounded-lg border-2 border-dashed border-emerald-700/50"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
