<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProfitChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-2xl mx-auto">
    <!-- ProfitChart Component -->
    <div class="w-full bg-gray-900 rounded-xl border border-gray-700 p-4">
      <!-- Header -->
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-gray-50 text-lg font-semibold">盈亏曲线</h3>
        <span class="text-sm font-medium px-2 py-0.5 rounded-lg text-emerald-400 bg-emerald-500/10">
          +32.5 BB
        </span>
      </div>

      <!-- Chart SVG -->
      <svg width="100%" viewBox="0 0 560 280" class="overflow-visible">
        <defs>
          <linearGradient id="gPos" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#10b981" stop-opacity="0.02" />
          </linearGradient>
        </defs>

        <g transform="translate(48, 24)">
          <!-- Grid lines -->
          <!-- 40 BB -->
          <line x1="0" x2="480" y1="20" y2="20" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" />
          <text x="-8" y="20" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">40</text>

          <!-- 20 BB -->
          <line x1="0" x2="480" y1="70" y2="70" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" />
          <text x="-8" y="70" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">20</text>

          <!-- 0 BB (zero line) -->
          <line x1="0" x2="480" y1="120" y2="120" stroke="#6b7280" stroke-width="1.5" />
          <text x="-8" y="120" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">0</text>

          <!-- -20 BB -->
          <line x1="0" x2="480" y1="170" y2="170" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" />
          <text x="-8" y="170" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">-20</text>

          <!-- X axis labels -->
          <text x="0" y="220" text-anchor="middle" fill="#6b7280" font-size="11">#1</text>
          <text x="96" y="220" text-anchor="middle" fill="#6b7280" font-size="11">#10</text>
          <text x="192" y="220" text-anchor="middle" fill="#6b7280" font-size="11">#20</text>
          <text x="288" y="220" text-anchor="middle" fill="#6b7280" font-size="11">#30</text>
          <text x="384" y="220" text-anchor="middle" fill="#6b7280" font-size="11">#40</text>
          <text x="480" y="220" text-anchor="middle" fill="#6b7280" font-size="11">#50</text>

          <!-- Area fill under curve -->
          <path d="
            M0,120
            L24,115 L48,105 L72,110 L96,98
            L120,130 L144,145 L168,138 L192,125
            L216,108 L240,95 L264,88 L288,100
            L312,85 L336,72 L360,78 L384,65
            L408,58 L432,68 L456,52 L480,38
            L480,120 L0,120 Z
          " fill="url(#gPos)" />

          <!-- Profit line -->
          <path d="
            M0,120
            L24,115 L48,105 L72,110 L96,98
            L120,130 L144,145 L168,138 L192,125
            L216,108 L240,95 L264,88 L288,100
            L312,85 L336,72 L360,78 L384,65
            L408,58 L432,68 L456,52 L480,38
          " fill="none" stroke="#10b981" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />

          <!-- Simulated hover state on hand #35 -->
          <!-- Vertical guide line -->
          <line x1="336" x2="336" y1="0" y2="200" stroke="#6b7280" stroke-width="0.5" stroke-dasharray="4 4" />
          <!-- Point ring -->
          <circle cx="336" cy="72" r="6" fill="transparent" stroke="#10b981" stroke-width="2" />
          <circle cx="336" cy="72" r="3" fill="#10b981" />
        </g>
      </svg>

      <!-- Tooltip (positioned statically for preview) -->
      <div class="relative" style="margin-top: -140px; margin-left: 400px; width: fit-content;">
        <div class="bg-gray-800 border border-gray-600 rounded-lg px-3 py-2 shadow-md text-xs">
          <div class="text-gray-400 mb-1">Hand #35</div>
          <div class="font-semibold text-emerald-400">+24.0 BB</div>
          <div class="text-gray-500 mt-1">点击查看牌局</div>
        </div>
      </div>

      <!-- X axis label -->
      <div class="text-center text-xs text-gray-500 mt-1">手数</div>
    </div>

    <!-- Second variant: negative/losing chart -->
    <div class="w-full bg-gray-900 rounded-xl border border-gray-700 p-4 mt-6">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-gray-50 text-lg font-semibold">盈亏曲线</h3>
        <span class="text-sm font-medium px-2 py-0.5 rounded-lg text-red-400 bg-red-500/10">
          -18.5 BB
        </span>
      </div>

      <svg width="100%" viewBox="0 0 560 280" class="overflow-visible">
        <defs>
          <linearGradient id="gNeg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.02" />
            <stop offset="100%" stop-color="#ef4444" stop-opacity="0.3" />
          </linearGradient>
        </defs>

        <g transform="translate(48, 24)">
          <!-- Grid lines -->
          <line x1="0" x2="480" y1="30" y2="30" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" />
          <text x="-8" y="30" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">10</text>

          <line x1="0" x2="480" y1="80" y2="80" stroke="#6b7280" stroke-width="1.5" />
          <text x="-8" y="80" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">0</text>

          <line x1="0" x2="480" y1="130" y2="130" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" />
          <text x="-8" y="130" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">-10</text>

          <line x1="0" x2="480" y1="180" y2="180" stroke="#374151" stroke-width="0.5" stroke-dasharray="4 4" />
          <text x="-8" y="180" text-anchor="end" dominant-baseline="middle" fill="#6b7280" font-size="11">-20</text>

          <!-- X axis labels -->
          <text x="0" y="220" text-anchor="middle" fill="#6b7280" font-size="11">S1</text>
          <text x="160" y="220" text-anchor="middle" fill="#6b7280" font-size="11">S2</text>
          <text x="320" y="220" text-anchor="middle" fill="#6b7280" font-size="11">S3</text>
          <text x="480" y="220" text-anchor="middle" fill="#6b7280" font-size="11">S4</text>

          <!-- Area fill -->
          <path d="
            M0,80
            L60,70 L120,55 L160,72
            L200,90 L240,105 L280,120
            L320,135 L360,128 L400,148
            L440,162 L480,172
            L480,80 L0,80 Z
          " fill="url(#gNeg)" />

          <!-- Loss line -->
          <path d="
            M0,80
            L60,70 L120,55 L160,72
            L200,90 L240,105 L280,120
            L320,135 L360,128 L400,148
            L440,162 L480,172
          " fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
        </g>
      </svg>

      <div class="text-center text-xs text-gray-500 mt-1">Session</div>
    </div>

    <!-- Empty state -->
    <div class="w-full bg-gray-900 rounded-xl border border-gray-700 p-4 mt-6">
      <div class="flex items-center justify-between mb-3">
        <h3 class="text-gray-50 text-lg font-semibold">盈亏曲线</h3>
      </div>
      <div class="flex items-center justify-center h-64 text-gray-500 text-sm">
        暂无数据
      </div>
      <div class="text-center text-xs text-gray-500 mt-1">手数</div>
    </div>
  </div>
</body>
</html>
