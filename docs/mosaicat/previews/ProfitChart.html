<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 max-w-2xl">
    <h3 class="text-lg font-semibold text-gray-50 mb-4">Profit / Loss</h3>
    <div style="position: relative; height: 200px;">
      <svg width="100%" height="100%" viewBox="0 0 560 200" preserveAspectRatio="none" style="position:absolute;inset:0;">
        <!-- Grid lines -->
        <line x1="48" y1="20" x2="544" y2="20" stroke="#374151" stroke-width="1"/>
        <line x1="48" y1="56" x2="544" y2="56" stroke="#374151" stroke-width="1"/>
        <line x1="48" y1="92" x2="544" y2="92" stroke="#374151" stroke-width="1"/>
        <line x1="48" y1="128" x2="544" y2="128" stroke="#374151" stroke-width="1"/>
        <line x1="48" y1="164" x2="544" y2="164" stroke="#374151" stroke-width="1"/>

        <!-- Zero line (dashed) -->
        <line x1="48" y1="128" x2="544" y2="128" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>

        <!-- Y-axis labels -->
        <text x="40" y="24" fill="#9ca3af" font-size="11" text-anchor="end" font-family="system-ui">40</text>
        <text x="40" y="60" fill="#9ca3af" font-size="11" text-anchor="end" font-family="system-ui">20</text>
        <text x="40" y="96" fill="#9ca3af" font-size="11" text-anchor="end" font-family="system-ui">10</text>
        <text x="40" y="132" fill="#9ca3af" font-size="11" text-anchor="end" font-family="system-ui">0</text>
        <text x="40" y="168" fill="#9ca3af" font-size="11" text-anchor="end" font-family="system-ui">-10</text>

        <!-- X-axis labels -->
        <text x="48" y="192" fill="#9ca3af" font-size="11" text-anchor="middle" font-family="system-ui">#1</text>
        <text x="147" y="192" fill="#9ca3af" font-size="11" text-anchor="middle" font-family="system-ui">#10</text>
        <text x="246" y="192" fill="#9ca3af" font-size="11" text-anchor="middle" font-family="system-ui">#20</text>
        <text x="345" y="192" fill="#9ca3af" font-size="11" text-anchor="middle" font-family="system-ui">#30</text>
        <text x="444" y="192" fill="#9ca3af" font-size="11" text-anchor="middle" font-family="system-ui">#40</text>
        <text x="544" y="192" fill="#9ca3af" font-size="11" text-anchor="middle" font-family="system-ui">#47</text>

        <!-- Gradient fill -->
        <defs>
          <linearGradient id="profitGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(52,211,153,0.3)"/>
            <stop offset="100%" stop-color="rgba(52,211,153,0)"/>
          </linearGradient>
        </defs>
        <path d="M48,128 L98,135 L148,120 L198,140 L248,110 L298,105 L348,85 L398,95 L448,70 L498,55 L544,42 L544,164 L48,164 Z" fill="url(#profitGrad)"/>

        <!-- Profit line -->
        <path d="M48,128 L98,135 L148,120 L198,140 L248,110 L298,105 L348,85 L398,95 L448,70 L498,55 L544,42" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- End dot -->
        <circle cx="544" cy="42" r="4" fill="#34d399"/>
      </svg>
    </div>
  </div>
</body>
</html>
