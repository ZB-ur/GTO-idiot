<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SettingsPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-lg mx-auto space-y-6">
    <!-- Game Settings -->
    <section class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100">
        <h3 class="text-lg font-semibold text-gray-900">Game Settings</h3>
        <p class="text-sm text-gray-500 mt-0.5">Configure your table setup</p>
      </div>
      <div class="p-6 space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Blind Level</label>
          <div class="flex gap-2">
            <button class="flex-1 py-2.5 text-sm font-medium rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">$1 / $2</button>
            <button class="flex-1 py-2.5 text-sm font-medium rounded-lg border bg-blue-600 border-blue-600 text-white">$2 / $5</button>
            <button class="flex-1 py-2.5 text-sm font-medium rounded-lg border bg-white border-gray-200 text-gray-600 hover:bg-gray-50">$5 / $10</button>
          </div>
        </div>
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-sm font-medium text-gray-700">Starting Stack</label>
            <span class="text-sm font-bold text-gray-900">100 BB</span>
          </div>
          <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 rounded-full" style="width: 33%"></div>
          </div>
          <div class="flex justify-between text-[10px] text-gray-400 mt-1">
            <span>50 BB</span>
            <span>100 BB</span>
            <span>200 BB</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Preferences -->
    <section class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100">
        <h3 class="text-lg font-semibold text-gray-900">Preferences</h3>
        <p class="text-sm text-gray-500 mt-0.5">Customize your experience</p>
      </div>
      <div class="p-6 space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Game Speed</label>
          <div class="space-y-2">
            <button class="w-full flex items-center justify-between p-3 rounded-lg border bg-white border-gray-200 hover:bg-gray-50">
              <div>
                <span class="text-sm font-medium text-gray-700">Fast</span>
                <span class="text-xs text-gray-400 ml-2">Instant actions</span>
              </div>
              <div class="w-4 h-4 rounded-full border-2 border-gray-300"></div>
            </button>
            <button class="w-full flex items-center justify-between p-3 rounded-lg border bg-blue-50 border-blue-300">
              <div>
                <span class="text-sm font-medium text-blue-700">Normal</span>
                <span class="text-xs text-gray-400 ml-2">Balanced pace</span>
              </div>
              <div class="w-4 h-4 rounded-full border-2 border-blue-600 bg-blue-600 flex items-center justify-center">
                <div class="w-1.5 h-1.5 bg-white rounded-full"></div>
              </div>
            </button>
            <button class="w-full flex items-center justify-between p-3 rounded-lg border bg-white border-gray-200 hover:bg-gray-50">
              <div>
                <span class="text-sm font-medium text-gray-700">Slow</span>
                <span class="text-xs text-gray-400 ml-2">With animations</span>
              </div>
              <div class="w-4 h-4 rounded-full border-2 border-gray-300"></div>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between p-3 rounded-lg border border-gray-200">
          <div>
            <span class="text-sm font-medium text-gray-700">Sound Effects</span>
            <span class="text-xs text-gray-400 ml-2">Card and chip sounds</span>
          </div>
          <div class="relative w-11 h-6 rounded-full bg-blue-600">
            <div class="absolute top-0.5 w-5 h-5 bg-white rounded-full shadow-sm" style="transform: translateX(22px)"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Data Management -->
    <section class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100">
        <h3 class="text-lg font-semibold text-gray-900">Data Management</h3>
        <p class="text-sm text-gray-500 mt-0.5">Manage your stored hand data</p>
      </div>
      <div class="p-6">
        <div class="p-4 rounded-lg border border-red-200 bg-red-50">
          <h4 class="text-sm font-semibold text-red-700">Clear All Data</h4>
          <p class="text-xs text-red-600/70 mt-1">This will permanently delete all hand history. This action cannot be undone.</p>
          <button class="mt-3 px-4 py-2 text-sm font-medium rounded-lg bg-white text-red-600 border border-red-300 hover:bg-red-50">Clear Data</button>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
