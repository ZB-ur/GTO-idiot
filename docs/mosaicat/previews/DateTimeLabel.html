<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DateTimeLabel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-4">
    <h2 class="text-lg font-semibold text-gray-900 mb-3">DateTimeLabel 示例</h2>

    <div class="bg-white rounded-xl border border-gray-200 p-4 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-600">刚刚：</span>
        <time class="text-sm text-gray-400 tabular-nums">刚刚</time>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-600">分钟前：</span>
        <time class="text-sm text-gray-400 tabular-nums">5 分钟前</time>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-600">小时前：</span>
        <time class="text-sm text-gray-400 tabular-nums">3 小时前</time>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-600">天前：</span>
        <time class="text-sm text-gray-400 tabular-nums">2 天前</time>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-600">日期格式：</span>
        <time class="text-sm text-gray-400 tabular-nums">03-15 14:32</time>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm text-gray-600">跨年格式：</span>
        <time class="text-sm text-gray-400 tabular-nums">2023-12-25 20:00</time>
      </div>
    </div>
  </div>
</body>
</html>
