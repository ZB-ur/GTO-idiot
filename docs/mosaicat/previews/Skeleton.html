<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skeleton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
  </style>
</head>
<body>
  <div class="space-y-6 max-w-md">
    <p class="text-sm font-semibold text-gray-500 mb-3">Skeleton Variants</p>

    <!-- Rect -->
    <div class="space-y-2">
      <span class="text-xs text-gray-400">rect</span>
      <div class="animate-pulse bg-gray-200 rounded-lg" style="width:100%;height:48px;"></div>
    </div>

    <!-- Circle -->
    <div class="space-y-2">
      <span class="text-xs text-gray-400">circle</span>
      <div class="flex gap-3">
        <div class="animate-pulse bg-gray-200 rounded-full" style="width:40px;height:40px;"></div>
        <div class="animate-pulse bg-gray-200 rounded-full" style="width:48px;height:48px;"></div>
        <div class="animate-pulse bg-gray-200 rounded-full" style="width:32px;height:32px;"></div>
      </div>
    </div>

    <!-- Text -->
    <div class="space-y-2">
      <span class="text-xs text-gray-400">text</span>
      <div class="space-y-2">
        <div class="animate-pulse bg-gray-200 rounded h-4" style="width:100%;"></div>
        <div class="animate-pulse bg-gray-200 rounded h-4" style="width:85%;"></div>
        <div class="animate-pulse bg-gray-200 rounded h-4" style="width:60%;"></div>
      </div>
    </div>

    <!-- Card-like composition -->
    <div class="space-y-2">
      <span class="text-xs text-gray-400">Card skeleton</span>
      <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
        <div class="flex items-center gap-3 mb-4">
          <div class="animate-pulse bg-gray-200 rounded-full" style="width:40px;height:40px;"></div>
          <div class="flex-1 space-y-2">
            <div class="animate-pulse bg-gray-200 rounded h-4" style="width:40%;"></div>
            <div class="animate-pulse bg-gray-200 rounded h-3" style="width:25%;"></div>
          </div>
        </div>
        <div class="space-y-2">
          <div class="animate-pulse bg-gray-200 rounded h-4" style="width:100%;"></div>
          <div class="animate-pulse bg-gray-200 rounded h-4" style="width:90%;"></div>
          <div class="animate-pulse bg-gray-200 rounded h-4" style="width:70%;"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
