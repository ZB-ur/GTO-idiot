<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionConfigModal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <!-- Backdrop -->
  <div style="position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(4px);"></div>

  <!-- Modal -->
  <div style="position:relative;z-index:10;width:100%;max-width:32rem;margin:0 1rem;" class="bg-gray-900 rounded-xl shadow-xl border border-gray-700 overflow-hidden">

    <!-- Header -->
    <div class="flex items-center justify-between px-6 pt-6 pb-3">
      <div>
        <h2 class="text-xl font-bold text-gray-50">New Session</h2>
        <p class="text-sm text-gray-400 mt-1">Configure opponents and blinds</p>
      </div>
      <button class="p-2 text-gray-500 hover:text-gray-300 hover:bg-gray-800 rounded-lg transition-colors">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-4 space-y-6">

      <!-- Section 1: Bot Count -->
      <div>
        <label class="block text-sm font-semibold text-gray-50 mb-3">Number of Opponents</label>
        <div class="flex gap-2">
          <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600">1</button>
          <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600">2</button>
          <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600">3</button>
          <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600">4</button>
          <!-- 5 selected -->
          <button class="flex-1 py-2.5 text-sm font-semibold rounded-lg border border-emerald-500 bg-emerald-500/10 text-emerald-400">5</button>
        </div>
      </div>

      <!-- Section 2: Per-Bot Difficulty -->
      <div>
        <label class="block text-sm font-semibold text-gray-50 mb-3">Bot Difficulty</label>
        <div class="space-y-2">

          <!-- BOT-1: Fish selected -->
          <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-800 border border-gray-700">
            <span class="text-sm font-medium text-gray-300 w-14 flex-shrink-0">BOT-1</span>
            <div class="flex gap-2 flex-1">
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-yellow-500 bg-yellow-500/10 text-yellow-400">
                <span class="mr-1">🐟</span>Fish
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🎯</span>Regular
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🧠</span>GTO
              </button>
            </div>
          </div>

          <!-- BOT-2: Regular selected -->
          <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-800 border border-gray-700">
            <span class="text-sm font-medium text-gray-300 w-14 flex-shrink-0">BOT-2</span>
            <div class="flex gap-2 flex-1">
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🐟</span>Fish
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-emerald-500 bg-emerald-500/10 text-emerald-400">
                <span class="mr-1">🎯</span>Regular
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🧠</span>GTO
              </button>
            </div>
          </div>

          <!-- BOT-3: Regular selected -->
          <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-800 border border-gray-700">
            <span class="text-sm font-medium text-gray-300 w-14 flex-shrink-0">BOT-3</span>
            <div class="flex gap-2 flex-1">
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🐟</span>Fish
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-emerald-500 bg-emerald-500/10 text-emerald-400">
                <span class="mr-1">🎯</span>Regular
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🧠</span>GTO
              </button>
            </div>
          </div>

          <!-- BOT-4: GTO selected -->
          <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-800 border border-gray-700">
            <span class="text-sm font-medium text-gray-300 w-14 flex-shrink-0">BOT-4</span>
            <div class="flex gap-2 flex-1">
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🐟</span>Fish
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🎯</span>Regular
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-red-500 bg-red-500/10 text-red-400">
                <span class="mr-1">🧠</span>GTO
              </button>
            </div>
          </div>

          <!-- BOT-5: Fish selected -->
          <div class="flex items-center gap-3 p-3 rounded-lg bg-gray-800 border border-gray-700">
            <span class="text-sm font-medium text-gray-300 w-14 flex-shrink-0">BOT-5</span>
            <div class="flex gap-2 flex-1">
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-yellow-500 bg-yellow-500/10 text-yellow-400">
                <span class="mr-1">🐟</span>Fish
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🎯</span>Regular
              </button>
              <button class="flex-1 py-1.5 px-2 text-xs font-medium rounded-lg border border-gray-700 bg-gray-900 text-gray-500">
                <span class="mr-1">🧠</span>GTO
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- Section 3: Blinds -->
      <div>
        <label class="block text-sm font-semibold text-gray-50 mb-3">Blinds</label>
        <div class="grid grid-cols-4 gap-2 mb-3">
          <!-- 1/2 selected -->
          <button class="py-2.5 text-sm font-medium rounded-lg border border-emerald-500 bg-emerald-500/10 text-emerald-400">
            1/2
          </button>
          <button class="py-2.5 text-sm font-medium rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600">
            2/5
          </button>
          <button class="py-2.5 text-sm font-medium rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600">
            5/10
          </button>
          <button class="py-2.5 text-sm font-medium rounded-lg border border-gray-700 bg-gray-800 text-gray-400 hover:border-gray-600">
            10/20
          </button>
        </div>
        <button class="w-full text-xs font-medium py-1.5 rounded text-gray-500 hover:text-gray-400 transition-colors">
          ▸ Custom Blinds
        </button>
      </div>

      <!-- Info banner -->
      <div class="flex items-start gap-2 p-3 bg-gray-800 rounded-lg border border-gray-700">
        <svg class="w-4 h-4 text-gray-500 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-xs text-gray-400 leading-relaxed">
          6-max No-Limit Hold'em. All players start with 100 BB.
          Positions are assigned automatically each hand.
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-700" style="background:rgba(17,24,39,0.8);">
      <button class="px-4 py-2.5 text-sm font-medium text-gray-400 hover:text-gray-200 hover:bg-gray-800 rounded-lg transition-colors">
        Cancel
      </button>
      <button class="px-6 py-2.5 text-sm font-semibold rounded-lg bg-emerald-500 text-gray-950 hover:bg-emerald-400 shadow-sm transition-all" style="box-shadow: 0 2px 8px rgba(16,185,129,0.2);">
        Start Session
      </button>
    </div>
  </div>

</body>
</html>
