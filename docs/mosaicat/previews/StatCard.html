<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="grid grid-cols-3 gap-4 max-w-lg p-4">
    <!-- Total Hands -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-1">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">Total Hands</p>
      <div class="flex items-baseline gap-2">
        <span class="text-2xl font-bold text-gray-50">12,847</span>
      </div>
      <p class="text-xs text-gray-500">Last 30 days</p>
    </div>
    <!-- bb/100, trend up -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-1">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">bb/100</p>
      <div class="flex items-baseline gap-2">
        <span class="text-2xl font-bold text-gray-50">8.3</span>
        <span class="text-sm font-semibold text-emerald-400">↑</span>
      </div>
      <p class="text-xs text-gray-500">+2.1 vs last month</p>
    </div>
    <!-- VPIP, trend down -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-1">
      <p class="text-xs font-medium text-gray-500 uppercase tracking-wider">VPIP</p>
      <div class="flex items-baseline gap-2">
        <span class="text-2xl font-bold text-gray-50">24%</span>
        <span class="text-sm font-semibold text-red-400">↓</span>
      </div>
    </div>
  </div>
</body>
</html>
