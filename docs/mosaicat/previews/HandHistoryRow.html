<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandHistoryRow Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-3xl mx-auto space-y-2">

    <!-- Row 1: Winning hand, key hand marked -->
    <div class="flex items-center gap-3 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl cursor-pointer transition-colors">
      <button class="flex-shrink-0 p-1 rounded-lg hover:bg-gray-700">
        <svg class="w-5 h-5 text-amber-400 fill-amber-400" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="currentColor">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      </button>
      <span class="flex-shrink-0 text-sm text-gray-500 w-14 font-mono">14:32</span>
      <span class="flex-shrink-0 w-10 text-center text-xs font-bold bg-gray-800 text-amber-400 border border-gray-700 rounded-lg py-0.5">BTN</span>
      <span class="flex-shrink-0 w-14 inline-flex gap-0.5 font-mono text-sm">
        <span class="text-gray-50">A♠</span><span class="text-red-500">K♥</span>
      </span>
      <span class="flex-1 text-sm text-gray-300 truncate">AKs → Top Pair, won at showdown</span>
      <span class="flex-shrink-0 text-xs text-gray-500">showdown</span>
      <span class="flex-shrink-0 w-16 text-right text-sm font-semibold font-mono text-emerald-500">+25.5 BB</span>
    </div>

    <!-- Row 2: Losing hand, not marked -->
    <div class="flex items-center gap-3 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl cursor-pointer transition-colors">
      <button class="flex-shrink-0 p-1 rounded-lg hover:bg-gray-700">
        <svg class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      </button>
      <span class="flex-shrink-0 text-sm text-gray-500 w-14 font-mono">14:28</span>
      <span class="flex-shrink-0 w-10 text-center text-xs font-bold bg-gray-800 text-amber-400 border border-gray-700 rounded-lg py-0.5">CO</span>
      <span class="flex-shrink-0 w-14 inline-flex gap-0.5 font-mono text-sm">
        <span class="text-red-500">Q♥</span><span class="text-red-500">J♥</span>
      </span>
      <span class="flex-1 text-sm text-gray-300 truncate">QJo → Missed draw, folded river</span>
      <span class="flex-shrink-0 text-xs text-gray-500">river</span>
      <span class="flex-shrink-0 w-16 text-right text-sm font-semibold font-mono text-red-500">-8.0 BB</span>
    </div>

    <!-- Row 3: Fold preflop, break even -->
    <div class="flex items-center gap-3 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl cursor-pointer transition-colors">
      <button class="flex-shrink-0 p-1 rounded-lg hover:bg-gray-700">
        <svg class="w-5 h-5 text-gray-500" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      </button>
      <span class="flex-shrink-0 text-sm text-gray-500 w-14 font-mono">14:25</span>
      <span class="flex-shrink-0 w-10 text-center text-xs font-bold bg-gray-800 text-amber-400 border border-gray-700 rounded-lg py-0.5">UTG</span>
      <span class="flex-shrink-0 w-14 inline-flex gap-0.5 font-mono text-sm">
        <span class="text-gray-50">7♠</span><span class="text-blue-400">2♦</span>
      </span>
      <span class="flex-1 text-sm text-gray-300 truncate">72o → Folded preflop</span>
      <span class="flex-shrink-0 text-xs text-gray-500">preflop</span>
      <span class="flex-shrink-0 w-16 text-right text-sm font-semibold font-mono text-gray-400">-1.0 BB</span>
    </div>

    <!-- Row 4: Big win, key hand (GTO deviation) -->
    <div class="flex items-center gap-3 px-4 py-3 bg-gray-900 hover:bg-gray-800 border border-gray-700 rounded-xl cursor-pointer transition-colors">
      <button class="flex-shrink-0 p-1 rounded-lg hover:bg-gray-700">
        <svg class="w-5 h-5 text-amber-400 fill-amber-400" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="currentColor">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      </button>
      <span class="flex-shrink-0 text-sm text-gray-500 w-14 font-mono">14:19</span>
      <span class="flex-shrink-0 w-10 text-center text-xs font-bold bg-gray-800 text-amber-400 border border-gray-700 rounded-lg py-0.5">BB</span>
      <span class="flex-shrink-0 w-14 inline-flex gap-0.5 font-mono text-sm">
        <span class="text-emerald-500">9♣</span><span class="text-emerald-500">9♣</span>
      </span>
      <span class="flex-1 text-sm text-gray-300 truncate">99 → Set on flop, all-in on turn</span>
      <span class="flex-shrink-0 text-xs text-gray-500">showdown</span>
      <span class="flex-shrink-0 w-16 text-right text-sm font-semibold font-mono text-emerald-500">+98.0 BB</span>
    </div>

  </div>
</body>
</html>
