<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">Badge Component</h2>

  <!-- Variants -->
  <p class="text-sm text-gray-600 mb-2">Variants</p>
  <div class="flex flex-wrap gap-2 mb-6">
    <span class="inline-flex items-center font-medium rounded-lg border bg-gray-100 text-gray-700 border-gray-200 text-xs px-1.5 py-0.5">Default</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-green-50 text-green-700 border-green-200 text-xs px-1.5 py-0.5">Conforming</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-yellow-50 text-yellow-700 border-yellow-200 text-xs px-1.5 py-0.5">Minor Deviation</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-red-50 text-red-700 border-red-200 text-xs px-1.5 py-0.5">Major Deviation</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">Info</span>
  </div>

  <!-- Sizes -->
  <p class="text-sm text-gray-600 mb-2">Sizes: sm / md</p>
  <div class="flex flex-wrap items-center gap-2 mb-6">
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">BTN (sm)</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-sm px-2 py-0.5">BTN (md)</span>
  </div>

  <!-- Use Cases -->
  <p class="text-sm text-gray-600 mb-2">Poker Use Cases</p>
  <div class="flex flex-wrap gap-2 mb-4">
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">UTG</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">HJ</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">CO</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">BTN</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">SB</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-blue-50 text-blue-700 border-blue-200 text-xs px-1.5 py-0.5">BB</span>
  </div>
  <div class="flex flex-wrap gap-2">
    <span class="inline-flex items-center font-medium rounded-lg border bg-green-50 text-green-700 border-green-200 text-xs px-1.5 py-0.5">Raise</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-yellow-50 text-yellow-700 border-yellow-200 text-xs px-1.5 py-0.5">Call</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-red-50 text-red-700 border-red-200 text-xs px-1.5 py-0.5">Fold</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-gray-100 text-gray-700 border-gray-200 text-xs px-1.5 py-0.5">Check</span>
    <span class="inline-flex items-center font-medium rounded-lg border bg-red-50 text-red-700 border-red-200 text-xs px-1.5 py-0.5">All-In</span>
  </div>
</body>
</html>
