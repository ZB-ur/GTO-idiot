<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokerTable Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #0f172a; font-family: system-ui, sans-serif; }
    input[type="range"] { accent-color: #ef4444; }
  </style>
</head>
<body>

<div class="relative w-full min-h-screen bg-slate-900 flex items-center justify-center overflow-hidden pb-32">

  <!-- Session controls -->
  <div class="absolute top-3 right-3 flex items-center gap-3 z-10">
    <span class="text-xs text-white/60 font-medium">Hand #17</span>
    <button class="text-xs px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white/80 hover:text-white transition-colors border border-white/10">
      End Session
    </button>
  </div>

  <!-- Street indicator -->
  <div class="absolute top-3 left-3 z-10">
    <span class="text-xs uppercase tracking-widest text-white/40 font-semibold">flop</span>
  </div>

  <!-- Table container -->
  <div class="relative" style="width: 680px; height: 400px;">

    <!-- Felt oval -->
    <div class="absolute inset-0 rounded-[50%] border-[6px] border-emerald-900 shadow-2xl"
         style="background: radial-gradient(ellipse at center, #065f46 0%, #064e3b 60%, #022c22 100%);"></div>

    <!-- Inner rail -->
    <div class="absolute inset-4 rounded-[50%] border-2 border-emerald-600/20"></div>

    <!-- Community cards + Pot (center) -->
    <div class="absolute inset-0 flex flex-col items-center justify-center gap-2">
      <!-- 3 community cards (flop) + 2 placeholders -->
      <div class="flex gap-1.5 items-center justify-center">
        <!-- Card: A♠ -->
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col items-center justify-center">
          <span class="text-sm font-bold leading-none text-gray-900">A</span>
          <span class="text-base leading-none text-gray-900">♠</span>
        </div>
        <!-- Card: K♥ -->
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col items-center justify-center">
          <span class="text-sm font-bold leading-none text-red-500">K</span>
          <span class="text-base leading-none text-red-500">♥</span>
        </div>
        <!-- Card: 7♦ -->
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col items-center justify-center">
          <span class="text-sm font-bold leading-none text-blue-500">7</span>
          <span class="text-base leading-none text-blue-500">♦</span>
        </div>
        <!-- Placeholder -->
        <div class="w-10 h-14 rounded-lg border-2 border-dashed border-emerald-500/30"></div>
        <!-- Placeholder -->
        <div class="w-10 h-14 rounded-lg border-2 border-dashed border-emerald-500/30"></div>
      </div>
      <!-- Pot -->
      <div class="flex items-center justify-center gap-1.5 bg-black/30 backdrop-blur-sm rounded-full px-4 py-1.5">
        <span class="text-yellow-400 text-xs font-semibold">POT</span>
        <span class="text-white text-sm font-bold">12.5 BB</span>
      </div>
    </div>

    <!-- ========= PLAYER SEATS ========= -->

    <!-- UTG (top-left) -->
    <div class="absolute flex flex-col items-center gap-1" style="top:10%; left:25%; transform:translate(-50%,-50%);">
      <div class="flex gap-0.5 mb-1">
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-md flex items-center justify-center"><div class="w-6 h-8 border border-blue-400/30 rounded-sm"></div></div>
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-md flex items-center justify-center"><div class="w-6 h-8 border border-blue-400/30 rounded-sm"></div></div>
      </div>
      <div class="bg-gray-900/90 backdrop-blur-sm rounded-xl px-3 py-1.5 text-center min-w-[80px] shadow-lg">
        <div class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">UTG</div>
        <div class="text-xs text-white font-semibold">Bot-1</div>
        <div class="text-[11px] text-emerald-400 font-bold">95 BB</div>
      </div>
      <div class="bg-yellow-500/90 rounded-full px-2 py-0.5 text-[10px] font-bold text-gray-900">3 BB</div>
    </div>

    <!-- HJ (top-right) - folded -->
    <div class="absolute flex flex-col items-center gap-1" style="top:10%; left:75%; transform:translate(-50%,-50%);">
      <div class="bg-gray-900/90 backdrop-blur-sm rounded-xl px-3 py-1.5 text-center min-w-[80px] shadow-lg opacity-40">
        <div class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">HJ</div>
        <div class="text-xs text-white font-semibold">Bot-2</div>
        <div class="text-[11px] text-emerald-400 font-bold">102 BB</div>
      </div>
    </div>

    <!-- CO (mid-right) -->
    <div class="absolute flex flex-col items-center gap-1" style="top:50%; left:95%; transform:translate(-50%,-50%);">
      <div class="flex gap-0.5 mb-1">
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-md flex items-center justify-center"><div class="w-6 h-8 border border-blue-400/30 rounded-sm"></div></div>
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-md flex items-center justify-center"><div class="w-6 h-8 border border-blue-400/30 rounded-sm"></div></div>
      </div>
      <div class="bg-gray-900/90 backdrop-blur-sm rounded-xl px-3 py-1.5 text-center min-w-[80px] shadow-lg">
        <div class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">CO</div>
        <div class="text-xs text-white font-semibold">Bot-3</div>
        <div class="text-[11px] text-emerald-400 font-bold">88 BB</div>
      </div>
    </div>

    <!-- BTN (bottom-right) - dealer -->
    <div class="absolute flex flex-col items-center gap-1" style="top:85%; left:75%; transform:translate(-50%,-50%);">
      <div class="flex gap-0.5 mb-1">
        <!-- Human hero cards face up: Q♥ J♥ -->
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col items-center justify-center">
          <span class="text-sm font-bold leading-none text-red-500">Q</span>
          <span class="text-base leading-none text-red-500">♥</span>
        </div>
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-300 shadow-md flex flex-col items-center justify-center">
          <span class="text-sm font-bold leading-none text-red-500">J</span>
          <span class="text-base leading-none text-red-500">♥</span>
        </div>
      </div>
      <div class="relative bg-gray-900/90 backdrop-blur-sm rounded-xl px-3 py-1.5 text-center min-w-[80px] shadow-lg ring-4 ring-yellow-400 ring-opacity-80">
        <div class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">BTN</div>
        <div class="text-xs text-white font-semibold">You</div>
        <div class="text-[11px] text-emerald-400 font-bold">100 BB</div>
        <!-- Dealer button -->
        <div class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-white text-[10px] font-black text-gray-900 flex items-center justify-center shadow border border-gray-300">D</div>
      </div>
    </div>

    <!-- SB (bottom-left) - folded -->
    <div class="absolute flex flex-col items-center gap-1" style="top:85%; left:25%; transform:translate(-50%,-50%);">
      <div class="bg-gray-900/90 backdrop-blur-sm rounded-xl px-3 py-1.5 text-center min-w-[80px] shadow-lg opacity-40">
        <div class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">SB</div>
        <div class="text-xs text-white font-semibold">Bot-4</div>
        <div class="text-[11px] text-emerald-400 font-bold">78 BB</div>
      </div>
    </div>

    <!-- BB (mid-left) -->
    <div class="absolute flex flex-col items-center gap-1" style="top:50%; left:5%; transform:translate(-50%,-50%);">
      <div class="flex gap-0.5 mb-1">
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-md flex items-center justify-center"><div class="w-6 h-8 border border-blue-400/30 rounded-sm"></div></div>
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-md flex items-center justify-center"><div class="w-6 h-8 border border-blue-400/30 rounded-sm"></div></div>
      </div>
      <div class="bg-gray-900/90 backdrop-blur-sm rounded-xl px-3 py-1.5 text-center min-w-[80px] shadow-lg">
        <div class="text-[10px] text-gray-400 font-medium uppercase tracking-wider">BB</div>
        <div class="text-xs text-white font-semibold">Bot-5</div>
        <div class="text-[11px] text-emerald-400 font-bold">110 BB</div>
      </div>
      <div class="bg-yellow-500/90 rounded-full px-2 py-0.5 text-[10px] font-bold text-gray-900">6 BB</div>
    </div>

  </div><!-- /table container -->

  <!-- ========= ACTION PANEL (bottom-anchored) ========= -->
  <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-sm border-t border-gray-200 shadow-lg z-50">
    <div class="max-w-4xl mx-auto px-4 py-3">

      <!-- Pot odds hint -->
      <div class="text-center mb-2">
        <span class="text-xs text-gray-500 bg-gray-100 rounded-full px-3 py-1">
          Pot Odds: 2.1 : 1 (32.3%)
        </span>
      </div>

      <!-- Raise slider -->
      <div class="mb-3 px-2">
        <div class="flex items-center gap-3">
          <div class="flex gap-1.5">
            <button class="text-xs font-medium px-2.5 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 transition-colors">1/3</button>
            <button class="text-xs font-medium px-2.5 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 transition-colors">1/2</button>
            <button class="text-xs font-medium px-2.5 py-1 rounded-lg bg-blue-100 text-blue-700 font-semibold">2/3</button>
            <button class="text-xs font-medium px-2.5 py-1 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 transition-colors">Pot</button>
          </div>
          <input type="range" min="12" max="100" value="18" class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" />
          <span class="text-sm font-bold text-gray-900 min-w-[4rem] text-right">18 BB</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="flex items-center gap-2 justify-center">
        <button class="flex-1 max-w-[140px] py-3 rounded-lg font-semibold text-sm uppercase tracking-wide bg-gray-500 hover:bg-gray-600 text-white">Fold</button>
        <button class="flex-1 max-w-[140px] py-3 rounded-lg font-semibold text-sm uppercase tracking-wide bg-green-500 hover:bg-green-600 text-white">Call 6</button>
        <button class="flex-1 max-w-[140px] py-3 rounded-lg font-semibold text-sm uppercase tracking-wide bg-red-500 hover:bg-red-600 text-white">Raise 18</button>
        <button class="flex-1 max-w-[140px] py-3 rounded-lg font-bold text-sm uppercase tracking-wide bg-red-700 hover:bg-red-800 text-white ring-2 ring-red-300">All In 100</button>
      </div>
    </div>
  </div>

</div>

</body>
</html>
