<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokerTable Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #0f172a; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="relative w-full max-w-3xl mx-auto" style="aspect-ratio: 16/10;">
    <!-- Table felt -->
    <div class="absolute inset-8 rounded-[50%] bg-gradient-to-b from-emerald-700 to-emerald-800 border-[6px] border-emerald-900 shadow-xl">
      <div class="absolute inset-3 rounded-[50%] border border-emerald-600/30"></div>

      <!-- Street label -->
      <div class="absolute top-[20%] left-1/2 -translate-x-1/2">
        <span class="text-emerald-300/60 text-xs font-medium uppercase tracking-wider">flop</span>
      </div>

      <!-- Pot -->
      <div class="absolute top-[30%] left-1/2 -translate-x-1/2">
        <div class="bg-black/30 backdrop-blur-sm rounded-full px-4 py-1.5">
          <span class="text-yellow-400 text-sm font-bold">$145</span>
        </div>
      </div>

      <!-- Community Cards -->
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex gap-1.5">
        <!-- Ah -->
        <div class="w-9 h-12 rounded-md bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center text-xs font-bold text-red-600">
          <span>A</span><span class="text-[10px] -mt-0.5">&hearts;</span>
        </div>
        <!-- Ks -->
        <div class="w-9 h-12 rounded-md bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center text-xs font-bold text-gray-900">
          <span>K</span><span class="text-[10px] -mt-0.5">&spades;</span>
        </div>
        <!-- 7d -->
        <div class="w-9 h-12 rounded-md bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center text-xs font-bold text-red-600">
          <span>7</span><span class="text-[10px] -mt-0.5">&diams;</span>
        </div>
        <!-- Empty slots -->
        <div class="w-9 h-12 rounded-md border border-emerald-600/20"></div>
        <div class="w-9 h-12 rounded-md border border-emerald-600/20"></div>
      </div>
    </div>

    <!-- Seat: BTN (bottom-right) — Active, Human player -->
    <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:75%; left:80%;">
      <div class="relative flex flex-col items-center gap-1 p-2 rounded-xl ring-2 ring-yellow-400 ring-offset-2 bg-slate-800">
        <div class="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-yellow-400 text-[9px] font-bold text-gray-900 flex items-center justify-center shadow">D</div>
        <div class="flex gap-0.5">
          <div class="w-9 h-12 rounded-md bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center text-xs font-bold text-red-600">
            <span>Q</span><span class="text-[10px] -mt-0.5">&hearts;</span>
          </div>
          <div class="w-9 h-12 rounded-md bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center text-xs font-bold text-red-600">
            <span>Q</span><span class="text-[10px] -mt-0.5">&diams;</span>
          </div>
        </div>
        <div class="text-center min-w-[70px]">
          <div class="text-xs font-semibold text-white">You</div>
          <div class="text-[10px] text-gray-400">BTN</div>
          <div class="text-xs font-mono text-yellow-300">$487</div>
        </div>
        <div class="absolute -bottom-5 bg-yellow-400/90 rounded-full px-2 py-0.5">
          <span class="text-[10px] font-bold text-gray-900">$30</span>
        </div>
      </div>
    </div>

    <!-- Seat: SB (top-right) -->
    <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:30%; left:85%;">
      <div class="relative flex flex-col items-center gap-1 p-2 rounded-xl bg-slate-800/90">
        <div class="flex gap-0.5">
          <div class="w-9 h-12 rounded-md bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center"><div class="w-5 h-7 rounded border border-blue-400/30 bg-blue-800"></div></div>
          <div class="w-9 h-12 rounded-md bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center"><div class="w-5 h-7 rounded border border-blue-400/30 bg-blue-800"></div></div>
        </div>
        <div class="text-center min-w-[70px]">
          <div class="text-xs font-semibold text-white">Bot_TAG</div>
          <div class="text-[10px] text-gray-400">SB</div>
          <div class="text-xs font-mono text-yellow-300">$495</div>
        </div>
        <div class="absolute -bottom-5 bg-yellow-400/90 rounded-full px-2 py-0.5">
          <span class="text-[10px] font-bold text-gray-900">$30</span>
        </div>
      </div>
    </div>

    <!-- Seat: BB (top) -->
    <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:5%; left:65%;">
      <div class="relative flex flex-col items-center gap-1 p-2 rounded-xl bg-slate-800/90">
        <div class="flex gap-0.5">
          <div class="w-9 h-12 rounded-md bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center"><div class="w-5 h-7 rounded border border-blue-400/30 bg-blue-800"></div></div>
          <div class="w-9 h-12 rounded-md bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center"><div class="w-5 h-7 rounded border border-blue-400/30 bg-blue-800"></div></div>
        </div>
        <div class="text-center min-w-[70px]">
          <div class="text-xs font-semibold text-white">Bot_LAG</div>
          <div class="text-[10px] text-gray-400">BB</div>
          <div class="text-xs font-mono text-yellow-300">$510</div>
        </div>
      </div>
    </div>

    <!-- Seat: UTG (top-left) — Folded -->
    <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:5%; left:25%;">
      <div class="relative flex flex-col items-center gap-1 p-2 rounded-xl bg-slate-800/90 opacity-40">
        <div class="text-center min-w-[70px]">
          <div class="text-xs font-semibold text-white">Bot_Nit</div>
          <div class="text-[10px] text-gray-400">UTG</div>
          <div class="text-xs font-mono text-yellow-300">$498</div>
        </div>
      </div>
    </div>

    <!-- Seat: HJ (left) -->
    <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:30%; left:5%;">
      <div class="relative flex flex-col items-center gap-1 p-2 rounded-xl bg-slate-800/90">
        <div class="flex gap-0.5">
          <div class="w-9 h-12 rounded-md bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center"><div class="w-5 h-7 rounded border border-blue-400/30 bg-blue-800"></div></div>
          <div class="w-9 h-12 rounded-md bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center"><div class="w-5 h-7 rounded border border-blue-400/30 bg-blue-800"></div></div>
        </div>
        <div class="text-center min-w-[70px]">
          <div class="text-xs font-semibold text-white">Bot_Fish</div>
          <div class="text-[10px] text-gray-400">HJ</div>
          <div class="text-xs font-mono text-yellow-300">$520</div>
        </div>
      </div>
    </div>

    <!-- Seat: CO (bottom-left) — Folded -->
    <div class="absolute -translate-x-1/2 -translate-y-1/2" style="top:75%; left:12%;">
      <div class="relative flex flex-col items-center gap-1 p-2 rounded-xl bg-slate-800/90 opacity-40">
        <div class="text-center min-w-[70px]">
          <div class="text-xs font-semibold text-white">Bot_Maniac</div>
          <div class="text-[10px] text-gray-400">CO</div>
          <div class="text-xs font-mono text-yellow-300">$440</div>
        </div>
      </div>
    </div>

    <!-- Session info -->
    <div class="absolute bottom-0 left-0 text-xs text-gray-400 space-x-3">
      <span>Hand #17</span>
      <span>Blinds 2/5</span>
      <span class="text-emerald-500">+85</span>
    </div>
  </div>
</body>
</html>
