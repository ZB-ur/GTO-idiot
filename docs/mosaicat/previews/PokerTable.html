<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokerTable Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    .winner-glow { animation: pulse-glow 1.5s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="relative w-full max-w-4xl mx-auto" style="aspect-ratio: 16 / 10; min-height: 560px;">

    <!-- Table felt — elliptical -->
    <div class="absolute rounded-[50%] bg-emerald-800 border-[6px] border-emerald-900 shadow-xl"
         style="top:8%; left:8%; right:8%; bottom:8%;">
      <!-- Inner ring -->
      <div class="absolute inset-3 rounded-[50%] border-2 border-emerald-600/30"></div>

      <!-- Center content: street label + community cards + pot -->
      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3">
        <!-- Street label -->
        <span class="text-[10px] uppercase tracking-widest text-emerald-400/60 font-medium">
          Hand #12 · flop
        </span>

        <!-- Community Cards -->
        <div class="flex flex-col items-center gap-2">
          <span class="text-xs font-medium tracking-wide uppercase text-emerald-300/70">Flop</span>
          <div class="flex items-center gap-2">
            <!-- Card 1: A♠ -->
            <div class="w-[60px] h-[84px] bg-white rounded-lg border border-gray-200 shadow-md flex flex-col items-center justify-center">
              <span class="text-lg font-bold text-gray-900">A</span>
              <span class="text-sm text-gray-900">♠</span>
            </div>
            <!-- Card 2: K♥ -->
            <div class="w-[60px] h-[84px] bg-white rounded-lg border border-gray-200 shadow-md flex flex-col items-center justify-center">
              <span class="text-lg font-bold text-red-600">K</span>
              <span class="text-sm text-red-600">♥</span>
            </div>
            <!-- Card 3: 7♦ -->
            <div class="w-[60px] h-[84px] bg-white rounded-lg border border-gray-200 shadow-md flex flex-col items-center justify-center">
              <span class="text-lg font-bold text-red-600">7</span>
              <span class="text-sm text-red-600">♦</span>
            </div>
            <!-- Card 4: empty slot -->
            <div class="w-[60px] h-[84px] rounded-lg border-2 border-dashed border-emerald-600/40 bg-emerald-900/30 flex items-center justify-center ml-3">
              <span class="text-emerald-600/30 text-lg">?</span>
            </div>
            <!-- Card 5: empty slot -->
            <div class="w-[60px] h-[84px] rounded-lg border-2 border-dashed border-emerald-600/40 bg-emerald-900/30 flex items-center justify-center">
              <span class="text-emerald-600/30 text-lg">?</span>
            </div>
          </div>
        </div>

        <!-- Pot Display -->
        <div class="flex flex-col items-center gap-1.5">
          <div class="flex items-center gap-2 bg-black/40 backdrop-blur-sm rounded-full px-5 py-2 border border-amber-500/30 shadow-lg">
            <svg class="w-4 h-4 text-amber-400 shrink-0" viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="12" r="10" />
              <text x="12" y="16" text-anchor="middle" font-size="12" font-weight="bold" fill="#000">$</text>
            </svg>
            <span class="text-amber-400 font-bold text-lg tracking-wide">1,500</span>
          </div>
        </div>

        <!-- Blinds -->
        <span class="text-[10px] text-emerald-400/50">Blinds 50/100</span>
      </div>
    </div>

    <!-- Seat 0: bottom-left — UTG (folded) -->
    <div class="absolute z-10" style="top:72%; left:15%; transform:translate(-50%,-50%);">
      <div class="relative flex flex-col items-center gap-1 opacity-50">
        <div class="relative w-20 h-20 rounded-xl flex flex-col items-center justify-center border-2 border-gray-200 bg-white shadow-sm">
          <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 rounded mb-0.5">UTG</span>
          <span class="text-xs font-semibold text-gray-900 truncate max-w-[72px]">BOT 1</span>
          <span class="text-[10px] text-gray-500">8.2k</span>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-400">已弃牌</span>
      </div>
    </div>

    <!-- Seat 1: top-left-side — MP (active, waiting) -->
    <div class="absolute z-10" style="top:28%; left:5%; transform:translate(-50%,-50%);">
      <div class="relative flex flex-col items-center gap-1">
        <div class="relative w-20 h-20 rounded-xl flex flex-col items-center justify-center border-2 border-gray-200 bg-white shadow-sm">
          <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 rounded mb-0.5">MP</span>
          <span class="text-xs font-semibold text-gray-900 truncate max-w-[72px]">BOT 2</span>
          <span class="text-[10px] text-gray-500">9.5k</span>
        </div>
        <div class="flex gap-0.5">
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
        </div>
        <div class="px-2 py-0.5 bg-gray-900/80 text-white text-[10px] font-medium rounded-full">跟注 200</div>
        <div class="mt-1">
          <span class="text-[10px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full">200</span>
        </div>
      </div>
    </div>

    <!-- Seat 2: top-left — CO (active, waiting) -->
    <div class="absolute z-10" style="top:5%; left:30%; transform:translate(-50%,-50%);">
      <div class="relative flex flex-col items-center gap-1">
        <div class="relative w-20 h-20 rounded-xl flex flex-col items-center justify-center border-2 border-gray-200 bg-white shadow-sm">
          <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 rounded mb-0.5">CO</span>
          <span class="text-xs font-semibold text-gray-900 truncate max-w-[72px]">BOT 3</span>
          <span class="text-[10px] text-gray-500">11k</span>
        </div>
        <div class="flex gap-0.5">
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
        </div>
        <div class="px-2 py-0.5 bg-gray-900/80 text-white text-[10px] font-medium rounded-full">过牌</div>
      </div>
    </div>

    <!-- Seat 3: top-right — BTN (user, active turn, with dealer button, hole cards visible) -->
    <div class="absolute z-10" style="top:5%; left:70%; transform:translate(-50%,-50%);">
      <div class="relative flex flex-col items-center gap-1">
        <!-- Dealer button -->
        <div class="absolute -top-2 -right-2 w-5 h-5 bg-amber-400 rounded-full flex items-center justify-center text-[10px] font-bold text-white shadow-sm z-10">D</div>
        <div class="relative w-20 h-20 rounded-xl flex flex-col items-center justify-center border-2 border-blue-500 bg-blue-50 shadow-md ring-2 ring-blue-300">
          <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 rounded mb-0.5">BTN</span>
          <span class="text-xs font-semibold text-blue-700 truncate max-w-[72px]">Hero</span>
          <span class="text-[10px] text-gray-500">10k</span>
        </div>
        <div class="flex gap-0.5">
          <div class="w-8 h-11 bg-white border border-gray-200 rounded-md flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-gray-900">A</span>
            <span class="text-[10px] text-gray-900">♠</span>
          </div>
          <div class="w-8 h-11 bg-white border border-gray-200 rounded-md flex flex-col items-center justify-center shadow-sm">
            <span class="text-xs font-bold text-red-600">K</span>
            <span class="text-[10px] text-red-600">♥</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Seat 4: top-right-side — SB (all-in) -->
    <div class="absolute z-10" style="top:28%; left:95%; transform:translate(-50%,-50%);">
      <div class="relative flex flex-col items-center gap-1">
        <div class="relative w-20 h-20 rounded-xl flex flex-col items-center justify-center border-2 border-amber-400 bg-amber-50 shadow-sm">
          <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 rounded mb-0.5">SB</span>
          <span class="text-xs font-semibold text-gray-900 truncate max-w-[72px]">BOT 4</span>
          <span class="text-[10px] text-gray-500">0</span>
        </div>
        <div class="flex gap-0.5">
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">ALL-IN</span>
        <div class="mt-1">
          <span class="text-[10px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full">5k</span>
        </div>
      </div>
    </div>

    <!-- Seat 5: bottom-right — BB (active, waiting) -->
    <div class="absolute z-10" style="top:72%; left:85%; transform:translate(-50%,-50%);">
      <div class="relative flex flex-col items-center gap-1">
        <div class="relative w-20 h-20 rounded-xl flex flex-col items-center justify-center border-2 border-gray-200 bg-white shadow-sm">
          <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-1.5 rounded mb-0.5">BB</span>
          <span class="text-xs font-semibold text-gray-900 truncate max-w-[72px]">BOT 5</span>
          <span class="text-[10px] text-gray-500">12.4k</span>
        </div>
        <div class="flex gap-0.5">
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
          <div class="w-8 h-11 bg-blue-600 border border-blue-700 rounded-md shadow-sm"></div>
        </div>
        <div class="px-2 py-0.5 bg-gray-900/80 text-white text-[10px] font-medium rounded-full">跟注 200</div>
        <div class="mt-1">
          <span class="text-[10px] font-semibold text-amber-700 bg-amber-50 border border-amber-200 px-1.5 py-0.5 rounded-full">200</span>
        </div>
      </div>
    </div>

    <!-- Action Panel — bottom bar (user's turn) -->
    <div class="absolute bottom-0 left-0 right-0 z-30">
      <div class="bg-white border-t border-gray-200 px-4 py-3">
        <div class="flex gap-2">
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
            弃牌
          </button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors">
            跟注 200
          </button>
          <button class="flex-1 px-4 py-3 text-sm font-semibold text-white bg-green-500 rounded-lg hover:bg-green-600 transition-colors">
            加注
          </button>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
