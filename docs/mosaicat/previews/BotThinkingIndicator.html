<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotThinkingIndicator Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }

    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.2); }
    }

    .dot-1 { animation: pulse-dot 1.4s ease-in-out infinite; }
    .dot-2 { animation: pulse-dot 1.4s ease-in-out 0.2s infinite; }
    .dot-3 { animation: pulse-dot 1.4s ease-in-out 0.4s infinite; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-4 items-start">
    <!-- Visible state -->
    <div class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-gray-800/70 border border-gray-700/50" role="status" aria-label="Bot is thinking">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 dot-1"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 dot-2"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 dot-3"></span>
    </div>

    <!-- With context label -->
    <div class="flex items-center gap-2">
      <div class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-gray-800/70 border border-gray-700/50">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 dot-1"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 dot-2"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 dot-3"></span>
      </div>
      <span class="text-xs text-gray-500">Bot thinking...</span>
    </div>
  </div>
</body>
</html>
