<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotThinkingIndicator Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.75); }
    }
    .dot { animation: pulse-dot 1.2s ease-in-out infinite; }
    .dot-2 { animation-delay: 0.2s; }
    .dot-3 { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div class="flex flex-col items-start gap-6 pt-8 pl-8">
    <!-- On dark surface -->
    <div>
      <p class="text-xs text-gray-500 mb-3 uppercase tracking-wide">Bot Thinking</p>
      <div class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-gray-800/80 border border-gray-700" style="backdrop-filter: blur(4px);">
        <span class="dot w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span class="dot dot-2 w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span class="dot dot-3 w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      </div>
    </div>

    <!-- On felt surface -->
    <div class="bg-emerald-900/60 rounded-xl p-6 border border-emerald-700/40">
      <p class="text-xs text-gray-500 mb-3 uppercase tracking-wide">On Felt Background</p>
      <div class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg bg-gray-800/80 border border-gray-700" style="backdrop-filter: blur(4px);">
        <span class="dot w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span class="dot dot-2 w-1.5 h-1.5 rounded-full bg-amber-400"></span>
        <span class="dot dot-3 w-1.5 h-1.5 rounded-full bg-amber-400"></span>
      </div>
    </div>
  </div>
</body>
</html>
