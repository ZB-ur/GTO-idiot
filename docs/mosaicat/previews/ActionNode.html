<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="max-w-sm mx-auto space-y-2">
  <p class="text-sm text-gray-500 mb-2">Action Nodes (Replay Timeline)</p>

  <!-- Player action with GTO match -->
  <div class="flex items-center gap-3 w-full px-3 py-2 rounded-lg bg-blue-50 border border-blue-200">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-gray-400 uppercase">BTN</span>
        <span class="text-sm font-semibold text-blue-700">You</span>
      </div>
      <div class="flex items-center gap-1.5 mt-0.5">
        <span class="text-sm font-bold text-amber-600">RAISE</span>
        <span class="text-sm text-gray-500">$150</span>
      </div>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">GTO</span>
  </div>

  <!-- Bot action -->
  <div class="flex items-center gap-3 w-full px-3 py-2 rounded-lg bg-white border border-gray-200">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-gray-400 uppercase">SB</span>
        <span class="text-sm font-semibold text-gray-900">Bot Alice</span>
      </div>
      <div class="flex items-center gap-1.5 mt-0.5">
        <span class="text-sm font-bold text-blue-600">CALL</span>
        <span class="text-sm text-gray-500">$150</span>
      </div>
    </div>
  </div>

  <!-- Player action with major deviation -->
  <div class="flex items-center gap-3 w-full px-3 py-2 rounded-lg bg-blue-50 border border-blue-200">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-gray-400 uppercase">BTN</span>
        <span class="text-sm font-semibold text-blue-700">You</span>
      </div>
      <div class="flex items-center gap-1.5 mt-0.5">
        <span class="text-sm font-bold text-blue-600">CALL</span>
        <span class="text-sm text-gray-500">$50</span>
      </div>
    </div>
    <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700">-EV</span>
  </div>

  <!-- Fold -->
  <div class="flex items-center gap-3 w-full px-3 py-2 rounded-lg bg-white border border-gray-200">
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1.5">
        <span class="text-xs font-medium text-gray-400 uppercase">BB</span>
        <span class="text-sm font-semibold text-gray-900">Bot Charlie</span>
      </div>
      <div class="flex items-center gap-1.5 mt-0.5">
        <span class="text-sm font-bold text-gray-400">FOLD</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
