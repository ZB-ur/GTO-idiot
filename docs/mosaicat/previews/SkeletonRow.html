<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonRow Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-2xl mx-auto space-y-4">
    <h2 class="text-lg font-semibold text-gray-900 mb-3">SkeletonRow 示例</h2>

    <div class="space-y-3">
      <!-- Row 1 -->
      <div class="animate-pulse bg-white rounded-xl border border-gray-200 px-4 flex items-center gap-4" style="height: 48px;">
        <div class="h-4 w-16 bg-gray-200 rounded"></div>
        <div class="h-4 w-24 bg-gray-200 rounded"></div>
        <div class="flex-1"></div>
        <div class="h-4 w-12 bg-gray-200 rounded"></div>
        <div class="h-5 w-16 bg-gray-200 rounded-lg"></div>
      </div>
      <!-- Row 2 -->
      <div class="animate-pulse bg-white rounded-xl border border-gray-200 px-4 flex items-center gap-4" style="height: 48px;">
        <div class="h-4 w-16 bg-gray-200 rounded"></div>
        <div class="h-4 w-24 bg-gray-200 rounded"></div>
        <div class="flex-1"></div>
        <div class="h-4 w-12 bg-gray-200 rounded"></div>
        <div class="h-5 w-16 bg-gray-200 rounded-lg"></div>
      </div>
      <!-- Row 3 -->
      <div class="animate-pulse bg-white rounded-xl border border-gray-200 px-4 flex items-center gap-4" style="height: 48px;">
        <div class="h-4 w-16 bg-gray-200 rounded"></div>
        <div class="h-4 w-24 bg-gray-200 rounded"></div>
        <div class="flex-1"></div>
        <div class="h-4 w-12 bg-gray-200 rounded"></div>
        <div class="h-5 w-16 bg-gray-200 rounded-lg"></div>
      </div>
    </div>

    <h3 class="text-base font-medium text-gray-700 mt-6 mb-2">高度 64px × 2 行</h3>
    <div class="space-y-3">
      <div class="animate-pulse bg-white rounded-xl border border-gray-200 px-4 flex items-center gap-4" style="height: 64px;">
        <div class="h-5 w-20 bg-gray-200 rounded"></div>
        <div class="h-5 w-32 bg-gray-200 rounded"></div>
        <div class="flex-1"></div>
        <div class="h-5 w-14 bg-gray-200 rounded"></div>
        <div class="h-6 w-20 bg-gray-200 rounded-lg"></div>
      </div>
      <div class="animate-pulse bg-white rounded-xl border border-gray-200 px-4 flex items-center gap-4" style="height: 64px;">
        <div class="h-5 w-20 bg-gray-200 rounded"></div>
        <div class="h-5 w-32 bg-gray-200 rounded"></div>
        <div class="flex-1"></div>
        <div class="h-5 w-14 bg-gray-200 rounded"></div>
        <div class="h-6 w-20 bg-gray-200 rounded-lg"></div>
      </div>
    </div>
  </div>
</body>
</html>
