<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionSetupPanel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex items-center justify-center min-h-screen">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-md">
      <h2 class="text-xl font-bold text-gray-100 mb-1">开始新游戏</h2>
      <p class="text-sm text-gray-400 mb-6">选择盲注级别，买入固定为 100BB</p>

      <!-- Blind Level Selector -->
      <div class="mb-6">
        <label class="text-sm font-medium text-gray-300 mb-3 block">盲注级别</label>
        <div class="grid grid-cols-2 gap-3">
          <button class="py-3 px-4 rounded-lg border border-emerald-500 bg-emerald-500/10 text-emerald-400 ring-1 ring-emerald-500/50 text-center">
            <span class="text-lg font-bold">1/2</span>
          </button>
          <button class="py-3 px-4 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 text-center">
            <span class="text-lg font-bold">2/5</span>
          </button>
          <button class="py-3 px-4 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 text-center">
            <span class="text-lg font-bold">5/10</span>
          </button>
          <button class="py-3 px-4 rounded-lg border border-gray-700 bg-gray-800 text-gray-300 text-center">
            <span class="text-lg font-bold">10/20</span>
          </button>
        </div>
      </div>

      <!-- Buy-in Display -->
      <div class="bg-gray-800 border border-gray-700 rounded-lg p-4 mb-6 flex items-center justify-between">
        <span class="text-sm text-gray-400">买入筹码</span>
        <div class="flex items-center gap-2">
          <span class="text-2xl font-bold text-amber-400">200</span>
          <span class="text-sm text-gray-500">chips</span>
        </div>
      </div>

      <!-- Confirm Button -->
      <button class="w-full py-3.5 rounded-lg font-semibold text-base bg-emerald-500 text-gray-950">
        确认开始
      </button>
    </div>
  </div>
</body>
</html>
