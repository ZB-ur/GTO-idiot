<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecondaryButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col items-start gap-4">
    <!-- Default -->
    <button
      type="button"
      class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-blue-600 bg-white border border-blue-600 rounded-lg transition-colors duration-150 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      离开牌桌
    </button>

    <!-- Another variant -->
    <button
      type="button"
      class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-blue-600 bg-white border border-blue-600 rounded-lg transition-colors duration-150 hover:bg-blue-50 hover:text-blue-700 hover:border-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      查看历史
    </button>

    <!-- Disabled -->
    <button
      type="button"
      disabled
      class="inline-flex items-center justify-center px-5 py-2.5 text-sm font-medium text-blue-600 bg-white border border-blue-600 rounded-lg opacity-50 cursor-not-allowed"
    >
      不可用状态
    </button>
  </div>
</body>
</html>
