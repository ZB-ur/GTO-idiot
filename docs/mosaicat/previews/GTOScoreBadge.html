<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTOScoreBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-sm mx-auto flex flex-col items-start gap-3">
    <!-- High score - green -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700">
      <span>92</span>
      <span class="opacity-70">·</span>
      <span>Optimal</span>
    </span>

    <!-- Medium-high score - green -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700">
      <span>85</span>
      <span class="opacity-70">·</span>
      <span>Optimal</span>
    </span>

    <!-- Medium score - amber -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-50 text-amber-700">
      <span>63</span>
      <span class="opacity-70">·</span>
      <span>Decent</span>
    </span>

    <!-- Low-medium score - amber -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-amber-50 text-amber-700">
      <span>51</span>
      <span class="opacity-70">·</span>
      <span>Decent</span>
    </span>

    <!-- Low score - red -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-red-50 text-red-700">
      <span>35</span>
      <span class="opacity-70">·</span>
      <span>Deviation</span>
    </span>

    <!-- Very low score - red -->
    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-semibold bg-red-50 text-red-700">
      <span>12</span>
      <span class="opacity-70">·</span>
      <span>Deviation</span>
    </span>
  </div>
</body>
</html>
