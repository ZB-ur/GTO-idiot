<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ActionSequenceItem Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-2 max-w-md">

    <!-- Normal action -->
    <div class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm bg-gray-900 border-l-2 border-transparent">
      <div class="flex items-center gap-2">
        <span class="text-gray-400 text-xs font-mono w-8">UTG</span>
        <span class="text-gray-50 font-medium">Player1</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-amber-500">加注</span>
        <span class="text-gray-400 text-xs font-mono">3 BB</span>
      </div>
    </div>

    <!-- User action (highlighted border) -->
    <div class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm bg-gray-900 border-l-2 border-amber-500">
      <div class="flex items-center gap-2">
        <span class="text-gray-400 text-xs font-mono w-8">CO</span>
        <span class="text-gray-50 font-medium">Hero</span>
        <span class="text-[10px] bg-amber-500/20 text-amber-500 px-1.5 py-0.5 rounded-full font-medium">你</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-sky-400">跟注</span>
        <span class="text-gray-400 text-xs font-mono">3 BB</span>
      </div>
    </div>

    <!-- Selected action -->
    <div class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm bg-gray-800 ring-1 ring-amber-500/60 border-l-2 border-transparent">
      <div class="flex items-center gap-2">
        <span class="text-gray-400 text-xs font-mono w-8">BTN</span>
        <span class="text-gray-50 font-medium">Player3</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-gray-500">弃牌</span>
      </div>
    </div>

    <!-- Check action -->
    <div class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm bg-gray-900 border-l-2 border-transparent">
      <div class="flex items-center gap-2">
        <span class="text-gray-400 text-xs font-mono w-8">SB</span>
        <span class="text-gray-50 font-medium">Player4</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-emerald-500">过牌</span>
      </div>
    </div>

    <!-- All-in action -->
    <div class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm bg-gray-900 border-l-2 border-transparent">
      <div class="flex items-center gap-2">
        <span class="text-gray-400 text-xs font-mono w-8">BB</span>
        <span class="text-gray-50 font-medium">Player5</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="font-semibold text-red-500">All-In</span>
        <span class="text-gray-400 text-xs font-mono">100 BB</span>
      </div>
    </div>

  </div>
</body>
</html>
