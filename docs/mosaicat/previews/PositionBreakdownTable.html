<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PositionBreakdownTable Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-2xl mx-auto">
    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900">位置统计</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="bg-slate-50">
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">位置</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">手牌数</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">偏离率</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-400 uppercase tracking-wider">盈亏</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100">
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-3"><span class="inline-flex items-center justify-center w-10 h-6 text-xs font-bold text-blue-600 bg-blue-50 rounded">UTG</span></td>
              <td class="px-6 py-3 text-right text-sm text-gray-900">8</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-amber-600">38%</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-red-600">-1,200</td>
            </tr>
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-3"><span class="inline-flex items-center justify-center w-10 h-6 text-xs font-bold text-blue-600 bg-blue-50 rounded">MP</span></td>
              <td class="px-6 py-3 text-right text-sm text-gray-900">7</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-green-600">14%</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-green-600">+450</td>
            </tr>
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-3"><span class="inline-flex items-center justify-center w-10 h-6 text-xs font-bold text-blue-600 bg-blue-50 rounded">CO</span></td>
              <td class="px-6 py-3 text-right text-sm text-gray-900">9</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-green-600">11%</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-green-600">+2,300</td>
            </tr>
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-3"><span class="inline-flex items-center justify-center w-10 h-6 text-xs font-bold text-blue-600 bg-blue-50 rounded">BTN</span></td>
              <td class="px-6 py-3 text-right text-sm text-gray-900">10</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-green-600">20%</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-green-600">+1,800</td>
            </tr>
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-3"><span class="inline-flex items-center justify-center w-10 h-6 text-xs font-bold text-blue-600 bg-blue-50 rounded">SB</span></td>
              <td class="px-6 py-3 text-right text-sm text-gray-900">6</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-amber-600">33%</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-red-600">-800</td>
            </tr>
            <tr class="hover:bg-slate-50">
              <td class="px-6 py-3"><span class="inline-flex items-center justify-center w-10 h-6 text-xs font-bold text-blue-600 bg-blue-50 rounded">BB</span></td>
              <td class="px-6 py-3 text-right text-sm text-gray-900">7</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-red-600">43%</td>
              <td class="px-6 py-3 text-right text-sm font-medium text-red-600">-1,300</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
