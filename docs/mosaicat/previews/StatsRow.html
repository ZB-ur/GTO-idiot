<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex gap-3">
    <!-- Hands -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex flex-col items-center gap-1 flex-1 min-w-0">
      <span class="text-gray-400 text-sm font-medium">Hands</span>
      <span class="text-2xl font-bold text-gray-50">47</span>
    </div>
    <!-- P/L -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex flex-col items-center gap-1 flex-1 min-w-0">
      <span class="text-gray-400 text-sm font-medium">P/L</span>
      <span class="text-2xl font-bold text-emerald-400">+34</span>
    </div>
    <!-- BB/100 -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex flex-col items-center gap-1 flex-1 min-w-0">
      <span class="text-gray-400 text-sm font-medium">BB/100</span>
      <span class="text-2xl font-bold text-emerald-400">+12.5</span>
    </div>
    <!-- VPIP% -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex flex-col items-center gap-1 flex-1 min-w-0">
      <span class="text-gray-400 text-sm font-medium">VPIP%</span>
      <span class="text-2xl font-bold text-amber-400">24.3%</span>
    </div>
    <!-- PFR% -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex flex-col items-center gap-1 flex-1 min-w-0">
      <span class="text-gray-400 text-sm font-medium">PFR%</span>
      <span class="text-2xl font-bold text-amber-400">18.7%</span>
    </div>
  </div>
</body>
</html>
