<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="flex flex-wrap gap-6 justify-center items-start">
  <!-- Active Player (Human, current actor, dealer) -->
  <div class="relative flex flex-col items-center gap-1">
    <div class="absolute -top-2 -right-2 z-10">
      <div class="w-5 h-5 rounded-full bg-white border-2 border-gray-300 flex items-center justify-center text-[8px] font-bold text-gray-700 shadow">D</div>
    </div>
    <div class="flex flex-col items-center bg-white border-2 border-blue-400 ring-2 ring-blue-400/30 rounded-xl px-3 py-2 shadow-sm min-w-[90px]">
      <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center text-xs font-bold mb-1">Y</div>
      <span class="text-xs font-semibold text-gray-900">You</span>
      <span class="text-[10px] text-gray-400 uppercase font-medium">BTN</span>
      <div class="flex items-center gap-1 mt-1">
        <div class="w-3 h-3 rounded-full bg-yellow-400 border border-yellow-500"></div>
        <span class="text-xs font-bold text-gray-700">$1,200</span>
      </div>
    </div>
    <div class="flex gap-1">
      <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center">
        <span class="text-xs font-bold text-gray-900">A</span>
        <span class="text-xs text-gray-900">♠</span>
      </div>
      <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center -ml-2 rotate-3">
        <span class="text-xs font-bold text-red-600">K</span>
        <span class="text-xs text-red-600">♥</span>
      </div>
    </div>
    <div class="absolute -bottom-5 flex items-center gap-1 bg-black/20 rounded-full px-2 py-0.5">
      <div class="w-3 h-3 rounded-full bg-yellow-400 border border-yellow-500"></div>
      <span class="text-[10px] font-bold text-white">$50</span>
    </div>
  </div>

  <!-- Bot (face down, thinking) -->
  <div class="relative flex flex-col items-center gap-1">
    <div class="flex flex-col items-center bg-white border-2 border-gray-200 rounded-xl px-3 py-2 shadow-sm min-w-[90px]">
      <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-xs font-bold mb-1">A</div>
      <span class="text-xs font-semibold text-gray-900">Alice</span>
      <span class="text-[10px] text-gray-400 uppercase font-medium">SB</span>
      <div class="flex items-center gap-1 mt-1">
        <div class="w-3 h-3 rounded-full bg-yellow-400 border border-yellow-500"></div>
        <span class="text-xs font-bold text-gray-700">$980</span>
      </div>
      <div class="flex gap-0.5 mt-1">
        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
        <div class="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
      </div>
    </div>
    <div class="flex gap-1">
      <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 border border-blue-900 shadow-sm"></div>
      <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 border border-blue-900 shadow-sm -ml-2 rotate-3"></div>
    </div>
  </div>

  <!-- Folded Bot -->
  <div class="relative flex flex-col items-center gap-1">
    <div class="flex flex-col items-center bg-white border-2 border-gray-300 opacity-50 rounded-xl px-3 py-2 shadow-sm min-w-[90px]">
      <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-xs font-bold mb-1">B</div>
      <span class="text-xs font-semibold text-gray-900">Bob</span>
      <span class="text-[10px] text-gray-400 uppercase font-medium">BB</span>
      <div class="flex items-center gap-1 mt-1">
        <div class="w-3 h-3 rounded-full bg-yellow-400 border border-yellow-500"></div>
        <span class="text-xs font-bold text-gray-700">$750</span>
      </div>
    </div>
    <div class="flex gap-1 opacity-40 grayscale">
      <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 border border-blue-900 shadow-sm"></div>
      <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 border border-blue-900 shadow-sm -ml-2 rotate-3"></div>
    </div>
  </div>

  <!-- All-In Bot -->
  <div class="relative flex flex-col items-center gap-1">
    <div class="flex flex-col items-center bg-white border-2 border-gray-200 rounded-xl px-3 py-2 shadow-sm min-w-[90px]">
      <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-xs font-bold mb-1">C</div>
      <span class="text-xs font-semibold text-gray-900">Charlie</span>
      <span class="text-[10px] text-gray-400 uppercase font-medium">CO</span>
      <div class="flex items-center gap-1 mt-1">
        <div class="w-3 h-3 rounded-full bg-yellow-400 border border-yellow-500"></div>
        <span class="text-xs font-bold text-red-500">ALL-IN</span>
      </div>
    </div>
    <div class="flex gap-1">
      <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 border border-blue-900 shadow-sm"></div>
      <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-600 to-blue-800 border border-blue-900 shadow-sm -ml-2 rotate-3"></div>
    </div>
  </div>
</div>
</body>
</html>
