<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThinkingIndicator Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes thinking-dot {
      0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
      30% { opacity: 1; transform: scale(1.3); }
    }
    .animate-thinking-dot {
      animation: thinking-dot 1.2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="space-y-6">
    <p class="text-sm font-semibold text-gray-600">Thinking Indicator — On Table Felt</p>

    <div class="bg-emerald-800 rounded-xl p-8 flex gap-8 items-start">
      <!-- BOT seat with thinking indicator -->
      <div class="text-center space-y-2">
        <div class="bg-gray-900/90 text-white rounded-xl px-4 py-3 w-36">
          <p class="text-sm font-semibold">BOT 3</p>
          <p class="text-xs text-gray-400">UTG · 500</p>
          <div class="flex gap-1.5 justify-center mt-2">
            <div class="w-10 h-14 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
              <div class="w-6 h-9 rounded border border-blue-600 bg-blue-700 opacity-80"></div>
            </div>
            <div class="w-10 h-14 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
              <div class="w-6 h-9 rounded border border-blue-600 bg-blue-700 opacity-80"></div>
            </div>
          </div>
        </div>
        <!-- Thinking dots -->
        <div class="flex items-center justify-center">
          <div class="flex items-center gap-1 px-2.5 py-1.5 bg-gray-900/70 rounded-lg">
            <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-thinking-dot" style="animation-delay: 0s;"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-thinking-dot" style="animation-delay: 0.2s;"></span>
            <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-thinking-dot" style="animation-delay: 0.4s;"></span>
          </div>
        </div>
      </div>
    </div>

    <p class="text-sm font-semibold text-gray-600 mt-4">Standalone — Light Background</p>
    <div class="flex items-center gap-1 px-2.5 py-1.5 bg-gray-900/70 rounded-lg w-fit">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-thinking-dot" style="animation-delay: 0s;"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-thinking-dot" style="animation-delay: 0.2s;"></span>
      <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-thinking-dot" style="animation-delay: 0.4s;"></span>
    </div>

    <p class="text-sm font-semibold text-gray-600 mt-4">Hidden (visible=false)</p>
    <div class="text-sm text-gray-400 italic">Nothing rendered</div>
  </div>
</body>
</html>
