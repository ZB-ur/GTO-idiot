<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DealerButton Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-6">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wide">DealerButton</p>

    <div class="flex items-center gap-6">
      <!-- Default on dark bg -->
      <div class="flex flex-col items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-gradient-to-b from-amber-300 to-amber-500 border-2 border-amber-300/70 shadow-lg shadow-black/40 flex items-center justify-center select-none">
          <span class="text-xs font-extrabold text-gray-900 leading-none">D</span>
        </div>
        <span class="text-gray-500 text-xs">Default</span>
      </div>

      <!-- On felt -->
      <div class="flex flex-col items-center gap-2">
        <div class="w-20 h-20 rounded-xl bg-emerald-900 border border-emerald-700 flex items-center justify-center">
          <div class="w-8 h-8 rounded-full bg-gradient-to-b from-amber-300 to-amber-500 border-2 border-amber-300/70 shadow-lg shadow-black/40 flex items-center justify-center select-none">
            <span class="text-xs font-extrabold text-gray-900 leading-none">D</span>
          </div>
        </div>
        <span class="text-gray-500 text-xs">On Felt</span>
      </div>

      <!-- On surface -->
      <div class="flex flex-col items-center gap-2">
        <div class="w-20 h-20 rounded-xl bg-gray-900 border border-gray-700 flex items-center justify-center">
          <div class="w-8 h-8 rounded-full bg-gradient-to-b from-amber-300 to-amber-500 border-2 border-amber-300/70 shadow-lg shadow-black/40 flex items-center justify-center select-none">
            <span class="text-xs font-extrabold text-gray-900 leading-none">D</span>
          </div>
        </div>
        <span class="text-gray-500 text-xs">On Surface</span>
      </div>
    </div>
  </div>
</body>
</html>
