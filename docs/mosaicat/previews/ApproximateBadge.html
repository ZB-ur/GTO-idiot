<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApproximateBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Approximate Badge</p>

    <!-- Standalone -->
    <div class="flex items-center gap-4">
      <span class="inline-flex items-center gap-1 text-xs font-medium rounded-full border bg-sky-400/10 text-sky-400 border-sky-400/25 px-2.5 py-0.5">
        <svg class="w-3 h-3" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 4.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="8" cy="11.5" r="0.75" fill="currentColor"/>
        </svg>
        <span>近似参考</span>
      </span>
    </div>

    <!-- In context: postflop strategy card -->
    <div>
      <p class="text-gray-500 text-xs mb-3">In context (postflop strategy)</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 space-y-3 max-w-sm">
        <div class="flex items-center justify-between">
          <span class="text-gray-50 text-sm font-semibold">Flop Strategy</span>
          <span class="inline-flex items-center gap-1 text-xs font-medium rounded-full border bg-sky-400/10 text-sky-400 border-sky-400/25 px-2.5 py-0.5">
            <svg class="w-3 h-3" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 4.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="8" cy="11.5" r="0.75" fill="currentColor"/>
            </svg>
            <span>近似参考</span>
          </span>
        </div>
        <div class="space-y-1.5">
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">Bet 33%</span>
            <span class="text-amber-400 font-medium">45%</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">Check</span>
            <span class="text-amber-400 font-medium">55%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Combined with RatingBadge -->
    <div>
      <p class="text-gray-500 text-xs mb-3">Combined with rating</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex items-center gap-3">
        <span class="inline-flex items-center font-medium rounded-full border bg-emerald-500/15 text-emerald-400 border-emerald-500/30 text-sm px-3 py-1 gap-1.5">
          <span>✅</span><span>最优</span>
        </span>
        <span class="inline-flex items-center gap-1 text-xs font-medium rounded-full border bg-sky-400/10 text-sky-400 border-sky-400/25 px-2.5 py-0.5">
          <svg class="w-3 h-3" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/>
            <path d="M8 4.5v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="11.5" r="0.75" fill="currentColor"/>
          </svg>
          <span>近似参考</span>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
