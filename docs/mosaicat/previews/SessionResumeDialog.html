<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SessionResumeDialog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm px-4">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-6 w-full max-w-sm shadow-xl">
      <!-- Icon -->
      <div class="w-12 h-12 rounded-full bg-amber-500/20 flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      </div>

      <h3 class="text-lg font-bold text-gray-100 text-center mb-2">检测到未完成的游戏</h3>
      <p class="text-sm text-gray-400 text-center mb-5">是否继续上次的 Session？</p>

      <!-- Session Info -->
      <div class="bg-gray-800 border border-gray-700/50 rounded-lg p-4 mb-6 space-y-2">
        <div class="flex justify-between text-sm">
          <span class="text-gray-500">盲注</span>
          <span class="text-gray-200">1/2</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-500">已玩手数</span>
          <span class="text-gray-200">47</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-500">净盈亏</span>
          <span class="font-semibold text-emerald-400">+23 BB</span>
        </div>
        <div class="flex justify-between text-sm">
          <span class="text-gray-500">时长</span>
          <span class="text-gray-200">32m</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="space-y-3">
        <button class="w-full py-3 rounded-lg font-semibold bg-emerald-500 text-gray-950">
          继续游戏
        </button>
        <button class="w-full py-3 rounded-lg font-semibold border border-gray-600 text-gray-300">
          开始新游戏
        </button>
      </div>
    </div>
  </div>
</body>
</html>
