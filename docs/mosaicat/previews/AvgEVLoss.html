<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AvgEVLoss Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; gap: 16px; flex-wrap: wrap;">
    <!-- Low loss (good) with estimated badge -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 flex flex-col gap-2" style="min-width: 200px;">
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-400">平均 EV 损失</span>
        <span class="text-xs bg-gray-800 text-gray-500 px-2 py-0.5 rounded-full">估算</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-3xl font-bold text-emerald-500">0.35</span>
        <span class="text-sm text-gray-500">BB / 手</span>
      </div>
      <span class="text-xs text-emerald-500">优秀</span>
    </div>

    <!-- Medium loss -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 flex flex-col gap-2" style="min-width: 200px;">
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-400">平均 EV 损失</span>
        <span class="text-xs bg-gray-800 text-gray-500 px-2 py-0.5 rounded-full">估算</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-3xl font-bold text-yellow-500">1.20</span>
        <span class="text-sm text-gray-500">BB / 手</span>
      </div>
      <span class="text-xs text-yellow-500">一般</span>
    </div>

    <!-- High loss -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 flex flex-col gap-2" style="min-width: 200px;">
      <div class="flex items-center gap-2">
        <span class="text-sm text-gray-400">平均 EV 损失</span>
      </div>
      <div class="flex items-baseline gap-1">
        <span class="text-3xl font-bold text-red-500">2.80</span>
        <span class="text-sm text-gray-500">BB / 手</span>
      </div>
      <span class="text-xs text-red-500">需改进</span>
    </div>
  </div>
</body>
</html>
