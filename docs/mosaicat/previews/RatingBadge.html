<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RatingBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">Rating Badge — All Variants</p>

    <!-- Size: md -->
    <div>
      <p class="text-gray-500 text-xs mb-3">size: md</p>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center font-medium rounded-full border bg-emerald-500/15 text-emerald-400 border-emerald-500/30 text-sm px-3 py-1 gap-1.5">
          <span>✅</span><span>最优</span>
        </span>
        <span class="inline-flex items-center font-medium rounded-full border bg-yellow-500/15 text-yellow-400 border-yellow-500/30 text-sm px-3 py-1 gap-1.5">
          <span>⚠️</span><span>可接受</span>
        </span>
        <span class="inline-flex items-center font-medium rounded-full border bg-red-500/15 text-red-400 border-red-500/30 text-sm px-3 py-1 gap-1.5">
          <span>❌</span><span>错误</span>
        </span>
      </div>
    </div>

    <!-- Size: sm -->
    <div>
      <p class="text-gray-500 text-xs mb-3">size: sm</p>
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center font-medium rounded-full border bg-emerald-500/15 text-emerald-400 border-emerald-500/30 text-xs px-2 py-0.5 gap-1">
          <span>✅</span><span>最优</span>
        </span>
        <span class="inline-flex items-center font-medium rounded-full border bg-yellow-500/15 text-yellow-400 border-yellow-500/30 text-xs px-2 py-0.5 gap-1">
          <span>⚠️</span><span>可接受</span>
        </span>
        <span class="inline-flex items-center font-medium rounded-full border bg-red-500/15 text-red-400 border-red-500/30 text-xs px-2 py-0.5 gap-1">
          <span>❌</span><span>错误</span>
        </span>
      </div>
    </div>

    <!-- In context -->
    <div>
      <p class="text-gray-500 text-xs mb-3">In context (dark surface)</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl p-4 flex items-center gap-4">
        <span class="text-gray-50 text-sm">Preflop: 3-bet with AKs</span>
        <span class="inline-flex items-center font-medium rounded-full border bg-emerald-500/15 text-emerald-400 border-emerald-500/30 text-sm px-3 py-1 gap-1.5">
          <span>✅</span><span>最优</span>
        </span>
      </div>
    </div>
  </div>
</body>
</html>
