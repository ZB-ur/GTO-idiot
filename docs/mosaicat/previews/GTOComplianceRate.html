<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTOComplianceRate Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 16px; max-width: 400px;">
    <!-- High rate (green) -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 flex items-center gap-5">
      <div class="relative flex-shrink-0" style="width: 96px; height: 96px;">
        <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; transform: rotate(-90deg);">
          <circle cx="50" cy="50" r="40" fill="none" stroke="#1f2937" stroke-width="8" />
          <circle cx="50" cy="50" r="40" fill="none" stroke="#10b981" stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="251.3"
            stroke-dashoffset="87.96" />
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span class="text-xl font-bold text-emerald-500">65%</span>
        </div>
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-base font-semibold text-gray-50">GTO 符合率</span>
        <span class="text-sm text-gray-400">✅ 最优决策占比</span>
        <span class="text-xs text-gray-500">共 320 个决策点</span>
      </div>
    </div>

    <!-- Low rate (red) -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 flex items-center gap-5">
      <div class="relative flex-shrink-0" style="width: 96px; height: 96px;">
        <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; transform: rotate(-90deg);">
          <circle cx="50" cy="50" r="40" fill="none" stroke="#1f2937" stroke-width="8" />
          <circle cx="50" cy="50" r="40" fill="none" stroke="#ef4444" stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="251.3"
            stroke-dashoffset="175.91" />
        </svg>
        <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
          <span class="text-xl font-bold text-red-500">30%</span>
        </div>
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-base font-semibold text-gray-50">GTO 符合率</span>
        <span class="text-sm text-gray-400">✅ 最优决策占比</span>
        <span class="text-xs text-gray-500">共 80 个决策点</span>
      </div>
    </div>
  </div>
</body>
</html>
