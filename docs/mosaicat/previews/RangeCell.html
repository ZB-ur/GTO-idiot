<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RangeCell Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-lg mx-auto space-y-6">
    <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider">RangeCell — Variants</p>

    <!-- Individual variants -->
    <div>
      <p class="text-xs text-gray-400 mb-3">Action types</p>
      <div class="flex items-center gap-3">
        <!-- Raise -->
        <div class="w-10 h-10 rounded-sm bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium">AKs</div>
        <!-- Call -->
        <div class="w-10 h-10 rounded-sm bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium">KQo</div>
        <!-- Fold -->
        <div class="w-10 h-10 rounded-sm bg-blue-500/20 flex items-center justify-center text-gray-500 text-[10px] font-medium">72o</div>
        <!-- 3bet -->
        <div class="w-10 h-10 rounded-sm bg-amber-500/90 flex items-center justify-center text-white text-[10px] font-medium">QQ</div>
        <!-- All-in -->
        <div class="w-10 h-10 rounded-sm bg-purple-600/90 flex items-center justify-center text-white text-[10px] font-medium">AA</div>
        <!-- Highlighted -->
        <div class="w-10 h-10 rounded-sm bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium ring-2 ring-amber-400 ring-offset-1">T9s</div>
      </div>
    </div>

    <!-- Mixed action cell -->
    <div>
      <p class="text-xs text-gray-400 mb-3">Mixed action (raise 60% / call 40%)</p>
      <div class="flex gap-3">
        <div class="relative w-10 h-10 rounded-sm bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium overflow-hidden">
          ATs
          <div class="absolute bottom-0 left-0 right-0 h-1 flex">
            <div class="bg-red-500" style="width:60%"></div>
            <div class="bg-emerald-500" style="width:40%"></div>
          </div>
        </div>
        <div class="relative w-10 h-10 rounded-sm bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium overflow-hidden">
          87s
          <div class="absolute bottom-0 left-0 right-0 h-1 flex">
            <div class="bg-emerald-500" style="width:55%"></div>
            <div class="bg-blue-500" style="width:45%"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mini grid (5x5 sample) -->
    <div>
      <p class="text-xs text-gray-400 mb-3">Sample 5×5 grid region</p>
      <div class="inline-grid grid-cols-5 gap-px bg-gray-300 rounded-lg overflow-hidden">
        <!-- Row 1: AA, AKs, AQs, AJs, ATs -->
        <div class="w-10 h-10 bg-purple-600/90 flex items-center justify-center text-white text-[10px] font-medium">AA</div>
        <div class="w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium">AKs</div>
        <div class="w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium">AQs</div>
        <div class="w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium">AJs</div>
        <div class="relative w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium overflow-hidden">ATs<div class="absolute bottom-0 left-0 right-0 h-1 flex"><div class="bg-red-500" style="width:70%"></div><div class="bg-emerald-500" style="width:30%"></div></div></div>
        <!-- Row 2: AKo, KK, KQs, KJs, KTs -->
        <div class="w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium">AKo</div>
        <div class="w-10 h-10 bg-purple-600/90 flex items-center justify-center text-white text-[10px] font-medium">KK</div>
        <div class="w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium">KQs</div>
        <div class="w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium">KJs</div>
        <div class="relative w-10 h-10 bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium overflow-hidden">KTs<div class="absolute bottom-0 left-0 right-0 h-1 flex"><div class="bg-emerald-500" style="width:60%"></div><div class="bg-red-500" style="width:40%"></div></div></div>
        <!-- Row 3: AQo, KQo, QQ, QJs, QTs -->
        <div class="relative w-10 h-10 bg-red-500/90 flex items-center justify-center text-white text-[10px] font-medium overflow-hidden">AQo<div class="absolute bottom-0 left-0 right-0 h-1 flex"><div class="bg-red-500" style="width:80%"></div><div class="bg-emerald-500" style="width:20%"></div></div></div>
        <div class="w-10 h-10 bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium">KQo</div>
        <div class="w-10 h-10 bg-amber-500/90 flex items-center justify-center text-white text-[10px] font-medium">QQ</div>
        <div class="w-10 h-10 bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium">QJs</div>
        <div class="w-10 h-10 bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium">QTs</div>
        <!-- Row 4: AJo, KJo, QJo, JJ, JTs -->
        <div class="w-10 h-10 bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium">AJo</div>
        <div class="w-10 h-10 bg-blue-500/20 flex items-center justify-center text-gray-500 text-[10px] font-medium">KJo</div>
        <div class="w-10 h-10 bg-blue-500/20 flex items-center justify-center text-gray-500 text-[10px] font-medium">QJo</div>
        <div class="w-10 h-10 bg-amber-500/90 flex items-center justify-center text-white text-[10px] font-medium">JJ</div>
        <div class="w-10 h-10 bg-emerald-500/90 flex items-center justify-center text-white text-[10px] font-medium">JTs</div>
        <!-- Row 5: ATo, KTo, QTo, JTo, TT -->
        <div class="w-10 h-10 bg-blue-500/20 flex items-center justify-center text-gray-500 text-[10px] font-medium">ATo</div>
        <div class="w-10 h-10 bg-blue-500/20 flex items-center justify-center text-gray-500 text-[10px] font-medium">KTo</div>
        <div class="w-10 h-10 bg-blue-500/20 flex items-center justify-center text-gray-500 text-[10px] font-medium">QTo</div>
        <div class="w-10 h-10 bg-blue-500/20 flex items-center justify-center text-gray-500 text-[10px] font-medium">JTo</div>
        <div class="w-10 h-10 bg-amber-500/90 flex items-center justify-center text-white text-[10px] font-medium">TT</div>
      </div>
    </div>

    <!-- Legend -->
    <div class="flex flex-wrap gap-3 text-[10px] text-gray-600">
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-sm bg-purple-600/90"></div>All-in</div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-sm bg-amber-500/90"></div>3-Bet</div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-sm bg-red-500/90"></div>Raise</div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-sm bg-emerald-500/90"></div>Call</div>
      <div class="flex items-center gap-1"><div class="w-3 h-3 rounded-sm bg-blue-500/20 border border-gray-300"></div>Fold</div>
    </div>
  </div>
</body>
</html>
