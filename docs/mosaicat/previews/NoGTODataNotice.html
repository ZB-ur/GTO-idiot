<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>NoGTODataNotice Preview</title>

  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="max-width: 520px;">
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 flex items-center justify-between gap-4">
      <div class="flex items-start gap-3">
        <!-- Info icon circle -->
        <div class="flex-shrink-0 mt-0.5" style="width: 32px; height: 32px; border-radius: 9999px; background: rgba(56, 189, 248, 0.1); display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 20 20" fill="#38bdf8" style="width: 16px; height: 16px;">

        <div class="flex flex-col" style="gap: 2px;">
          <span class="text-sm font-medium text-gray-50">完成复盘后才能显示 GTO 统计</span>
          <span class="text-xs text-gray-500">复盘你的手牌来解锁 GTO 符合率和 EV 分析</span>
        </div>
      </div>

      <button class="font-medium text-sm px-4 py-2 rounded-lg whitespace-nowrap flex-shrink-0" style="background-color: #1f2937; color: #f59e0b;">
        去复盘
      </button>
    </div>
  </div>
