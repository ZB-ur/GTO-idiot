<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ErrorModal Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm">
    <div class="bg-gray-900 border border-gray-700 rounded-2xl shadow-lg shadow-black/40 p-8 max-w-md w-full mx-4 text-center">
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-red-500/15">
        <span class="text-2xl text-red-400">!</span>
      </div>
      <h2 class="text-xl font-bold text-gray-50 mb-2">Analysis Failed</h2>
      <p class="text-sm text-gray-400 mb-8 leading-relaxed">The GTO solver encountered an unexpected error while processing your hand. Please try again or contact support if this persists.</p>
      <button class="w-full rounded-lg bg-red-500 hover:bg-red-400 text-white font-semibold py-3 px-6 text-sm transition-colors">
        Try Again
      </button>
    </div>
  </div>
</body>
</html>
