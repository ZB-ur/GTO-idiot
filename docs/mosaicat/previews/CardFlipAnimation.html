<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardFlipAnimation Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #064e3b; font-family: system-ui, sans-serif; }

    .flip-container {
      perspective: 600px;
      display: inline-block;
    }
    .flip-inner {
      position: relative;
      transform-style: preserve-3d;
      animation: flipCard 1.2s ease-in-out infinite alternate;
    }
    .flip-inner-delay1 {
      position: relative;
      transform-style: preserve-3d;
      animation: flipCard 1.2s ease-in-out 0.2s infinite alternate;
    }
    .flip-inner-delay2 {
      position: relative;
      transform-style: preserve-3d;
      animation: flipCard 1.2s ease-in-out 0.4s infinite alternate;
    }
    .flip-front, .flip-back {
      backface-visibility: hidden;
    }
    .flip-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
    }
    @keyframes flipCard {
      0% { transform: rotateY(180deg); }
      40% { transform: rotateY(180deg); }
      100% { transform: rotateY(0deg); }
    }
  </style>
</head>
<body>
  <div class="space-y-10 p-6">
    <p class="text-gray-300 text-sm font-semibold uppercase tracking-wider">CardFlipAnimation — Flop reveal</p>

    <!-- Flop: 3 cards flipping with stagger -->
    <div>
      <p class="text-gray-400 text-xs mb-4">Flop reveal (3 cards with staggered delay)</p>
      <div class="flex items-center gap-2">
        <!-- Card 1 — A♥ -->
        <div class="flip-container">
          <div class="flip-inner">
            <div class="flip-front">
              <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
                <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♥</span></div>
                <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">A</span><span class="text-base">♥</span></div>
              </div>
            </div>
            <div class="flip-back">
              <div class="w-16 h-22 rounded-lg bg-gradient-to-br from-sky-800 to-sky-950 border border-sky-600 flex items-center justify-center shadow-md">
                <div class="w-[70%] h-[75%] rounded border border-sky-500/40 bg-sky-900/60 flex items-center justify-center">
                  <span class="text-sky-400/50 text-lg font-bold">✦</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 2 — K♠ -->
        <div class="flip-container">
          <div class="flip-inner-delay1">
            <div class="flip-front">
              <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative" style="color:#1f2937">
                <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♠</span></div>
                <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">K</span><span class="text-base">♠</span></div>
              </div>
            </div>
            <div class="flip-back">
              <div class="w-16 h-22 rounded-lg bg-gradient-to-br from-sky-800 to-sky-950 border border-sky-600 flex items-center justify-center shadow-md">
                <div class="w-[70%] h-[75%] rounded border border-sky-500/40 bg-sky-900/60 flex items-center justify-center">
                  <span class="text-sky-400/50 text-lg font-bold">✦</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Card 3 — 7♦ -->
        <div class="flip-container">
          <div class="flip-inner-delay2">
            <div class="flip-front">
              <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
                <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♦</span></div>
                <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">7</span><span class="text-base">♦</span></div>
              </div>
            </div>
            <div class="flip-back">
              <div class="w-16 h-22 rounded-lg bg-gradient-to-br from-sky-800 to-sky-950 border border-sky-600 flex items-center justify-center shadow-md">
                <div class="w-[70%] h-[75%] rounded border border-sky-500/40 bg-sky-900/60 flex items-center justify-center">
                  <span class="text-sky-400/50 text-lg font-bold">✦</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Static states reference -->
    <div>
      <p class="text-gray-400 text-xs mb-4">Static states: face-down vs face-up</p>
      <div class="flex items-center gap-6">
        <div class="text-center">
          <p class="text-gray-500 text-xs mb-2">Before flip</p>
          <div class="w-16 h-22 rounded-lg bg-gradient-to-br from-sky-800 to-sky-950 border border-sky-600 flex items-center justify-center shadow-md">
            <div class="w-[70%] h-[75%] rounded border border-sky-500/40 bg-sky-900/60 flex items-center justify-center">
              <span class="text-sky-400/50 text-lg font-bold">✦</span>
            </div>
          </div>
        </div>
        <div class="text-gray-500 text-lg">→</div>
        <div class="text-center">
          <p class="text-gray-500 text-xs mb-2">After flip</p>
          <div class="w-16 h-22 rounded-lg bg-white border border-gray-300 flex flex-col justify-between p-1 shadow-md relative text-red-500">
            <div class="flex flex-col items-center leading-none"><span class="text-sm font-bold">Q</span><span class="text-base">♥</span></div>
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none"><span class="text-2xl">♥</span></div>
            <div class="flex flex-col items-center leading-none rotate-180"><span class="text-sm font-bold">Q</span><span class="text-base">♥</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
