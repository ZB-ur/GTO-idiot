<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="p-6 bg-gray-800 rounded-xl border border-gray-700 max-w-md">
    <p class="text-gray-100 text-base leading-relaxed">
      When you are dealt a hand, you can choose to
      <span class="border-b border-dashed border-gray-500 text-gray-100 cursor-help hover:border-emerald-400 hover:text-emerald-400 transition-colors">Fold</span>,
      <span class="border-b border-dashed border-emerald-400 text-emerald-400 cursor-help transition-colors">Check</span>,
      or
      <span class="border-b border-dashed border-gray-500 text-gray-100 cursor-help hover:border-emerald-400 hover:text-emerald-400 transition-colors">Raise</span>
      depending on your position.
    </p>
    <p class="text-gray-400 text-sm mt-3">↑ Hover over the dotted terms to see definitions</p>
  </div>
</body>
</html>
