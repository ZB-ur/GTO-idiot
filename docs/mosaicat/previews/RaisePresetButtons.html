<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RaisePresetButtons Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="max-w-md mx-auto space-y-8">
    <!-- State: 1/2 Pot active -->
    <div class="bg-slate-800 border border-gray-700 rounded-xl p-4">
      <p class="text-[10px] text-gray-500 mb-2 uppercase tracking-wider">1/2 Pot selected</p>
      <div class="flex gap-2">
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">1/3 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">4.2 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-sm shadow-emerald-500/20">
          <span class="block">1/2 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">6.3 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">2/3 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">8.3 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">12.5 BB</span>
        </button>
      </div>
    </div>

    <!-- State: none active -->
    <div class="bg-slate-800 border border-gray-700 rounded-xl p-4">
      <p class="text-[10px] text-gray-500 mb-2 uppercase tracking-wider">No selection</p>
      <div class="flex gap-2">
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">1/3 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">4.2 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">1/2 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">6.3 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">2/3 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">8.3 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">12.5 BB</span>
        </button>
      </div>
    </div>

    <!-- State: Pot active -->
    <div class="bg-slate-800 border border-gray-700 rounded-xl p-4">
      <p class="text-[10px] text-gray-500 mb-2 uppercase tracking-wider">Pot selected</p>
      <div class="flex gap-2">
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">1/3 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">4.2 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">1/2 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">6.3 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-slate-800 border-gray-700 text-gray-300">
          <span class="block">2/3 Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">8.3 BB</span>
        </button>
        <button class="flex-1 px-3 py-2 text-xs font-semibold rounded-lg border bg-emerald-500/20 border-emerald-500 text-emerald-400 shadow-sm shadow-emerald-500/20">
          <span class="block">Pot</span>
          <span class="block text-[10px] font-normal opacity-70 mt-0.5">12.5 BB</span>
        </button>
      </div>
    </div>
  </div>
</body>
</html>
