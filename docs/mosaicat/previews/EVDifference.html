<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVDifference Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-3 max-w-sm">

    <!-- Positive EV (good decision) -->
    <div class="flex items-center justify-center gap-2 px-4 py-2 bg-gray-900 rounded-lg border border-emerald-500/30">
      <span class="text-sm text-gray-400">EV差异:</span>
      <span class="text-sm font-bold font-mono text-emerald-500">+1.25 BB</span>
    </div>

    <!-- Negative EV (bad decision), estimated -->
    <div class="flex items-center justify-center gap-2 px-4 py-2 bg-gray-900 rounded-lg border border-red-500/30">
      <span class="text-sm text-gray-400">估算EV差异:</span>
      <span class="text-sm font-bold font-mono text-red-500">-3.50 BB</span>
      <span class="text-[10px] bg-yellow-500/20 text-yellow-500 px-1.5 py-0.5 rounded-full font-medium">估算</span>
    </div>

    <!-- Zero EV (same as GTO) -->
    <div class="flex items-center justify-center gap-2 px-4 py-2 bg-gray-900 rounded-lg border border-gray-800">
      <span class="text-sm text-gray-400">EV差异:</span>
      <span class="text-sm font-bold font-mono text-gray-400">0.00 BB</span>
    </div>

    <!-- Null value (insufficient data) -->
    <div class="flex items-center justify-center gap-2 px-4 py-2 bg-gray-900 rounded-lg border border-gray-800">
      <span class="text-sm text-gray-500">EV差异: 数据不足</span>
    </div>

  </div>
</body>
</html>
