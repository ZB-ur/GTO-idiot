<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-12 items-center justify-center min-h-[300px]">
    <!-- Top tooltip (visible) -->
    <div class="relative inline-flex">
      <span class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium cursor-pointer">Hover me (top)</span>
      <div class="absolute z-50 px-3 py-1.5 text-sm text-white bg-gray-900 rounded-lg whitespace-nowrap pointer-events-none bottom-full left-1/2 -translate-x-1/2 mb-2">
        TAG: Tight-Aggressive player
        <div class="absolute w-0 h-0 border-4 border-transparent top-full left-1/2 -translate-x-1/2 border-t-gray-900"></div>
      </div>
    </div>

    <!-- Bottom tooltip (visible) -->
    <div class="relative inline-flex">
      <span class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium cursor-pointer">Hover me (bottom)</span>
      <div class="absolute z-50 px-3 py-1.5 text-sm text-white bg-gray-900 rounded-lg whitespace-nowrap pointer-events-none top-full left-1/2 -translate-x-1/2 mt-2">
        Shortcut: Press F to fold
        <div class="absolute w-0 h-0 border-4 border-transparent bottom-full left-1/2 -translate-x-1/2 border-b-gray-900"></div>
      </div>
    </div>

    <!-- Right tooltip (visible) -->
    <div class="relative inline-flex">
      <span class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium cursor-pointer">Hover me (right)</span>
      <div class="absolute z-50 px-3 py-1.5 text-sm text-white bg-gray-900 rounded-lg whitespace-nowrap pointer-events-none left-full top-1/2 -translate-y-1/2 ml-2">
        GTO deviation: minor
        <div class="absolute w-0 h-0 border-4 border-transparent right-full top-1/2 -translate-y-1/2 border-r-gray-900"></div>
      </div>
    </div>
  </div>
</body>
</html>
