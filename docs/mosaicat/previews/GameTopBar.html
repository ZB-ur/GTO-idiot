<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GameTopBar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-6">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wide">GameTopBar — States</p>

    <!-- Profit state -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Profitable session</p>
      <div class="flex items-center justify-between w-full px-4 py-2.5 bg-gray-900/90 border-b border-gray-800 rounded-t-xl">
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-500">Hand</span>
          <span class="text-sm font-bold text-gray-50 tabular-nums">#47</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-500">Session</span>
          <span class="text-sm font-bold tabular-nums text-emerald-400">+34 BB</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="p-2 rounded-lg text-gray-400 hover:bg-gray-800">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400 border border-red-500/30">End Session</button>
        </div>
      </div>
    </div>

    <!-- Loss state -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Losing session</p>
      <div class="flex items-center justify-between w-full px-4 py-2.5 bg-gray-900/90 border-b border-gray-800 rounded-t-xl">
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-500">Hand</span>
          <span class="text-sm font-bold text-gray-50 tabular-nums">#23</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-500">Session</span>
          <span class="text-sm font-bold tabular-nums text-red-400">-18 BB</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="p-2 rounded-lg text-gray-400 hover:bg-gray-800">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400 border border-red-500/30">End Session</button>
        </div>
      </div>
    </div>

    <!-- Breakeven state -->
    <div>
      <p class="text-gray-500 text-xs mb-2">Breakeven (hand #1)</p>
      <div class="flex items-center justify-between w-full px-4 py-2.5 bg-gray-900/90 border-b border-gray-800 rounded-t-xl">
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-500">Hand</span>
          <span class="text-sm font-bold text-gray-50 tabular-nums">#1</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-sm text-gray-500">Session</span>
          <span class="text-sm font-bold tabular-nums text-gray-400">+0 BB</span>
        </div>
        <div class="flex items-center gap-2">
          <button class="p-2 rounded-lg text-gray-400 hover:bg-gray-800">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3" />
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
            </svg>
          </button>
          <button class="px-3 py-1.5 rounded-lg text-sm font-semibold bg-red-500/20 text-red-400 border border-red-500/30">End Session</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
