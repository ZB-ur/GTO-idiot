<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 24px;">
    <!-- Face-up cards -->
    <div>
      <p class="text-gray-400 text-sm mb-2">Face Up</p>
      <div class="flex gap-1">
        <div class="w-12 h-[68px] rounded-lg bg-gray-50 border border-gray-200 shadow-lg flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm font-bold leading-none text-gray-900">A</span>
          <span class="text-lg leading-none text-gray-900">♠</span>
        </div>
        <div class="w-12 h-[68px] rounded-lg bg-gray-50 border border-gray-200 shadow-lg flex flex-col items-center justify-center gap-0.5">
          <span class="text-sm font-bold leading-none text-red-500">K</span>
          <span class="text-lg leading-none text-red-500">♥</span>
        </div>
      </div>
    </div>
    <!-- Face-down cards -->
    <div>
      <p class="text-gray-400 text-sm mb-2">Face Down</p>
      <div class="flex gap-1">
        <div class="w-12 h-[68px] rounded-lg bg-gradient-to-br from-amber-500 to-amber-700 border border-amber-400/50 shadow-lg flex items-center justify-center">
          <div class="w-8 h-12 rounded border border-amber-300/30 bg-amber-600/50"></div>
        </div>
        <div class="w-12 h-[68px] rounded-lg bg-gradient-to-br from-amber-500 to-amber-700 border border-amber-400/50 shadow-lg flex items-center justify-center">
          <div class="w-8 h-12 rounded border border-amber-300/30 bg-amber-600/50"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
