<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HoleCards Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6">
    <!-- Label -->
    <p class="text-sm font-semibold text-gray-600">Face Up — md</p>
    <div class="flex gap-1.5">
      <!-- A♥ -->
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-lg font-bold leading-none text-red-600">A</span>
        <span class="text-sm leading-none text-red-600">♥</span>
      </div>
      <!-- K♠ -->
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-lg font-bold leading-none text-gray-900">K</span>
        <span class="text-sm leading-none text-gray-900">♠</span>
      </div>
    </div>

    <!-- Face Up — lg -->
    <p class="text-sm font-semibold text-gray-600 mt-4">Face Up — lg</p>
    <div class="flex gap-2">
      <div class="w-20 h-28 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-2xl font-bold leading-none text-red-600">Q</span>
        <span class="text-lg leading-none text-red-600">♦</span>
      </div>
      <div class="w-20 h-28 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-2xl font-bold leading-none text-gray-900">J</span>
        <span class="text-lg leading-none text-gray-900">♣</span>
      </div>
    </div>

    <!-- Face Up — sm -->
    <p class="text-sm font-semibold text-gray-600 mt-4">Face Up — sm</p>
    <div class="flex gap-1">
      <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-sm font-bold leading-none text-red-600">T</span>
        <span class="text-xs leading-none text-red-600">♥</span>
      </div>
      <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-sm font-bold leading-none text-gray-900">9</span>
        <span class="text-xs leading-none text-gray-900">♠</span>
      </div>
    </div>

    <!-- Face Down -->
    <p class="text-sm font-semibold text-gray-600 mt-4">Face Down — md</p>
    <div class="flex gap-1.5">
      <div class="w-14 h-20 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
        <div class="w-3/4 h-3/4 rounded border border-blue-600 bg-blue-700 opacity-80"></div>
      </div>
      <div class="w-14 h-20 rounded-lg bg-blue-800 border border-blue-900 shadow-sm flex items-center justify-center">
        <div class="w-3/4 h-3/4 rounded border border-blue-600 bg-blue-700 opacity-80"></div>
      </div>
    </div>

    <!-- Greyed -->
    <p class="text-sm font-semibold text-gray-600 mt-4">Greyed (folded) — md</p>
    <div class="flex gap-1.5 opacity-40">
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-lg font-bold leading-none text-red-600">7</span>
        <span class="text-sm leading-none text-red-600">♥</span>
      </div>
      <div class="w-14 h-20 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center select-none">
        <span class="text-lg font-bold leading-none text-gray-900">2</span>
        <span class="text-sm leading-none text-gray-900">♠</span>
      </div>
    </div>
  </div>
</body>
</html>
