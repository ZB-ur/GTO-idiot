<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HistoryFilter Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <!-- Closed state -->
  <div class="mb-8">
    <p class="text-xs text-gray-500 mb-2">Closed (no filters)</p>
    <div class="relative inline-block">
      <button class="flex items-center gap-2 px-4 py-2 rounded-xl border bg-gray-900 border-gray-700 text-gray-400 text-sm font-medium">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
        筛选
      </button>
    </div>
  </div>

  <!-- Closed state with active filters -->
  <div class="mb-8">
    <p class="text-xs text-gray-500 mb-2">Closed (2 active filters)</p>
    <div class="relative inline-block">
      <button class="flex items-center gap-2 px-4 py-2 rounded-xl border bg-amber-500/10 border-amber-500/50 text-amber-400 text-sm font-medium">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
        筛选
        <span class="flex items-center justify-center w-5 h-5 rounded-full bg-amber-500 text-gray-950 text-xs font-bold">2</span>
      </button>
    </div>
  </div>

  <!-- Open state -->
  <div>
    <p class="text-xs text-gray-500 mb-2">Open (BTN selected, key hands on)</p>
    <div class="relative inline-block">
      <button class="flex items-center gap-2 px-4 py-2 rounded-xl border bg-amber-500/10 border-amber-500/50 text-amber-400 text-sm font-medium">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
        </svg>
        筛选
        <span class="flex items-center justify-center w-5 h-5 rounded-full bg-amber-500 text-gray-950 text-xs font-bold">2</span>
      </button>
      <div class="absolute left-0 top-full mt-2 w-64 bg-gray-800 border border-gray-700 rounded-xl shadow-lg z-50 overflow-hidden">
        <div class="p-4 border-b border-gray-700">
          <label class="flex items-center justify-between">
            <span class="text-sm text-gray-50">仅关键手牌</span>
            <div class="relative w-10 h-6 rounded-full bg-amber-500">
              <span class="absolute top-1 left-5 w-4 h-4 rounded-full bg-white"></span>
            </div>
          </label>
        </div>
        <div class="p-4">
          <p class="text-xs text-gray-500 uppercase tracking-wider mb-3">按位置筛选</p>
          <div class="grid grid-cols-3 gap-2">
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-400">全部</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-400">UTG</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-400">HJ</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-400">CO</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-500 text-gray-950">BTN</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-400">SB</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-gray-700 text-gray-400">BB</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
