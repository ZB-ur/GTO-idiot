<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandResultBanner Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="space-y-8">
    <p class="text-gray-400 text-sm font-semibold tracking-wide uppercase">HandResultBanner — Win / Loss / Zero</p>

    <div class="flex flex-col items-center gap-6">
      <!-- Positive result on felt -->
      <div class="bg-emerald-900/60 rounded-2xl px-20 py-10 border border-emerald-800/40 flex items-center justify-center">
        <div class="inline-flex items-center justify-center px-6 py-2 rounded-full border bg-emerald-950/80 border-emerald-700/50 font-bold text-2xl text-emerald-400 shadow-lg shadow-emerald-500/20" style="backdrop-filter:blur(8px);font-variant-numeric:tabular-nums">
          +15BB
        </div>
      </div>

      <!-- Negative result on felt -->
      <div class="bg-emerald-900/60 rounded-2xl px-20 py-10 border border-emerald-800/40 flex items-center justify-center">
        <div class="inline-flex items-center justify-center px-6 py-2 rounded-full border bg-red-950/80 border-red-700/50 font-bold text-2xl text-red-400 shadow-lg shadow-red-500/20" style="backdrop-filter:blur(8px);font-variant-numeric:tabular-nums">
          -6BB
        </div>
      </div>

      <!-- Zero result on felt -->
      <div class="bg-emerald-900/60 rounded-2xl px-20 py-10 border border-emerald-800/40 flex items-center justify-center">
        <div class="inline-flex items-center justify-center px-6 py-2 rounded-full border bg-gray-800/80 border-gray-600 font-bold text-2xl text-gray-400 shadow-lg" style="backdrop-filter:blur(8px);font-variant-numeric:tabular-nums">
          0BB
        </div>
      </div>

      <!-- Large positive -->
      <div class="bg-emerald-900/60 rounded-2xl px-20 py-10 border border-emerald-800/40 flex items-center justify-center">
        <div class="inline-flex items-center justify-center px-6 py-2 rounded-full border bg-emerald-950/80 border-emerald-700/50 font-bold text-2xl text-emerald-400 shadow-lg shadow-emerald-500/20" style="backdrop-filter:blur(8px);font-variant-numeric:tabular-nums">
          +200BB
        </div>
      </div>
    </div>
  </div>
</body>
</html>
