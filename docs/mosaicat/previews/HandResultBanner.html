<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-6 items-center">
    <!-- Single winner -->
    <div class="w-full max-w-md mx-auto">
      <div class="bg-gray-900/95 border border-amber-500/30 rounded-xl px-5 py-3 shadow-lg">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-amber-400 text-lg">🏆</span>
            <span class="text-gray-50 font-semibold truncate">PlayerOne</span>
            <span class="text-gray-400 text-sm shrink-0">(Full House)</span>
          </div>
          <span class="text-emerald-500 font-bold text-lg shrink-0">+2,400</span>
        </div>
      </div>
    </div>

    <!-- Multiple winners (split pot) -->
    <div class="w-full max-w-md mx-auto">
      <div class="bg-gray-900/95 border border-amber-500/30 rounded-xl px-5 py-3 shadow-lg">
        <div class="flex items-center justify-between gap-3">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-amber-400 text-lg">🏆</span>
            <span class="text-gray-50 font-semibold truncate">Alice</span>
            <span class="text-gray-400 text-sm shrink-0">(Flush)</span>
          </div>
          <span class="text-emerald-500 font-bold text-lg shrink-0">+1,200</span>
        </div>
        <div class="flex items-center justify-between gap-3 mt-2 pt-2 border-t border-gray-700">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-amber-400 text-lg">🏆</span>
            <span class="text-gray-50 font-semibold truncate">Bob</span>
            <span class="text-gray-400 text-sm shrink-0">(Flush)</span>
          </div>
          <span class="text-emerald-500 font-bold text-lg shrink-0">+1,200</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
