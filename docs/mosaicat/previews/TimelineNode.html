<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TimelineNode Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-col gap-6">
    <!-- Row: All states -->
    <div class="flex items-center gap-3">
      <!-- Active -->
      <button class="inline-flex items-center justify-center min-w-[56px] px-3 py-1.5 text-sm font-semibold border-2 rounded-full bg-amber-500 text-gray-950 border-amber-400 shadow-lg shadow-amber-500/30">
        翻牌
      </button>
      <!-- Visited -->
      <button class="inline-flex items-center justify-center min-w-[56px] px-3 py-1.5 text-sm font-semibold border-2 rounded-full bg-gray-800 text-gray-50 border-gray-700">
        翻前
      </button>
      <!-- Visited -->
      <button class="inline-flex items-center justify-center min-w-[56px] px-3 py-1.5 text-sm font-semibold border-2 rounded-full bg-gray-800 text-gray-50 border-gray-700">
        转牌
      </button>
      <!-- Disabled -->
      <button class="inline-flex items-center justify-center min-w-[56px] px-3 py-1.5 text-sm font-semibold border-2 rounded-full bg-gray-900 text-gray-500 border-gray-800 opacity-50 cursor-not-allowed" disabled>
        河牌
      </button>
    </div>
    <!-- Labels -->
    <div class="flex items-center gap-4 text-xs text-gray-500">
      <span>● active</span>
      <span>● visited</span>
      <span>● visited</span>
      <span>● disabled</span>
    </div>
  </div>
</body>
</html>
