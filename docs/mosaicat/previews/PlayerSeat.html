<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PlayerSeat Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 32px;">
    <p class="text-gray-400 text-sm font-semibold uppercase tracking-wider">PlayerSeat — All States</p>

    <div style="display: flex; gap: 40px; flex-wrap: wrap; align-items: flex-start;">

      <!-- User (active, current actor, dealer-like) -->
      <div class="relative flex flex-col items-center gap-1 min-w-[80px]">
        <div class="w-14 h-14 rounded-full flex items-center justify-center bg-gray-700 ring-2 ring-emerald-400 shadow-lg shadow-emerald-400/30">
          <span class="text-white text-lg font-bold">Y</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white text-xs font-medium">You</span>
          <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">BTN</span>
        </div>
        <span class="text-gray-300 text-xs font-semibold" style="font-variant-numeric: tabular-nums;">98.5 BB</span>
        <span class="text-yellow-400 text-[10px] font-semibold uppercase">Raise 6.5</span>
        <span class="text-emerald-400 text-[9px] font-bold uppercase tracking-wide">You</span>
        <p class="text-gray-500 text-[10px] mt-2">User + Active + Current</p>
      </div>

      <!-- Bot TAG (thinking) -->
      <div class="relative flex flex-col items-center gap-1 min-w-[80px]">
        <div class="w-14 h-14 rounded-full flex items-center justify-center bg-gray-700 ring-2 ring-emerald-400 shadow-lg shadow-emerald-400/30">
          <div class="flex items-center gap-0.5">
            <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-bounce" style="animation-delay: 0ms;"></div>
            <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-bounce" style="animation-delay: 150ms;"></div>
            <div class="w-1.5 h-1.5 bg-emerald-400 rounded-full animate-bounce" style="animation-delay: 300ms;"></div>
          </div>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white text-xs font-medium">Shark</span>
          <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">CO</span>
        </div>
        <span class="inline-block px-1.5 py-0 rounded text-[9px] font-bold text-white bg-blue-600">TAG</span>
        <span class="text-gray-300 text-xs font-semibold" style="font-variant-numeric: tabular-nums;">75.0 BB</span>
        <p class="text-gray-500 text-[10px] mt-2">Bot TAG + Thinking</p>
      </div>

      <!-- Bot LAG (just raised) -->
      <div class="relative flex flex-col items-center gap-1 min-w-[80px]">
        <div class="w-14 h-14 rounded-full flex items-center justify-center bg-gray-700 ring-1 ring-gray-600">
          <span class="text-white text-lg font-bold">F</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white text-xs font-medium">Fire</span>
          <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">MP</span>
        </div>
        <span class="inline-block px-1.5 py-0 rounded text-[9px] font-bold text-white bg-orange-500">LAG</span>
        <span class="text-gray-300 text-xs font-semibold" style="font-variant-numeric: tabular-nums;">120.0 BB</span>
        <span class="text-yellow-400 text-[10px] font-semibold uppercase">Raise 8</span>
        <p class="text-gray-500 text-[10px] mt-2">Bot LAG + Raised</p>
      </div>

      <!-- Folded -->
      <div class="relative flex flex-col items-center gap-1 min-w-[80px] opacity-40">
        <div class="w-14 h-14 rounded-full flex items-center justify-center bg-gray-700 ring-1 ring-gray-600">
          <span class="text-white text-lg font-bold">R</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white text-xs font-medium">Rock</span>
          <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">SB</span>
        </div>
        <span class="inline-block px-1.5 py-0 rounded text-[9px] font-bold text-white bg-gray-500">Nit</span>
        <span class="text-gray-300 text-xs font-semibold" style="font-variant-numeric: tabular-nums;">45.0 BB</span>
        <span class="text-gray-500 text-[10px] font-medium uppercase">Folded</span>
        <p class="text-gray-500 text-[10px] mt-2">Folded</p>
      </div>

      <!-- All-In -->
      <div class="relative flex flex-col items-center gap-1 min-w-[80px]">
        <div class="w-14 h-14 rounded-full flex items-center justify-center bg-gray-700 ring-2 ring-red-500">
          <span class="text-white text-lg font-bold">W</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white text-xs font-medium">Whale</span>
          <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">BB</span>
        </div>
        <span class="inline-block px-1.5 py-0 rounded text-[9px] font-bold text-white bg-green-500">Fish</span>
        <span class="text-red-400 text-xs font-bold uppercase">All-In</span>
        <p class="text-gray-500 text-[10px] mt-2">All-In</p>
      </div>

      <!-- Idle / waiting -->
      <div class="relative flex flex-col items-center gap-1 min-w-[80px]">
        <div class="w-14 h-14 rounded-full flex items-center justify-center bg-gray-700 ring-1 ring-gray-600">
          <span class="text-white text-lg font-bold">G</span>
        </div>
        <div class="flex items-center gap-1">
          <span class="text-white text-xs font-medium">Ghost</span>
          <span class="text-gray-400 text-[10px] bg-gray-700 px-1 py-0.5 rounded font-medium">UTG</span>
        </div>
        <span class="inline-block px-1.5 py-0 rounded text-[9px] font-bold text-white bg-purple-600">GTO</span>
        <span class="text-gray-300 text-xs font-semibold" style="font-variant-numeric: tabular-nums;">100.0 BB</span>
        <span class="text-green-400 text-[10px] font-semibold uppercase">Check</span>
        <p class="text-gray-500 text-[10px] mt-2">Idle + Checked</p>
      </div>

    </div>
  </div>
</body>
</html>
