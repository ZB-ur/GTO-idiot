<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayerSeat Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #065f46; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="flex flex-wrap gap-6 items-start">

    <!-- Seat 1: Active current player, showing cards, dealer -->
    <div class="relative flex flex-col items-center gap-1 p-3 rounded-xl ring-2 ring-yellow-400 ring-offset-2 ring-offset-emerald-800 bg-emerald-700/80 shadow-lg shadow-emerald-900/50">
      <!-- Dealer Button -->
      <div class="absolute -top-1 -right-1 w-6 h-6 rounded-full bg-yellow-400 border-2 border-yellow-600 shadow flex items-center justify-center z-10">
        <span class="text-[10px] font-black text-yellow-900">D</span>
      </div>
      <!-- Avatar -->
      <div class="relative">
        <div class="w-12 h-12 rounded-full border-2 border-yellow-400 flex items-center justify-center overflow-hidden">
          <div class="w-full h-full bg-gradient-to-br from-slate-300 to-slate-500 flex items-center justify-center">
            <span class="text-lg font-bold text-white">A</span>
          </div>
        </div>
      </div>
      <!-- Name + Position -->
      <div class="flex items-center gap-1">
        <span class="text-sm font-semibold text-white">Alice</span>
        <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-600 text-emerald-50">BTN</span>
      </div>
      <!-- Chips -->
      <span class="text-xs text-emerald-200 font-medium">1,250 BB</span>
      <!-- Hole Cards (face up) -->
      <div class="flex gap-1 mt-1">
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center gap-0">
          <span class="text-xs font-bold text-red-500">A</span>
          <span class="text-sm leading-none text-red-500">♥</span>
        </div>
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center gap-0">
          <span class="text-xs font-bold text-gray-900">K</span>
          <span class="text-sm leading-none text-gray-900">♠</span>
        </div>
      </div>
      <!-- Hand Strength -->
      <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-green-500 text-white">Strong</span>
      <!-- Bet -->
      <div class="flex items-center gap-1 mt-1">
        <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
        <span class="text-xs font-semibold text-emerald-100">12 BB</span>
      </div>
    </div>

    <!-- Seat 2: Inactive player, cards face down -->
    <div class="relative flex flex-col items-center gap-1 p-3 rounded-xl bg-emerald-900/60">
      <div class="relative">
        <div class="w-12 h-12 rounded-full border-2 border-emerald-600 flex items-center justify-center overflow-hidden">
          <div class="w-full h-full bg-gradient-to-br from-slate-300 to-slate-500 flex items-center justify-center">
            <span class="text-lg font-bold text-white">B</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <span class="text-sm font-semibold text-white">Bob</span>
        <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-600 text-emerald-50">CO</span>
      </div>
      <span class="text-xs text-emerald-200 font-medium">980 BB</span>
      <div class="flex gap-1 mt-1">
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center">
          <div class="w-6 h-8 rounded border border-blue-400/30 bg-blue-800"></div>
        </div>
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-700 to-blue-900 border border-blue-600 shadow-sm flex items-center justify-center">
          <div class="w-6 h-8 rounded border border-blue-400/30 bg-blue-800"></div>
        </div>
      </div>
      <div class="flex items-center gap-1 mt-1">
        <div class="w-4 h-4 rounded-full bg-gradient-to-b from-red-400 to-red-600 border border-red-700 shadow-sm"></div>
        <span class="text-xs font-semibold text-emerald-100">6 BB</span>
      </div>
    </div>

    <!-- Seat 3: Folded player -->
    <div class="relative flex flex-col items-center gap-1 p-3 rounded-xl bg-emerald-900/60 opacity-50">
      <div class="relative">
        <div class="w-12 h-12 rounded-full border-2 border-emerald-600 flex items-center justify-center overflow-hidden">
          <div class="w-full h-full bg-gradient-to-br from-slate-300 to-slate-500 flex items-center justify-center">
            <span class="text-lg font-bold text-white">C</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-1">
        <span class="text-sm font-semibold text-white">Charlie</span>
        <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-600 text-emerald-50">SB</span>
      </div>
      <span class="text-xs text-emerald-200 font-medium">750 BB</span>
    </div>

    <!-- Seat 4: All-in player -->
    <div class="relative flex flex-col items-center gap-1 p-3 rounded-xl bg-emerald-900/60">
      <div class="relative">
        <div class="w-12 h-12 rounded-full border-2 border-emerald-600 flex items-center justify-center overflow-hidden">
          <div class="w-full h-full bg-gradient-to-br from-slate-300 to-slate-500 flex items-center justify-center">
            <span class="text-lg font-bold text-white">D</span>
          </div>
        </div>
        <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full whitespace-nowrap">ALL IN</div>
      </div>
      <div class="flex items-center gap-1 mt-1">
        <span class="text-sm font-semibold text-white">Diana</span>
        <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-emerald-600 text-emerald-50">BB</span>
      </div>
      <span class="text-xs text-emerald-200 font-medium">0 BB</span>
      <div class="flex gap-1 mt-1">
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center gap-0">
          <span class="text-xs font-bold text-red-500">Q</span>
          <span class="text-sm leading-none text-red-500">♦</span>
        </div>
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 shadow-sm flex flex-col items-center justify-center gap-0">
          <span class="text-xs font-bold text-red-500">Q</span>
          <span class="text-sm leading-none text-red-500">♥</span>
        </div>
      </div>
      <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-amber-400 text-amber-900">Nuts</span>
    </div>

  </div>
</body>
</html>
