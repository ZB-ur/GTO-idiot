<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayerSeat Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 24px; background: #030712; font-family: system-ui, sans-serif; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .anim-bounce { animation: bounce 0.6s infinite; }
  </style>
</head>
<body>
  <div class="flex flex-wrap gap-16 items-start justify-center">

    <!-- Human player — current turn, with visible cards, dealer -->
    <div class="relative flex flex-col items-center gap-2">
      <!-- Dealer button -->
      <div class="absolute -top-2 -right-2 w-6 h-6 rounded-full bg-amber-500 text-gray-950 text-xs font-bold flex items-center justify-center shadow-lg z-10">D</div>
      <!-- Avatar plate -->
      <div class="relative flex flex-col items-center gap-1.5 px-4 py-3 rounded-2xl border bg-gray-800 border-amber-500/50 shadow-lg shadow-amber-500/10">
        <div class="text-2xl">👤</div>
        <div class="text-center">
          <div class="text-xs font-semibold text-gray-50">You</div>
          <div class="text-[10px] text-gray-500 font-mono">CO</div>
        </div>
        <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-gray-950/50">
          <span class="text-amber-400 text-[10px]">●</span>
          <span class="text-xs font-mono font-semibold text-gray-50">186</span>
        </div>
      </div>
      <!-- Hole cards visible -->
      <div class="flex gap-1">
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
          <span class="text-sm font-bold leading-none text-gray-100" style="color:#f87171">A</span>
          <span class="text-xs leading-none" style="color:#f87171">♥</span>
        </div>
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
          <span class="text-sm font-bold leading-none text-gray-100" style="color:#f87171">K</span>
          <span class="text-xs leading-none" style="color:#f87171">♥</span>
        </div>
      </div>
      <!-- Current bet -->
      <div class="flex items-center gap-1">
        <span class="text-amber-500 text-xs">●</span>
        <span class="text-xs font-mono text-gray-400">6</span>
      </div>
    </div>

    <!-- TAG Bot — thinking -->
    <div class="relative flex flex-col items-center gap-2">
      <div class="relative flex flex-col items-center gap-1.5 px-4 py-3 rounded-2xl border bg-gray-900 border-gray-700">
        <div class="text-2xl">🦅</div>
        <div class="text-center">
          <div class="text-xs font-semibold text-gray-50">TAG Bot</div>
          <div class="text-[10px] text-gray-500 font-mono">UTG</div>
        </div>
        <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-gray-950/50">
          <span class="text-amber-400 text-[10px]">●</span>
          <span class="text-xs font-mono font-semibold text-gray-50">200</span>
        </div>
        <div class="text-[10px] text-gray-500 bg-gray-800 px-1.5 py-0.5 rounded">TAG</div>
        <!-- Thinking dots -->
        <div class="flex gap-1 mt-1">
          <div class="w-1.5 h-1.5 rounded-full bg-amber-400 anim-bounce"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-amber-400 anim-bounce" style="animation-delay: 150ms"></div>
          <div class="w-1.5 h-1.5 rounded-full bg-amber-400 anim-bounce" style="animation-delay: 300ms"></div>
        </div>
      </div>
      <!-- Face down cards -->
      <div class="flex gap-1">
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-800 to-blue-950 border border-blue-700/50 shadow-md flex items-center justify-center">
          <div class="w-6 h-8 rounded border border-blue-600/30 bg-blue-900/50"></div>
        </div>
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-800 to-blue-950 border border-blue-700/50 shadow-md flex items-center justify-center">
          <div class="w-6 h-8 rounded border border-blue-600/30 bg-blue-900/50"></div>
        </div>
      </div>
    </div>

    <!-- Fish Bot — showing action "Call 6" -->
    <div class="relative flex flex-col items-center gap-2">
      <div class="relative flex flex-col items-center gap-1.5 px-4 py-3 rounded-2xl border bg-gray-900 border-gray-700">
        <div class="text-2xl">🐟</div>
        <div class="text-center">
          <div class="text-xs font-semibold text-gray-50">Fish Bot</div>
          <div class="text-[10px] text-gray-500 font-mono">BTN</div>
        </div>
        <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-gray-950/50">
          <span class="text-amber-400 text-[10px]">●</span>
          <span class="text-xs font-mono font-semibold text-gray-50">194</span>
        </div>
        <div class="text-[10px] text-gray-500 bg-gray-800 px-1.5 py-0.5 rounded">Fish</div>
      </div>
      <div class="flex gap-1">
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-800 to-blue-950 border border-blue-700/50 shadow-md flex items-center justify-center">
          <div class="w-6 h-8 rounded border border-blue-600/30 bg-blue-900/50"></div>
        </div>
        <div class="w-10 h-14 rounded-lg bg-gradient-to-br from-blue-800 to-blue-950 border border-blue-700/50 shadow-md flex items-center justify-center">
          <div class="w-6 h-8 rounded border border-blue-600/30 bg-blue-900/50"></div>
        </div>
      </div>
      <!-- Action label -->
      <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap">
        <div class="px-2 py-0.5 rounded-lg bg-gray-900/90 border border-gray-700 text-xs font-semibold text-emerald-400">Call 6</div>
      </div>
    </div>

    <!-- Nit Bot — folded -->
    <div class="relative flex flex-col items-center gap-2 opacity-40">
      <div class="relative flex flex-col items-center gap-1.5 px-4 py-3 rounded-2xl border bg-gray-900 border-gray-700">
        <div class="text-2xl">🐢</div>
        <div class="text-center">
          <div class="text-xs font-semibold text-gray-50">Nit Bot</div>
          <div class="text-[10px] text-gray-500 font-mono">SB</div>
        </div>
        <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-gray-950/50">
          <span class="text-amber-400 text-[10px]">●</span>
          <span class="text-xs font-mono font-semibold text-gray-50">199</span>
        </div>
        <div class="text-[10px] text-gray-500 bg-gray-800 px-1.5 py-0.5 rounded">Nit</div>
      </div>
      <div class="absolute -bottom-6 left-1/2 -translate-x-1/2 whitespace-nowrap">
        <div class="px-2 py-0.5 rounded-lg bg-gray-900/90 border border-gray-700 text-xs font-semibold text-gray-500">Fold</div>
      </div>
    </div>

    <!-- Winner state -->
    <div class="relative flex flex-col items-center gap-2 pb-10">
      <div class="relative flex flex-col items-center gap-1.5 px-4 py-3 rounded-2xl border bg-gray-800 border-emerald-500/50 shadow-lg shadow-emerald-500/10">
        <div class="text-2xl">🔥</div>
        <div class="text-center">
          <div class="text-xs font-semibold text-gray-50">LAG Bot</div>
          <div class="text-[10px] text-gray-500 font-mono">MP</div>
        </div>
        <div class="flex items-center gap-1 px-2 py-0.5 rounded-lg bg-gray-950/50">
          <span class="text-amber-400 text-[10px]">●</span>
          <span class="text-xs font-mono font-semibold text-gray-50">248</span>
        </div>
        <div class="text-[10px] text-gray-500 bg-gray-800 px-1.5 py-0.5 rounded">LAG</div>
      </div>
      <!-- Revealed cards -->
      <div class="flex gap-1">
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
          <span class="text-sm font-bold leading-none" style="color:#111827">A</span>
          <span class="text-xs leading-none" style="color:#111827">♠</span>
        </div>
        <div class="w-10 h-14 rounded-lg bg-white border border-gray-200 flex flex-col items-center justify-center shadow-md">
          <span class="text-sm font-bold leading-none" style="color:#111827">K</span>
          <span class="text-xs leading-none" style="color:#111827">♠</span>
        </div>
      </div>
      <!-- Winner badge -->
      <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 whitespace-nowrap">
        <div class="px-3 py-1 rounded-lg bg-emerald-500/20 border border-emerald-500/40 text-center">
          <div class="text-xs font-semibold text-emerald-400">+48</div>
          <div class="text-[10px] text-emerald-300/70">Two Pair, Aces and Kings</div>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
