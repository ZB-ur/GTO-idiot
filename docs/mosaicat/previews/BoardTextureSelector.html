<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoardTextureSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-xl mx-auto">
    <div class="space-y-3">
      <label class="block text-sm font-semibold text-gray-600">牌面结构</label>
      <div class="space-y-3">
        <!-- 高牌面 -->
        <div class="space-y-1.5">
          <span class="block text-xs font-medium text-gray-400 uppercase tracking-wide">高牌面</span>
          <div class="flex flex-wrap gap-2">
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-blue-600 text-white border-blue-600 shadow-sm transition-all duration-150">彩虹断裂</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">彩虹连接</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">双色断裂</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">双色连接</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">同花</button>
          </div>
        </div>
        <!-- 低牌面 -->
        <div class="space-y-1.5">
          <span class="block text-xs font-medium text-gray-400 uppercase tracking-wide">低牌面</span>
          <div class="flex flex-wrap gap-2">
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">彩虹断裂</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">彩虹连接</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">双色断裂</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">双色连接</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">同花</button>
          </div>
        </div>
        <!-- 混合牌面 -->
        <div class="space-y-1.5">
          <span class="block text-xs font-medium text-gray-400 uppercase tracking-wide">混合牌面</span>
          <div class="flex flex-wrap gap-2">
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">彩虹</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">双色</button>
            <button class="px-3 py-1.5 text-sm font-medium rounded-lg border bg-white text-gray-600 border-gray-200 transition-all duration-150">同花</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
