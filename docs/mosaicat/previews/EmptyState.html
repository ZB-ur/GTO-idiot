<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmptyState Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <!-- Example 1: With action button -->
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm mb-8">
    <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
      <div class="mb-6 flex items-center justify-center w-24 h-24 rounded-full bg-slate-100">
        <svg class="w-16 h-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-2.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
        </svg>
      </div>
      <h3 class="text-lg font-semibold text-gray-900 mb-2">No Hand History Yet</h3>
      <p class="text-sm text-gray-500 max-w-sm mb-6">Play your first hand to start tracking your GTO performance and building your stats.</p>
      <button class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
        Start Playing
      </button>
    </div>
  </div>

  <!-- Example 2: Without action button -->
  <div class="bg-white border border-gray-200 rounded-xl shadow-sm">
    <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
      <div class="mb-6 flex items-center justify-center w-24 h-24 rounded-full bg-slate-100">
        <svg class="w-16 h-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <h3 class="text-lg font-semibold text-gray-900 mb-2">No Results Found</h3>
      <p class="text-sm text-gray-500 max-w-sm">Try adjusting your filters or date range to find matching hands.</p>
    </div>
  </div>
</body>
</html>
