<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmptyState Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="space-y-8 max-w-md mx-auto">

    <!-- With action button -->
    <div>
      <p class="text-gray-400 text-sm mb-3 font-semibold">Empty State — With Action</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl">
        <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
          <div class="mb-4">
            <svg class="w-12 h-12 text-gray-600" fill="none" viewBox="0 0 48 48" stroke="currentColor" stroke-width="1.5">
              <rect x="6" y="10" width="36" height="28" rx="4" />
              <path d="M6 18h36" />
              <circle cx="24" cy="30" r="4" />
            </svg>
          </div>
          <h3 class="text-gray-50 text-lg font-semibold mb-2">No Hand History</h3>
          <p class="text-gray-400 text-sm max-w-xs mb-6">Start playing to build your hand history and track your GTO improvement over time.</p>
          <button class="px-5 py-2.5 bg-emerald-500 hover:bg-emerald-400 text-gray-950 font-semibold text-sm rounded-lg transition-colors duration-200">
            Start New Game
          </button>
        </div>
      </div>
    </div>

    <!-- Without action button -->
    <div>
      <p class="text-gray-400 text-sm mb-3 font-semibold">Empty State — No Action</p>
      <div class="bg-gray-900 border border-gray-700 rounded-xl">
        <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
          <div class="mb-4">
            <svg class="w-12 h-12 text-gray-600" fill="none" viewBox="0 0 48 48" stroke="currentColor" stroke-width="1.5">
              <path d="M12 36V20l12-8 12 8v16" />
              <path d="M20 36v-8h8v8" />
            </svg>
          </div>
          <h3 class="text-gray-50 text-lg font-semibold mb-2">No Statistics Yet</h3>
          <p class="text-gray-400 text-sm max-w-xs mb-6">Play at least 10 hands to unlock your performance statistics and deviation analysis.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
