<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppShell Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-spin { animation: spin 1s linear infinite; }
    .animate-pulse { animation: pulse 1.5s ease-in-out infinite; }
    .animate-slide-in { animation: slideIn 0.3s ease-out; }
  </style>
</head>
<body>
  <div style="min-height: 100vh; display: flex; flex-direction: column; background: #f8fafc;">

    <!-- ── TopNav ────────────────────────────────────────────────── -->
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 sm:px-6">
        <div class="flex items-center justify-between h-14">
          <!-- Logo -->
          <div class="flex items-center gap-2">
            <span class="text-2xl">♠</span>
            <span class="text-lg font-bold text-gray-900 tracking-tight">GTO Idiot</span>
          </div>
          <!-- Nav Links -->
          <div class="flex items-center gap-1">
            <button class="px-3 py-2 rounded-lg text-sm font-medium bg-blue-50 text-blue-600">
              <span class="mr-1.5">🃏</span>Play
            </button>
            <button class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50">
              <span class="mr-1.5">📋</span>History
            </button>
            <button class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50">
              <span class="mr-1.5">📊</span>Report
            </button>
            <button class="px-3 py-2 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50">
              <span class="mr-1.5">⚙️</span>Settings
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- ── Page Content Area ─────────────────────────────────────── -->
    <main class="flex-1 w-full max-w-6xl mx-auto px-4 sm:px-6 py-6">
      <!-- Placeholder content to show layout -->
      <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-6">
        <h1 class="text-2xl font-bold text-gray-900 mb-2">Welcome to GTO Idiot</h1>
        <p class="text-gray-500 mb-6">Practice Texas Hold'em with real-time GTO strategy feedback.</p>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="bg-slate-50 rounded-lg p-4 text-center">
            <p class="text-3xl font-bold text-gray-900">247</p>
            <p class="text-sm text-gray-500 mt-1">Hands Played</p>
          </div>
          <div class="bg-emerald-50 rounded-lg p-4 text-center">
            <p class="text-3xl font-bold text-emerald-600">+$342</p>
            <p class="text-sm text-gray-500 mt-1">Session Profit</p>
          </div>
          <div class="bg-blue-50 rounded-lg p-4 text-center">
            <p class="text-3xl font-bold text-blue-600">72%</p>
            <p class="text-sm text-gray-500 mt-1">GTO Compliance</p>
          </div>
        </div>

        <div class="mt-6 flex gap-3">
          <button class="px-5 py-2.5 bg-blue-600 text-white text-sm font-semibold rounded-lg hover:bg-blue-700 transition-colors">
            New Game
          </button>
          <button class="px-5 py-2.5 bg-white border border-gray-200 text-gray-700 text-sm font-semibold rounded-lg hover:bg-gray-50 transition-colors">
            View History
          </button>
        </div>
      </div>
    </main>

    <!-- ── Toast Container ───────────────────────────────────────── -->
    <div class="fixed top-4 right-4 z-50 flex flex-col gap-2 w-80">
      <!-- Success Toast -->
      <div class="flex items-start gap-3 px-4 py-3 rounded-lg border-l-4 bg-emerald-50 border-emerald-500 shadow-md animate-slide-in">
        <span class="text-lg leading-none mt-0.5">✓</span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-900">Hand Complete</p>
          <p class="text-sm text-gray-600 mt-0.5">You won $24 with two pair!</p>
        </div>
        <button class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
      <!-- Warning Toast -->
      <div class="flex items-start gap-3 px-4 py-3 rounded-lg border-l-4 bg-amber-50 border-amber-500 shadow-md animate-slide-in" style="animation-delay: 100ms;">
        <span class="text-lg leading-none mt-0.5">⚠</span>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-gray-900">GTO Deviation</p>
          <p class="text-sm text-gray-600 mt-0.5">Major deviation on last decision</p>
        </div>
        <button class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
    </div>

  </div>
</body>
</html>
