<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTOActionComparison Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-6 max-w-md mx-auto py-4">
    <!-- Aligned Example -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-gray-50 uppercase tracking-wide">GTO Comparison</h3>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-400/15 text-emerald-400 border border-emerald-400/30">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          Aligned
        </span>
      </div>

      <div class="bg-gray-800 rounded-lg p-4">
        <div class="text-xs text-gray-500 uppercase tracking-wider mb-1.5">Your Action</div>
        <div class="flex items-baseline gap-2">
          <span class="text-lg font-bold text-gray-50">Raise</span>
          <span class="text-base text-gray-400" style="font-variant-numeric: tabular-nums;">12</span>
        </div>
      </div>

      <div>
        <div class="text-xs text-gray-500 uppercase tracking-wider mb-3">GTO Recommendation</div>
        <div class="space-y-2.5">
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-300 w-16 shrink-0 font-medium">Raise</span>
            <div class="flex-1 h-5 bg-gray-800 rounded-md overflow-hidden">
              <div class="h-full rounded-md bg-amber-400 opacity-100" style="width: 65%;"></div>
            </div>
            <span class="text-xs text-gray-400 w-10 text-right font-medium" style="font-variant-numeric: tabular-nums;">65%</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-300 w-16 shrink-0 font-medium">Call</span>
            <div class="flex-1 h-5 bg-gray-800 rounded-md overflow-hidden">
              <div class="h-full rounded-md bg-sky-400 opacity-60" style="width: 30%;"></div>
            </div>
            <span class="text-xs text-gray-400 w-10 text-right font-medium" style="font-variant-numeric: tabular-nums;">30%</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-300 w-16 shrink-0 font-medium">Fold</span>
            <div class="flex-1 h-5 bg-gray-800 rounded-md overflow-hidden">
              <div class="h-full rounded-md bg-gray-500 opacity-60" style="width: 5%;"></div>
            </div>
            <span class="text-xs text-gray-400 w-10 text-right font-medium" style="font-variant-numeric: tabular-nums;">5%</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Deviation Example -->
    <div class="bg-gray-900 border border-gray-700 rounded-xl p-5 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-semibold text-gray-50 uppercase tracking-wide">GTO Comparison</h3>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-orange-400/15 text-orange-400 border border-orange-400/30">
          <span class="w-1.5 h-1.5 rounded-full bg-orange-400"></span>
          Deviation
        </span>
      </div>

      <div class="bg-gray-800 rounded-lg p-4">
        <div class="text-xs text-gray-500 uppercase tracking-wider mb-1.5">Your Action</div>
        <div class="flex items-baseline gap-2">
          <span class="text-lg font-bold text-gray-50">Fold</span>
        </div>
      </div>

      <div>
        <div class="text-xs text-gray-500 uppercase tracking-wider mb-3">GTO Recommendation</div>
        <div class="space-y-2.5">
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-300 w-16 shrink-0 font-medium">Call</span>
            <div class="flex-1 h-5 bg-gray-800 rounded-md overflow-hidden">
              <div class="h-full rounded-md bg-sky-400 opacity-60" style="width: 55%;"></div>
            </div>
            <span class="text-xs text-gray-400 w-10 text-right font-medium" style="font-variant-numeric: tabular-nums;">55%</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-300 w-16 shrink-0 font-medium">Raise</span>
            <div class="flex-1 h-5 bg-gray-800 rounded-md overflow-hidden">
              <div class="h-full rounded-md bg-amber-400 opacity-60" style="width: 35%;"></div>
            </div>
            <span class="text-xs text-gray-400 w-10 text-right font-medium" style="font-variant-numeric: tabular-nums;">35%</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm text-gray-300 w-16 shrink-0 font-medium">Fold</span>
            <div class="flex-1 h-5 bg-gray-800 rounded-md overflow-hidden">
              <div class="h-full rounded-md bg-gray-500 opacity-100" style="width: 10%;"></div>
            </div>
            <span class="text-xs text-gray-400 w-10 text-right font-medium" style="font-variant-numeric: tabular-nums;">10%</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
