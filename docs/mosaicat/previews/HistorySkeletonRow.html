<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
</style>
</head>
<body>
  <div style="display: flex; flex-direction: column; gap: 8px; max-width: 600px;">
    <!-- Row 1 -->
    <div class="flex items-center gap-4 px-4 py-3 bg-gray-900 rounded-xl border border-gray-700 animate-pulse">
      <div class="w-12 h-4 bg-gray-700 rounded"></div>
      <div class="w-20 h-4 bg-gray-700 rounded"></div>
      <div class="flex gap-1">
        <div class="w-8 h-11 bg-gray-700 rounded"></div>
        <div class="w-8 h-11 bg-gray-700 rounded"></div>
      </div>
      <div class="flex-1"></div>
      <div class="w-16 h-4 bg-gray-700 rounded"></div>
      <div class="w-12 h-4 bg-gray-700 rounded"></div>
    </div>
    <!-- Row 2 -->
    <div class="flex items-center gap-4 px-4 py-3 bg-gray-900 rounded-xl border border-gray-700 animate-pulse" style="animation-delay: 0.15s;">
      <div class="w-12 h-4 bg-gray-700 rounded"></div>
      <div class="w-20 h-4 bg-gray-700 rounded"></div>
      <div class="flex gap-1">
        <div class="w-8 h-11 bg-gray-700 rounded"></div>
        <div class="w-8 h-11 bg-gray-700 rounded"></div>
      </div>
      <div class="flex-1"></div>
      <div class="w-16 h-4 bg-gray-700 rounded"></div>
      <div class="w-12 h-4 bg-gray-700 rounded"></div>
    </div>
    <!-- Row 3 -->
    <div class="flex items-center gap-4 px-4 py-3 bg-gray-900 rounded-xl border border-gray-700 animate-pulse" style="animation-delay: 0.3s;">
      <div class="w-12 h-4 bg-gray-700 rounded"></div>
      <div class="w-20 h-4 bg-gray-700 rounded"></div>
      <div class="flex gap-1">
        <div class="w-8 h-11 bg-gray-700 rounded"></div>
        <div class="w-8 h-11 bg-gray-700 rounded"></div>
      </div>
      <div class="flex-1"></div>
      <div class="w-16 h-4 bg-gray-700 rounded"></div>
      <div class="w-12 h-4 bg-gray-700 rounded"></div>
    </div>
  </div>
</body>
</html>
