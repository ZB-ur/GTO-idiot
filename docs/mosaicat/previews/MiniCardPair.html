<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MiniCardPair Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex items-center gap-8 p-6 bg-gray-900 rounded-xl">
    <!-- Pair 1: A♠ K♥ -->
    <div class="flex flex-col items-center gap-2">
      <div class="inline-flex -space-x-2">
        <div class="w-8 h-11 bg-gray-100 border border-gray-300 rounded flex flex-col items-center justify-center text-[10px] font-bold leading-none shadow-sm" style="z-index: 0;">
          <span class="text-gray-900">A</span>
          <span class="text-gray-900">♠</span>
        </div>
        <div class="w-8 h-11 bg-gray-100 border border-gray-300 rounded flex flex-col items-center justify-center text-[10px] font-bold leading-none shadow-sm" style="z-index: 1;">
          <span class="text-red-500">K</span>
          <span class="text-red-500">♥</span>
        </div>
      </div>
      <span class="text-xs text-gray-400">A♠ K♥</span>
    </div>

    <!-- Pair 2: 10♦ 10♣ -->
    <div class="flex flex-col items-center gap-2">
      <div class="inline-flex -space-x-2">
        <div class="w-8 h-11 bg-gray-100 border border-gray-300 rounded flex flex-col items-center justify-center text-[10px] font-bold leading-none shadow-sm" style="z-index: 0;">
          <span class="text-red-500">10</span>
          <span class="text-red-500">♦</span>
        </div>
        <div class="w-8 h-11 bg-gray-100 border border-gray-300 rounded flex flex-col items-center justify-center text-[10px] font-bold leading-none shadow-sm" style="z-index: 1;">
          <span class="text-gray-900">10</span>
          <span class="text-gray-900">♣</span>
        </div>
      </div>
      <span class="text-xs text-gray-400">10♦ 10♣</span>
    </div>

    <!-- Pair 3: Q♥ J♥ -->
    <div class="flex flex-col items-center gap-2">
      <div class="inline-flex -space-x-2">
        <div class="w-8 h-11 bg-gray-100 border border-gray-300 rounded flex flex-col items-center justify-center text-[10px] font-bold leading-none shadow-sm" style="z-index: 0;">
          <span class="text-red-500">Q</span>
          <span class="text-red-500">♥</span>
        </div>
        <div class="w-8 h-11 bg-gray-100 border border-gray-300 rounded flex flex-col items-center justify-center text-[10px] font-bold leading-none shadow-sm" style="z-index: 1;">
          <span class="text-red-500">J</span>
          <span class="text-red-500">♥</span>
        </div>
      </div>
      <span class="text-xs text-gray-400">Q♥ J♥</span>
    </div>
  </div>
</body>
</html>
