<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ScenarioTabs Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #1a1a2e; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div style="max-width:400px;" class="space-y-4">
    <!-- Open Raise selected -->
    <div class="flex gap-1 bg-[#1a1a2e] border border-gray-700 p-1 rounded-lg">
      <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-md bg-emerald-500 text-white shadow-md">Open Raise</button>
      <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-md text-gray-400">vs 3-Bet</button>
      <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-md text-gray-400">vs 4-Bet</button>
    </div>

    <!-- vs 3-Bet selected -->
    <div class="flex gap-1 bg-[#1a1a2e] border border-gray-700 p-1 rounded-lg">
      <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-md text-gray-400">Open Raise</button>
      <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-md bg-emerald-500 text-white shadow-md">vs 3-Bet</button>
      <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-md text-gray-400">vs 4-Bet</button>
    </div>
  </div>
