<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmptyHistoryIllustration Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="max-w-md mx-auto rounded-xl border border-gray-200 bg-white shadow-sm">
    <div class="flex flex-col items-center justify-center py-16 px-6 text-center">
      <!-- Illustration: stylized card deck -->
      <div class="relative mb-6" style="width:88px;height:96px;">
        <div class="w-16 rounded-lg bg-gray-100 border-2 border-dashed border-gray-300 absolute left-0 top-0" style="height:88px;transform:rotate(-6deg);"></div>
        <div class="w-16 rounded-lg bg-gray-100 border-2 border-dashed border-gray-300 absolute right-0 top-0" style="height:88px;transform:rotate(6deg);"></div>
        <div class="relative w-16 rounded-lg bg-white border-2 border-dashed border-gray-300 flex items-center justify-center z-10 mx-auto" style="height:88px;">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
          </svg>
        </div>
      </div>

      <h3 class="text-lg font-semibold text-gray-900 mt-4">No hands played yet</h3>
      <p class="text-sm text-gray-500 mt-2 max-w-xs">
        Start a session against a bot to see your hand history and review your decisions.
      </p>

      <button class="mt-6 inline-flex items-center gap-2 px-5 py-2.5 rounded-lg bg-blue-600 text-white text-sm font-medium shadow-sm hover:bg-blue-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        Play a Hand
      </button>
    </div>
  </div>
</body>
</html>
