<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { margin: 0; padding: 48px; background: #030712; font-family: system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; gap: 32px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.animate-spin { animation: spin 1s linear infinite; }
</style>
</head>
<body>
  <!-- Default state -->
  <div style="text-align: center;">
    <p class="text-gray-400 text-sm mb-3">Default</p>
    <button class="relative inline-flex items-center justify-center px-10 py-4 text-lg font-bold text-gray-950 bg-gradient-to-r from-amber-400 via-amber-500 to-amber-400 rounded-xl shadow-lg transition-all duration-200 hover:from-amber-300 hover:via-amber-400 hover:to-amber-300 hover:shadow-xl hover:scale-105 active:scale-95 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 focus:ring-offset-gray-950" style="box-shadow: 0 10px 15px -3px rgba(245,158,11,0.25);">
      开始对战
    </button>
  </div>

  <!-- Loading state -->
  <div style="text-align: center;">
    <p class="text-gray-400 text-sm mb-3">Loading</p>
    <button class="relative inline-flex items-center justify-center px-10 py-4 text-lg font-bold text-gray-950 bg-gradient-to-r from-amber-400 via-amber-500 to-amber-400 rounded-xl shadow-lg opacity-60 cursor-not-allowed" disabled style="box-shadow: 0 10px 15px -3px rgba(245,158,11,0.25);">
      <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-gray-950" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      准备中...
    </button>
  </div>
</body>
</html>
