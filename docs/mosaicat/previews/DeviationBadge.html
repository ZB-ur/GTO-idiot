<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DeviationBadge Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex items-center gap-3 flex-wrap">
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold ring-1 ring-inset bg-emerald-400/15 text-emerald-400 ring-emerald-400/30">Good</span>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold ring-1 ring-inset bg-sky-400/15 text-sky-400 ring-sky-400/30">Minor</span>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold ring-1 ring-inset bg-amber-400/15 text-amber-400 ring-amber-400/30">Mistake</span>
    <span class="inline-flex items-center px-2.5 py-0.5 rounded-lg text-xs font-semibold ring-1 ring-inset bg-red-500/15 text-red-400 ring-red-500/30">Blunder</span>
  </div>
</body>
</html>
