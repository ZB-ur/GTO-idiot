<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-8">
    <!-- Dot-only variants -->
    <div>
      <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">Dot Only</p>
      <div class="flex items-center gap-6">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="text-sm text-gray-600">Match</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400"></span>
          <span class="text-sm text-gray-600">Minor</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500"></span>
          <span class="text-sm text-gray-600">Major</span>
        </div>
      </div>
    </div>

    <!-- With label variants -->
    <div>
      <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">With Label</p>
      <div class="flex items-center gap-3 flex-wrap">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border bg-emerald-50 text-emerald-700 border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          GTO Match
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border bg-amber-50 text-amber-700 border-amber-200">
          <span class="w-2 h-2 rounded-full bg-amber-400"></span>
          Minor Deviation
        </span>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium border bg-red-50 text-red-700 border-red-200">
          <span class="w-2 h-2 rounded-full bg-red-500"></span>
          Major Deviation
        </span>
      </div>
    </div>

    <!-- In context -->
    <div>
      <p class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">In Context (Action Node)</p>
      <div class="flex flex-col gap-2">
        <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-xl px-4 py-3">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span class="text-sm font-medium text-gray-900">Raise 3x</span>
          <span class="text-xs text-gray-500 ml-auto">GTO: 65%</span>
        </div>
        <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-xl px-4 py-3">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400"></span>
          <span class="text-sm font-medium text-gray-900">Call</span>
          <span class="text-xs text-gray-500 ml-auto">GTO: 25%</span>
        </div>
        <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-xl px-4 py-3">
          <span class="inline-block w-2.5 h-2.5 rounded-full bg-red-500"></span>
          <span class="text-sm font-medium text-gray-900">Fold</span>
          <span class="text-xs text-gray-500 ml-auto">GTO: 5%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
