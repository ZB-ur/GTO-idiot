<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandStrengthIndicator Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-3">
    <!-- Nuts -->
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-yellow-100" style="width: fit-content;">
      <span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span>
      <span class="text-xs font-medium text-yellow-800">Flush (A♠ high)</span>
    </div>
    <!-- Strong -->
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-green-100" style="width: fit-content;">
      <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
      <span class="text-xs font-medium text-green-800">Two Pair (K&amp;Q)</span>
    </div>
    <!-- Medium -->
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-blue-100" style="width: fit-content;">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
      <span class="text-xs font-medium text-blue-800">Top Pair (K kicker)</span>
    </div>
    <!-- Weak -->
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-gray-100" style="width: fit-content;">
      <span class="w-1.5 h-1.5 rounded-full bg-gray-400"></span>
      <span class="text-xs font-medium text-gray-600">Gutshot Draw</span>
    </div>
    <!-- Air -->
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-red-100" style="width: fit-content;">
      <span class="w-1.5 h-1.5 rounded-full bg-red-400"></span>
      <span class="text-xs font-medium text-red-700">High Card (J)</span>
    </div>
  </div>
</body>
</html>
