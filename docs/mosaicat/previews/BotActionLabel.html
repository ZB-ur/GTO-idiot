<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BotActionLabel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col items-start gap-3 pt-8 pl-8">
    <p class="text-xs text-gray-500 mb-1 uppercase tracking-wide">Bot Actions</p>

    <!-- Raise -->
    <div class="inline-flex items-center px-3 py-1 rounded-lg border text-sm font-semibold bg-red-500/20 border-red-500/40 text-red-400">
      Raise to 6
    </div>

    <!-- Call -->
    <div class="inline-flex items-center px-3 py-1 rounded-lg border text-sm font-semibold bg-emerald-500/20 border-emerald-500/40 text-emerald-400">
      Call
    </div>

    <!-- Check -->
    <div class="inline-flex items-center px-3 py-1 rounded-lg border text-sm font-semibold bg-sky-500/20 border-sky-500/40 text-sky-400">
      Check
    </div>

    <!-- Fold -->
    <div class="inline-flex items-center px-3 py-1 rounded-lg border text-sm font-semibold bg-gray-500/20 border-gray-600/40 text-gray-400">
      Fold
    </div>

    <!-- All-in -->
    <div class="inline-flex items-center px-3 py-1 rounded-lg border text-sm font-semibold bg-amber-500/20 border-amber-500/40 text-amber-400">
      All-in
    </div>

    <!-- Bet -->
    <div class="inline-flex items-center px-3 py-1 rounded-lg border text-sm font-semibold bg-red-500/20 border-red-500/40 text-red-400">
      Bet to 12
    </div>
  </div>
</body>
</html>
