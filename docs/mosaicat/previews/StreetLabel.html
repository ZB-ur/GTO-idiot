<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreetLabel Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="flex flex-col gap-4">
    <h2 class="text-lg font-semibold text-gray-900">StreetLabel</h2>
    <div class="flex items-center gap-3">
      <!-- Preflop -->
      <span class="inline-flex items-center px-2.5 py-0.5 text-xs font-semibold rounded-lg border bg-blue-100 text-blue-700 border-blue-200">
        Preflop
      </span>
      <!-- Flop -->
      <span class="inline-flex items-center px-2.5 py-0.5 text-xs font-semibold rounded-lg border bg-emerald-100 text-emerald-700 border-emerald-200">
        Flop
      </span>
      <!-- Turn -->
      <span class="inline-flex items-center px-2.5 py-0.5 text-xs font-semibold rounded-lg border bg-amber-100 text-amber-700 border-amber-200">
        Turn
      </span>
      <!-- River -->
      <span class="inline-flex items-center px-2.5 py-0.5 text-xs font-semibold rounded-lg border bg-purple-100 text-purple-700 border-purple-200">
        River
      </span>
    </div>
  </div>
</body>
</html>
