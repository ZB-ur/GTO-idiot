<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://cdn.tailwindcss.com"></script>
<style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
<div class="max-w-md mx-auto space-y-4">
  <!-- GTO Match (collapsed) -->
  <div class="border border-emerald-200 bg-emerald-50/50 rounded-xl overflow-hidden">
    <div class="w-full flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700">GTO</span>
        <span class="text-sm font-semibold text-gray-900">You: RAISE $150</span>
        <span class="text-xs text-gray-400">vs Open from CO</span>
      </div>
      <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </div>
  </div>

  <!-- Major Deviation (expanded) -->
  <div class="border border-red-200 bg-red-50/50 rounded-xl overflow-hidden">
    <div class="w-full flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-red-100 text-red-700">-EV</span>
        <span class="text-sm font-semibold text-gray-900">You: CALL $50</span>
        <span class="text-xs text-gray-400">Facing 3-bet OOP</span>
      </div>
      <svg class="w-4 h-4 text-gray-400 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </div>
    <div class="px-4 pb-4 space-y-3 border-t border-gray-100">
      <p class="text-sm text-gray-600 mt-3">GTO suggests 3-betting 60% and folding 35% here. Calling is only 5% frequency — you're losing value by flatting with AKs.</p>
      <div class="space-y-2">
        <p class="text-xs font-semibold text-gray-500 uppercase">GTO Distribution</p>
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium text-gray-700 w-20">raise_3x</span>
          <div class="flex-1 h-5 bg-gray-100 rounded-md overflow-hidden relative">
            <div class="h-full bg-blue-500 rounded-md" style="width: 100%;"></div>
            <span class="absolute inset-y-0 right-2 flex items-center text-[10px] font-bold text-gray-600">60%</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium text-gray-700 w-20">fold</span>
          <div class="flex-1 h-5 bg-gray-100 rounded-md overflow-hidden relative">
            <div class="h-full bg-blue-500 rounded-md" style="width: 58%;"></div>
            <span class="absolute inset-y-0 right-2 flex items-center text-[10px] font-bold text-gray-600">35%</span>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <span class="text-xs font-medium text-gray-700 w-20">call</span>
          <div class="flex-1 h-5 bg-gray-100 rounded-md overflow-hidden relative">
            <div class="h-full bg-blue-500 rounded-md" style="width: 8%;"></div>
            <span class="absolute inset-y-0 right-2 flex items-center text-[10px] font-bold text-gray-600">5%</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Minor Deviation (collapsed) -->
  <div class="border border-amber-200 bg-amber-50/50 rounded-xl overflow-hidden">
    <div class="w-full flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-700">~EV</span>
        <span class="text-sm font-semibold text-gray-900">You: CHECK</span>
        <span class="text-xs text-gray-400">C-bet spot IP</span>
      </div>
      <svg class="w-4 h-4 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </div>
  </div>
</div>
</body>
</html>
