<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardComponent Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    .flip-card { perspective: 600px; }
    .flip-card-inner {
      transition: transform 0.6s;
      transform-style: preserve-3d;
      position: relative;
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-card-front, .flip-card-back {
      backface-visibility: hidden;
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    }
    .flip-card-back { transform: rotateY(180deg); }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">CardComponent — Flip Animation</h2>

  <p class="text-sm text-gray-600 mb-2">Face Up (clickable to flip)</p>
  <div class="flex gap-4 mb-6">
    <!-- Face up card -->
    <div class="cursor-pointer transition-transform duration-300">
      <div class="w-16 h-[5.6rem] rounded-lg border border-gray-200 shadow-sm bg-white flex flex-col justify-between p-1 select-none">
        <div class="flex flex-col items-start leading-none text-red-500">
          <span class="text-sm font-bold">A</span>
          <span class="text-xs">♥</span>
        </div>
        <div class="flex items-center justify-center text-red-500 text-2xl">♥</div>
        <div class="flex flex-col items-end leading-none rotate-180 text-red-500">
          <span class="text-sm font-bold">A</span>
          <span class="text-xs">♥</span>
        </div>
      </div>
    </div>

    <!-- Face up card 2 -->
    <div class="cursor-pointer transition-transform duration-300">
      <div class="w-16 h-[5.6rem] rounded-lg border border-gray-200 shadow-sm bg-white flex flex-col justify-between p-1 select-none">
        <div class="flex flex-col items-start leading-none text-gray-900">
          <span class="text-sm font-bold">K</span>
          <span class="text-xs">♠</span>
        </div>
        <div class="flex items-center justify-center text-gray-900 text-2xl">♠</div>
        <div class="flex flex-col items-end leading-none rotate-180 text-gray-900">
          <span class="text-sm font-bold">K</span>
          <span class="text-xs">♠</span>
        </div>
      </div>
    </div>
  </div>

  <p class="text-sm text-gray-600 mb-2">Face Down (pending reveal)</p>
  <div class="flex gap-4 mb-6">
    <div class="cursor-pointer transition-transform duration-300">
      <div class="w-16 h-[5.6rem] rounded-lg border border-gray-200 shadow-sm flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-800 select-none">
        <div class="w-3/4 h-3/4 rounded border border-blue-400/30 bg-blue-700/50 flex items-center justify-center">
          <span class="text-blue-300/60 text-xs font-bold">★</span>
        </div>
      </div>
    </div>
    <div class="cursor-pointer transition-transform duration-300">
      <div class="w-16 h-[5.6rem] rounded-lg border border-gray-200 shadow-sm flex items-center justify-center bg-gradient-to-br from-blue-600 to-blue-800 select-none">
        <div class="w-3/4 h-3/4 rounded border border-blue-400/30 bg-blue-700/50 flex items-center justify-center">
          <span class="text-blue-300/60 text-xs font-bold">★</span>
        </div>
      </div>
    </div>
  </div>

  <p class="text-sm text-gray-600 mb-2">Mid-Flip Animation State (scale-x-0)</p>
  <div class="flex gap-4">
    <div class="cursor-pointer transition-transform duration-300 scale-x-0">
      <div class="w-16 h-[5.6rem] rounded-lg border border-gray-200 shadow-sm bg-white flex flex-col justify-between p-1 select-none">
        <div class="flex flex-col items-start leading-none text-red-500">
          <span class="text-sm font-bold">Q</span>
          <span class="text-xs">♦</span>
        </div>
        <div class="flex items-center justify-center text-red-500 text-2xl">♦</div>
        <div class="flex flex-col items-end leading-none rotate-180 text-red-500">
          <span class="text-sm font-bold">Q</span>
          <span class="text-xs">♦</span>
        </div>
      </div>
    </div>
    <span class="text-xs text-gray-400 self-center">(invisible during flip transition)</span>
  </div>
</body>
</html>
