<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NavSidebar Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #030712; font-family: system-ui, sans-serif; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse-dot { animation: pulse-dot 2s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="flex">
    <!-- Sidebar -->
    <aside class="flex flex-col w-64 h-screen bg-gray-900 border-r border-gray-700">
      <!-- Logo / Brand -->
      <div class="flex items-center gap-3 px-6 py-5 border-b border-gray-700">
        <div class="flex items-center justify-center w-9 h-9 rounded-xl bg-emerald-500 text-gray-950 font-bold text-lg">
          G
        </div>
        <div>
          <h1 class="text-base font-bold text-gray-50 leading-tight">GTO Idiot</h1>
          <p class="text-xs text-gray-500">德州扑克GTO训练器</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 px-3 py-4 space-y-1">
        <!-- Home - not active -->
        <button class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-gray-50 transition-colors duration-150">
          <span class="text-gray-500">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z" />
            </svg>
          </span>
          首页
        </button>

        <!-- Game - active -->
        <button class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium bg-emerald-500/15 text-emerald-500 transition-colors duration-150">
          <span class="text-emerald-500">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </span>
          游戏
          <span class="ml-auto w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        </button>

        <!-- History - not active -->
        <button class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-gray-50 transition-colors duration-150">
          <span class="text-gray-500">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </span>
          历史
        </button>

        <!-- Stats - not active -->
        <button class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-sm font-medium text-gray-400 hover:bg-gray-800 hover:text-gray-50 transition-colors duration-150">
          <span class="text-gray-500">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
          </span>
          统计
        </button>
      </nav>

      <!-- Active Session Card -->
      <div class="mx-3 mb-4 p-4 rounded-xl bg-gray-800 border border-gray-700">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-medium text-gray-400 uppercase tracking-wider">当前牌局</span>
          <span class="flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse-dot"></span>
            <span class="text-xs text-gray-400">进行中</span>
          </span>
        </div>
        <div class="flex items-baseline gap-1">
          <span class="text-2xl font-bold text-gray-50">42</span>
          <span class="text-sm text-gray-500">手</span>
        </div>
        <button class="mt-3 w-full py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-gray-950 text-sm font-semibold transition-colors duration-150">
          继续游戏
        </button>
      </div>

      <!-- Footer -->
      <div class="px-6 py-4 border-t border-gray-700">
        <p class="text-xs text-gray-500 text-center">v1.0.0</p>
      </div>
    </aside>

    <!-- Main content placeholder -->
    <div class="flex-1 h-screen bg-gray-950 flex items-center justify-center">
      <p class="text-gray-500 text-sm">主内容区域</p>
    </div>
  </div>
</body>
</html>
