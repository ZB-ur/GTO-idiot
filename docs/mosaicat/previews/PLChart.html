<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLChart Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #030712; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="bg-gray-900 border border-gray-700 rounded-xl p-4" style="max-width: 600px;">
    <h3 class="text-sm font-semibold text-gray-400 mb-3">盈亏走势</h3>
    <svg viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: 200px;">
      <!-- Grid area -->
      <rect x="48" y="20" width="496" height="148" fill="none" />

      <!-- Y-axis labels -->
      <text x="42" y="28" fill="#6b7280" font-size="11" text-anchor="end" font-family="system-ui">+30</text>
      <text x="42" y="97" fill="#6b7280" font-size="11" text-anchor="end" font-family="system-ui">0</text>
      <text x="42" y="168" fill="#6b7280" font-size="11" text-anchor="end" font-family="system-ui">-10</text>

      <!-- X-axis labels -->
      <text x="48" y="188" fill="#6b7280" font-size="11" text-anchor="middle" font-family="system-ui">0</text>
      <text x="544" y="188" fill="#6b7280" font-size="11" text-anchor="middle" font-family="system-ui">150</text>
      <text x="296" y="198" fill="#6b7280" font-size="11" text-anchor="middle" font-family="system-ui">手牌数</text>

      <!-- Zero line (dashed) -->
      <line x1="48" y1="94" x2="544" y2="94" stroke="#374151" stroke-width="1" stroke-dasharray="4,4" />

      <!-- Gradient fill under the line -->
      <defs>
        <linearGradient id="plGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(16,185,129,0.25)" />
          <stop offset="100%" stop-color="rgba(16,185,129,0)" />
        </linearGradient>
      </defs>

      <!-- Area fill: points follow a sample P&L curve that ends positive -->
      <polygon
        points="48,94 81,98 114,105 148,100 181,110 214,106 248,95 281,88 314,78 348,82 381,70 414,60 448,55 481,48 514,42 544,35 544,94 48,94"
        fill="url(#plGrad)"
      />

      <!-- P&L Line -->
      <polyline
        points="48,94 81,98 114,105 148,100 181,110 214,106 248,95 281,88 314,78 348,82 381,70 414,60 448,55 481,48 514,42 544,35"
        fill="none"
        stroke="#10b981"
        stroke-width="2"
        stroke-linejoin="round"
      />

      <!-- End dot -->
      <circle cx="544" cy="35" r="3" fill="#10b981" />
    </svg>
  </div>
</body>
</html>
