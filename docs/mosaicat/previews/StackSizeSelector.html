<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StackSizeSelector Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }</style>
</head>
<body>
  <div class="space-y-6 max-w-xs">
    <!-- 100BB selected -->
    <div>
      <p class="text-xs text-gray-400 mb-2">100 BB selected</p>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Starting Stack</label>
      <div class="flex gap-2">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-blue-600 bg-blue-600 text-white shadow-sm">100 BB</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-900">200 BB</button>
      </div>
    </div>
    <!-- 200BB selected -->
    <div>
      <p class="text-xs text-gray-400 mb-2">200 BB selected</p>
      <label class="block text-sm font-semibold text-gray-900 mb-2">Starting Stack</label>
      <div class="flex gap-2">
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-gray-200 bg-white text-gray-900">100 BB</button>
        <button class="flex-1 px-4 py-2.5 text-sm font-medium rounded-lg border border-blue-600 bg-blue-600 text-white shadow-sm">200 BB</button>
      </div>
    </div>
  </div>
</body>
</html>
