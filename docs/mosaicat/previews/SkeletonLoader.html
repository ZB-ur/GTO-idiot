<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkeletonLoader Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 16px; background: #f8fafc; font-family: system-ui, sans-serif; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    .shimmer { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background-color: #e5e7eb; border-radius: 0.5rem; }
  </style>
</head>
<body>
  <h2 class="text-lg font-semibold text-gray-900 mb-4">SkeletonLoader Component</h2>

  <div class="grid grid-cols-2 gap-6 max-w-3xl">
    <!-- Table Variant -->
    <div>
      <p class="text-sm text-gray-600 mb-2">variant="table"</p>
      <div class="border border-gray-200 rounded-xl overflow-hidden">
        <div class="flex gap-4 px-4 py-3 bg-gray-50 border-b border-gray-200">
          <div class="shimmer h-4 w-16"></div>
          <div class="shimmer h-4 w-24"></div>
          <div class="shimmer h-4 w-20"></div>
          <div class="shimmer h-4 w-16"></div>
        </div>
        <div class="flex gap-4 px-4 py-3 border-b border-gray-100">
          <div class="shimmer h-4 w-16"></div>
          <div class="shimmer h-4 w-24"></div>
          <div class="shimmer h-4 w-20"></div>
          <div class="shimmer h-4 w-16"></div>
        </div>
        <div class="flex gap-4 px-4 py-3 border-b border-gray-100">
          <div class="shimmer h-4 w-16"></div>
          <div class="shimmer h-4 w-24"></div>
          <div class="shimmer h-4 w-20"></div>
          <div class="shimmer h-4 w-16"></div>
        </div>
        <div class="flex gap-4 px-4 py-3 border-b border-gray-100">
          <div class="shimmer h-4 w-16"></div>
          <div class="shimmer h-4 w-24"></div>
          <div class="shimmer h-4 w-20"></div>
          <div class="shimmer h-4 w-16"></div>
        </div>
        <div class="flex gap-4 px-4 py-3">
          <div class="shimmer h-4 w-16"></div>
          <div class="shimmer h-4 w-24"></div>
          <div class="shimmer h-4 w-20"></div>
          <div class="shimmer h-4 w-16"></div>
        </div>
      </div>
    </div>

    <!-- Chart Variant -->
    <div>
      <p class="text-sm text-gray-600 mb-2">variant="chart"</p>
      <div class="border border-gray-200 rounded-xl p-6">
        <div class="shimmer h-5 w-32 mb-4"></div>
        <div class="flex items-end gap-2 h-40">
          <div class="shimmer flex-1 rounded-t-md" style="height: 60%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 80%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 45%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 90%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 70%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 55%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 85%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 40%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 75%"></div>
          <div class="shimmer flex-1 rounded-t-md" style="height: 65%"></div>
        </div>
        <div class="flex justify-between mt-2">
          <div class="shimmer h-3 w-8"></div>
          <div class="shimmer h-3 w-8"></div>
          <div class="shimmer h-3 w-8"></div>
        </div>
      </div>
    </div>

    <!-- List Variant -->
    <div>
      <p class="text-sm text-gray-600 mb-2">variant="list"</p>
      <div class="space-y-3">
        <div class="flex items-center gap-3">
          <div class="shimmer h-8 w-8 rounded-full flex-shrink-0"></div>
          <div class="flex-1 space-y-1.5">
            <div class="shimmer h-4 w-3/4"></div>
            <div class="shimmer h-3 w-1/2"></div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="shimmer h-8 w-8 rounded-full flex-shrink-0"></div>
          <div class="flex-1 space-y-1.5">
            <div class="shimmer h-4 w-3/4"></div>
            <div class="shimmer h-3 w-1/2"></div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="shimmer h-8 w-8 rounded-full flex-shrink-0"></div>
          <div class="flex-1 space-y-1.5">
            <div class="shimmer h-4 w-3/4"></div>
            <div class="shimmer h-3 w-1/2"></div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="shimmer h-8 w-8 rounded-full flex-shrink-0"></div>
          <div class="flex-1 space-y-1.5">
            <div class="shimmer h-4 w-3/4"></div>
            <div class="shimmer h-3 w-1/2"></div>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <div class="shimmer h-8 w-8 rounded-full flex-shrink-0"></div>
          <div class="flex-1 space-y-1.5">
            <div class="shimmer h-4 w-3/4"></div>
            <div class="shimmer h-3 w-1/2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Card Variant -->
    <div>
      <p class="text-sm text-gray-600 mb-2">variant="card"</p>
      <div class="border border-gray-200 rounded-xl p-6 space-y-4">
        <div class="flex items-center gap-3">
          <div class="shimmer h-10 w-10 rounded-full flex-shrink-0"></div>
          <div class="flex-1 space-y-1.5">
            <div class="shimmer h-4 w-1/2"></div>
            <div class="shimmer h-3 w-1/3"></div>
          </div>
        </div>
        <div class="shimmer h-4 w-full"></div>
        <div class="shimmer h-4 w-5/6"></div>
        <div class="shimmer h-4 w-2/3"></div>
      </div>
    </div>
  </div>
</body>
</html>
