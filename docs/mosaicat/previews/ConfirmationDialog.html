<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ConfirmationDialog Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin: 0; padding: 0; background: #f8fafc; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div class="fixed inset-0 z-50 flex items-center justify-center" style="position:relative;min-height:320px;">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40 rounded-xl"></div>
    <!-- Dialog -->
    <div class="relative bg-white rounded-xl shadow-md border border-gray-200 p-6 w-full max-w-md mx-4">
      <h2 class="text-lg font-semibold text-gray-900 mb-2">Clear Hand History?</h2>
      <p class="text-sm text-gray-500 mb-6">This will permanently delete all saved hands. This action cannot be undone.</p>
      <div class="flex justify-end gap-3">
        <button class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
        <button class="px-4 py-2 text-sm font-medium text-white bg-red-500 rounded-lg hover:bg-red-600 transition-colors">Clear All</button>
      </div>
    </div>
  </div>
</body>
</html>
