  # ═══════════════════════════════════════════
  # HAND HISTORY
  # ═══════════════════════════════════════════

  /hands:
    get:
      summary: List hand history with pagination and filters
      operationId: listHands
      tags: [Hands]
      x-covers-features: [F-005, F-009]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
          description: Page number (1-indexed)
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Items per page
        - name: filter_key_hands
          in: query
          schema:
            type: boolean
          description: "If true, only return key hands"
        - name: filter_position
          in: query
          schema:
            $ref: "#/components/schemas/Position"
          description: Filter by user position
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [timestamp, pnl]
            default: timestamp
          description: Sort field
        - name: sort_order
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
          description: Sort direction
      responses:
        "200":
          description: Paginated hand history list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandHistoryListResponse"
        "400":
          description: Invalid filter/pagination parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Clear all hand history
      operationId: clearHistory
      tags: [Hands]
      x-covers-features: [F-005]
      responses:
        "200":
          description: History cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClearHistoryResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hands/{handId}:
    get:
      summary: Get complete hand history record
      operationId: getHand
      tags: [Hands]
      x-covers-features: [F-005, F-006]
      parameters:
        - name: handId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete hand record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandHistoryRecord"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Hand not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /hands/{handId}/mark:
    patch:
      summary: Toggle key hand marking on a hand
      operationId: markKeyHand
      tags: [Hands]
      x-covers-features: [F-009]
      parameters:
        - name: handId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkKeyHandRequest"
      responses:
        "200":
          description: Mark updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkKeyHandResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Hand not found
          content:
            application/json:
