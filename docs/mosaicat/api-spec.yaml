openapi: 3.0.3
info:
  title: GTO Idiot - Texas Hold'em GTO Trainer API
  description: |
    GTO Idiot 德州扑克GTO策略练习器的内部服务层API规范。
    虽然应用为纯浏览器端运行（无后端服务器），此API定义了前端服务层的数据契约，
    所有端点通过IndexedDB和内存状态实现，可作为未来后端化的基础。
  version: 1.0.0
  contact:
    name: GTO Idiot Team

servers:
  - url: /api/v1
    description: 本地服务层（浏览器内实现）

tags:
  - name: Sessions
    description: 牌局会话管理
  - name: Game
    description: 牌局引擎与游戏操作
  - name: GTO
    description: GTO计算与提示
  - name: History
    description: 牌局历史记录
  - name: Replay
    description: 手牌回放与偏差分析
  - name: Stats
    description: 统计数据面板

paths:
  # ==================== Session Management ====================
  /sessions:
    post:
      operationId: createSession
      tags: [Sessions]
      summary: 创建新牌局会话
      description: 配置BOT对手、盲注大小等参数，创建并启动新的牌局session。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      operationId: listSessions
      tags: [Sessions]
      summary: 获取Session列表
      description: 获取所有历史session列表，按时间倒序排列。
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, completed]
          description: 按状态筛选
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Session列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListResponse'

  /sessions/{sessionId}:
    get:
      operationId: getSession
      tags: [Sessions]
      summary: 获取Session详情
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      operationId: updateSession
      tags: [Sessions]
      summary: 更新Session状态（暂停/继续/结束）
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Session更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{sessionId}/summary:
    get:
      operationId: getSessionSummary
      tags: [Sessions]
      summary: 获取Session结束小结
      description: 返回本次session的手数、盈亏、关键偏差点回顾等小结信息。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session小结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/recover:
    get:
      operationId: recoverSession
      tags: [Sessions]
      summary: 检测未完成的Session
      description: 检查是否存在因页面关闭等异常中断的session，供用户恢复。
      responses:
        '200':
          description: 未完成Session信息（若无则返回null）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoverSessionResponse'

  # ==================== Game Engine ====================
  /sessions/{sessionId}/hands:
    post:
      operationId: startNewHand
      tags: [Game]
      summary: 开始新一手牌
      description: 在当前session中开始新一手牌，自动分配位置、收盲注、发底牌。
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '201':
          description: 新手牌已开始
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      operationId: listSessionHands
      tags: [Game]
      summary: 获取Session中的手牌列表
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: 手牌列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandListResponse'

  /sessions/{sessionId}/hands/{handId}:
    get:
      operationId: getHandState
      tags: [Game]
      summary: 获取当前手牌状态
      description: 返回当前手牌的完整游戏状态，包括公共牌、底池、各玩家可见信息。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/HandId'
      responses:
        '200':
          description: 手牌当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandState'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{sessionId}/hands/{handId}/actions:
    post:
      operationId: performAction
      tags: [Game]
      summary: 执行玩家行动
      description: 用户在当前决策点执行行动（Fold/Call/Raise/All-in）。行动后自动推进游戏状态，触发BOT决策。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/HandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerActionRequest'
      responses:
        '200':
          description: 行动执行成功，返回更新后的游戏状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 非用户行动回合或行动不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /sessions/{sessionId}/hands/{handId}/bot-actions:
    post:
      operationId: triggerBotAction
      tags: [Game]
      summary: 触发BOT行动
      description: 触发当前行动BOT的决策，BOT根据配置的难度级别做出行动。响应时间<200ms。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/HandId'
      responses:
        '200':
          description: BOT行动完成
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionResult'
        '409':
          description: 当前不是BOT行动回合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== GTO Engine ====================
  /gto/preflop/ranges:
    get:
      operationId: getPreflopRanges
      tags: [GTO]
      summary: 获取翻前GTO范围表
      description: 返回指定位置和场景的翻前GTO范围表，包含169种起手牌组合的行动频率。
      parameters:
        - name: position
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Position'
        - name: scenario
          in: query
          required: true
          schema:
            type: string
            enum: [open, vs_open, vs_3bet, vs_4bet]
            description: "场景：未开池open / 面对open / 面对3bet / 面对4bet"
        - name: open_position
          in: query
          schema:
            $ref: '#/components/schemas/Position'
          description: 当scenario为vs_open/vs_3bet时，开池者的位置
      responses:
        '200':
          description: 翻前范围表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreflopRangeTable'
        '400':
          $ref: '#/components/responses/BadRequest'

  /gto/preflop/advice:
    post:
      operationId: getPreflopAdvice
      tags: [GTO]
      summary: 获取翻前GTO建议
      description: 根据当前翻前局面（位置、手牌、前序行动），返回GTO建议行动和频率分布。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreflopAdviceRequest'
      responses:
        '200':
          description: 翻前GTO建议
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GTOAdvice'
        '400':
          $ref: '#/components/responses/BadRequest'

  /gto/postflop/solve:
    post:
      operationId: solvePostflop
      tags: [GTO]
      summary: 翻后CFR求解
      description: |
        使用简化CFR算法求解当前翻后局面。采用简化博弈树（下注尺度33%/66%/100%底池）。
        在Web Worker中运行，目标响应时间<500ms。结果为近似GTO，非精确解。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostflopSolveRequest'
      responses:
        '200':
          description: CFR求解结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GTOAdvice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '408':
          description: CFR计算超时（>2s），返回降级简化建议
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GTOAdviceDegraded'

  /sessions/{sessionId}/hands/{handId}/hints:
    post:
      operationId: getHint
      tags: [GTO]
      summary: 获取当前决策点的GTO提示
      description: |
        用户主动请求当前决策点的GTO提示。翻前使用范围表查询，翻后使用CFR求解器。
        返回行动频率分布和EV估算。提示查看状态会记录到牌局历史。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/HandId'
      responses:
        '200':
          description: GTO提示
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HintResponse'
        '400':
          description: 当前非用户决策点
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '408':
          description: 计算超时，返回降级建议
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HintResponse'

  # ==================== Hand History ====================
  /hands:
    get:
      operationId: listHands
      tags: [History]
      summary: 获取牌局历史列表
      description: 从IndexedDB读取历史牌局记录，支持筛选和分页。使用虚拟滚动时配合limit/offset。
      parameters:
        - name: session_id
          in: query
          schema:
            type: string
          description: 按Session筛选
        - name: position
          in: query
          schema:
            $ref: '#/components/schemas/Position'
          description: 按用户位置筛选
        - name: result
          in: query
          schema:
            type: string
            enum: [win, lose, break_even]
          description: 按结果筛选
        - name: start_date
          in: query
          schema:
            type: string
            format: date-time
          description: 起始时间
        - name: end_date
          in: query
          schema:
            type: string
            format: date-time
          description: 结束时间
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, biggest_win, biggest_loss]
            default: newest
      responses:
        '200':
          description: 牌局历史列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandHistoryListResponse'

  /hands/{handId}:
    get:
      operationId: getHandDetail
      tags: [History]
      summary: 获取手牌完整详情
      description: 返回一手牌的完整记录，包括所有玩家手牌、公共牌、每轮行动序列、底池变化和最终结果。
      parameters:
        - $ref: '#/components/parameters/HandId'
      responses:
        '200':
          description: 手牌完整详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandHistory'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== Replay & Deviation ====================
  /hands/{handId}/replay:
    get:
      operationId: getReplayData
      tags: [Replay]
      summary: 获取手牌回放数据
      description: 返回结构化的回放数据，包含每一步的牌桌状态快照，供回放器逐步重现。
      parameters:
        - $ref: '#/components/parameters/HandId'
      responses:
        '200':
          description: 回放数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayData'
        '404':
          $ref: '#/components/responses/NotFound'

  /hands/{handId}/deviations:
    get:
      operationId: getHandDeviations
      tags: [Replay]
      summary: 获取手牌GTO偏差分析
      description: |
        分析用户在该手牌中每个决策点与GTO策略的偏差。
        偏差分三级：轻微（<15%）、中等（15%-40%）、严重（>40%）。
        包含偏差描述和EV损失估算。
      parameters:
        - $ref: '#/components/parameters/HandId'
      responses:
        '200':
          description: 偏差分析结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviationAnalysis'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== Statistics ====================
  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [Stats]
      summary: 获取统计总览
      description: 返回总手数、胜率、总盈亏等概览指标。
      parameters:
        - $ref: '#/components/parameters/HandRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: 统计总览
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'

  /stats/profit-curve:
    get:
      operationId: getProfitCurve
      tags: [Stats]
      summary: 获取盈亏曲线数据
      description: 返回按手数排列的累计盈亏数据点，用于绘制盈亏走势折线图。
      parameters:
        - $ref: '#/components/parameters/HandRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [hand, session]
            default: hand
          description: 按手数或按session分组
      responses:
        '200':
          description: 盈亏曲线数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitCurveResponse'

  /stats/metrics:
    get:
      operationId: getKeyMetrics
      tags: [Stats]
      summary: 获取关键指标
      description: 返回VPIP、PFR、3Bet%、WTSD%等关键扑克统计指标。
      parameters:
        - $ref: '#/components/parameters/HandRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: 关键指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyMetrics'

  /stats/deviations/top:
    get:
      operationId: getTopDeviations
      tags: [Stats]
      summary: 获取最常见GTO偏差TOP5
      description: 返回用户最常见的GTO偏差类型排行，帮助识别系统性泄漏。
      parameters:
        - $ref: '#/components/parameters/HandRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
      responses:
        '200':
          description: 偏差排行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopDeviationsResponse'

  /stats/positions:
    get:
      operationId: getPositionStats
      tags: [Stats]
      summary: 获取按位置的统计分布
      description: 返回各位置（UTG/HJ/CO/BTN/SB/BB）的盈亏和关键指标分布。
      parameters:
        - $ref: '#/components/parameters/HandRange'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
      responses:
        '200':
          description: 位置统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionStatsResponse'

components:
  # ==================== Parameters ====================
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Session唯一标识

    HandId:
      name: handId
      in: path
      required: true
      schema:
        type: string
      description: 手牌唯一标识

    HandRange:
      name: hand_range
      in: query
      schema:
        type: string
        enum: ['100', '500', 'all']
        default: 'all'
      description: 手数范围筛选

    StartDate:
      name: start_date
      in: query
      schema:
        type: string
        format: date-time
      description: 起始时间筛选

    EndDate:
      name: end_date
      in: query
      schema:
        type: string
        format: date-time
      description: 结束时间筛选

  # ==================== Responses ====================
  responses:
    BadRequest:
      description: 请求参数无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # ==================== Schemas ====================
  schemas:
    # ---------- Common ----------
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: INVALID_ACTION
        message:
          type: string
          example: "当前不是你的行动回合"

    Card:
      type: object
      required: [rank, suit]
      properties:
        rank:
          type: string
          enum: ['2', '3', '4', '5', '6', '7', '8', '9', 'T', 'J', 'Q', 'K', 'A']
        suit:
          type: string
          enum: [hearts, diamonds, clubs, spades]
      example:
        rank: 'A'
        suit: spades

    Position:
      type: string
      enum: [UTG, HJ, CO, BTN, SB, BB]

    Street:
      type: string
      enum: [preflop, flop, turn, river]

    ActionType:
      type: string
      enum: [fold, check, call, raise, all_in]

    BotDifficulty:
      type: string
      enum: [fish, regular, gto]
      description: "BOT难度：鱼（松散被动）/ 常规（TAG策略）/ GTO（CFR均衡策略）"

    DeviationSeverity:
      type: string
      enum: [minor, moderate, severe]
      description: "偏差等级：轻微(<15%) / 中等(15%-40%) / 严重(>40%)"

    # ---------- Session ----------
    CreateSessionRequest:
      type: object
      required: [bots, blinds]
      properties:
        bots:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/BotConfig'
        blinds:
          $ref: '#/components/schemas/BlindsConfig'

    BotConfig:
      type: object
      required: [name, difficulty]
      properties:
        name:
          type: string
          example: "BOT-1"
        difficulty:
          $ref: '#/components/schemas/BotDifficulty'

    BlindsConfig:
      type: object
      required: [small_blind, big_blind]
      properties:
        small_blind:
          type: number
          minimum: 1
          example: 1
        big_blind:
          type: number
          minimum: 2
          example: 2

    UpdateSessionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [pause, resume, end]

    Session:
      type: object
      required: [id, status, config, created_at, hand_count]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, paused, completed]
        config:
          type: object
          properties:
            bots:
              type: array
              items:
                $ref: '#/components/schemas/BotConfig'
            blinds:
              $ref: '#/components/schemas/BlindsConfig'
            starting_stack:
              type: number
              description: 起始筹码（BB数）
              default: 100
        hand_count:
          type: integer
          description: 已完成手数
        current_hand_id:
          type: string
          nullable: true
          description: 当前正在进行的手牌ID
        player_stack:
          type: number
          description: 用户当前筹码
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SessionListResponse:
      type: object
      required: [sessions, total]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/Session'
        total:
          type: integer

    SessionSummary:
      type: object
      required: [session_id, hand_count, net_profit_bb, duration_minutes, key_deviations]
      properties:
        session_id:
          type: string
          format: uuid
        hand_count:
          type: integer
          description: 本次session手数
        net_profit_bb:
          type: number
          description: 净盈亏（BB）
        duration_minutes:
          type: number
          description: 持续时间（分钟）
        win_rate:
          type: number
          description: 胜率百分比
        biggest_pot_hand_id:
          type: string
          description: 最大底池手牌ID
        key_deviations:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/DeviationSummaryItem'
          description: 关键偏差回顾（最多5个）

    RecoverSessionResponse:
      type: object
      properties:
        has_unfinished:
          type: boolean
        session:
          $ref: '#/components/schemas/Session'
          nullable: true

    # ---------- Game State ----------
    HandState:
      type: object
      required: [id, session_id, hand_number, street, pot, community_cards, players, current_player_seat, dealer_seat]
      properties:
        id:
          type: string
        session_id:
          type: string
          format: uuid
        hand_number:
          type: integer
          description: 本session内手牌序号
        street:
          $ref: '#/components/schemas/Street'
        pot:
          type: number
          description: 当前主底池
        side_pots:
          type: array
          items:
            type: object
            properties:
              amount:
                type: number
              eligible_seats:
                type: array
                items:
                  type: integer
        community_cards:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Card'
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerState'
        current_player_seat:
          type: integer
          nullable: true
          description: 当前行动玩家座位号（null表示非下注阶段）
        dealer_seat:
          type: integer
          description: 庄家按钮座位号
        is_user_turn:
          type: boolean
          description: 是否轮到用户行动
        available_actions:
          type: array
          items:
            $ref: '#/components/schemas/AvailableAction'
          description: 用户当前可执行的行动列表
        min_raise:
          type: number
          nullable: true
          description: 最小加注额
        max_raise:
          type: number
          nullable: true
          description: 最大加注额（All-in）
        status:
          type: string
          enum: [in_progress, showdown, completed]

    PlayerState:
      type: object
      required: [seat, name, position, stack, is_active, is_bot]
      properties:
        seat:
          type: integer
          minimum: 0
          maximum: 5
        name:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        stack:
          type: number
        hole_cards:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Card'
          nullable: true
          description: 手牌（用户自己的或摊牌时可见的）
        is_active:
          type: boolean
          description: 是否仍在手牌中（未弃牌）
        is_all_in:
          type: boolean
        is_bot:
          type: boolean
        current_bet:
          type: number
          description: 当前街已下注金额
        total_invested:
          type: number
          description: 本手牌总投入
        last_action:
          type: string
          nullable: true
          description: 本街最后行动描述

    AvailableAction:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ActionType'
        amount:
          type: number
          nullable: true
          description: 行动金额（call金额或最小raise金额）

    PlayerActionRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/ActionType'
        amount:
          type: number
          nullable: true
          description: raise或all_in金额（fold/check/call不需要）

    ActionResult:
      type: object
      required: [hand_state, action_taken]
      properties:
        hand_state:
          $ref: '#/components/schemas/HandState'
          description: 行动后更新的游戏状态
        action_taken:
          type: object
          required: [player_seat, player_name, action, street]
          properties:
            player_seat:
              type: integer
            player_name:
              type: string
            action:
              $ref: '#/components/schemas/ActionType'
            amount:
              type: number
              nullable: true
            street:
              $ref: '#/components/schemas/Street'
        hand_complete:
          type: boolean
          description: 手牌是否已结束
        showdown:
          $ref: '#/components/schemas/ShowdownResult'
          nullable: true
          description: 摊牌结果（手牌结束时返回）
        next_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionResult'
          description: 后续BOT自动行动结果（连续BOT行动时批量返回）

    ShowdownResult:
      type: object
      required: [winners, players_shown]
      properties:
        winners:
          type: array
          items:
            type: object
            required: [seat, name, amount_won]
            properties:
              seat:
                type: integer
              name:
                type: string
              amount_won:
                type: number
              hand_rank:
                type: string
                description: 牌型描述，如"同花顺"、"两对"
        players_shown:
          type: array
          items:
            type: object
            required: [seat, hole_cards]
            properties:
              seat:
                type: integer
              hole_cards:
                type: array
                items:
                  $ref: '#/components/schemas/Card'
              hand_rank:
                type: string

    HandListResponse:
      type: object
      required: [hands, total]
      properties:
        hands:
          type: array
          items:
            $ref: '#/components/schemas/HandSummary'
        total:
          type: integer

    HandSummary:
      type: object
      required: [id, hand_number, date, position, result_bb, street_reached]
      properties:
        id:
          type: string
        hand_number:
          type: integer
        session_id:
          type: string
        date:
          type: string
          format: date-time
        position:
          $ref: '#/components/schemas/Position'
        result_bb:
          type: number
          description: 盈亏（BB）
        street_reached:
          $ref: '#/components/schemas/Street'
        has_deviation:
          type: boolean
          description: 是否有GTO偏差
        max_deviation_severity:
          $ref: '#/components/schemas/DeviationSeverity'
          nullable: true
        hero_hand:
          type: array
          items:
            $ref: '#/components/schemas/Card'
          nullable: true
          description: 用户手牌（如有摊牌）

    # ---------- GTO ----------
    PreflopRangeTable:
      type: object
      required: [position, scenario, ranges]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        scenario:
          type: string
        open_position:
          $ref: '#/components/schemas/Position'
          nullable: true
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/HandRangeEntry'
          description: 169种起手牌的行动频率

    HandRangeEntry:
      type: object
      required: [hand, actions]
      properties:
        hand:
          type: string
          description: "起手牌表示（如 'AKs', 'QTo', '88'）"
          example: "AKs"
        actions:
          type: object
          properties:
            fold:
              type: number
              minimum: 0
              maximum: 1
            call:
              type: number
              minimum: 0
              maximum: 1
            raise:
              type: number
              minimum: 0
              maximum: 1
          description: 各行动频率（0-1，总和为1）

    PreflopAdviceRequest:
      type: object
      required: [position, hole_cards, action_history]
      properties:
        position:
          $ref: '#/components/schemas/Position'
        hole_cards:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Card'
        action_history:
          type: array
          items:
            $ref: '#/components/schemas/ActionRecord'
          description: 翻前前序行动历史

    PostflopSolveRequest:
      type: object
      required: [hero_position, hero_cards, community_cards, pot, effective_stack, action_history, street]
      properties:
        hero_position:
          $ref: '#/components/schemas/Position'
        hero_cards:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/Card'
        community_cards:
          type: array
          minItems: 3
          maxItems: 5
          items:
            $ref: '#/components/schemas/Card'
        pot:
          type: number
          description: 当前底池
        effective_stack:
          type: number
          description: 有效筹码
        street:
          $ref: '#/components/schemas/Street'
        action_history:
          type: array
          items:
            $ref: '#/components/schemas/ActionRecord'
        villain_range:
          type: string
          nullable: true
          description: 对手范围估计（可选）

    GTOAdvice:
      type: object
      required: [actions, is_approximate]
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/GTOActionFrequency'
        recommended_action:
          $ref: '#/components/schemas/ActionType'
          description: 最高频率的推荐行动
        is_approximate:
          type: boolean
          description: 是否为近似GTO（翻后始终为true）
        computation_time_ms:
          type: number
          description: 计算耗时（毫秒）

    GTOAdviceDegraded:
      type: object
      required: [actions, is_approximate, is_degraded, degradation_reason]
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/GTOActionFrequency'
        recommended_action:
          $ref: '#/components/schemas/ActionType'
        is_approximate:
          type: boolean
          default: true
        is_degraded:
          type: boolean
          default: true
        degradation_reason:
          type: string
          example: "计算超时，结果可能不够精确"

    GTOActionFrequency:
      type: object
      required: [action, frequency, ev]
      properties:
        action:
          $ref: '#/components/schemas/ActionType'
        frequency:
          type: number
          minimum: 0
          maximum: 1
          description: 行动频率（0-1）
        ev:
          type: number
          description: 该行动的期望值（EV，以BB为单位）
        bet_size:
          type: string
          nullable: true
          description: 下注尺度描述（如 "33% pot", "66% pot", "100% pot"）

    HintResponse:
      type: object
      required: [hand_id, street, decision_point, advice]
      properties:
        hand_id:
          type: string
        street:
          $ref: '#/components/schemas/Street'
        decision_point:
          type: integer
          description: 决策点序号
        advice:
          $ref: '#/components/schemas/GTOAdvice'
        hint_viewed:
          type: boolean
          default: true
          description: 标记已查看提示（记录到历史）
        is_degraded:
          type: boolean
          default: false
          description: 是否为降级结果

    ActionRecord:
      type: object
      required: [seat, position, action]
      properties:
        seat:
          type: integer
        position:
          $ref: '#/components/schemas/Position'
        action:
          $ref: '#/components/schemas/ActionType'
        amount:
          type: number
          nullable: true
        street:
          $ref: '#/components/schemas/Street'

    # ---------- Hand History ----------
    HandHistory:
      type: object
      required: [id, session_id, hand_number, date, players, community_cards, actions, result]
      properties:
        id:
          type: string
        session_id:
          type: string
          format: uuid
        hand_number:
          type: integer
        date:
          type: string
          format: date-time
        dealer_seat:
          type: integer
        blinds:
          $ref: '#/components/schemas/BlindsConfig'
        players:
          type: array
          items:
            $ref: '#/components/schemas/HandHistoryPlayer'
        community_cards:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Card'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/HandHistoryAction'
        pot_history:
          type: array
          items:
            type: object
            properties:
              street:
                $ref: '#/components/schemas/Street'
              pot_after:
                type: number
        result:
          $ref: '#/components/schemas/HandResult'
        hero_position:
          $ref: '#/components/schemas/Position'
        hero_result_bb:
          type: number
        hints_viewed:
          type: array
          items:
            type: object
            properties:
              street:
                $ref: '#/components/schemas/Street'
              decision_point:
                type: integer
          description: 用户查看了哪些决策点的提示

    HandHistoryPlayer:
      type: object
      required: [seat, name, position, starting_stack, is_bot]
      properties:
        seat:
          type: integer
        name:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        starting_stack:
          type: number
        ending_stack:
          type: number
        hole_cards:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/Card'
          nullable: true
          description: 手牌（摊牌时可见）
        is_bot:
          type: boolean
        bot_difficulty:
          $ref: '#/components/schemas/BotDifficulty'
          nullable: true

    HandHistoryAction:
      type: object
      required: [sequence, seat, player_name, position, street, action]
      properties:
        sequence:
          type: integer
          description: 行动序号
        seat:
          type: integer
        player_name:
          type: string
        position:
          $ref: '#/components/schemas/Position'
        street:
          $ref: '#/components/schemas/Street'
        action:
          $ref: '#/components/schemas/ActionType'
        amount:
          type: number
          nullable: true
        pot_after:
          type: number
          description: 行动后底池金额
        is_hero:
          type: boolean
          description: 是否为用户的行动

    HandResult:
      type: object
      required: [winners, final_pot]
      properties:
        winners:
          type: array
          items:
            type: object
            properties:
              seat:
                type: integer
              name:
                type: string
              amount_won:
                type: number
              hand_rank:
                type: string
        final_pot:
          type: number
        went_to_showdown:
          type: boolean

    HandHistoryListResponse:
      type: object
      required: [hands, total, has_more]
      properties:
        hands:
          type: array
          items:
            $ref: '#/components/schemas/HandSummary'
        total:
          type: integer
        has_more:
          type: boolean

    # ---------- Replay & Deviation ----------
    ReplayData:
      type: object
      required: [hand_id, steps, total_steps]
      properties:
        hand_id:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ReplayStep'
        total_steps:
          type: integer
        street_indices:
          type: object
          description: 每个street的起始step索引
          properties:
            preflop:
              type: integer
            flop:
              type: integer
              nullable: true
            turn:
              type: integer
              nullable: true
            river:
              type: integer
              nullable: true

    ReplayStep:
      type: object
      required: [index, type, street, table_state]
      properties:
        index:
          type: integer
        type:
          type: string
          enum: [deal_hole_cards, post_blinds, player_action, deal_community, showdown]
        street:
          $ref: '#/components/schemas/Street'
        table_state:
          $ref: '#/components/schemas/ReplayTableState'
        action:
          $ref: '#/components/schemas/HandHistoryAction'
          nullable: true
        is_hero_decision:
          type: boolean
          description: 是否为用户的决策点
        deviation:
          $ref: '#/components/schemas/Deviation'
          nullable: true
          description: 偏差信息（仅用户决策点）

    ReplayTableState:
      type: object
      required: [pot, community_cards, players]
      properties:
        pot:
          type: number
        community_cards:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        players:
          type: array
          items:
            $ref: '#/components/schemas/PlayerState'

    DeviationAnalysis:
      type: object
      required: [hand_id, deviations, total_ev_loss]
      properties:
        hand_id:
          type: string
        deviations:
          type: array
          items:
            $ref: '#/components/schemas/Deviation'
        total_ev_loss:
          type: number
          description: 总EV损失（BB）
        deviation_count:
          type: object
          properties:
            minor:
              type: integer
            moderate:
              type: integer
            severe:
              type: integer

    Deviation:
      type: object
      required: [decision_point, street, severity, hero_action, gto_advice, description]
      properties:
        decision_point:
          type: integer
        street:
          $ref: '#/components/schemas/Street'
        severity:
          $ref: '#/components/schemas/DeviationSeverity'
        hero_action:
          type: object
          required: [action]
          properties:
            action:
              $ref: '#/components/schemas/ActionType'
            amount:
              type: number
              nullable: true
        gto_advice:
          type: array
          items:
            $ref: '#/components/schemas/GTOActionFrequency'
        frequency_diff:
          type: number
          description: GTO频率差值（绝对值）
        ev_loss:
          type: number
          description: EV损失估算（BB）
        description:
          type: string
          description: 偏差描述文本
          example: "GTO建议加注66%pot频率为60%，你选择了跟注"

    DeviationSummaryItem:
      type: object
      required: [hand_id, street, severity, description]
      properties:
        hand_id:
          type: string
        hand_number:
          type: integer
        street:
          $ref: '#/components/schemas/Street'
        severity:
          $ref: '#/components/schemas/DeviationSeverity'
        description:
          type: string
        ev_loss:
          type: number

    # ---------- Statistics ----------
    StatsSummary:
      type: object
      required: [total_hands, win_rate, net_profit_bb, sessions_count]
      properties:
        total_hands:
          type: integer
        win_rate:
          type: number
          description: 胜率百分比
        net_profit_bb:
          type: number
          description: 净盈亏（BB）
        bb_per_100:
          type: number
          description: 每100手盈亏率（BB/100）
        sessions_count:
          type: integer
        avg_hands_per_session:
          type: number

    ProfitCurveResponse:
      type: object
      required: [data_points]
      properties:
        data_points:
          type: array
          items:
            type: object
            required: [x, y]
            properties:
              x:
                type: number
                description: 手牌序号或session序号
              y:
                type: number
                description: 累计盈亏（BB）
              hand_id:
                type: string
                description: 对应手牌ID（可点击跳转）
              session_id:
                type: string

    KeyMetrics:
      type: object
      required: [vpip, pfr, three_bet, wtsd, won_at_showdown, aggression_factor]
      properties:
        vpip:
          type: number
          description: VPIP（主动入池率）百分比
        pfr:
          type: number
          description: PFR（翻前加注率）百分比
        three_bet:
          type: number
          description: 3-Bet百分比
        wtsd:
          type: number
          description: WTSD（看到摊牌率）百分比
        won_at_showdown:
          type: number
          description: W$SD（摊牌胜率）百分比
        aggression_factor:
          type: number
          description: 攻击因子 (bet+raise) / call
        cbet_flop:
          type: number
          description: 翻牌持续下注率百分比
        fold_to_cbet:
          type: number
          description: 面对持续下注弃牌率百分比

    TopDeviationsResponse:
      type: object
      required: [deviations]
      properties:
        deviations:
          type: array
          items:
            type: object
            required: [type, count, total_ev_loss, avg_severity]
            properties:
              type:
                type: string
                description: 偏差类型描述
                example: "翻前在CO位对open弃牌过多"
              count:
                type: integer
                description: 出现次数
              total_ev_loss:
                type: number
                description: 总EV损失（BB）
              avg_severity:
                $ref: '#/components/schemas/DeviationSeverity'
              example_hand_ids:
                type: array
                items:
                  type: string
                description: 典型案例手牌ID

    PositionStatsResponse:
      type: object
      required: [positions]
      properties:
        positions:
          type: array
          items:
            type: object
            required: [position, hands, net_profit_bb]
            properties:
              position:
                $ref: '#/components/schemas/Position'
              hands:
                type: integer
                description: 该位置手数
              net_profit_bb:
                type: number
                description: 该位置净盈亏（BB）
              bb_per_100:
                type: number
                description: 该位置BB/100
              vpip:
                type: number
              pfr:
                type: number