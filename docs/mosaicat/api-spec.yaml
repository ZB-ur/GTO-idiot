  # ===== Game Engine =====
  /sessions/{sessionId}/game/state:
    get:
      summary: Get current game state for the active session
      operationId: getGameState
      tags: [Game]
      x-covers-features: [F-001, F-013]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "400":
          description: Session is not active or invalid ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/game/action:
    post:
      summary: Submit a user action (fold, check, call, bet, raise, all-in) for the current hand
      operationId: submitAction
      tags: [Game]
      x-covers-features: [F-001, F-003, F-004]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  $ref: "#/components/schemas/ActionType"
                amount:
                  type: number
                  description: Bet/raise amount (required for bet, raise; ignored for fold, check, call, all_in)
                  example: 12
      responses:
        "200":
          description: Action processed, updated game state returned. Includes bot actions that follow until next user decision or hand end.
          content:
            application/json:
              schema:
                type: object
                required: [gameState, botActions]
                properties:
                  gameState:
                    $ref: "#/components/schemas/GameState"
                  botActions:
                    type: array
                    items:
                      type: object
                      required: [seatIndex, action, delay]
                      properties:
                        seatIndex:
                          type: integer
                          description: Bot seat index
                          example: 2
                        action:
                          $ref: "#/components/schemas/ActionType"
                        amount:
                          type: number
                          description: Action amount (if applicable)
                          example: 6
                        delay:
                          type: integer
                          description: Simulated thinking delay in milliseconds
                          example: 1200
                    description: Sequence of bot actions that occurred after user's action
                  newCardsDealt:
                    type: array
                    items:
                      $ref: "#/components/schemas/Card"
                    description: New community cards dealt (if round advanced)
        "400":
          description: Invalid or illegal action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /sessions/{sessionId}/game/next-hand:
    post:
      summary: Deal the next hand in the session, rotating positions
      operationId: dealNextHand
      tags: [Game]
      x-covers-features: [F-001, F-003]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Next hand dealt, new game state returned. Includes any bot preflop actions before user's turn.
          content:
            application/json:
              schema:
                type: object
                required: [gameState, botActions]
                properties:
                  gameState:
                    $ref: "#/components/schemas/GameState"
                  botActions:
                    type: array
                    items:
                      type: object
                      required: [seatIndex, action, delay]
                      properties:
                        seatIndex:
                          type: integer
                          example: 1
                        action:
                          $ref: "#/components/schemas/ActionType"
                        amount:
                          type: number
                          example: 6
                        delay:
                          type: integer
                          description: Simulated thinking delay in milliseconds
                          example: 800
                    description: Bot preflop actions that occur before user's turn
        "400":
          description: Current hand is not complete or session not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
